# Reforged Villagers
#
# The field sets every villager this project adds is built from. Apply one with `$extends`.
#
# ReforgedVillager: an invincible, non-combat NPC template. aiid 100 is the villager idle AI,
# so a villager built on it stands where it spawns and never wanders.
# VillagerSpawn: the territory spawn of one such villager, aggression and patrol off.
# VillagerTerritory: the territory a villager spawns in, with its fences left to the spec.

spec:
  version: "1.0"

definitions:
  ReforgedVillager:
    villager: true
    invincible: true
    aiid: 100
    size: medium
    resourceType: medium
    resourceSize: 100
    class: ""
    collideOnMove: false
    isObjectNpc: false
    isWideBroadcaster: false
    isFreeNamed: false
    isLightParty: false
    elite: false
    showAggroTarget: false
    showShorttermTarget: false
    dontTurn: false
    partyMember: 0
    spawnScriptId: 0
    despawnScriptId: 0
    pcDespawnScriptId: 0
    villagerVolumeOffset: ""
    villagerVolumeActiveRange: 0
    villagerVolumeHalfHeight: 0
    villagerVolumeInteractionDist: 0
    namePlate:
      deathNameplateHeight: 0
    abnormalityResistanceOverride:
      resetTime: 60000
    stat:
      maxHp: 10000
      walkSpeed: 60
      runSpeed: 110
      atk: 100
      def: 2000
      exp: 1
      level: 40
    npcOnly:
      onDeathSkill: 0
    anger:
      gaugeSize: 403799
      time: 16633
      moveSpeedUpRate: 1.6
      accumRateWhenHpLow: 1.0
      accumRateWhenHpMed: 1
      accumRateWhenHpHigh: 1.0
      modeOnProbabilityWhenPartyMemberDead: 0.2
    critical:
      str: 30
      res: 180
      powRate: 1.5
    criticalAdjust:
      front: 1
      right: 1.2
      left: 1.2
      back: 1.6
    reaction:
      statStr: 40
      statRes: 150
      miniRes: 100
      basicRes: 100
      basicIncRes: 0
      basicGaugeResetTime: 20000
      maxBasicGauge: 2000
      maxAdditionalGauge: 600000
    abnormality:
      strA: 50
      resA: 40
      strB: 50
      resB: 40
      strC: 50
      resC: 40
      strD: 50
      resD: 40
    aggro:
      hateSkillCategoryName: ""
      viewRadius: 200
      viewAngle: 360
      sightRangeAggroWeight: 1.3
      hateSkillAggroWeight: 1
      bigReactionAggroWeight: 0.5
      aggroSendToClanDistance: 300
      clanName: ""
      aggroSendToPartyDistance: 400
      aggroSendRate: 1
      aggroSendStackRate: 0.1
      aggroSendStackRateWhenFirstAttacked: 2
      aggroReceiveOnlyInSight: false
      aggroReceiveRate: 0.5
    skillList: {}
    stackPoint:
      maxStackPoint: 10
      minStackPointRequire: 3
      stackPointPeriod: 8000

  VillagerSpawn:
    memberId: 0
    ai: 100
    randomPos: false
    spawnCount: 1
    offsetZ: 0
    respawnTime: 10000
    respawnRandomTime: "20000"
    delaySpawnTimeWhenWorldStart: 0
    isAggressiveMonster: false
    isReturn: false
    isReturnMyTerritory: false
    conditionalSpawn: false
    returnDistance: 0
    moveInTerritory: false
    questPatrol: false
    peaceStateNoMoving: false
    cautionStateNoMoving: false
    voidSpawn: false
    viewRadius: 300
    viewAngle: 130
    alertRadius: 400
    alertAngle: 360
    aggroShareGroupId: 0
    aggroSendToPartyDistance: 400
    aggroSendToClanDistance: 300
    aggroSendToTerritory: ""
    aggroIgnorePartyId: ""
    aggroReceiveOnlyInSight: false
    excludeAggroLimit: false
    escapeLocation: [0, 0, 0]
    popupMsg: ""
    msgProb: 0
    msgInterval: 0
    msgBroadcastingChannel: false
    randomGroupId: 0

  VillagerTerritory:
    type: normal
    addMaxZ: 256.000000
    subtractMinZ: 0.000000
    eventId: 0
    randomPosMinDist: 100.000000
    peaceMoveNpcCheckDist: 100.000000
    attribute:
      abnormality: 0
      achieveConditionId: 0

exports:
  definitions:
    - ReforgedVillager
    - VillagerSpawn
    - VillagerTerritory
