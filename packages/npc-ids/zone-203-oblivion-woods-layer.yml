    - $OWL_RASIMA
    - $OWL_DROYAN
    - $OWL_CHAMA
    - $OWL_TIMURON
    - $OWL_MALVINA
    - $OWL_RHONA
    - $OWL_NERIA
    - $OWL_EHRINGER
    - $OWL_UNFORTUNATE_VICTIM
    - $OWL_MUTILATED_CORPSE
    - $OWL_OHDI
    - $OWL_RURIK
    - $OWL_DARAN
    - $OWL_PEDDLER
    - $OWL_KELETH
    - $OWL_KANTUSA
    - $OWL_TERSIAJ
    - $OWL_AUSDAN
    - $OWL_JORBAL
    - $OWL_SUNZI
    - $OWL_BASTION_OF_LOK_TELEPORTAL
    - $OWL_GUARD
    - $OWL_UNNAMED_1900
  OWL_NORMAL_MONSTERS: []
  OWL_ELITE_MONSTERS: []
  OWL_BOSS_MONSTERS: []
  OWL_WORLD_BOSSES: []
  OWL_OBJECTS: []

