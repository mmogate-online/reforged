# Oblivion Woods layer (zone 203) NPC template ids.
#
# Roster: every template the zone's classic territory set places. Flags and levels
# come from the live template row, display names from the live client sheet.
# Categories follow the package README; WORLD_BOSSES is a manual list.
# 30 templates: 30 friendly npcs.
# 1 template has no display name and is named by id.

spec:
  version: "1.0"

variables:
  OWL_RUSHAL:                     1001     # Rushal (lv40)
  OWL_NEACAL:                     1004     # Neacal (lv40)
  OWL_FOLEDUS:                    1005     # Foledus (lv40)
  OWL_ISLA:                       1006     # Isla (lv40)
  OWL_HENDRY:                     1007     # Hendry (lv40)
  OWL_PHOLUS:                     1008     # Pholus (lv40)
  OWL_PARLAN:                     1009     # Parlan (lv40)
  OWL_RASIMA:                     1010     # Rasima (lv40)
  OWL_DROYAN:                     1011     # Droyan (lv40)
  OWL_CHAMA:                      1013     # Chama (lv40)
  OWL_TIMURON:                    1014     # Timuron (lv40)
  OWL_MALVINA:                    1015     # Malvina (lv40)
  OWL_RHONA:                      1016     # Rhona (lv40)
  OWL_NERIA:                      1021     # Neria (lv40)
  OWL_EHRINGER:                   1022     # Ehringer (lv40)
  OWL_UNFORTUNATE_VICTIM:         1023     # Unfortunate Victim (lv40)
  OWL_MUTILATED_CORPSE:           1024     # Mutilated Corpse (lv40)
  OWL_OHDI:                       1025     # Ohdi (lv40)
  OWL_RURIK:                      1026     # Rurik (lv40)
  OWL_DARAN:                      1027     # Daran (lv40)
  OWL_PEDDLER:                    1028     # Peddler (lv40)
  OWL_KELETH:                     1029     # Keleth (lv40)
  OWL_KANTUSA:                    1030     # Kantusa (lv40)
  OWL_TERSIAJ:                    1032     # Tersiaj (lv40)
  OWL_AUSDAN:                     1033     # Ausdan (lv40)
  OWL_JORBAL:                     1034     # Jorbal (lv40)
  OWL_SUNZI:                      1035     # Sunzi (lv40)
  OWL_BASTION_OF_LOK_TELEPORTAL:  1501     # Bastion of Lok Teleportal (lv40)
  OWL_GUARD:                      1700     # Guard (lv65)
  OWL_UNNAMED_1900:               1900     #  (lv40)

  # Category groups reference the scalars above so each id has one home.
  OWL_FRIENDLY_NPCS:
    - $OWL_RUSHAL
    - $OWL_NEACAL
    - $OWL_FOLEDUS
    - $OWL_ISLA
    - $OWL_HENDRY
    - $OWL_PHOLUS
