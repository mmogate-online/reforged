# npc-ids — NPC Template ID Registry
#
# Central registry of NPC template IDs for rebalancing and reference.
# Organized as one sub-file per zone. Each sub-file exports individual NPC
# variables (named after the NPC) and category group lists (lists of IDs).
#
# Variable naming convention: {ZONE_ABBR}_{NPC_NAME_UPPER_SNAKE}
# Category naming convention: {ZONE_ABBR}_{FRIENDLY_NPCS|NORMAL_MONSTERS|
#                              ELITE_MONSTERS|BOSS_MONSTERS|WORLD_BOSSES|OBJECTS}
#
# See README.md for the zone abbreviation table and categorization rules.

spec:
  version: "1.0"

imports:
  - from: ./zone-436-karascha_lair.yml
    use:
      variables:
        - KL_CULTIST_DEVASTATOR
