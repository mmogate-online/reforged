    - $IOD_HORNED_GHILLIEDHU
    - $IOD_HARDENED_GHILLIEDHU
    - $IOD_TERRON
    - $IOD_TERRON_THRALL
    - $IOD_TERRON_SABOTEUR
    - $IOD_TERRON_CHIEF
    - $IOD_TERRON_LAMA
    - $IOD_DARK_RAIDER
    - $IOD_DEVOTED_EBON_IMP
    - $IOD_STONEBEAK_RAIDER
    - $IOD_STONEBEAK_BRIGAND
    - $IOD_STONEBEAK_HIGHCREST

  IOD_ELITE_MONSTERS: []

  IOD_BOSS_MONSTERS: []

  IOD_WORLD_BOSSES: []

