# Valley of Titans (zone 6) NPC skill row ids, one variable per monster and factor step.
#
# Each list holds the normal skills and the rows cast when enraged. Monsters that cast the same
# rows through shareId share the variable named after the first of them.

spec:
  version: "1.0"

variables:
  VT_GRAZING_NORUK_DASH_ATTACK: [1102, 2102]
  VT_GRAZING_NORUK_DOUBLE_UPPERCUT: [1103, 2103]
  VT_STOMPING_NORUK_DOUBLE_UPPERCUT: [1103, 2103]

  # Ravenous Hyena and Hyena Stalker.
  VT_RAVENOUS_HYENA_DASH_ATTACK: [1103, 2103]
  VT_STARVING_HYENA_DASH_ATTACK: [1103, 2103]
  VT_GUTREND_HYENA_1_DASH_ATTACK: [1103, 2103]
  VT_GUTREND_HYENA_2_DASH_ATTACK: [1103, 2103]

  # Enraged, the Kulkari, Brigand, Skullcrusher and Reaper AIs cast a ready action (1203)
  # instead of the claw.
  VT_GUTREND_KULKARI_SPIN_ATTACK: [1102, 2102]
  VT_GUTREND_KULKARI_CLAW: [1103, 2103]
  VT_GUTREND_BRIGAND_SPIN_ATTACK: [1102, 2102]
  VT_GUTREND_BRIGAND_CLAW: [1103, 2103]
  # Spin attack 1102, claw 1103.
  VT_GUTREND_SKULLCRUSHER_HEAVY: [1102, 1103, 2102, 2103]
  VT_GUTREND_REAPER_HEAVY: [1102, 1103, 2102, 2103]

  VT_GUTREND_CLAWTAMER_SHIELD_CHARGE: [1102, 2102]
  VT_GUTREND_PILLAGER_SHIELD_CHARGE: [1102, 2102]
  VT_GUTREND_RAIDER_SHIELD_CHARGE: [1102, 2102]
  VT_GUTREND_JUGGERNAUT_SHIELD_CHARGE: [1102, 2102]

  # Grenades 1101, 1103 and 1104 (long, middle and short range throws of one attack), debuff
  # attack 1105. Enraged, the AI some Seer spawns run names 1203 for the middle throw, which has
  # no row.
  VT_GUTREND_SEER_HEAVY: [1101, 1103, 1104, 1105, 2101, 2103, 2104, 2105]

  VT_HILLWALKER_WARTHOG_CHARGE: [1102, 2102]
  VT_GREAT_TUSK_WARTHOG_CHARGE: [1102, 2102]

  VT_SCAVENGING_BEAR_POUNCE: [1104, 2104]
  VT_RAVENOUS_BEAR_POUNCE: [1104, 2104]

  # Two-hit combo 1105, advance atk05 1106.
  VT_SCION_JUSTICAR_HEAVY: [1105, 1106, 2105, 2106]

  # Weapon bash 1104, blast slash 1105, combo 1110.
  VT_LOKIAN_BATTLERAGER_HEAVY: [1104, 1105, 1110, 2104, 2105, 2110]

  # Concentrate attack 1103, dual sword dance 1104.
  VT_LOKIAN_REAVER_HEAVY: [1103, 1104, 2103, 2104]
  VT_LOKIAN_REAPMASTER_HEAVY: [1103, 1104, 2103, 2104]

exports:
  variables:
    - VT_GRAZING_NORUK_DASH_ATTACK
    - VT_GRAZING_NORUK_DOUBLE_UPPERCUT
    - VT_STOMPING_NORUK_DOUBLE_UPPERCUT
    - VT_RAVENOUS_HYENA_DASH_ATTACK
    - VT_STARVING_HYENA_DASH_ATTACK
    - VT_GUTREND_HYENA_1_DASH_ATTACK
    - VT_GUTREND_HYENA_2_DASH_ATTACK
    - VT_GUTREND_KULKARI_SPIN_ATTACK
    - VT_GUTREND_KULKARI_CLAW
    - VT_GUTREND_BRIGAND_SPIN_ATTACK
    - VT_GUTREND_BRIGAND_CLAW
    - VT_GUTREND_SKULLCRUSHER_HEAVY
    - VT_GUTREND_REAPER_HEAVY
    - VT_GUTREND_CLAWTAMER_SHIELD_CHARGE
    - VT_GUTREND_PILLAGER_SHIELD_CHARGE
    - VT_GUTREND_RAIDER_SHIELD_CHARGE
    - VT_GUTREND_JUGGERNAUT_SHIELD_CHARGE
    - VT_GUTREND_SEER_HEAVY
    - VT_HILLWALKER_WARTHOG_CHARGE
    - VT_GREAT_TUSK_WARTHOG_CHARGE
    - VT_SCAVENGING_BEAR_POUNCE
    - VT_RAVENOUS_BEAR_POUNCE
    - VT_SCION_JUSTICAR_HEAVY
    - VT_LOKIAN_BATTLERAGER_HEAVY
    - VT_LOKIAN_REAVER_HEAVY
    - VT_LOKIAN_REAPMASTER_HEAVY
