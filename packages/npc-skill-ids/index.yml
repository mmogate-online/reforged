# npc-skill-ids: NPC skill row id registry
#
# A skill id is unique only under one template in one hunting zone, so a variable here is
# meaningful only beside the monster it names: filter on huntingZoneId, npc.id (an npc-ids
# constant) and id (a variable from here). npc.id reaches the rows a monster casts, its own or
# its shareId template's.
#
# Each variable holds the attacks of one monster that take one factor, and every row each attack
# is cast as: the normal skill (11xx) and the rows cast when enraged, read from the
# angerBehaviorId of every AI the monster runs (its template's aiid and any ai a spawn row sets).
# That is usually the id + 1000 row; the id + 1000 row is kept even when no AI casts it, and an
# enraged id with no row of its own is left out.
#
# Naming: {ZONE_ABBR}_{NPC_NAME}_{ATTACKS}, the NPC part as in npc-ids. ATTACKS is the skill's own
# name for one attack, the names joined for two, and HEAVY when the variable holds every long
# attack of the monster. Monsters that cast the same rows share the variable named after the first
# of them. One sub-file per zone.
#
# A list cannot hold another list variable, so attacks that take one factor share one variable
# rather than one variable each.

spec:
  version: "1.0"

imports:
  - from: ./zone-003-oblivion-woods.yml
    use:
      variables:
        - OW_AGITATED_SPOREWALKER_JUMP_SLAM
        - OW_AGITATED_SPOREWALKER_ROLLING_ATTACK_MUD_SHAKE
        - OW_MOSSY_GHILLIEDHU_HEAVY
