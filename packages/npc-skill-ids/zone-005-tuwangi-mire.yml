# Tuwangi Mire (zone 5) NPC skill row ids, one variable per monster and factor step.
#
# Each list holds the normal skills and the rows cast when enraged.

spec:
  version: "1.0"

variables:
  TM_MUDDY_SPOREWALKER_JUMP_SLAM: [1101, 2101]
  # Rolling attack 1102, mud shake 1103.
  TM_MUDDY_SPOREWALKER_ROLLING_ATTACK_MUD_SHAKE: [1102, 1103, 2102, 2103]

  # Poison gas 1102, spike attack 1103.
  TM_HUNGRY_CULLAR_HEAVY: [1102, 1103, 2102, 2103]

  # Charge 1102, poison attack 1103.
  TM_TENTACULLAR_HEAVY: [1102, 1103, 2102, 2103]

exports:
  variables:
    - TM_MUDDY_SPOREWALKER_JUMP_SLAM
    - TM_MUDDY_SPOREWALKER_ROLLING_ATTACK_MUD_SHAKE
    - TM_HUNGRY_CULLAR_HEAVY
    - TM_TENTACULLAR_HEAVY
