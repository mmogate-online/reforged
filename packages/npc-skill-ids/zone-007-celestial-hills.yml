# Celestial Hills (zone 7) NPC skill row ids, one variable per monster and factor step.
#
# Each list holds the normal skills and the rows cast when enraged. Monsters that cast the same
# rows share the variable named after the first of them.

spec:
  version: "1.0"

variables:
  CH_NAGA_MERCENARY_MAGIC_ORB_LONG_MOVES: [1106, 1110, 1113, 2106, 2110, 2113]
  CH_RED_FANG_ORCAN_DOUBLE_LARIAT: [1102, 2102]
  CH_RED_FANG_RAGER_DOUBLE_LARIAT: [1102, 2102]
  CH_RED_FANG_KOBOLD_DASH_ATTACK: [1103, 2103]
  CH_RED_FANG_KOBOLD_MINION_DASH_ATTACK: [1103, 2103]
  CH_LEAN_HYENA_DASH_ATTACK: [1103, 2103]
  CH_BLOODGUARD_HEAVY: [1102, 1105, 1106, 2102, 2105, 2106]
  CH_LOKIAN_LANCER_HEAVY: [1104, 1110, 2104, 2110]
  CH_LOKIAN_BERSERKER_WEAPON_BASH_BLAST_SLASH_COMBO2: [1104, 1105, 1110, 2104, 2105, 2110]
  CH_NAKARASH_ATK01_TAIL_SWIPE_ROUND_ATTACKS: [1101, 1107, 1108, 1109, 2101, 2107, 2108, 2109]
  CH_DARK_IMP_CLAW_SLAM: [1103, 2103]
  CH_TEZLUAR_WEAPON_BASH_COMBO2: [1104, 1110, 2104, 2110]
  CH_RADAT_ATK01_ATK02: [1101, 1110, 2101, 2110]

exports:
  variables:
    - CH_NAGA_MERCENARY_MAGIC_ORB_LONG_MOVES
    - CH_RED_FANG_ORCAN_DOUBLE_LARIAT
    - CH_RED_FANG_RAGER_DOUBLE_LARIAT
    - CH_RED_FANG_KOBOLD_DASH_ATTACK
    - CH_RED_FANG_KOBOLD_MINION_DASH_ATTACK
    - CH_LEAN_HYENA_DASH_ATTACK
    - CH_BLOODGUARD_HEAVY
    - CH_LOKIAN_LANCER_HEAVY
    - CH_LOKIAN_BERSERKER_WEAPON_BASH_BLAST_SLASH_COMBO2
    - CH_NAKARASH_ATK01_TAIL_SWIPE_ROUND_ATTACKS
    - CH_DARK_IMP_CLAW_SLAM
    - CH_TEZLUAR_WEAPON_BASH_COMBO2
    - CH_RADAT_ATK01_ATK02
