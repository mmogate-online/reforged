# Oblivion Woods (zone 3) NPC skill row ids, one variable per monster attack.
#
# Each list holds the normal skill and the rows cast when enraged. Monsters that cast the same
# rows through shareId share the variable named after the first of them.

spec:
  version: "1.0"

variables:
  # Agitated and Aggravated Sporewalker.
  OW_AGITATED_SPOREWALKER_JUMP_SLAM: [1101, 2101]
  OW_AGITATED_SPOREWALKER_ROLLING_ATTACK: [1102, 2102]
  OW_AGITATED_SPOREWALKER_MUD_SHAKE: [1103, 2103]

  OW_MOSSY_GHILLIEDHU_SMASH: [1103, 2103]
  OW_MOSSY_GHILLIEDHU_POUNCE: [1104, 2104]
  OW_MOSSY_GHILLIEDHU_STOMP: [1106, 2106]
  # Close and ranged variants of one attack.
  OW_MOSSY_GHILLIEDHU_CHARGED_SMASH: [1107, 1108, 2107, 2108]

  OW_REAVER_OF_RESURRECTION_WEAPON_BASH: [1104, 2104]
  OW_REAVER_OF_RESURRECTION_BLAST_SLASH: [1105, 2105]
  OW_REAVER_OF_RESURRECTION_COMBO_2: [1110, 2110]

  # Devan Blademaster and Devan Scrapper.
  OW_DEVAN_BLADEMASTER_ADVANCE_ATK06: [1102, 2102]
  OW_DEVAN_BLADEMASTER_TWO_HIT_COMBO: [1105, 2105]
  OW_DEVAN_BLADEMASTER_ADVANCE_ATK05: [1106, 2106]

  OW_DEVAN_WARRIOR_ADVANCE_ATK06: [1102, 2102]
  OW_DEVAN_WARRIOR_TWO_HIT_COMBO: [1105, 2105]
  OW_DEVAN_WARRIOR_ADVANCE_ATK05: [1106, 2106]

  OW_DEVAN_BRIGAND_SPEAR_THROW: [1101, 2101]
  OW_DEVAN_BRIGAND_BRANDISH: [1103, 2103]
  OW_DEVAN_BRIGAND_THROW: [1104, 2104]

  OW_DEVAN_ARCANIST_BLAST: [1105, 2105]
  OW_DEVAN_ARCANIST_NUKE: [1106, 2106]

  OW_DEVAN_CHANTER_BLAST: [1105, 2105]
  OW_DEVAN_CHANTER_NUKE: [1106, 2106]

  # Fallen Soldier and Fallen Defender. Their AI casts the normal skill when enraged too.
  OW_FALLEN_SOLDIER_RANGED_ATTACK: [1103, 2103]

exports:
  variables:
    - OW_AGITATED_SPOREWALKER_JUMP_SLAM
    - OW_AGITATED_SPOREWALKER_ROLLING_ATTACK
    - OW_AGITATED_SPOREWALKER_MUD_SHAKE
    - OW_MOSSY_GHILLIEDHU_SMASH
    - OW_MOSSY_GHILLIEDHU_POUNCE
    - OW_MOSSY_GHILLIEDHU_STOMP
    - OW_MOSSY_GHILLIEDHU_CHARGED_SMASH
    - OW_REAVER_OF_RESURRECTION_WEAPON_BASH
    - OW_REAVER_OF_RESURRECTION_BLAST_SLASH
    - OW_REAVER_OF_RESURRECTION_COMBO_2
    - OW_DEVAN_BLADEMASTER_ADVANCE_ATK06
    - OW_DEVAN_BLADEMASTER_TWO_HIT_COMBO
    - OW_DEVAN_BLADEMASTER_ADVANCE_ATK05
    - OW_DEVAN_WARRIOR_ADVANCE_ATK06
    - OW_DEVAN_WARRIOR_TWO_HIT_COMBO
    - OW_DEVAN_WARRIOR_ADVANCE_ATK05
    - OW_DEVAN_BRIGAND_SPEAR_THROW
    - OW_DEVAN_BRIGAND_BRANDISH
    - OW_DEVAN_BRIGAND_THROW
    - OW_DEVAN_ARCANIST_BLAST
    - OW_DEVAN_ARCANIST_NUKE
    - OW_DEVAN_CHANTER_BLAST
    - OW_DEVAN_CHANTER_NUKE
    - OW_FALLEN_SOLDIER_RANGED_ATTACK
