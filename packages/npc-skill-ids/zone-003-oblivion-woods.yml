# Oblivion Woods (zone 3) NPC skill row ids, one variable per monster and factor step.
#
# Each list holds the normal skills and the rows cast when enraged. Monsters that cast the same
# rows through shareId share the variable named after the first of them.

spec:
  version: "1.0"

variables:
  # Agitated and Aggravated Sporewalker.
  OW_AGITATED_SPOREWALKER_JUMP_SLAM: [1101, 2101]
  # Rolling attack 1102, mud shake 1103.
  OW_AGITATED_SPOREWALKER_ROLLING_ATTACK_MUD_SHAKE: [1102, 1103, 2102, 2103]

  # Smash 1103, pounce 1104, stomp 1106, and charged smash 1107 and 1108 (its close and ranged
  # variants).
  OW_MOSSY_GHILLIEDHU_HEAVY: [1103, 1104, 1106, 1107, 1108, 2103, 2104, 2106, 2107, 2108]

  # Weapon bash 1104, blast slash 1105, combo 1110.
  OW_REAVER_OF_RESURRECTION_HEAVY: [1104, 1105, 1110, 2104, 2105, 2110]

  # Devan Blademaster and Devan Scrapper: advance atk06 1102, two-hit combo 1105, advance atk05 1106.
  OW_DEVAN_BLADEMASTER_HEAVY: [1102, 1105, 1106, 2102, 2105, 2106]

  OW_DEVAN_WARRIOR_ADVANCE_ATK06: [1102, 2102]
  # Two-hit combo 1105, advance atk05 1106.
  OW_DEVAN_WARRIOR_TWO_HIT_COMBO_ADVANCE_ATK05: [1105, 1106, 2105, 2106]

  OW_DEVAN_BRIGAND_SPEAR_THROW: [1101, 2101]
  # Brandish 1103, throw 1104.
  OW_DEVAN_BRIGAND_BRANDISH_THROW: [1103, 1104, 2103, 2104]

  OW_DEVAN_ARCANIST_BLAST: [1105, 2105]
  OW_DEVAN_ARCANIST_NUKE: [1106, 2106]

  # Blast 1105, nuke 1106.
  OW_DEVAN_CHANTER_HEAVY: [1105, 1106, 2105, 2106]

  # Fallen Soldier and Fallen Defender. Their AI casts the normal skill when enraged too.
  OW_FALLEN_SOLDIER_RANGED_ATTACK: [1103, 2103]

  # Their AI casts the normal skill when enraged too.
  OW_SKELETAL_RETAINER_RANGED_ATTACK: [1103, 2103]
  OW_SKELETAL_SOLDIER_RANGED_ATTACK: [1103, 2103]

  # Advance atk06 1102, two-hit combo 1105, advance atk05 1106.
  OW_DARK_MAIDEN_HEAVY: [1102, 1105, 1106, 2102, 2105, 2106]

exports:
  variables:
    - OW_AGITATED_SPOREWALKER_JUMP_SLAM
    - OW_AGITATED_SPOREWALKER_ROLLING_ATTACK_MUD_SHAKE
    - OW_MOSSY_GHILLIEDHU_HEAVY
    - OW_REAVER_OF_RESURRECTION_HEAVY
    - OW_DEVAN_BLADEMASTER_HEAVY
    - OW_DEVAN_WARRIOR_ADVANCE_ATK06
    - OW_DEVAN_WARRIOR_TWO_HIT_COMBO_ADVANCE_ATK05
    - OW_DEVAN_BRIGAND_SPEAR_THROW
    - OW_DEVAN_BRIGAND_BRANDISH_THROW
    - OW_DEVAN_ARCANIST_BLAST
    - OW_DEVAN_ARCANIST_NUKE
    - OW_DEVAN_CHANTER_HEAVY
    - OW_FALLEN_SOLDIER_RANGED_ATTACK
    - OW_SKELETAL_RETAINER_RANGED_ATTACK
    - OW_SKELETAL_SOLDIER_RANGED_ATTACK
    - OW_DARK_MAIDEN_HEAVY
