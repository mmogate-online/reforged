# IoD (Island of Dawn) Token IDs
#
# ONE token lives here: KUGAI_TOKEN, dropped by Kugai (npcTemplateId 1004) in hunting
# zone 13, opening a 3-tab MedalStore (Weapons / Armor / Materials). It is genuinely
# island-scoped, which is why it stays.
#
# The early-progression currency 95217 USED to live here as IOD_PROGRESSION_TOKEN.
# Ruling R25 made it band-wide (every sub-60 zone, not just the island), so it moved to
# `packages/progression-tokens` as EARLY_PROGRESSION_TOKEN. Import it from there.
#
# ID allocation from dungeon-tokens reserved ranges:
#   Token items:  95216 (Kugai)
#   Menu/VMI ID:  9999008
#   BuyList IDs:  9999009 (Weapons), 9999010 (Armor), 9999011 (Materials)

spec:
  version: "1.0"

variables:
  # Early-progression token (RV-01), the cross-vector reward spine for the Island
  # of Dawn: every reward vector pays some of it. Next free slot in the project's
  # MOVED 2026-07-30 by ruling R25. The early-progression token is band-wide, not
  # island-scoped, so it now lives in `packages/progression-tokens` as
  # EARLY_PROGRESSION_TOKEN. This package keeps only Kugai's per-region wiring.

  KUGAI_TOKEN: 95216

  KUGAI_MENU: 9999008

  KUGAI_LIST_WEAPONS: 9999009
  KUGAI_LIST_ARMOR: 9999010
  KUGAI_LIST_MATERIALS: 9999011

exports:
  variables:
    - KUGAI_TOKEN
    - KUGAI_MENU
    - KUGAI_LIST_WEAPONS
    - KUGAI_LIST_ARMOR
    - KUGAI_LIST_MATERIALS
