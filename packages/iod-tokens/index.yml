# IoD (Island of Dawn) Token IDs
#
# Token dropped by Kugai (npcTemplateId 1004) in hunting zone 13.
# Opens a 3-tab MedalStore: Weapons / Armor / Materials.
#
# ID allocation from dungeon-tokens reserved ranges:
#   Token item:   95216
#   Menu/VMI ID:  9999008
#   BuyList IDs:  9999009 (Weapons), 9999010 (Armor), 9999011 (Materials)

spec:
  version: "1.0"

variables:
  KUGAI_TOKEN: 95216

  KUGAI_MENU: 9999008

  KUGAI_LIST_WEAPONS: 9999009
  KUGAI_LIST_ARMOR: 9999010
  KUGAI_LIST_MATERIALS: 9999011

exports:
  variables:
    - KUGAI_TOKEN
    - KUGAI_MENU
    - KUGAI_LIST_WEAPONS
    - KUGAI_LIST_ARMOR
    - KUGAI_LIST_MATERIALS
