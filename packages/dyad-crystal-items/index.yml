# Dyad Crystal Item Base Definitions
# Shared item envelope for all Dyad crystal items (weapon + armor, tiers 1-6).
# Generated by tools/dyad-crystals/generate_dyad_specs.py. Do not hand-edit.
#
# Per-tier bases bake tier economics via $extends over the slot-common base,
# which carries the constant category, equipment type and tooltip. Consumer
# crystal specs $extends the matching Dyad{Slot}{Tier}Base.

spec:
  version: "1.0"

definitions:
  DyadCrystalCommon:
    combatItemType: CUSTOM
    combatItemSubType: custormaize
    rareGrade: 2
    boundType: EquipToItem
    tradable: false
    maxStack: 1
    maxDropUnit: 1
    guildWarehouseStorable: false
    warehouseStorable: true
    destroyable: true
    dismantlable: false
    storeSellable: true
    obtainable: true
    relocatable: true
    artisanable: false
    enchantEnable: false
    searchable: true
    rank: 0
    sortingNumber: 1
    gambleItemType: "1;2;4"
    conversionBigGroup: 4
    coolTimeGroup: 0
    slotLimit: 0
    dropSilhouette: DropItem.SM.Item_Drop_Chest_SM
    dropSound: InterfaceSound.Drop_ItemCUE.Drop_ChestBoxCue
    equipSound: InterfaceSound.Equip_ItemCUE.Equip_CustomizeStoneCue

  DyadWeaponCommon:
    $extends: DyadCrystalCommon
    category: customize_weapon
    requiredEquipmentType: EQUIP_WEAPON
    strings:
      toolTip: "<font color = '#2478FF'>[Recommended Classes: warrior, lancer, slayer, berserker, sorcerer, archer, reaper, gunner, brawler, ninja, valkyrie]</font> Dyad crystals are not destroyed upon death."

  DyadArmorCommon:
    $extends: DyadCrystalCommon
    category: customize_armor
