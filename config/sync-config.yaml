# DataSheetLang Client Sync Configuration Template
# =================================================
# Update paths to match your environment before use.
#
# This template contains common entity configurations for server-to-client
# synchronization. Remove or comment out entities you don't need.
#
# Documentation: https://datasheetlang.dev/tools/client-sync
version: 1

paths:
  server: "D:/dev/mmogate/tera92/server/Datasheet"                           # Server DataSheet XML files
  client: "D:/dev/mmogate/tera92/client-dc/DataCenter_Final_EUR"   # Client DataCenter folder
  schemas: "D:/dev/mmogate/tera92/client-dc/DataCenter_Final_EUR"  # XSD schemas (usually same as client)

defaults:
  id_attribute: "id"
  encoding: "utf-8"
  indent: "    "

# =============================================================================
# ENTITY CONFIGURATIONS
# =============================================================================
# Each entity defines how server XML files are transformed and routed to client
# DataCenter files. See documentation for strategy details.
#
# Strategies:
#   - monolithic:    Single server file → Single client file
#   - SourceMapped:  Multiple server files → Multiple client files (1:1 mapping)
#   - ZoneBased:     Zone-partitioned data (huntingZoneId routing)
#   - Bucket:        ID-range bucketing
#   - Merged:        Multiple source types merged into one entity
#   - IdSorted:      Position-based file assignment (sorted by ID)
# =============================================================================

entities:

  # ===========================================================================
  # COLLECTION DATA
  # ===========================================================================
  # Collections.xml defines gathering node behaviors (animation, proficiency,
  # spawn timing). pickSkillType controls the client-side gathering animation.

  CollectionData:
    strategy: monolithic
    server_file: "CollectionData/Collections.xml"
    client_folder: "Collections"
    client_file: "Collections-00000.xml"
    root_element: "Collections"
    id_attribute: "collectionId"
    xsd_file: "Collections/Collections.xsd"

  # ===========================================================================
  # EQUIPMENT DATA
  # ===========================================================================
  # EquipmentTemplate.xml contains equipment stats, requirements, and attributes.
  # Single server file maps to single client file.

  EquipmentData:
    strategy: monolithic
    server_file: "EquipmentTemplate.xml"
    client_folder: "EquipmentData"
    client_file: "EquipmentData-00000.xml"
    root_element: "EquipmentData"
    id_attribute: "id"
    xsd_file: "EquipmentData/EquipmentData.xsd"

  # Equipment enchantment data (success rates, costs, stat bonuses)
  EquipmentEnchantData:
    strategy: monolithic
    server_file: "EquipmentEnchantData.xml"
    client_folder: "EquipmentEnchantData"
    client_file: "EquipmentEnchantData-00000.xml"
    root_element: "EquipmentEnchantData"
    id_attribute: "id"
    xsd_file: "EquipmentEnchantData/EquipmentEnchantData.xsd"

  # Equipment evolution recipes and requirements
  EquipmentEvolutionData:
    strategy: monolithic
    server_file: "EquipmentEvolutionData.xml"
    client_folder: "EquipmentEvolutionData"
    client_file: "EquipmentEvolutionData-00000.xml"
    root_element: "EquipmentEvolutionData"
    id_attribute: "targetTemplateId"
    xsd_file: "EquipmentEvolutionData/EquipmentEvolutionData.xsd"

  # Equipment inheritance tokens (inheritance rules for gear transfer)
  EquipmentInheritanceData:
    strategy: monolithic
    server_file: "EquipmentInheritanceData.xml"
    client_folder: "EquipmentInheritanceData"
    client_file: "EquipmentInheritanceData-00000.xml"
    root_element: "EquipmentInheritanceData"
    id_attribute: "templateId"
    xsd_file: "EquipmentInheritanceData/EquipmentInheritanceData.xsd"

  # Item produce recipes (crafting recipes and requirements)
  ItemProduceRecipeData:
    strategy: monolithic
    server_file: "ItemProduceRecipe.xml"
    client_folder: "ItemProduceRecipe"
    client_file: "ItemProduceRecipe-00000.xml"
    root_element: "ItemProduceRecipe"
    id_attribute: "id"
    xsd_file: "ItemProduceRecipe/ItemProduceRecipe.xsd"

  # Material enchant data (enchant materials, costs, probabilities)
  # Note: Client XSD filters out most attributes - only structure is synced
  MaterialEnchantData:
    strategy: monolithic
    server_file: "MaterialEnchantData.xml"
    client_folder: "MaterialEnchantData"
    client_file: "MaterialEnchantData-00000.xml"
    root_element: "MaterialEnchantData"
    id_attribute: "materialEnchantId"
    xsd_file: "MaterialEnchantData/MaterialEnchantData.xsd"

  # ---------------------------------------------------------------------------
  # Registered 2026-07-29 for the IoD reward-vector wave 1 (feedstock flattening).
  # All four carry feedstock item ids on the client, verified by id census before
  # registration, so all four need a real descriptor rather than a None mapping in
  # migrate's ENTITY_SYNC_MAP. Shapes were MEASURED per family, not templated: see
  # docs/plans/reward-vectors/IOD-WAVE1-PLAN.md phase A.
  #
  # A key mapped in ENTITY_SYNC_MAP with no descriptor here is FAIL-CLOSED: plan
  # emits E603 and dsl sync exits 2 BEFORE writing anything, aborting the client
  # leg for the whole patch. Never add the key without the descriptor.
  # ---------------------------------------------------------------------------

  # Fodder and gear dismantle outputs. Server 343 rows vs client 334 at
  # registration, so the first sync ADDS 9 server-only rows to the client.
  DecompositionData:
    strategy: monolithic
    merge: replace
    server_file: "DecompositionData.xml"
    client_folder: "DecompositionData"
    client_file: "DecompositionData-00000.xml"
    root_element: "DecompositionData"
    id_attribute: "id"
    xsd_file: "DecompositionData/DecompositionData.xsd"

  # Item combine recipes (the feedstock tier-up ladder lives here). Server 852
  # rows vs client 848, so the first sync ADDS 4. Both roots also carry a single
  # Common element, so a replace does not strand it.
  ItemMixData:
    strategy: monolithic
    merge: replace
    server_file: "ItemMixData.xml"
    client_folder: "ItemMixData"
    client_file: "ItemMixData-00000.xml"
    root_element: "ItemMixData"
    id_attribute: "itemMixId"
    xsd_file: "ItemMixData/ItemMixData.xsd"

  # Vanguard Request rewards. merge: replace is REFUSED here with E683, and that
  # refusal is correct: the client shard carries a DailyCheckEvent root child the
  # server file does not contain at all, so a replace would rebuild the file
  # without it and write XSD-invalid output. preserve-required-elements is a
  # replace in every other respect, carrying over an XSD-required root child the
  # projection cannot supply and re-sorting it into schema order. Idempotent, and
  # it grafts nothing when the client file is absent. DSL f3be560c.
  EventMatching:
    strategy: monolithic
    merge: preserve-required-elements
    server_file: "EventMatching.xml"
    client_folder: "EventMatching"
    client_file: "EventMatching-00000.xml"
    root_element: "EventMatching"
    id_attribute: "id"
    xsd_file: "EventMatching/EventMatching.xsd"

  # Achievement rows, including three that grant feedstock directly (9002, 9009,
  # 9011). This is a SHARD family, not a monolith: the 7 regional server files map
  # onto client shards 00001 to 00007, verified by row count and id range.
  #
  # DELIBERATELY MAPPED TO THE BASE FILE ONLY. Measured on the first real sync
  # 2026-07-29, with the full 7-file mapping in place: the regional shards carry
  # genuine server-vs-client divergence that has nothing to do with feedstock, and
  # propagating it is a player-visible change well outside this wave's scope.
  #
  #   server AchievementList_NAEU.xml has active="False" on ALL 135 rows, while
  #   client shard 00005 shipped 112 of them active="true". The sync deactivated
  #   all 112, hid 30 more, and moved one grade. Shards 00003 (JP), 00004 (KR) and
  #   00006 (RUS) flipped 10 further rows active.
  #
  # This is NOT the boolean-case defect (NormalizeBoolean matches
  # case-insensitively per DSL 3976613a, and zero values sit outside the
  # xsd:boolean lexical space). It is real data divergence, and which side is
  # authoritative is unresolved: the v92 server's regional files may simply be
  # stale relative to the NA/EU publisher client. Do not widen this mapping
  # without settling that question first.
  #
  # All three feedstock achievements live in the BASE AchievementList.xml, so the
  # base mapping alone carries everything this wave needs. Unmapped shards are
  # left untouched by sync, verified: shard 00000 came out byte-identical.
  #
  # Shard AchievementList-00000.xml must stay excluded regardless. It holds a
  # single CategoryInfo element and no Achievement rows, has no counterpart inside
  # AchievementList.xml, and mapping it would overwrite publisher-side category
  # curation with achievement rows.
  #
  # Expected W602 out-of-schema drops on this family (client XSD does not declare
  # them): conditionCheckMethod, mailSender, serverUnique, notifyLevel, hasTitle,
  # withoutMsgClasses, withoutRewardClasses, Condition/value2 to value6,
  # ItemReward/desc, SpecialReward/targetType, targetId, value,
  # TitleReward/directApply, and the AwakenReward element.
  AchievementList:
    strategy: SourceMapped
    client_folder: "AchievementList"
    root_element: "AchievementList"
    id_attribute: "id"
    xsd_file: "AchievementList/AchievementList.xsd"
    source_mapping:
      "AchievementList.xml": "AchievementList-00001.xml"

  # ===========================================================================
  # ABNORMALITY DATA
  # ===========================================================================
  # Abnormality.xml defines buff/debuff status effects.
  # Regional variants map 1:1 like ItemData.

  Abnormality:
    strategy: SourceMapped
    client_folder: "Abnormality"
    root_element: "Abnormality"
    id_attribute: "id"
    xsd_file: "Abnormality/Abnormality.xsd"
    source_mapping:
      "Abnormality.xml": "Abnormality-00000.xml"

  # AbnormalityIconData.xml maps abnormality ids to buff-bar icons.
  # Base file only; regionals untouched (same policy as Abnormality above).
  AbnormalityIconData:
    strategy: SourceMapped
    client_folder: "AbnormalityIconData"
    root_element: "AbnormalityIconData"
    id_attribute: "abnormalityId"
    xsd_file: "AbnormalityIconData/AbnormalityIconData.xsd"
    source_mapping:
      "AbnormalityIconData.xml": "AbnormalityIconData-00000.xml"

  # Abnormality names/tooltips. Client shard 00000 holds the base roster
  # (verified: custom 488xxxxxx ids live there); shards 00002+ are content-pack
  # extras that keep ownership of their records via shard-aware merge (the
  # server file is the merged superset; without it ~1315 records duplicate).
  StrSheet_Abnormality:
    strategy: SourceMapped
    merge: shard-aware
    client_folder: "StrSheet_Abnormality"
    root_element: "StrSheet_Abnormality"
    id_attribute: "id"
    xsd_file: "StrSheet_Abnormality/StrSheet_Abnormality.xsd"
    source_mapping:
      "StrSheet_Abnormality.xml": "StrSheet_Abnormality-00000.xml"

  # ===========================================================================
  # CUSTOMIZING (CRYSTAL SOCKET) DATA
  # ===========================================================================
  # CustomizingItem.xml defines crystal socket entries with passivity links.
  # Single server file maps to single client file.

  CustomizingItems:
    strategy: monolithic
    server_file: "CustomizingItem.xml"
    client_folder: "CustomizingItems"
    client_file: "CustomizingItems-00000.xml"
    root_element: "CustomizingItems"
    id_attribute: "id"
    xsd_file: "CustomizingItems/CustomizingItems.xsd"

  # ===========================================================================
  # RAW STONE (CRYSTAL FUSION) DATA
  # ===========================================================================
  # RawStoneItem.xml defines crystal fusion structure behaviors (TIERUP/UPGRADE).
  # Single server file maps to single client file.

  RawStoneItems:
    strategy: monolithic
    server_file: "RawStoneItem.xml"
    client_folder: "RawStoneItems"
    client_file: "RawStoneItems-00000.xml"
    root_element: "RawStoneItems"
    id_attribute: "id"
    xsd_file: "RawStoneItems/RawStoneItems.xsd"

  # ===========================================================================
  # GACHA DATA
  # ===========================================================================
  # Gacha loot box definitions (random reward pools, fixed rewards).
  # Regional variants map 1:1 like ItemData.

  Gacha:
    strategy: SourceMapped
    client_folder: "Gacha"
    root_element: "Gacha"
    id_attribute: "itemTemplateId"
    xsd_file: "Gacha/Gacha.xsd"
    source_mapping:
      "Gacha.xml": "Gacha-00000.xml"
      "Gacha_JP.xml": "Gacha-00001.xml"
      "Gacha_KR.xml": "Gacha-00002.xml"
      "Gacha_NAEU.xml": "Gacha-00003.xml"
      "Gacha_RUS.xml": "Gacha-00004.xml"
      "Gacha_THA.xml": "Gacha-00005.xml"
      "Gacha_Tool.xml": "Gacha-00006.xml"
      "Gacha_TW.xml": "Gacha-00007.xml"

  # ===========================================================================
  # ITEM DATA
  # ===========================================================================
  # ItemTemplate files are split by region/purpose. Each server file maps to a
  # corresponding client file. Adjust source_mapping based on your server files.

  ItemData:
    strategy: SourceMapped
    client_folder: "ItemData"
    root_element: "ItemData"
    id_attribute: "id"
    xsd_file: "ItemData/ItemData.xsd"
    source_mapping:
      # Base item definitions
      "ItemTemplate.xml": "ItemData-00000.xml"
      # Regional variants
      "ItemTemplate_cn.xml": "ItemData-00001.xml"
      "ItemTemplate_JP.xml": "ItemData-00007.xml"
      "ItemTemplate_KR.xml": "ItemData-00009.xml"
      "ItemTemplate_NAEU.xml": "ItemData-00011.xml"
      "ItemTemplate_RUS.xml": "ItemData-00013.xml"
      "ItemTemplate_THA.xml": "ItemData-00015.xml"
      "ItemTemplate_TW.xml": "ItemData-00018.xml"

  # ===========================================================================
  # STRING SHEETS (LOCALIZATION)
  # ===========================================================================
  # String sheets contain localized text for items, NPCs, etc.
  # Use SourceMapped strategy for regional variants.

  # ===========================================================================
  # PASSIVITY DATA
  # ===========================================================================
  # Passivity files are split by category on the server. Only map the files
  # modified by our specs. Passivity_Equipment.xml → Passivity-00005.xml.

  Passivity:
    strategy: SourceMapped
    client_folder: "Passivity"
    root_element: "Passivity"
    id_attribute: "id"
    xsd_file: "Passivity/Passivity.xsd"
    source_mapping:
      "Passivity_Equipment.xml": "Passivity-00005.xml"

  # Passivity strings — single server file bucketed into 5 client files by ID range.
  # default_bucket_seq: 4 catches PcSkill, EpPerk, SkillPolishing, Card IDs.
  StrSheet_Passivity:
    strategy: Bucket
    server_files:
      - "StrSheet_Passivity.xml"
    client_folder: "StrSheet_Passivity"
    client_pattern: "StrSheet_Passivity-{seq:D5}.xml"
    root_element: "StrSheet_Passivity"
    id_attribute: "id"
    xsd_file: "StrSheet_Passivity/StrSheet_Passivity.xsd"
    default_bucket_seq: 4
    id_buckets:
      - seq: 0
        min: 6000001
        max: 6000166
      - seq: 1
        min: 80010
        max: 81067
      - seq: 2
        min: 120100
        max: 5006952
      - seq: 2
        min: 9000001
        max: 9999999
      - seq: 3
        min: 8885001
        max: 8886107

  # ===========================================================================
  # NPC DATA
  # ===========================================================================
  # NPC templates (monsters, villagers, bosses) organized by hunting zone.
  # Uses ZoneBased strategy with numeric sorting by huntingZoneId.
  #
  # Server files: NpcData_{huntingZoneId}.xml (424 files)
  # Client files: NpcData-{sequence}.xml (425 files, numeric zone order)

  NpcData:
    strategy: ZoneBased
    server_pattern: "NpcData_*.xml"
    client_folder: "NpcData"
    client_pattern: "NpcData-{seq:D5}.xml"
    root_element: "NpcData"
    zone_attribute: "huntingZoneId"
    id_attribute: "id"
    sorting: numeric
    xsd_file: "NpcData/NpcData.xsd"

  # ===========================================================================
  # TERRITORY DATA
  # ===========================================================================
  # Territory definitions (spawn zones, groups, areas) organized by hunting zone.
  # Uses ZoneBased strategy with alphabetical sorting by huntingZoneId.

  TerritoryData:
    strategy: ZoneBased
    server_pattern: "TerritoryData_*.xml"
    client_folder: "TerritoryData"
    client_pattern: "TerritoryData-{seq:D5}.xml"
    root_element: "TerritoryData"
    zone_attribute: "huntingZoneId"
    id_attribute: "id"
    sorting: alphabetical
    xsd_file: "TerritoryData/TerritoryData.xsd"

  # BuyMenuList server files map to MenuList client folder.
  # 8 server files (base + 7 regional) → 10 client files (2 client-only).
  # StrSheet_Npc.xml contains NPC/shop display names.
  # stringId in BuyMenuList resolves here.
  StrSheet_Npc:
    strategy: monolithic
    server_file: "StrSheet_Npc.xml"
    client_folder: "StrSheet_Npc"
    client_file: "StrSheet_Npc-00000.xml"
    root_element: "StrSheet_Npc"
    id_attribute: "id"
    xsd_file: "StrSheet_Npc/StrSheet_Npc.xsd"

# Villager shop/menu registry. Server VillagerData/VillagerMenu.xml (rich: Menu
  # children) maps to the single client shard (bare registry; XSD filtering strips
  # the server-only structure).
  VillagerMenu:
    strategy: monolithic
    server_file: "VillagerData/VillagerMenu.xml"
    client_folder: "VillagerMenu"
    client_file: "VillagerMenu-00000.xml"
    root_element: "VillagerMenu"
    id_attribute: "id"
    xsd_file: "VillagerMenu/VillagerMenu.xsd"

  # Region name strings (world map / zone banners). Single global file both sides.
  StrSheet_Region:
    strategy: monolithic
    server_file: "StrSheet_Region.xml"
    client_folder: "StrSheet_Region"
    client_file: "StrSheet_Region-00000.xml"
    root_element: "StrSheet_Region"
    id_attribute: "id"
    xsd_file: "StrSheet_Region/StrSheet_Region.xsd"

  # Creature display names, keyed (huntingZoneId, templateId) via <HuntingZone>
  # wrappers. Registered 2026-07-28. The family was ALREADY authorable through the
  # `creatureStrings` DSL entity and the server file already existed, but it had no
  # sync descriptor at all, so an authored creature name landed server-only and the
  # client nameplate had nothing to draw. Required by patch 003, the first patch to
  # author new monster templates. No import needed: the server file is present and
  # tracked.
  StrSheet_Creature:
    strategy: monolithic
    server_file: "StrSheet_Creature.xml"
    client_folder: "StrSheet_Creature"
    client_file: "StrSheet_Creature-00000.xml"
    root_element: "StrSheet_Creature"
    id_attribute: "templateId"
    xsd_file: "StrSheet_Creature/StrSheet_Creature.xsd"

  # Quest-marker location registry, keyed (huntingZoneId, templateId). One marker
  # world coordinate per quest-linked template; the client reads it to place the
  # journal objective marker. Registered 2026-07-28 and IMPORTED with `dsl import`,
  # because this family was client-only: `gen_npcloc.py` used to write the client
  # shard DIRECTLY, bypassing the pipeline. That is why a patch replay could not
  # reproduce it (the server tree is the reproducible one and NpcLoc was never in
  # it) and why a stash of the client tree silently discarded a regeneration.
  # The generator now writes the server file and this descriptor carries it across.
  StrSheet_NpcLoc:
    strategy: monolithic
    server_file: "StrSheet_NpcLoc.xml"
    client_folder: "StrSheet_NpcLoc"
    client_file: "StrSheet_NpcLoc-00000.xml"
    root_element: "StrSheet_NpcLoc"
    id_attribute: "templateId"
    composite_id_attributes: ["huntingZoneId", "templateId"]
    xsd_file: "StrSheet_NpcLoc/StrSheet_NpcLoc.xsd"

  # Gather-node marker registry, keyed templateId (= collection id). The collection
  # sibling of StrSheet_NpcLoc. Registered 2026-07-28. No import was needed: the
  # server file was already present and tracked. Only the sync leg was missing, so
  # the client half used to be a hand-written side effect of `gen_collectionloc.py`
  # rather than a synced result. That tool no longer writes any datasheet; it emits
  # a spec (`collectionLocStrings`) and this descriptor carries the result across.
  # Note templateId 496 spans continent 13 AND the mainland, the only such row of
  # the 177 shipped, so it must never be re-derived from continent-13 data alone.
  StrSheet_CollectionLoc:
    strategy: monolithic
    server_file: "StrSheet_CollectionLoc.xml"
    client_folder: "StrSheet_CollectionLoc"
    client_file: "StrSheet_CollectionLoc-00000.xml"
    root_element: "StrSheet_CollectionLoc"
    id_attribute: "templateId"
    xsd_file: "StrSheet_CollectionLoc/StrSheet_CollectionLoc.xsd"

  # World area/section topology. Per the DSL team's sync-config template
  # (commit 75da0211): SourceMapped with an explicit server->client filename map;
  # server files rank 1:1 onto client Area-{seq:D5}.xml by alphabetical order
  # (verified 289/289). Add one source_mapping line per file we intend to sync.
  # Note: XSD-driven attribute filtering keeps recallReviveContinentIdB/C on
  # client Sections because the client Area.xsd genuinely declares them; that
  # is correct behavior, not a server-attribute leak.
  AreaData:
    strategy: SourceMapped
    client_folder: "Area"
    root_element: "Area"
    id_attribute: "id"
    xsd_file: "Area/Area.xsd"
    # FIXED 2026-07-27: the key was "AreaData_13_ATW_Death_P.xml" without the
    # subdirectory prefix, but the server file lives at AreaData/. SourceMapped keys
    # are server-root-relative paths, not bare filenames (QuestCompensationData below
    # gets this right with "CompensationData/..."), so the entity planned 0 sources
    # and 0 targets, printed nothing, and exited 0. Consequence: the client Area leg
    # had NEVER synced, so every areaSections op in patches 001 and 002 was
    # server-only in practice, including spec 002/26's recall-point restore. Expect a
    # first-time client Area-00013 diff on the next sync. A zero-file plan being
    # indistinguishable from success is filed as
    # docs/dsl-requests/2026-07-27-idsorted-server-path-required.md.
    source_mapping:
      "AreaData/AreaData_13_ATW_Death_P.xml": "Area-00013.xml"

  # World map hierarchy (worlds > guards > sections > NPC markers). Drives the
  # client minimap/world-map bindings (section nameId -> MapDefine mapId).
  # merge: merge-by-id (added 2026-07-19). A plain monolithic sync is LOSSY here:
  # the EUR client file carries ~35 curated markers (dungeon entrances, brokers,
  # reputation stores across all cities) plus a couple of client-only sections
  # that the server file does not, so a full-file replace deletes them game-wide.
  # merge-by-id recursively merges the server projection into the client file down
  # the World > Guard > Section > Npc hierarchy: server records overwrite matched
  # ones, server-only records are added (e.g. the patch 001 Tower Base town from
  # spec 13), and client-only siblings are preserved at every level.
  # merge_key_attributes lists the key per level: Sections/Guards/Worlds key on
  # id, Npc markers on nameId (first attribute present wins).
  # See docs/dsl-requests/2026-07-19-newworldmapdata-sync-lossy.md.
  NewWorldMapData:
    strategy: monolithic
    merge: merge-by-id
    merge_key_attributes: [id, nameId]
    server_file: "WorldMap/NewWorldMapData.xml"
    client_folder: "NewWorldMapData"
    client_file: "NewWorldMapData-00000.xml"
    root_element: "NewWorldMapData"
    id_attribute: "id"
    xsd_file: "NewWorldMapData/NewWorldMapData.xsd"

  # Work object templates (portals, altars, gimmicks). Client copy carries the
  # isForQuestId/firstTaskId/lastTaskId gating, so a new or re-gated work object
  # needs this sync (spec 19 Sorcha portal precedent). Placement files
  # (WorkObjectTerritory_{hz}) have no client family and never sync. The
  # StrSheet_WorkObject / StrSheet_WorkObjectLoc legs stay hand-managed.
  WorkObjectData:
    strategy: monolithic
    server_file: "WorkObjectData.xml"
    client_folder: "WorkObjectData"
    client_file: "WorkObjectData-00000.xml"
    root_element: "WorkObjectData"
    id_attribute: "templateId"
    xsd_file: "WorkObjectData/WorkObjectData.xsd"

  BuyMenuList:
    strategy: SourceMapped
    client_folder: "MenuList"
    root_element: "MenuList"
    id_attribute: "id"
    xsd_file: "MenuList/MenuList.xsd"
    source_mapping:
      "BuyMenuList.xml": "MenuList-00000.xml"
      "BuyMenuList_CN.xml": "MenuList-00001.xml"
      "BuyMenuList_JP.xml": "MenuList-00002.xml"
      "BuyMenuList_KR.xml": "MenuList-00003.xml"
      "BuyMenuList_NAEU.xml": "MenuList-00004.xml"
      "BuyMenuList_RUS.xml": "MenuList-00005.xml"
      "BuyMenuList_THA.xml": "MenuList-00006.xml"
      "BuyMenuList_TW.xml": "MenuList-00007.xml"

  # ===========================================================================
  # SKILL DATA (USER + NPC)
  # ===========================================================================
  # Segmented strategy consolidates two server file groups into one client folder.
  # Segment 1 "user": UserSkillData_*.xml (alphabetical).
  # Segment 2 "npc":  NpcSkillData_*.xml  (numeric_suffix, zone-keyed).
  # Any active filter or --segment disables orphan deletion.

  SkillData:
    strategy: Segmented
    client_folder: "SkillData"
    client_pattern: "SkillData-{seq:D5}.xml"
    root_element: "SkillData"
    id_attribute: "id"
    xsd_file: "SkillData/SkillData.xsd"
    segments:
      - id: user
        server_pattern: "UserSkillData_*.xml"
        order: alphabetical
        filters:
          class:  { regex: '^UserSkillData_([^_.]+)' }
          race:   { regex: '^UserSkillData_[^_]+_([^_]+)_' }
          gender: { regex: '^UserSkillData_[^_]+_[^_]+_([FM])\.' }
          region: { regex: '^UserSkillData_Common_[^_]+_([A-Za-z]+)\.' }
      - id: npc
        server_pattern: "NpcSkillData_*.xml"
        order: numeric_suffix
        composite_id_attributes: ["id", "templateId"]
        filters:
          zone: { from: numeric_suffix }

  # ===========================================================================
  # QUEST DATA
  # ===========================================================================
  # Quest files (one quest per server file, zero-padded ID as filename).
  # Uses IdSorted strategy: server files sorted alphabetically by filename,
  # each maps to a client file at its sorted position.

  QuestDialog:
    strategy: IdSorted
    server_path: "QuestDialog"
    server_pattern: "QuestDialog_*.xml"
    sorting: numeric
    client_folder: "QuestDialog"
    client_pattern: "QuestDialog-{seq:D5}.xml"
    root_element: "QuestDialog"
    id_attribute: "id"
    xsd_file: "QuestDialog/QuestDialog.xsd"

  Quest:
    strategy: IdSorted
    server_path: "QuestData"
    server_pattern: "*.quest"
    client_folder: "Quest"
    client_pattern: "Quest-{seq:D5}.xml"
    root_element: "Quest"
    id_attribute: "id"
    xsd_file: "Quest/Quest.xsd"

  # Quest strings (journal text, popups, task success messages). One monolithic
  # server file against 2879 per-quest client shards whose shard number is an
  # opaque sequence index, not a function of the ids (shard order is not even
  # monotonic by quest id, and 00000/01765 are irregular). No bucket ranges can
  # express that, and shard-aware would drop every edit since each record is
  # sibling-owned. shard-routed follows the existing ownership instead: it
  # rewrites each record in the shard that already holds it, so the layout is
  # read from the client and never inferred. The source_mapping value is the
  # FALLBACK primary (where unowned/new records land), not the sole write target.
  StrSheet_Quest:
    strategy: SourceMapped
    merge: shard-routed
    client_folder: "StrSheet_Quest"
    root_element: "StrSheet_Quest"
    id_attribute: "id"
    xsd_file: "StrSheet_Quest/StrSheet_Quest.xsd"
    source_mapping:
      "StrSheet_Quest.xml": "StrSheet_Quest-00000.xml"

  # Quest reward tables. NOT server-only, despite the blanket claim about
  # compensation families in the domain KB and in this project's family map:
  # CCompensation/ECompensation/FCompensation/ICompensation have no client
  # folder, but the client DOES ship 153 QuestCompensationData shards and the
  # QUEST LOG reward panel reads them. The NPC accept dialog is server-fed
  # (S_DIALOG.questRewards), which is why the two windows disagreed for as long
  # as this family went unsynced: the log showed gold and exp (attributes, always
  # present) but no item, because the class-filtered <Item> rows we added were
  # server-side only. Root cause write-up: docs/plans/questcomp-client-sync.md.
  #
  # SourceMapped, not ZoneBased, for two reasons (both filed as DSL requests):
  #   - server_path is IdSorted-only, so ZoneBased cannot reach CompensationData/
  #   - ZoneBased auto sequence assignment misaligns here: 156 server zone files
  #     against 153 client shards, with zones 620/622/628 having no client shard
  #     and sitting mid-ordering, which shifts every zone after them
  #   docs/dsl-requests/2026-07-26-zonebased-server-path.md
  #   docs/dsl-requests/2026-07-26-zonebased-position-conflict-guard.md
  #
  # SCOPED TO ZONE 13 DELIBERATELY. Zone 13 is the only quest reward table this
  # project has ever modified. Mapping only what we own keeps a game-wide reward
  # rewrite out of the patch (same posture as the AreaData entry above). The
  # content-verified full 153-pair mapping is recorded in
  # docs/plans/questcomp-client-sync.md; add pairs from there when a new zone's
  # rewards come into scope, or the sync will silently skip them.
  QuestCompensationData:
    strategy: SourceMapped
    client_folder: "QuestCompensationData"
    root_element: "QuestCompensationData"
    id_attribute: "questId"
    xsd_file: "QuestCompensationData/QuestCompensationData.xsd"
    source_mapping:
      "CompensationData/QuestCompensationData_13.xml": "QuestCompensationData-00012.xml"

  # ===========================================================================
  # FIELD EVENT (GUARDIAN LEGION) DATA
  # ===========================================================================
  # The five families that make up a Guardian Legion mission. All five have real
  # client legs, so none of them may be mapped to None in migrate's
  # ENTITY_SYNC_MAP (that is the QuestCompensationData mistake repeated).
  #
  # The server/client split is a compiled boundary, not a convention: client
  # Field.xsd declares only 9 complex types and keeps just Guide, Marker,
  # FieldEventCloud/Aero and Progress.dividerPercent off the mission element.
  # The whole EventGroup/Event/EventTaskGroup/EventTask encounter script is
  # SERVER-ONLY by schema, so a script-only change legitimately syncs nothing.
  # Anything touching Guide, Marker, eventSize, dividerPercent, the aero dome, or
  # ShowRewardList does need the client leg.

  # Per-continent mission definitions. One server FieldData_{continentId}.xml
  # against one client Field-{seq}.xml, and the shipped client set is ordered
  # numerically by continentId (2000, 7001, 7003, 7005, 7011-7015, 7021, 7022,
  # 7031 -> shards 00000-00011), so this is an IdSorted layout, not SourceMapped.
  #
  # CONSEQUENCE FOR ISLAND OF DAWN: continent 13 sorts FIRST (13 < 2000), so
  # adding FieldData_13.xml shifts every existing shard by one and the client set
  # goes 12 -> 13 files. That is the Quest precedent exactly: a manifest-narrowed
  # sync cannot place a new shard in a sorted layout (E680), so any patch adding a
  # FieldData file must sync with --no-narrow. Expect a 13-file client diff on the
  # first run and treat a nonzero E680 as "you narrowed it", not as a real fault.
  # server_path "." is REQUIRED, not cosmetic. The client-sync reference calls
  # server_path optional for both ZoneBased and IdSorted ("without it the glob runs
  # at the server root"), and that holds for ZoneBased (NpcData globs the root with
  # no server_path) but NOT for IdSorted: omitting it, or setting it to "", plans
  # 0 sources and 0 targets silently, with no error and a green exit. Measured
  # 2026-07-27 against dsl.exe: server_path "." plans 12 sources to 12 targets,
  # absent and "" both plan 0. Filed as a docs/behaviour mismatch.
  Field:
    strategy: IdSorted
    server_path: "."
    server_pattern: "FieldData_*.xml"
    sorting: numeric
    client_folder: "Field"
    client_pattern: "Field-{seq:D5}.xml"
    root_element: "Field"
    id_attribute: "continentId"
    xsd_file: "Field/Field.xsd"

  # Global singleton: rotation schedule, contribution rates, reward bags, clear
  # reward pools, world-map UI vocabulary. An event that is not listed in a
  # FieldEventRotation group never fires at all (proven by 2000/2, whose rotation
  # group is commented out), so this file is load-bearing for every new mission.
  # Client FieldEvent.xsd is aggressive: FieldEventRotation and FieldEventPoint are
  # absent entirely and FieldEventReward is an empty complexType, so the schedule
  # and the real reward payload stay server-side while the client keeps only the
  # world-map presentation and each ClearReward's ShowRewardList tooltip.
  FieldEvent:
    strategy: monolithic
    server_file: "FieldEvent.xml"
    client_folder: "FieldEvent"
    client_file: "FieldEvent-00000.xml"
    root_element: "FieldEvent"
    id_attribute: "id"
    xsd_file: "FieldEvent/FieldEvent.xsd"

  # Mission strings: titles, descriptions, objective lines, banner and bubble text.
  # One monolithic server file (214 rows) against 10 client shards whose boundaries
  # follow the id convention {continent4}{eventIdx2}{seq3}: shard 00000 holds the
  # shared low-id and title band, 00001-00009 hold one continent each.
  #
  # shard-routed, same reasoning as StrSheet_Quest: it rewrites each record in the
  # shard that already owns it, so the existing layout is read from the client
  # rather than inferred, and new ids land in the fallback primary below. Bucket
  # would work too but would hard-code 10 ranges that the client already states.
  # A new continent's strings therefore land in shard 00000 rather than creating an
  # 11th shard, which is deliberate: it keeps the client file count stable.
  StrSheet_Field:
    strategy: SourceMapped
    merge: shard-routed
    client_folder: "StrSheet_Field"
    root_element: "StrSheet_Field"
    id_attribute: "id"
    xsd_file: "StrSheet_Field/StrSheet_Field.xsd"
    source_mapping:
      "StrSheet_Field.xml": "StrSheet_Field-00000.xml"

  # World topology: per-continent channel behaviour and hunting zone membership.
  # The client ships this family as ONE monolithic shard of 249 Continent rows and its
  # XSD genuinely declares channelType, so a continent flip is NOT server-only.
  # Registered 2026-07-28 for the Island of Dawn field event: continent 13 has to move
  # from channelingZone to field, and the client has to agree.
  # Note the XSD keeps only id, channelMax, channelType, isSpecificSpace,
  # inChannelingContinent, disableChannelListBtn and the HuntingZone children;
  # initChannelCount, userMaxPerChannel and the abnormality lists stay server-side.
  ContinentData:
    strategy: monolithic
    server_file: "ContinentData.xml"
    client_folder: "ContinentData"
    client_file: "ContinentData-00000.xml"
    root_element: "ContinentData"
    id_attribute: "id"
    xsd_file: "ContinentData/ContinentData.xsd"

  # Portrait cutin records (image path, duration, speaker, string id). Registered
  # for completeness so a future eventDialogs: block is never silently skipped;
  # v0 of the IoD event uses no cutins.
  #
  # NOTE: the server-side EventDialog.xml is an IMPORTED client family (via
  # `dsl import`), is currently UNTRACKED in the server datasheet repo, and is the
  # only non-StrSheet datasheet at the server root without a UTF-8 BOM. Reconcile
  # its provenance before relying on it; see the field-event plumbing notes.
  EventDialog:
    strategy: monolithic
    server_file: "EventDialog.xml"
    client_folder: "EventDialog"
    client_file: "EventDialog-00000.xml"
    root_element: "EventDialog"
    id_attribute: "id"
    xsd_file: "EventDialog/EventDialog.xsd"

  # Cutin body text. Already tracked server-side, unlike EventDialog.xml above.
  StrSheet_EventDialog:
    strategy: monolithic
    server_file: "StrSheet_EventDialog.xml"
    client_folder: "StrSheet_EventDialog"
    client_file: "StrSheet_EventDialog-00000.xml"
    root_element: "StrSheet_EventDialog"
    id_attribute: "id"
    xsd_file: "StrSheet_EventDialog/StrSheet_EventDialog.xsd"

  StrSheet_Item:
    strategy: SourceMapped
    client_folder: "StrSheet_Item"
    root_element: "StrSheet_Item"
    id_attribute: "id"
    xsd_file: "StrSheet_Item/StrSheet_Item.xsd"
    source_mapping:
      # Base string sheet
      "StrSheet_Item.xml": "StrSheet_Item-00000.xml"
      # Regional variants
      "StrSheet_Item_cn.xml": "StrSheet_Item-00001.xml"
      "StrSheet_Item_ctf.xml": "StrSheet_Item-00004.xml"
      "StrSheet_Item_JP.xml": "StrSheet_Item-00007.xml"
      "StrSheet_Item_KR.xml": "StrSheet_Item-00009.xml"
      "StrSheet_Item_NAEU.xml": "StrSheet_Item-00011.xml"
      "StrSheet_Item_RUS.xml": "StrSheet_Item-00013.xml"
      "StrSheet_Item_THA.xml": "StrSheet_Item-00015.xml"
      "StrSheet_Item_TW.xml": "StrSheet_Item-00018.xml"
