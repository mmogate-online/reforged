# Classic kill loot for hunting zone 419, ported whole from the classic
# class compensation table. Generated, do not hand-edit.
#
# Rows only the live server has are deleted, and so is a live row whose classic
# counterpart carries no bags. A shared row is deleted and then restated whole, because an
# upsert onto an existing row merges its bags with the live ones, and the DSL runs deletes
# before upserts whatever their order in this file. Items 70116, 70117 and 90012 are left
# out of every bag, and a bag they leave empty is dropped. Names keep their internal
# labels; templateId is the key.
#
# A class branch pays nothing to a class it does not name, so each row's branch is
# copied for the four classes that postdate the classic data. The `_classBag_*` bases
# hold each distinct branch body; a branch states its class name only.
#
# provenance: ported-from-v31

spec:
  version: "1.0"
  schema: v92

definitions:
  _classBag_0:
    itemBags:
