# Hesketh the tanner at Maon's Cabin, and his one-time quest Bark for the Tannery (215): an
# optional pointer to the Verdra Plants on the slopes around the cabin, the only plants in
# the Fey Forest that carry Palisade Tanbark. The quest asks for one gather's worth of bark
# and pays it back, so it costs the player nothing but the walk.
#
# A villager needs a VillagerData condition file and a VillagerDialog entry besides its
# template, or it cannot be clicked. dir is degrees, counter-clockwise from +x; Hesketh faces
# the way Reindal does. This spec adds a spawn point, so the npc location prune belongs after
# the apply.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

variables:
  TANBARK: 920287                # Palisade Tanbark

definitions:
  # Villager envelope; aiid 100 is the villager idle AI, so the tanner does not wander.
