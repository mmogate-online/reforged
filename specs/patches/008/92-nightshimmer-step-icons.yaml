        - name: Icon_Items.evo_va_devan_captains_hornmask_Tex
        - name: Icon_Items.evo_va_nightshimmer_grip_core_Tex
        - name: Icon_Items.evo_va_sporewalker_rootwood_Tex
        - name: Icon_Items.evo_va_nightshimmer_thread_Tex
        - name: Icon_Items.evo_va_scion_ritual_cord_Tex
        - name: Icon_Items.evo_va_oblivion_shadeflax_Tex
        - name: Icon_Items.evo_recipe_nightshimmer_grip_core_Tex
        - name: Icon_Items.evo_recipe_nightshimmer_thread_Tex
