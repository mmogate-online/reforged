# Region design merchants: Bram in Lumbertown and Ysolde in Crescentia, both opening one
# shared store of the region's evolution designs. A design added to the town design stores
# would be sold in every town that shares them, so these designs get a store of their own.
#
# A shop NPC needs a VillagerData condition file and a VillagerDialog entry besides its
# template: the shop menu is drawn inside the dialog window, so without them the NPC cannot be
# clicked. A gold store charges the item's own buyPrice, so the price lives on the item. The
# store title and the tab label resolve through the NPC string table by the store's stringId
# and the tab's stringed. A villagerMenus upsert replaces the villager's whole menu list.
#
# dir is degrees, counter-clockwise from +x. This spec adds spawn points, so the npc location
# prune belongs after the apply.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

definitions:
  # Villager envelope; aiid 100 is the villager idle AI, so neither merchant wanders.
  _designMerchant:
    villager: true
    invincible: true
    aiid: 100
    scale: 1
    size: medium
    resourceType: medium
    resourceSize: 100
    class: ""
    collideOnMove: false
    isObjectNpc: false
    isWideBroadcaster: false
    isFreeNamed: false
    isLightParty: false
    elite: false
    showAggroTarget: false
    showShorttermTarget: false
    dontTurn: false
    partyMember: 0
    spawnScriptId: 0
    despawnScriptId: 0
    pcDespawnScriptId: 0
    villagerVolumeOffset: ""
    villagerVolumeActiveRange: 0
    villagerVolumeHalfHeight: 0
    villagerVolumeInteractionDist: 0
    race: Human
    namePlate:
      deathNameplateHeight: 0
    abnormalityResistanceOverride:
      resetTime: 60000
    stat:
      maxHp: 10000
      walkSpeed: 60
      runSpeed: 110
      atk: 100
      def: 2000
      exp: 1
      level: 40
    npcOnly:
      onDeathSkill: 0
    anger:
      gaugeSize: 403799
      time: 16633
      moveSpeedUpRate: 1.6
      accumRateWhenHpLow: 1.0
      accumRateWhenHpMed: 1
      accumRateWhenHpHigh: 1.0
      modeOnProbabilityWhenPartyMemberDead: 0.2
    critical:
      str: 30
      res: 180
      powRate: 1.5
    criticalAdjust:
      front: 1
      right: 1.2
      left: 1.2
      back: 1.6
    reaction:
