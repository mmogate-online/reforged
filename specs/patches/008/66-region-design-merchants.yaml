    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000039
      $extends: VillagerTerritory
      desc: "Design Merchant, Lumbertown"
      fences:
        - [88029, -2503, 724]
        - [88329, -2503, 724]
        - [88329, -2203, 724]
        - [88029, -2203, 724]
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900032
      $extends: VillagerTerritory
      desc: "Design Merchant, Crescentia"
      fences:
        - [94568, 15419, 2691]
        - [94868, 15419, 2691]
        - [94868, 15719, 2691]
        - [94568, 15719, 2691]

territorySpawns:
