    - { huntingZoneId: 60, templateId: 1100, name: "Bram", gender: male, race: Human, title: "Design Merchant" }
    - { huntingZoneId: 59, templateId: 1100, name: "Ysolde", gender: female, race: Human, title: "Design Merchant" }

speechConditions:
  upsert:
    - huntingZoneId: 60
      templateId: 1100
      note: "Design Merchant Bram"
      normal:
        - { id: 1, paramType: random }
      popup: []
    - huntingZoneId: 59
      templateId: 1100
      note: "Design Merchant Ysolde"
      normal:
        - { id: 1, paramType: random }
      popup: []

# voiceTypeId is the voice of the NPC whose model was copied.
villagerDialogs:
  upsert:
    - huntingZoneId: 60
      id: 1100
      voiceTypeId: 27
      texts:
        - id: 1
          huntingZoneId: 60
          villagerId: 1100
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Outriders ride the timber road on gear made from what the forest gives up. I sell the designs, <PCNAME>. The hunting is yours."
    - huntingZoneId: 59
      id: 1100
      voiceTypeId: 32
      texts:
        - id: 1
          huntingZoneId: 59
          villagerId: 1100
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Every region keeps its own patterns, and Crescentia keeps them here. Bring the materials and a smith will do the rest."

villagerMenus:
  upsert:
    - huntingZoneId: 60
      npcTemplateId: 1100
      guideEffectId: 118
      menus:
        - { type: PointStore, id: 923 }
    - huntingZoneId: 59
      npcTemplateId: 1100
      guideEffectId: 118
      menus:
        - { type: PointStore, id: 923 }

# A Materials tab holds the designs of the lane's gear parts, then one tab per gear set the region
# sells: its twelve class weapons, then its armor. The title already says designs, so a set's tab
# carries the set name alone. A store holds at most five tabs, and a tab's label is read by its
# stringed, not its list id.
buyMenuLists:
  upsert:
    - id: 923
      stringId: 920
      desc: "Regional Gear Designs"
      itemLists:
        - id: 9231
          stringed: 9200
        - id: 9232
          stringed: 9201
        - id: 9233
          stringed: 9202

# Part designs open at Arcadian Wardens grade 1 and gear designs at grade 2; their point and
# grade rows live with the faction's store.
