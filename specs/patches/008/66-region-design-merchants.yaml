      statRes: 150
      miniRes: 100
      basicRes: 100
      basicIncRes: 0
      basicGaugeResetTime: 20000
      maxBasicGauge: 2000
      maxAdditionalGauge: 600000
    abnormality:
      strA: 50
      resA: 40
      strB: 50
      resB: 40
      strC: 50
      resC: 40
      strD: 50
      resD: 40
    aggro:
      hateSkillCategoryName: ""
      viewRadius: 200
      viewAngle: 360
      sightRangeAggroWeight: 1.3
      hateSkillAggroWeight: 1
      bigReactionAggroWeight: 0.5
      aggroSendToClanDistance: 300
      clanName: ""
      aggroSendToPartyDistance: 400
      aggroSendRate: 1
      aggroSendStackRate: 0.1
      aggroSendStackRateWhenFirstAttacked: 2
      aggroReceiveOnlyInSight: false
      aggroReceiveRate: 0.5
    skillList: {}
    stackPoint:
      maxStackPoint: 10
      minStackPointRequire: 3
      stackPointPeriod: 8000

  _villagerSpawn:
    memberId: 0
    ai: 100
    randomPos: false
    spawnCount: 1
    offsetZ: 0
    respawnTime: 10000
    respawnRandomTime: "20000"
    delaySpawnTimeWhenWorldStart: 0
    isAggressiveMonster: false
    isReturn: false
    isReturnMyTerritory: false
    conditionalSpawn: false
    returnDistance: 0
    moveInTerritory: false
    questPatrol: false
    peaceStateNoMoving: false
    cautionStateNoMoving: false
    voidSpawn: false
    viewRadius: 300
    viewAngle: 130
    alertRadius: 400
    alertAngle: 360
    aggroShareGroupId: 0
    aggroSendToPartyDistance: 400
    aggroSendToClanDistance: 300
    aggroSendToTerritory: ""
    aggroIgnorePartyId: ""
    aggroReceiveOnlyInSight: false
    excludeAggroLimit: false
    escapeLocation: [0, 0, 0]
    popupMsg: ""
    msgProb: 0
    msgInterval: 0
    msgBroadcastingChannel: false
    randomGroupId: 0

  _villagerTerritory:
    type: normal
    addMaxZ: 256.000000
    subtractMinZ: 0.000000
    eventId: 0
    randomPosMinDist: 100.000000
    peaceMoveNpcCheckDist: 100.000000
    attribute:
      abnormality: 0
      achieveConditionId: 0

npcs:
  upsert:
    - huntingZoneId: 60
      id: 1100
      $extends: _designMerchant
      name: "Design Merchant Bram"
      shapeId: 500095                       # Royer 60,1057
      basicActionId: 5000800
      gender: male
    - huntingZoneId: 59
      id: 1100
      $extends: _designMerchant
      name: "Design Merchant Ysolde"
      shapeId: 500127                       # Sadma 60,1059
      basicActionId: 5001200
      gender: female

territoryGroups:
  upsert:
    - huntingZoneId: 60
      groupId: 6000003
      desc: "Reforged Vendors, Lumbertown"
    - huntingZoneId: 59
      groupId: 5900006
      desc: "Reforged Vendors, Crescentia"

territories:
