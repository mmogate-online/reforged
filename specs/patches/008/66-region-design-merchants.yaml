    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000039
      $extends: _villagerTerritory
      desc: "Design Merchant, Lumbertown"
      fences:
        - [88029, -2503, 724]
        - [88329, -2503, 724]
        - [88329, -2203, 724]
        - [88029, -2203, 724]
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900032
      $extends: _villagerTerritory
      desc: "Design Merchant, Crescentia"
      fences:
        - [94568, 15419, 2691]
        - [94868, 15419, 2691]
        - [94868, 15719, 2691]
        - [94568, 15719, 2691]

territorySpawns:
  upsert:
    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000039
      npcInstanceId: 6004053
      npcTemplateId: 1100
      $extends: _villagerSpawn
      desc: "Design Merchant Bram"
      pos: [88179, -2353, 724]
      dir: 270
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900032
      npcInstanceId: 5900418
      npcTemplateId: 1100
      $extends: _villagerSpawn
      desc: "Design Merchant Ysolde"
      pos: [94718, 15569, 2691]
      dir: 35

creatureStrings:
  upsert:
    - { huntingZoneId: 60, templateId: 1100, name: "Bram", gender: male, race: Human, title: "Design Merchant" }
    - { huntingZoneId: 59, templateId: 1100, name: "Ysolde", gender: female, race: Human, title: "Design Merchant" }

speechConditions:
  upsert:
    - huntingZoneId: 60
      templateId: 1100
      note: "Design Merchant Bram"
      normal:
        - { id: 1, paramType: random }
      popup: []
    - huntingZoneId: 59
      templateId: 1100
      note: "Design Merchant Ysolde"
      normal:
        - { id: 1, paramType: random }
      popup: []

# voiceTypeId is the voice of the NPC whose model was copied.
villagerDialogs:
  upsert:
    - huntingZoneId: 60
      id: 1100
      voiceTypeId: 27
      texts:
        - id: 1
          huntingZoneId: 60
          villagerId: 1100
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Outriders ride the timber road on gear made from what the forest gives up. I sell the designs, <PCNAME>. The hunting is yours."
    - huntingZoneId: 59
      id: 1100
      voiceTypeId: 32
      texts:
        - id: 1
          huntingZoneId: 59
          villagerId: 1100
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Every region keeps its own patterns, and Crescentia keeps them here. Bring the materials and a smith will do the rest."

villagerMenus:
  upsert:
    - huntingZoneId: 60
      npcTemplateId: 1100
      menus:
        - { type: Merchant, id: 920 }
    - huntingZoneId: 59
      npcTemplateId: 1100
      menus:
        - { type: Merchant, id: 920 }

buyMenuLists:
  upsert:
    - id: 920
      stringId: 920
      desc: "Regional Designs"
      itemLists:
        - id: 9200
          stringed: 9200

buyLists:
  upsert:
    - id: 9200
      desc: "Outrider Designs"
      items:
        - { itemId: 920290, priceRevision: 1 }
        - { itemId: 920291, priceRevision: 1 }

npcStrings:
  upsert:
    - { id: 920, string: "Regional Designs" }
    - { id: 9200, string: "Outrider Designs" }
