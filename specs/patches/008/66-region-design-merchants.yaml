    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000039
      npcInstanceId: 6004053
      npcTemplateId: 1100
      $extends: VillagerSpawn
      desc: "Design Merchant Bram"
      pos: [88179, -2353, 724]
      dir: 270
    - huntingZoneId: 59
      groupId: 5900006
