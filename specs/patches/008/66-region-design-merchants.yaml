# Region design merchants: Bram in Lumbertown and Ysolde in Crescentia, both opening one
# shared store of the region's designs. A design added to the town design stores would be sold
# in every town that shares them, so these designs get a store of their own. Every design in it
# is bought with Arcadian Wardens points, so it is a PointStore menu and its tabs carry the
# faction gate. A villager shows one button per menu type and opens the first menu of that
# type, so the region's designs sit in one store and never beside another PointStore.
#
# A shop NPC needs a VillagerData condition file and a VillagerDialog entry besides its
# template: the shop menu is drawn inside the dialog window, so without them the NPC cannot be
# clicked. A PointStore charges the faction's ReputationItem row, which lives with the
# faction's store. The store title and the tab label resolve through the NPC string table by the store's stringId
# and the tab's stringed. A villagerMenus upsert replaces the villager's whole menu list.
#
# dir is degrees, counter-clockwise from +x. This spec adds spawn points, so the npc location
# prune belongs after the apply.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: reforged-villagers
    use:
      definitions:
        - ReforgedVillager
        - VillagerSpawn
        - VillagerTerritory

definitions:
  _designMerchant:
    $extends: ReforgedVillager
    scale: 1
    race: Human

npcs:
  upsert:
    - huntingZoneId: 60
      id: 1100
      $extends: _designMerchant
      name: "Design Merchant Bram"
      shapeId: 500095                       # Royer 60,1057
      basicActionId: 5000800
      gender: male
    - huntingZoneId: 59
      id: 1100
      $extends: _designMerchant
      name: "Design Merchant Ysolde"
      shapeId: 500127                       # Sadma 60,1059
      basicActionId: 5001200
      gender: female

territoryGroups:
  upsert:
    - huntingZoneId: 60
      groupId: 6000003
      desc: "Reforged Vendors, Lumbertown"
    - huntingZoneId: 59
      groupId: 5900006
      desc: "Reforged Vendors, Crescentia"

territories:
