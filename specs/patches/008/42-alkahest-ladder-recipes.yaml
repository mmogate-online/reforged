# Alkahest ladder recipes, on Alchemy. Three powders of a tier and one Alchemical Kit brew two
# alkahest of the next tier, one kit rank per hundred points of proficiency, as the classic
# dust-and-kit recipes do. The refining recipes turn gathered ore, fibers and essence into the
# powders above the first, so the upper tiers can be brewed without dismantling anything. A
# recipe's id equals the id of the formula item that teaches it.
