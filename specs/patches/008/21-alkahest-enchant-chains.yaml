# Enchant chains (MaterialEnchantData) and the item links of levels 1 to 37
# Generated by generate_enchant_materials.py, do not hand-edit.
#
# Every step lists Alkahest (15), the base of the alkahest ladder. The server replaces a listed
# material whose ScrollItemRevision bonus is 0 with the highest-bonus alkahest the player holds
# in the full amount, and adds that bonus. A listed alkahest whose own bonus is above 0 is never
# replaced, so the base must be the 0-bonus tier or the higher tiers never enter an enchant.
# A material id cannot be swapped by update, so the previous spec deletes the chains that exist
# and this one writes each chain whole.
#
# requiredMoney is the fee per attempt: the gear power curve at the band's level and grade, times
# the step's Alkahest count. One chain serves every item of a level band, so levels 1 to 37 are
# split into bands and their items are relinked here.
# provenance: policy

