# Revelation gear recipes. A crafted piece costs the materials of the evolution into the same
# piece at one and a half times the counts, except the single Lumbertown Mission Writ every
# piece costs either way, and it is crafted at +0, so evolving a held piece stays the cheaper
# route. On top of those, each recipe takes what classic crafted gear of its
# level takes: the refined material of its weapon kind or armor weight (ingot for metal weapons
# and mail, silex for magic weapons, leather and cloth for the lighter weights), the runes of its
# band (Shara on weapons, Arun on armor) and the vendor kit. Cost, proficiency and experience
# follow the classic band 1 rows. A recipe's id equals the id of the design item that teaches it.
#
# Weaponcrafting's group lacks the Powerfists, Shuriken and Runeglaive headings whose texts the
# client carries, so they are added here. A critical result would be the same piece, so the
# recipes name none, in the vanilla shape of a recipe without one: no critical item and no
# critical rate. The loader refuses a critical item paired with a zero rate.
# provenance: policy

