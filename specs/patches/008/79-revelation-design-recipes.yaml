# Revelation gear recipes. A crafted piece costs the materials of the evolution into the same
# piece at one and a half times the counts, and it is crafted at +0, so evolving a held piece
# stays the cheaper route. A recipe's id equals the id of the design item that teaches it.
#
# Each recipe sits under its weapon type's or armor slot's Basic heading. Weaponcrafting's
# group lacks the Powerfists, Shuriken and Runeglaive headings whose texts the client carries,
# so they are added here; a recipe whose category its profession's group does not carry is
# listed under no heading. The loader refuses a recipe that names a critical result with a zero
# critical rate, so the rate is set and the critical result is the same single piece.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

artisanCategories:
  upsertCategories:
    - id: 21
      categories:
        - { id: 1212, pos: 1, stringId: 911212 }
        - { id: 1213, pos: 1, stringId: 911213 }
        - { id: 1214, pos: 1, stringId: 911214 }

