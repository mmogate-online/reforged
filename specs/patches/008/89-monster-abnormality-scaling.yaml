# Monster buffs and the debuffs monsters put on players, scaled by one whole factor so a
# buff or a damage over time weighs as much as the rescaled monsters around it. A tier
# ladder is scaled as a unit, so its steps keep their order. A buff above 1 is multiplied, a
# debuff below 1 has its strength multiplied, and a share of max HP per tick is multiplied.
# Crowd control, immunity flags and speed buffs are left as they are.
#
# Effects are clear-and-replace: each entry restates every effect of its abnormality.
# Generated, do not hand-edit.
# provenance: policy

