# Accessory-only fusion structures, tiers 1 to 5. A tier-up structure turns three
# Pristine crystals of tier n into a random Pristine crystal of tier n + 1, read from
# the accessory pool of that tier; a dyad structure turns three Pristine crystals of
# tier n into a random Dyad of tier n. Neither is ever bought back for gold.
# provenance: policy

