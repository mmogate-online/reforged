# Crafting Supplies: the vendor kits the region's lane recipes consume, sold by a blacksmith in
# each town (Jaram in Lumbertown, Keid in Crescentia). The design merchants sell designs only.
# A gold store charges the item's own buyPrice, so the kits keep their vanilla price.
#
# Keid's name, dialog and condition file already exist in Crescentia's files, but no template or
# spawn backs them; the template takes the model of Tafan, the castanic blacksmith of zone 84. A
# villagerMenus upsert replaces the villager's whole menu list; neither blacksmith had one. This
# spec adds a spawn point, so the npc location prune belongs after the apply.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

definitions:
  # Villager envelope; aiid 100 is the villager idle AI, so the blacksmith does not wander.
  _blacksmith:
    villager: true
    invincible: true
    aiid: 100
    scale: 1
    size: medium
    resourceType: medium
    resourceSize: 100
    class: ""
    collideOnMove: false
    isObjectNpc: false
    isWideBroadcaster: false
    isFreeNamed: false
    isLightParty: false
    elite: false
    showAggroTarget: false
    showShorttermTarget: false
    dontTurn: false
    partyMember: 0
    spawnScriptId: 0
    despawnScriptId: 0
    pcDespawnScriptId: 0
    villagerVolumeOffset: ""
    villagerVolumeActiveRange: 0
    villagerVolumeHalfHeight: 0
    villagerVolumeInteractionDist: 0
    namePlate:
      deathNameplateHeight: 0
    abnormalityResistanceOverride:
      resetTime: 60000
    stat:
      maxHp: 10000
      walkSpeed: 60
      runSpeed: 110
      atk: 100
      def: 2000
      exp: 1
      level: 40
    npcOnly:
      onDeathSkill: 0
    anger:
      gaugeSize: 403799
      time: 16633
      moveSpeedUpRate: 1.6
      accumRateWhenHpLow: 1.0
      accumRateWhenHpMed: 1
      accumRateWhenHpHigh: 1.0
      modeOnProbabilityWhenPartyMemberDead: 0.2
    critical:
      str: 30
      res: 180
      powRate: 1.5
    criticalAdjust:
      front: 1
      right: 1.2
      left: 1.2
      back: 1.6
    reaction:
      statStr: 40
      statRes: 150
      miniRes: 100
      basicRes: 100
      basicIncRes: 0
      basicGaugeResetTime: 20000
      maxBasicGauge: 2000
      maxAdditionalGauge: 600000
    abnormality:
      strA: 50
      resA: 40
      strB: 50
      resB: 40
      strC: 50
      resC: 40
      strD: 50
      resD: 40
    aggro:
      hateSkillCategoryName: ""
      viewRadius: 200
      viewAngle: 360
      sightRangeAggroWeight: 1.3
      hateSkillAggroWeight: 1
      bigReactionAggroWeight: 0.5
      aggroSendToClanDistance: 300
      clanName: ""
      aggroSendToPartyDistance: 400
      aggroSendRate: 1
      aggroSendStackRate: 0.1
      aggroSendStackRateWhenFirstAttacked: 2
      aggroReceiveOnlyInSight: false
      aggroReceiveRate: 0.5
    skillList: {}
    stackPoint:
      maxStackPoint: 10
      minStackPointRequire: 3
      stackPointPeriod: 8000

  _villagerSpawn:
    memberId: 0
    ai: 100
    randomPos: false
    spawnCount: 1
    offsetZ: 0
    respawnTime: 10000
    respawnRandomTime: "20000"
    delaySpawnTimeWhenWorldStart: 0
    isAggressiveMonster: false
    isReturn: false
    isReturnMyTerritory: false
    conditionalSpawn: false
    returnDistance: 0
    moveInTerritory: false
    questPatrol: false
    peaceStateNoMoving: false
    cautionStateNoMoving: false
    voidSpawn: false
    viewRadius: 300
    viewAngle: 130
    alertRadius: 400
    alertAngle: 360
    aggroShareGroupId: 0
    aggroSendToPartyDistance: 400
    aggroSendToClanDistance: 300
    aggroSendToTerritory: ""
    aggroIgnorePartyId: ""
    aggroReceiveOnlyInSight: false
    excludeAggroLimit: false
    escapeLocation: [0, 0, 0]
    popupMsg: ""
    msgProb: 0
    msgInterval: 0
    msgBroadcastingChannel: false
    randomGroupId: 0

  _villagerTerritory:
    type: normal
    addMaxZ: 256.000000
    subtractMinZ: 0.000000
    eventId: 0
    randomPosMinDist: 100.000000
    peaceMoveNpcCheckDist: 100.000000
    attribute:
      abnormality: 0
      achieveConditionId: 0

npcs:
  upsert:
    - huntingZoneId: 59
      id: 2501
      $extends: _blacksmith
      name: "Blacksmith Keid"
      shapeId: 510230                       # Tafan 84,1036
      basicActionId: 5001500
      race: Castanic
      gender: male

# The territory group is spec 66's Crescentia vendor group. dir is degrees, counter-clockwise
# from +x.
territories:
  upsert:
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900033
      $extends: _villagerTerritory
      desc: "Blacksmith, Crescentia"
      fences:
        - [94885, 15785, 2693]
        - [95185, 15785, 2693]
        - [95185, 16085, 2693]
        - [94885, 16085, 2693]

territorySpawns:
  upsert:
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900033
      npcInstanceId: 5900419
      npcTemplateId: 2501
      $extends: _villagerSpawn
      desc: "Blacksmith Keid"
      pos: [95035, 15935, 2693]
      dir: 121                              # as Lunarea 59,1003

villagerMenus:
  upsert:
    - huntingZoneId: 60
      npcTemplateId: 1010
      guideEffectId: 119
      menus:
        - { type: Merchant, id: 921 }
    - huntingZoneId: 59
      npcTemplateId: 2501
      guideEffectId: 119
      menus:
        - { type: Merchant, id: 921 }

# One tab per kit family the region's recipes consume; a later region's band adds its kit tier.
buyMenuLists:
  upsert:
    - id: 921
      stringId: 921
      desc: "Crafting Supplies"
      itemLists:
        - id: 9210
          stringed: 9210

buyLists:
  upsert:
    - id: 9210
      desc: "Kits"
      items:
        - { itemId: 1621, priceRevision: 1 }     # Apprentice Weapon Kit
        - { itemId: 1622, priceRevision: 1 }     # Apprentice Armor Kit
        - { itemId: 1631, priceRevision: 1 }     # Apprentice Refining Kit

npcStrings:
  upsert:
    - { id: 921, string: "Crafting Supplies" }
    - { id: 9210, string: "Kits" }
