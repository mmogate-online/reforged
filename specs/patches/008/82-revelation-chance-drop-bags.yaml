# Revelation drop route. Each chance mob of the Fey Forest gains one bag per gear slot, rolled
# once per kill at the slot's own chance. Each rare boss gains three bags of its whole pool,
# rolled once per kill at 1, 0.5 and 0.25, so every kill pays at least one piece. The rows
# already repeat bag ids, so each new bag carries a name of its own for the next spec to select
# it by. A mob that has no loot row at all gets its whole row here, bags filled in place, since
# an update matches nothing.
# provenance: policy
spec:
  version: "1.0"
  schema: v92

eCompensations:
  update:
    - huntingZoneId: 2
      npcTemplateId: 5
      changes:
        addItemBags:
          - { id: 103, bagName: "revelation-drop-weapon", probability: 0.00539523 }
          - { id: 104, bagName: "revelation-drop-body", probability: 0.00179841 }
          - { id: 105, bagName: "revelation-drop-hand", probability: 0.00269762 }
          - { id: 106, bagName: "revelation-drop-feet", probability: 0.00269762 }
    - huntingZoneId: 2
      npcTemplateId: 6
      changes:
        addItemBags:
