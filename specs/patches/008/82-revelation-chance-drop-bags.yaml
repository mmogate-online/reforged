          - { id: 103, bagName: "revelation-drop-body", probability: 0.00146294 }
          - { id: 104, bagName: "revelation-drop-hand", probability: 0.00219441 }
          - { id: 105, bagName: "revelation-drop-feet", probability: 0.00219441 }
    - huntingZoneId: 2
