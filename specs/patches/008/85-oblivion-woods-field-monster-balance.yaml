# Oblivion Woods (zone 3): raise every hostile monster's maxHp x7 and atk x7 over its current
# values, so that combat in the zone keeps pace with the gear formula's lift on player equipment,
# as the Fey Forest rescale does for the zone before it.
#
# Scope: one factor for every hostile monster the zone spawns, field, named, quest and rare
# alike, with the attack exceptions below. The ambient creature, the quest villager and the
# notice board are left out.
#
# TRAP: `multiply` is a delta from the file's current values, not an absolute target. It is safe
# under a whole-patch migrate, which reads from the server repo's committed baseline; a bare
# single-spec apply against the working tree compounds it.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: npc-ids
    use:
      variables:
        - OW_STONEBEAK_SCAVENGER
        - OW_AGITATED_SPOREWALKER
        - OW_MOSSY_GHILLIEDHU
        - OW_REAVER_OF_RESURRECTION
        - OW_EBONHEART_SORCERER
        - OW_FALLEN_DEFENDER
        - OW_DEVAN_ROBBER
        - OW_DEVAN_SCRAPPER
        - OW_DEVAN_BRIGAND
        - OW_AGGRAVATED_SPOREWALKER
        - OW_STONEBEAK_SOLDIER
        - OW_STONEBEAK_FIGHTER
        - OW_DEVAN_BANDIT
        - OW_DEVAN_BLADEMASTER
        - OW_DEVAN_WARRIOR
        - OW_DEVAN_ARCANIST
        - OW_DEVAN_CHANTER
        - OW_FURIOUS_DRAGOON
        - OW_FALLEN_SOLDIER
        - OW_GRAYAL
        - OW_SKELETAL_RETAINER
        - OW_SKELETAL_SOLDIER
        - OW_DAKANIUS
        - OW_DEVAN_ARCHPRIEST
        - OW_DEVAN_WARLORD
        - OW_DARK_MAIDEN
        - OW_KULSILVA
        - OW_DAKANIUSS_GUARD_1
        - OW_DAKANIUSS_GUARD_2
        - OW_DEVAN_WATCHER
        - OW_DUR_BARAK
        - OW_LANOK
        - OW_BASILISK

balanceProfiles:
  - name: OblivionWoodsMonsters
    npcFilter:
      huntingZoneId: 3
      id:
        - $OW_STONEBEAK_SCAVENGER
        - $OW_AGITATED_SPOREWALKER
        - $OW_MOSSY_GHILLIEDHU
        - $OW_REAVER_OF_RESURRECTION
        - $OW_EBONHEART_SORCERER
        - $OW_FALLEN_DEFENDER
        - $OW_DEVAN_ROBBER
        - $OW_DEVAN_SCRAPPER
        - $OW_DEVAN_BRIGAND
        - $OW_AGGRAVATED_SPOREWALKER
        - $OW_STONEBEAK_SOLDIER
        - $OW_STONEBEAK_FIGHTER
        - $OW_DEVAN_BANDIT
        - $OW_DEVAN_BLADEMASTER
        - $OW_DEVAN_WARRIOR
        - $OW_DEVAN_ARCANIST
        - $OW_DEVAN_CHANTER
        - $OW_FURIOUS_DRAGOON
        - $OW_FALLEN_SOLDIER
        - $OW_GRAYAL
        - $OW_SKELETAL_RETAINER
        - $OW_SKELETAL_SOLDIER
        - $OW_DAKANIUS
        - $OW_DEVAN_WARLORD
        - $OW_DARK_MAIDEN
        - $OW_DAKANIUSS_GUARD_1
        - $OW_DAKANIUSS_GUARD_2
        - $OW_DEVAN_WATCHER
        - $OW_LANOK
        - $OW_BASILISK
    npc:
      stat:
        maxHp: { multiply: 7 }
        atk:   { multiply: 7 }

  # Kulsilva's authored attack is thirteen times the Devan Arcanist's on the same model, and
  # Basenius's skill rows are authored several times above the other captains', so the zone's
  # attack factor would let their quick attacks kill in two hits. They take a smaller one.
  - name: OblivionWoodsCasterCaptains
    npcFilter:
      huntingZoneId: 3
      id:
        - $OW_DEVAN_ARCHPRIEST
        - $OW_KULSILVA
    npc:
      stat:
        maxHp: { multiply: 7 }
        atk:   { multiply: 4 }

  # Dur Barak's authored base attack is seventeen times a Devan field monster's, so any raise
  # lets his two-hit slash kill an arriving player in one use. His attack stays at its own value.
  - name: OblivionWoodsDurBarak
    npcFilter:
      huntingZoneId: 3
      id:
        - $OW_DUR_BARAK
    npc:
      stat:
        maxHp: { multiply: 7 }
        atk:   { multiply: 1 }
