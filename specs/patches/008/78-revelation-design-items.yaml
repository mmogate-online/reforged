# Revelation gear designs: one per piece, twelve class weapons and the three armor weights' body,
# hands and feet. The region design merchants sell them for gold, and a gold store charges the
# item's own buyPrice.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

definitions:
  # From Weaponcrafting Design: Krysteel Ingot (23001), as the Outrider part designs.
  _Design:
    level: 11
    rareGrade: 1
    combatItemType: RECIPE
    combatItemSubType: generalMaterial
    category: generalMaterial
    requiredLevel: 11
    requiredEquipmentType: NO_COMBAT
    itemUseCount: 1
    maxStack: 10
    maxDropUnit: 10
    slotLimit: 0
    rank: 0
    dropType: 0
    divide: 0
    coolTime: 0
    coolTimeGroup: 0
    boundType: None
    tradable: true
    warehouseStorable: true
    guildWarehouseStorable: true
    storeSellable: true
    dismantlable: false
    destroyable: true
    obtainable: true
    relocatable: true
    searchable: true
    buyPrice: 50000
    sellPrice: 5000
    dropSilhouette: Item_Drop.SM.Recipe_SM
    dropSound: InterfaceSound.Drop_ItemCUE.Drop_ScrollCue
    usedSound: InterfaceSound.UseItem.UseItemCue
    equipSound: InterfaceSound.Equip_ItemCUE.Equip_LeatherPaperCue

