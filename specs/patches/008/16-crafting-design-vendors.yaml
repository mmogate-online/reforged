# Velika's crafting design vendors close. Profession designs for this region are sold by the
# crafters' guild instead, so a city store would let a crafter level past the region's band.
#
# Each villager below opens one design store and nothing else. A villagerMenus row cannot hold
# an empty menu list, so the whole row is deleted: the villager stays in town as a townsperson
# with its spawn and dialog, and offers no store.
#
# provenance: policy

