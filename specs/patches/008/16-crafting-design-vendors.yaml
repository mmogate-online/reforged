# Velika's crafting design vendors close. Profession designs for this region are sold by the
# crafters' guild instead, so a city store would let a crafter level past the region's band.
#
# A villager that opens one design store and nothing else is deleted from villagerMenus, since
# a row cannot hold an empty menu list: it stays in town as a townsperson with its spawn and
# dialog, and offers no store. A villager that also sells crafting materials keeps its material
# stores; its menu list is replace-all, so it is restated whole without the design stores.
#
# provenance: policy

spec:
  version: "1.0"
  schema: v92

villagerMenus:
  update:
    # materials store 180, weapon designs store 190 removed
    - huntingZoneId: 63
      npcTemplateId: 50003
      changes:
        menus:
          - { type: Merchant, id: 180 }
    # materials stores 181, 182, 183, armor designs stores 191, 192, 193 removed
    - huntingZoneId: 63
      npcTemplateId: 50005
      changes:
        menus:
          - { type: Merchant, id: 181 }
          - { type: Merchant, id: 182 }
          - { type: Merchant, id: 183 }
  delete:
    # weapon designs, store 190
    - { huntingZoneId: 63, npcTemplateId: 1195 }
    - { huntingZoneId: 63, npcTemplateId: 1196 }
    - { huntingZoneId: 63, npcTemplateId: 1197 }
    # armor designs, stores 191, 192, 193
    - { huntingZoneId: 63, npcTemplateId: 1198 }
    - { huntingZoneId: 63, npcTemplateId: 1199 }
    - { huntingZoneId: 63, npcTemplateId: 1200 }
    - { huntingZoneId: 63, npcTemplateId: 1202 }
    - { huntingZoneId: 63, npcTemplateId: 1203 }
    - { huntingZoneId: 63, npcTemplateId: 1204 }
    - { huntingZoneId: 63, npcTemplateId: 1222 }
    - { huntingZoneId: 63, npcTemplateId: 1223 }
    - { huntingZoneId: 63, npcTemplateId: 1224 }
    # glyph designs, store 196
    - { huntingZoneId: 63, npcTemplateId: 1214 }
    # alchemy designs, store 195
    - { huntingZoneId: 63, npcTemplateId: 1215 }
    - { huntingZoneId: 63, npcTemplateId: 1254 }
