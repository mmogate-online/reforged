# QA loadouts for the Slayer along the gear spine, one tier per set:
# 0 Kugai, 1 Revelation, 2 Nightshimmer, 3 Bastion, 4 Demonia.
# The command reads tiers 0 to 4 only, so the spine replaces the Slayer's level 65 tiers.
# The enchant level is the command's second argument, not part of the row.
# Every set shares one roll pool per slot, so each tier pins the same lines: passive1 is
# the item's base roll, passive2 to passive4 its three enchant rolls.
# Accessories are the common-grade ring, earring and necklace at the set's level.
# A tier row is dropped unless its item links an equipment record, so a crystal on a tier row
# never arrives. Crystals are inventory rows instead, which the command adds to the bag as they
# are, with their amount. The inventory rows are granted on every call whatever the tier, so
# they carry the crystals of every tier, and the tester slots the grade of the set worn.
# An equipment row's amount other than 2 delivers one item.
# provenance: policy
spec:
  version: "1.0"
  schema: v92

