# Tuwangi Mire (zone 5): raise every hostile monster's maxHp x10 over its current values, as
# in the Valley of Titans before it, and its attack so its attacks land about the share of a
# level 19 to 21 player's health the Valley's land on its own arrivals: x7 on the field.
#
# Scope: every hostile monster the zone spawns. Left out: the ambient creatures, the minigame
# drums players strike with a quest skill (their hit count is the game), and the invisible caster
# whose skills serve an instance. The Inky Sabertooth's long attack already lands there at its
# current attack, and the four Tuwangi chiefs' quick tongue lash is authored about four times the
# field's, so they take smaller factors. Named monsters are sized large, so the server refuses
# any air launch on them.
#
# TRAP: `multiply` is a delta from the file's current values, not an absolute target. It is safe
# under a whole-patch migrate, which reads from the server repo's committed baseline; a bare
# single-spec apply against the working tree compounds it.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: npc-ids
    use:
      variables:
        - TM_TUWANGI_OVERSEER
        - TM_TUWANGI_HELPER
        - TM_TUWANGI_WORKER
        - TM_TUWANGI_FROGRIDER
        - TM_TUWANGI_BLOCKHEAD
        - TM_TUWANGI_CHOPPER
        - TM_TUWANGI_WARFROGGER
        - TM_KEEN_HAT_TUWANGI
        - TM_STONEHAMMER_TUWANGI
        - TM_INKY_SABERTOOTH
        - TM_MUDDY_SPOREWALKER
        - TM_HUNGRY_CULLAR
        - TM_TENTACULLAR
        - TM_GARANGKA
        - TM_BAUBA
        - TM_MOONG
        - TM_RAGUGA
        - TM_TUWANGI_PROTECTOR
        - TM_TUWANGI_HATCHETER
        - TM_UNNAMED_7010
        - TM_UNNAMED_7012
        - TM_UNNAMED_7013

balanceProfiles:
  - name: TuwangiMireMonsters
    npcFilter:
      huntingZoneId: 5
      id:
        - $TM_TUWANGI_OVERSEER
        - $TM_TUWANGI_HELPER
        - $TM_TUWANGI_WORKER
        - $TM_TUWANGI_FROGRIDER
        - $TM_TUWANGI_BLOCKHEAD
        - $TM_TUWANGI_CHOPPER
        - $TM_TUWANGI_WARFROGGER
        - $TM_KEEN_HAT_TUWANGI
        - $TM_STONEHAMMER_TUWANGI
        - $TM_MUDDY_SPOREWALKER
        - $TM_HUNGRY_CULLAR
        - $TM_TENTACULLAR
        - $TM_TUWANGI_PROTECTOR
        - $TM_TUWANGI_HATCHETER
        - $TM_UNNAMED_7010
        - $TM_UNNAMED_7012
        - $TM_UNNAMED_7013
    npc:
      stat:
        maxHp: { multiply: 10 }
        atk:   { multiply: 7 }

  - name: TuwangiMireInkySabertooth
    npcFilter:
      huntingZoneId: 5
      id:
        - $TM_INKY_SABERTOOTH
    npc:
      stat:
        maxHp: { multiply: 10 }
        atk:   { multiply: 1 }

  - name: TuwangiMireChiefs
    npcFilter:
      huntingZoneId: 5
      id:
        - $TM_GARANGKA
        - $TM_BAUBA
        - $TM_MOONG
        - $TM_RAGUGA
    npc:
      stat:
        maxHp: { multiply: 10 }
        atk:   { multiply: 2 }

npcs:
  update:
    - huntingZoneId: 5
      id: $TM_GARANGKA
      changes:
        size: large
    - huntingZoneId: 5
      id: $TM_BAUBA
      changes:
        size: large
    - huntingZoneId: 5
      id: $TM_MOONG
      changes:
        size: large
    - huntingZoneId: 5
      id: $TM_RAGUGA
      changes:
        size: large
    - huntingZoneId: 5
      id: $TM_TUWANGI_PROTECTOR
      changes:
        size: large
    - huntingZoneId: 5
      id: $TM_TUWANGI_HATCHETER
      changes:
        size: large
