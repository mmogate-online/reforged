# Velika's flight master Adela opens menu 560, which kept the level requirements of the later
# game's story order (Crescentia first). The classic story sends the player to Lumbertown
# first, so the classic levels come back: Lumbertown 10, Crescentia 13, Island of Dawn 10.
# Menu 63 is a different list; Adela does not open it.
#
# Stepstone Isle is a starter island that did not exist in the classic era and is closed on
# this server, so its flight leaves the list.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

pegasusRiders:
  upsertDestinations:
    - menuId: 560
      destinations:
        - { id: 1, level: 10 }     # Island of Dawn
        - { id: 2, level: 10 }     # Lumbertown
        - { id: 3, level: 13 }     # Crescentia
  removeDestinations:
    - menuId: 560
      destinations:
        - { id: 600 }              # Stepstone Isle
