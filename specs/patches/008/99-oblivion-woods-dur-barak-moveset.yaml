# Oblivion Woods: Dur Barak fights with his slash, his horn charge and his bite.
#
# In vanilla AI 30 he only slashed. His horn charge is the wind-up 1203 chained into 1102, and
# the Work starting it was gated on GetPcCountInAttackRange(1), whose argument names neither a
# skill nor a Work of his, so it never passed; it is ungated as on his model's other templates.
# His four-part bite (1103 and 2103, played in place) had no Work and totalAtk 0; it gains both.
# The slash, the charge and the bite are weighted evenly and the slash is on a 6 s cooldown.
# AI 30 is his alone, so it is changed in place.
#
# He is sized large, as every boss of his rank is: the server refuses any air launch on a
# large template, while knockdowns still roll against the skills' large-target rates.
#
# The bite ticks every 200 ms at Effect atk 0.3 per tick, so its totalAtk is set against the
# slash's from the ratio the same model carries where the bite has damage. Its hit area is a
# ring centred 450 units behind him, reaching about 80 units in front, but the vanilla row cast
# it at a target 300 to 500 units away, where it plays in place and cannot connect. Its cast
# range is brought to its reach.
#
# provenance: policy

