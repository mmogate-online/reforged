# Town merchants stop selling items that do nothing on this server: the Tier 3 to Tier 6
# Alkahests, which no enchant an item can reach asks for, the Ranger's and Energy nostrums,
# which the permanent nostrum buff replaces, and the enigmatic and identification scrolls. Two items of the
# Russian region, a pet treat and a skill manual, leave too: they have no English text. The
# general merchant sells Refined Alkahest instead, at the markup price on the item, and the
# Potential Unlock Scroll, the one unlock item for every leveling tier.
#
# The general goods lists (two copies), the combat list and the arcane supplies list are each
# shared by many towns' merchants, so every change applies in every town. Shop item lists are
# replace-all, so each list is restated with its other items in their original order.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

buyLists:
  update:
    # General Goods, both copies.
    - id: 1601
      changes:
