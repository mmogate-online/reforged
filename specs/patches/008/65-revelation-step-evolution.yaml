# Kugai to Revelation evolution: Kugai +9 to +12 evolves into its Revelation piece for
# Slinking Sabertooth Fangs, Lumbertown Mission Writs and the gear part of its slot, instead of
# runes. Weapon, body, hands and feet ask 4 : 3 : 2 : 2 of every count; hands and feet are
# equal. An upsert merges its materials into the existing condition, so each Kugai entry is
# deleted first; otherwise the runes stay beside the new materials.
# provenance: policy
spec:
  version: "1.0"
  schema: v92

imports:
  - from: evolution-base
    use:
      variables:
        - EVOLUTION_COST
        - EVOLUTION_PROB
      definitions:
        - EvolutionItem

variables:
  FANG: 920001                   # Slinking Sabertooth Fang
  WRIT: 920005                   # Lumbertown Mission Writ
  FERRULE: 920283                # Outrider's Ferrule
  LINING: 920285                 # Outrider's Lining

  # ── Source Gear (Kugai's) ──
  SOURCE_WEAPON_DUAL: 12137
  SOURCE_WEAPON_LANCE: 12138
  SOURCE_WEAPON_TWOHAND: 12139
  SOURCE_WEAPON_AXE: 12140
  SOURCE_WEAPON_CIRCLE: 12141
  SOURCE_WEAPON_BOW: 12142
  SOURCE_WEAPON_STAFF: 12143
  SOURCE_WEAPON_ROD: 12144
  SOURCE_WEAPON_BLASTER: 55272
  SOURCE_WEAPON_GAUNTLET: 82272
  SOURCE_WEAPON_SHURIKEN: 58523
  SOURCE_WEAPON_GLAIVE: 59320
  SOURCE_BODYMAIL: 17413
  SOURCE_HANDMAIL: 17414
  SOURCE_FEETMAIL: 17415
  SOURCE_BODYLEATHER: 17416
  SOURCE_HANDLEATHER: 17417
  SOURCE_FEETLEATHER: 17418
  SOURCE_BODYROBE: 17419
  SOURCE_HANDROBE: 17420
  SOURCE_FEETROBE: 17421

  # ── Result Gear (Revelation) ──
  TARGET_WEAPON_DUAL: 10593
  TARGET_WEAPON_LANCE: 10594
  TARGET_WEAPON_TWOHAND: 10595
  TARGET_WEAPON_AXE: 10596
  TARGET_WEAPON_CIRCLE: 10597
  TARGET_WEAPON_BOW: 10598
  TARGET_WEAPON_STAFF: 10599
  TARGET_WEAPON_ROD: 10600
  TARGET_WEAPON_BLASTER: 55079
  TARGET_WEAPON_GAUNTLET: 82079
  TARGET_WEAPON_SHURIKEN: 58245
  TARGET_WEAPON_GLAIVE: 59127
  TARGET_BODYMAIL: 15667
  TARGET_HANDMAIL: 15668
  TARGET_FEETMAIL: 15669
  TARGET_BODYLEATHER: 15670
  TARGET_HANDLEATHER: 15671
  TARGET_FEETLEATHER: 15672
  TARGET_BODYROBE: 15673
  TARGET_HANDROBE: 15674
  TARGET_FEETROBE: 15675

definitions:
  _RevelationPath:
    awaken: false
    masterpiece: false
    evolutionProb: $EVOLUTION_PROB
    requiredMoney: $EVOLUTION_COST

  RevelationWeaponPath:
    $extends: _RevelationPath
    materials:
      - { id: $FANG, amount: 24, type: item }
      - { id: $WRIT, amount: 4, type: item }
      - { id: $FERRULE, amount: 4, type: item }

  RevelationBodyPath:
    $extends: _RevelationPath
    materials:
      - { id: $FANG, amount: 18, type: item }
      - { id: $WRIT, amount: 3, type: item }
      - { id: $LINING, amount: 3, type: item }

  RevelationHandFeetPath:
    $extends: _RevelationPath
    materials:
      - { id: $FANG, amount: 12, type: item }
      - { id: $WRIT, amount: 2, type: item }
      - { id: $LINING, amount: 2, type: item }

evolutionPaths:
  delete:
    - { targetTemplateId: $SOURCE_WEAPON_DUAL }
    - { targetTemplateId: $SOURCE_WEAPON_LANCE }
    - { targetTemplateId: $SOURCE_WEAPON_TWOHAND }
    - { targetTemplateId: $SOURCE_WEAPON_AXE }
    - { targetTemplateId: $SOURCE_WEAPON_CIRCLE }
    - { targetTemplateId: $SOURCE_WEAPON_BOW }
    - { targetTemplateId: $SOURCE_WEAPON_STAFF }
    - { targetTemplateId: $SOURCE_WEAPON_ROD }
    - { targetTemplateId: $SOURCE_WEAPON_BLASTER }
    - { targetTemplateId: $SOURCE_WEAPON_GAUNTLET }
    - { targetTemplateId: $SOURCE_WEAPON_SHURIKEN }
    - { targetTemplateId: $SOURCE_WEAPON_GLAIVE }
    - { targetTemplateId: $SOURCE_BODYMAIL }
    - { targetTemplateId: $SOURCE_HANDMAIL }
    - { targetTemplateId: $SOURCE_FEETMAIL }
    - { targetTemplateId: $SOURCE_BODYLEATHER }
    - { targetTemplateId: $SOURCE_HANDLEATHER }
    - { targetTemplateId: $SOURCE_FEETLEATHER }
    - { targetTemplateId: $SOURCE_BODYROBE }
    - { targetTemplateId: $SOURCE_HANDROBE }
    - { targetTemplateId: $SOURCE_FEETROBE }
  upsert:
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_DUAL, TARGET: $TARGET_WEAPON_DUAL, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_LANCE, TARGET: $TARGET_WEAPON_LANCE, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_TWOHAND, TARGET: $TARGET_WEAPON_TWOHAND, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_AXE, TARGET: $TARGET_WEAPON_AXE, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_CIRCLE, TARGET: $TARGET_WEAPON_CIRCLE, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_BOW, TARGET: $TARGET_WEAPON_BOW, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_STAFF, TARGET: $TARGET_WEAPON_STAFF, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_ROD, TARGET: $TARGET_WEAPON_ROD, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_BLASTER, TARGET: $TARGET_WEAPON_BLASTER, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_GAUNTLET, TARGET: $TARGET_WEAPON_GAUNTLET, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_SHURIKEN, TARGET: $TARGET_WEAPON_SHURIKEN, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_WEAPON_GLAIVE, TARGET: $TARGET_WEAPON_GLAIVE, PATH_DEF: RevelationWeaponPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_BODYMAIL, TARGET: $TARGET_BODYMAIL, PATH_DEF: RevelationBodyPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_HANDMAIL, TARGET: $TARGET_HANDMAIL, PATH_DEF: RevelationHandFeetPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_FEETMAIL, TARGET: $TARGET_FEETMAIL, PATH_DEF: RevelationHandFeetPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_BODYLEATHER, TARGET: $TARGET_BODYLEATHER, PATH_DEF: RevelationBodyPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_HANDLEATHER, TARGET: $TARGET_HANDLEATHER, PATH_DEF: RevelationHandFeetPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_FEETLEATHER, TARGET: $TARGET_FEETLEATHER, PATH_DEF: RevelationHandFeetPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_BODYROBE, TARGET: $TARGET_BODYROBE, PATH_DEF: RevelationBodyPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_HANDROBE, TARGET: $TARGET_HANDROBE, PATH_DEF: RevelationHandFeetPath } }
    - { $extends: EvolutionItem, $with: { SOURCE: $SOURCE_FEETROBE, TARGET: $TARGET_FEETROBE, PATH_DEF: RevelationHandFeetPath } }
