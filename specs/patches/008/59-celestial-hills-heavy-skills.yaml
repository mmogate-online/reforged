# Celestial Hills (zone 7): every hostile monster's long telegraphed attacks hit hard enough to
# punish a player who does not dodge them, by the rule of the zones before it, sized for the
# level 22 to 25 player who arrives here; Barraq is sized by his own fight. Quick attacks and base attack are left as they are.
#
# How hard follows how long the attack takes to play: the skill's animation length in
# AnimationData over its timeRate. An attack of four seconds or more aims at about two thirds of
# the arriving player's health per landed use, one of three to four seconds at about half, the
# factor rounded up to a whole step, two at least. A factor only ever raises, so every attack not
# named here already lands at or above its aim. Rows are named by id, never by animation, and
# `strict` fails the apply when any named monster or row is missing.
#
# TRAP: `multiply` is a delta from the file's current values, not an absolute target. It is safe
# under a whole-patch migrate, which reads from the server repo's committed baseline; a bare
# single-spec apply against the working tree compounds it.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: npc-ids
    use:
      variables:
        - CH_NAGA_MERCENARY
        - CH_RED_FANG_ORCAN
        - CH_RED_FANG_FIGHTER
        - CH_RED_FANG_RAGER
        - CH_RED_FANG_KOBOLD
        - CH_RED_FANG_KOBOLD_MINION
        - CH_LEAN_HYENA
        - CH_BLOODGUARD
        - CH_LOKIAN_LANCER
        - CH_LOKIAN_BERSERKER
        - CH_NAKARASH
        - CH_DARK_IMP
        - CH_TEZLUAR
        - CH_RADAT
        - CH_KADAS
  - from: npc-skill-ids
    use:
      variables:
        - CH_NAGA_MERCENARY_MAGIC_ORB_LONG_MOVES
        - CH_RED_FANG_ORCAN_DOUBLE_LARIAT
        - CH_RED_FANG_RAGER_DOUBLE_LARIAT
        - CH_RED_FANG_KOBOLD_DASH_ATTACK
        - CH_RED_FANG_KOBOLD_MINION_DASH_ATTACK
        - CH_LEAN_HYENA_DASH_ATTACK
        - CH_BLOODGUARD_HEAVY
        - CH_LOKIAN_LANCER_HEAVY
        - CH_LOKIAN_BERSERKER_WEAPON_BASH_BLAST_SLASH_COMBO2
        - CH_NAKARASH_ATK01_TAIL_SWIPE_ROUND_ATTACKS
        - CH_DARK_IMP_CLAW_SLAM
        - CH_TEZLUAR_WEAPON_BASH_COMBO2
        - CH_RADAT_ATK01_ATK02

npcSkills:
  updateWhere:
    strict: true
    entries:
      # Skills 1106 magic orb (4.1 s), 1110 and 1113 long moves (3.5 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_NAGA_MERCENARY
          id: $CH_NAGA_MERCENARY_MAGIC_ORB_LONG_MOVES
        changes:
          totalAtk: { multiply: 2 }
      # Skill 1102, double lariat (3.4 s).
      - filter:
          huntingZoneId: 7
          npc.id: [$CH_RED_FANG_ORCAN, $CH_RED_FANG_FIGHTER]
          id: $CH_RED_FANG_ORCAN_DOUBLE_LARIAT
        changes:
          totalAtk: { multiply: 3 }
      # Skill 1102, double lariat (3.4 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_RED_FANG_RAGER
          id: $CH_RED_FANG_RAGER_DOUBLE_LARIAT
        changes:
          totalAtk: { multiply: 2 }
      # Skill 1103, dash attack (5.7 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_RED_FANG_KOBOLD
          id: $CH_RED_FANG_KOBOLD_DASH_ATTACK
        changes:
          totalAtk: { multiply: 14 }
      # Skill 1103, dash attack (5.7 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_RED_FANG_KOBOLD_MINION
          id: $CH_RED_FANG_KOBOLD_MINION_DASH_ATTACK
        changes:
          totalAtk: { multiply: 5 }
      # Skill 1103, dash attack (5.7 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_LEAN_HYENA
          id: $CH_LEAN_HYENA_DASH_ATTACK
        changes:
          totalAtk: { multiply: 2 }
      # Skills 1102 advance atk06 (4.6 s), 1105 two-hit combo (5.0 s), 1106 advance atk05 (3.8 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_BLOODGUARD
          id: $CH_BLOODGUARD_HEAVY
        changes:
          totalAtk: { multiply: 2 }
      # Skills 1104 screw through (3.2 s), 1110 combo2 (3.5 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_LOKIAN_LANCER
          id: $CH_LOKIAN_LANCER_HEAVY
        changes:
          totalAtk: { multiply: 2 }
      # Skills 1104 weapon bash (4.4 s), 1105 blast slash (5.1 s), 1110 combo2 (4.4 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_LOKIAN_BERSERKER
          id: $CH_LOKIAN_BERSERKER_WEAPON_BASH_BLAST_SLASH_COMBO2
        changes:
          totalAtk: { multiply: 2 }
      # Skills 1101 atk01 (4.1 s), 1107 tail swipe (4.1 s), 1108 and 1109 round attacks (3.2 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_NAKARASH
          id: $CH_NAKARASH_ATK01_TAIL_SWIPE_ROUND_ATTACKS
        changes:
          totalAtk: { multiply: 2 }
      # Skill 1103, claw slam (4.5 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_DARK_IMP
          id: $CH_DARK_IMP_CLAW_SLAM
        changes:
          totalAtk: { multiply: 2 }
      # Skills 1104 weapon bash (4.6 s), 1110 combo2 (4.6 s).
      - filter:
          huntingZoneId: 7
          npc.id: $CH_TEZLUAR
          id: $CH_TEZLUAR_WEAPON_BASH_COMBO2
        changes:
          totalAtk: { multiply: 2 }
      # Skills 1101 atk01 (4.2 s), 1110 atk02 (5.6 s).
      - filter:
          huntingZoneId: 7
          npc.id: [$CH_RADAT, $CH_KADAS]
          id: $CH_RADAT_ATK01_ATK02
        changes:
          totalAtk: { multiply: 2 }
