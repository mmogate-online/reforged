# Revelation to Nightshimmer recipes. The Nightshimmer Grip Core is a Weaponcrafting part and the
# Nightshimmer Thread an Armorcrafting part, one part per craft with one Apprentice Refining Kit.
# Each Nightshimmer piece costs the materials of the evolution into it at one and a half times
# the counts, and is crafted at +0, so evolving a held piece stays the cheaper route. On top of
# those, each piece takes what classic crafted gear of its level takes: the refined material of
# its weapon kind or armor weight, the runes of its band (Shara on weapons, Arun on armor) and the
# vendor kit, at the classic level 15 counts. The pieces need proficiency 50 and pay to 150. A
# recipe holds at most seven materials, which these recipes reach. A recipe's id equals the id
# of the design item that teaches it.
#
# A critical result would be the same single item, so the recipes name none, in the vanilla shape
# of a recipe without one: no critical item and no critical rate. The loader refuses a critical
# item paired with a zero rate.
# provenance: policy
