# Revelation to Nightshimmer recipes. The Nightshimmer Grip Core is a Weaponcrafting part and the
# Nightshimmer Thread an Armorcrafting part, one part per craft with one Apprentice Refining Kit.
# Each Nightshimmer piece costs the materials of the evolution into it at one and a half times
# the counts plus its band's vendor kit, and is crafted at +0, so evolving a held piece stays the
# cheaper route. A recipe's id equals the id of the design item that teaches it.
#
# Each gear recipe sits under its weapon type's or armor slot's Basic heading. The loader refuses
# a recipe that names a critical result with a zero critical rate, so the rate is set and the
# critical result is the same single item.
# provenance: policy
