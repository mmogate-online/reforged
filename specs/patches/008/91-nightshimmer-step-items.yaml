# Revelation to Nightshimmer items: the step's three dropped materials, its two raw materials
# and gathered flax, its two gear parts, the two designs that craft the parts, and one design per
# Nightshimmer piece.
#
# Every stackable row carries boundType None: the loader refuses the whole item file when a
# stackable item names any other binding. The drop model and sounds of each kind come from a
# vanilla item of the same subtype, so nothing new is rendered or played. Every design sells
# for faction points, so it is worth nothing to a vendor.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: lane-step-items
    use:
      definitions:
        - LaneMaterial
        - LaneHideMaterial
        - LaneMetalMaterial
        - LaneDesign

definitions:
  _GearDesign:
    $extends: LaneDesign
    buyPrice: 50000
    sellPrice: 0

items:
  upsert:
    - { $extends: LaneMetalMaterial, id: 920253, name: evo_devan_crookblade, icon: Icon_Items.evo_va_devan_crookblade_Tex }
