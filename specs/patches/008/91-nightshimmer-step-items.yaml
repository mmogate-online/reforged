# Revelation to Nightshimmer items: the step's three dropped materials, its two raw materials
# and gathered flax, its two gear parts, the two designs that craft the parts, and one design per
# Nightshimmer piece.
#
# Every stackable row carries boundType None: the loader refuses the whole item file when a
# stackable item names any other binding. The drop model and sounds of each kind come from a
# vanilla item of the same subtype, so nothing new is rendered or played. A gold store charges
# a design's own buyPrice.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

definitions:
  _Material:
    level: 1
    rareGrade: 1
    combatItemType: NO_COMBAT
    requiredLevel: 1
    requiredEquipmentType: NO_COMBAT
    itemUseCount: 1
    maxStack: 10000
    maxDropUnit: 9999
    slotLimit: 0
    rank: 0
    dropType: 0
    divide: 0
    coolTime: 0
    coolTimeGroup: 0
    boundType: None
    tradable: true
    warehouseStorable: true
    guildWarehouseStorable: true
    storeSellable: true
    dismantlable: false
    destroyable: true
    obtainable: true
    relocatable: true
    searchable: true
    buyPrice: 50
    sellPrice: 5

  # Hide, bone, wood and fiber materials, from Simple Salts (534).
  _HideMaterial:
    $extends: _Material
    combatItemSubType: generalMaterial
    category: generalMaterial
    dropSilhouette: DropItem.SM.Item_Drop_Chest_SM
    dropSound: InterfaceSound.Drop_ItemCUE.Drop_ChestBoxCue
    equipSound: InterfaceSound.Equip_ItemCUE.Equip_LeatherCue

  # Metal materials, from Paverune of Shara (501).
  _MetalMaterial:
    $extends: _Material
    combatItemSubType: weaponMaterial
    category: weaponMaterial
    dropSilhouette: Item_Drop.SM.Weaponstone_SM
    dropSound: InterfaceSound.Drop_ItemCUE.Drop_WeaponStoneCue
    equipSound: InterfaceSound.Equip_ItemCUE.Equip_OreCue

  # Designs, from Weaponcrafting Design: Krysteel Ingot (23001).
  _Design:
    level: 11
    rareGrade: 1
    combatItemType: RECIPE
    combatItemSubType: generalMaterial
    category: generalMaterial
    requiredLevel: 11
    requiredEquipmentType: NO_COMBAT
    itemUseCount: 1
    maxStack: 10
    maxDropUnit: 10
    slotLimit: 0
    rank: 0
    dropType: 0
    divide: 0
    coolTime: 0
    coolTimeGroup: 0
    boundType: None
    tradable: true
    warehouseStorable: true
    guildWarehouseStorable: true
    storeSellable: true
    dismantlable: false
    destroyable: true
    obtainable: true
    relocatable: true
    searchable: true
    buyPrice: 10000
    sellPrice: 1000
    dropSilhouette: Item_Drop.SM.Recipe_SM
    dropSound: InterfaceSound.Drop_ItemCUE.Drop_ScrollCue
    usedSound: InterfaceSound.UseItem.UseItemCue
    equipSound: InterfaceSound.Equip_ItemCUE.Equip_LeatherPaperCue

  _GearDesign:
    $extends: _Design
    buyPrice: 50000
    sellPrice: 5000

