itemStrings:
  upsert:
    - id: 920253
      name: "Devan Crookblade"
      toolTip: "<font color = '#2478FF'>[Dropped Material]</font> Taken from the Devan raiders of Oblivion Woods. Spent to evolve Revelation gear into Nightshimmer."
    - id: 920254
      name: "Berzerad Spinecoil"
      toolTip: "<font color = '#2478FF'>[Dropped Material]</font> Torn from the Furious Dragoons and Fallen Defenders of Berzerad Cemetery in Oblivion Woods. Spent to evolve Revelation gear into Nightshimmer."
    - id: 920255
      name: "Devan Captain's Hornmask"
      toolTip: "<font color = '#2478FF'>[Dropped Material]</font> Taken from the Devan captains Tuebenius, Basenius and Kulsilva in Oblivion Woods. Spent to evolve Revelation gear into Nightshimmer."
    - id: 920292
      name: "Nightshimmer Grip Core"
      toolTip: "<font color = '#2478FF'>[Processed Material]</font> Carved by weaponsmiths from Sporewalker Rootwood. Spent to evolve a Revelation weapon into Nightshimmer."
    - id: 920293
      name: "Sporewalker Rootwood"
      toolTip: "<font color = '#2478FF'>[Dropped Material]</font> Cut from the Agitated Sporewalkers of Oblivion Woods. Weaponsmiths carve it into a Nightshimmer Grip Core."
    - id: 920294
      name: "Nightshimmer Thread"
      toolTip: "<font color = '#2478FF'>[Processed Material]</font> Spun by armorsmiths from Scion Ritual Cord and Oblivion Shadeflax. Spent to evolve Revelation armor into Nightshimmer."
    - id: 920295
      name: "Scion Ritual Cord"
      toolTip: "<font color = '#2478FF'>[Dropped Material]</font> Unpicked from the garb of the Scion Justicars at Valselok Shrine in the Valley of Titans. Armorsmiths spin it with Oblivion Shadeflax into Nightshimmer Thread."
