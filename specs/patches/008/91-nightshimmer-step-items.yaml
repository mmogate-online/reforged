      toolTip: "<font color = '#2478FF'>[Dropped Material]</font> Cut from the Agitated Sporewalkers of Oblivion Woods. Weaponsmiths carve it into a Nightshimmer Grip Core."
    - id: 920294
      name: "Nightshimmer Thread"
      toolTip: "<font color = '#2478FF'>[Processed Material]</font> Spun by armorsmiths from Noruk Undercoat and Oblivion Shadeflax. Spent to evolve Revelation armor into Nightshimmer."
    - id: 920312
      name: "Noruk Undercoat"
      toolTip: "<font color = '#2478FF'>[Dropped Material]</font> Cut from the coats of Grazing Noruk and Stomping Noruk herds in the Valley of Titans. Armorsmiths spin it with Oblivion Shadeflax into Nightshimmer Thread."
