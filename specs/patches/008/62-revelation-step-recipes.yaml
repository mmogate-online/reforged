# takes one Apprentice Refining Kit, the vendor kit vanilla refining consumes. A recipe's id
# equals the id of the design item that teaches it. A critical result would be the same single
# part, so the recipes name none, in the vanilla shape of a recipe without one: no critical item
# and no critical rate. The loader refuses a critical item paired with a zero rate.
