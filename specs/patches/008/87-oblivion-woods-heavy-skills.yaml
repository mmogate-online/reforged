# Oblivion Woods (zone 3): every field monster's long telegraphed attacks hit hard enough to punish
# a player who does not dodge them. Their quick attacks and their base attack are left as they are.
#
# How hard follows how long the attack takes to play: the skill's animation length in
# AnimationData over its timeRate (the AnimSeq duration on monster rows is 0). An attack of four
# seconds or more aims at about two thirds of the arriving player's health per landed use, one of
# three to four seconds at about half. The factor that reaches the aim is rounded up to a whole
# step, two at least, so an attack lands at or above its aim. A factor only ever raises; an attack
# already at its target is left alone, and so is any skill named as a buff.
#
# Each entry names a monster (npc-ids) and the attacks of it that take one factor (npc-skill-ids):
# the skill rows of each normal skill and of its enraged form. A monster with no rows of its own
# casts its shareId template's, so the change lands there, and any other template that casts those
# rows takes it too. Rows are named by id, never by animation: one monster's attacks share
# animations (a combo reuses its opening move), so an animation can reach a second attack.
# `strict` fails the apply when any named monster or row is missing.
#
# TRAP: `multiply` is a delta from the file's current values, not an absolute target. It is safe
# under a whole-patch migrate, which reads from the server repo's committed baseline; a bare
# single-spec apply against the working tree compounds it.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: npc-ids
    use:
      variables:
        - OW_AGITATED_SPOREWALKER
        - OW_AGGRAVATED_SPOREWALKER
        - OW_MOSSY_GHILLIEDHU
        - OW_REAVER_OF_RESURRECTION
        - OW_DEVAN_BLADEMASTER
        - OW_DEVAN_SCRAPPER
        - OW_DEVAN_WARRIOR
        - OW_DEVAN_BRIGAND
        - OW_DEVAN_ARCANIST
        - OW_DEVAN_CHANTER
        - OW_FALLEN_SOLDIER
        - OW_FALLEN_DEFENDER
  - from: npc-skill-ids
    use:
      variables:
        - OW_AGITATED_SPOREWALKER_JUMP_SLAM
        - OW_AGITATED_SPOREWALKER_ROLLING_ATTACK_MUD_SHAKE
        - OW_MOSSY_GHILLIEDHU_HEAVY
        - OW_REAVER_OF_RESURRECTION_HEAVY
        - OW_DEVAN_BLADEMASTER_HEAVY
        - OW_DEVAN_WARRIOR_ADVANCE_ATK06
        - OW_DEVAN_WARRIOR_TWO_HIT_COMBO_ADVANCE_ATK05
        - OW_DEVAN_BRIGAND_SPEAR_THROW
        - OW_DEVAN_BRIGAND_BRANDISH_THROW
        - OW_DEVAN_ARCANIST_BLAST
        - OW_DEVAN_ARCANIST_NUKE
        - OW_DEVAN_CHANTER_HEAVY
        - OW_FALLEN_SOLDIER_RANGED_ATTACK

npcSkills:
  updateWhere:
    strict: true
    entries:
      # Skill 1101, atk01 (3.0 s).
      - filter:
          huntingZoneId: 3
          npc.id: [$OW_AGITATED_SPOREWALKER, $OW_AGGRAVATED_SPOREWALKER]
          id: $OW_AGITATED_SPOREWALKER_JUMP_SLAM
        changes:
          totalAtk: { multiply: 4 }
      # Skills 1102 atk03 (5.7 s), 1103 atk02 (5.1 s).
      - filter:
          huntingZoneId: 3
          npc.id: [$OW_AGITATED_SPOREWALKER, $OW_AGGRAVATED_SPOREWALKER]
          id: $OW_AGITATED_SPOREWALKER_ROLLING_ATTACK_MUD_SHAKE
        changes:
          totalAtk: { multiply: 3 }
      # Skills 1103 atk02 (3.8 s), 1104 atk03 (5.6 s), 1106 UltraAtk01 (3.4 s), 1107 and 1108
      # UltraAtk02 (4.6 s).
      - filter:
          huntingZoneId: 3
          npc.id: $OW_MOSSY_GHILLIEDHU
          id: $OW_MOSSY_GHILLIEDHU_HEAVY
        changes:
          totalAtk: { multiply: 2 }
      # Skills 1104 bash (4.0 s), 1105 blastSlashStart (4.6 s), 1110 combo2R (4.0 s).
      - filter:
          huntingZoneId: 3
          npc.id: $OW_REAVER_OF_RESURRECTION
          id: $OW_REAVER_OF_RESURRECTION_HEAVY
        changes:
          totalAtk: { multiply: 2 }
      # Skills 1102 atk06 (4.6 s), 1105 atk04 (5.0 s), 1106 atk05 (3.8 s).
      - filter:
          huntingZoneId: 3
          npc.id: [$OW_DEVAN_BLADEMASTER, $OW_DEVAN_SCRAPPER]
          id: $OW_DEVAN_BLADEMASTER_HEAVY
        changes:
          totalAtk: { multiply: 2 }
      # Skill 1102, atk06 (3.7 s).
      - filter:
          huntingZoneId: 3
          npc.id: $OW_DEVAN_WARRIOR
          id: $OW_DEVAN_WARRIOR_ADVANCE_ATK06
        changes:
          totalAtk: { multiply: 3 }
      # Skills 1105 atk04 (4.0 s), 1106 atk05 (3.1 s).
      - filter:
          huntingZoneId: 3
          npc.id: $OW_DEVAN_WARRIOR
          id: $OW_DEVAN_WARRIOR_TWO_HIT_COMBO_ADVANCE_ATK05
        changes:
          totalAtk: { multiply: 4 }
      # Skill 1101, atk02 (3.2 s).
      - filter:
          huntingZoneId: 3
          npc.id: $OW_DEVAN_BRIGAND
          id: $OW_DEVAN_BRIGAND_SPEAR_THROW
        changes:
          totalAtk: { multiply: 5 }
      # Skills 1103 atk03 (3.8 s), 1104 atk04 (3.6 s).
      - filter:
          huntingZoneId: 3
          npc.id: $OW_DEVAN_BRIGAND
          id: $OW_DEVAN_BRIGAND_BRANDISH_THROW
        changes:
          totalAtk: { multiply: 3 }
      # Skill 1105, atk04 (4.5 s).
      - filter:
          huntingZoneId: 3
          npc.id: $OW_DEVAN_ARCANIST
          id: $OW_DEVAN_ARCANIST_BLAST
        changes:
          totalAtk: { multiply: 3 }
      # Skill 1106, atk05 (5.7 s). The common Arcanist's AI never chooses it; on this model only the
      # captains cast it.
      - filter:
          huntingZoneId: 3
          npc.id: $OW_DEVAN_ARCANIST
          id: $OW_DEVAN_ARCANIST_NUKE
        changes:
          totalAtk: { multiply: 2 }
      # Skills 1105 atk04 (4.5 s), 1106 atk05 (5.7 s).
      - filter:
          huntingZoneId: 3
          npc.id: $OW_DEVAN_CHANTER
          id: $OW_DEVAN_CHANTER_HEAVY
        changes:
          totalAtk: { multiply: 4 }
      # Skill 1103, atk02 (3.4 s).
      - filter:
          huntingZoneId: 3
          npc.id: [$OW_FALLEN_SOLDIER, $OW_FALLEN_DEFENDER]
          id: $OW_FALLEN_SOLDIER_RANGED_ATTACK
        changes:
          totalAtk: { multiply: 13 }
