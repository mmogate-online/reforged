# Oblivion Woods (zone 3): every field monster's long telegraphed attacks hit hard enough to punish
# a player who does not dodge them. Their quick attacks and their base attack are left as they are.
#
# How hard follows how long the attack takes to play: the skill's animation length in
# AnimationData over its timeRate (the AnimSeq duration on monster rows is 0). An attack of four
# seconds or more aims at about two thirds of the arriving player's health per landed use, one of
# three to four seconds at about half. A critical hit multiplies either by one and a half, which
# is why neither aims at a full health bar. A factor only ever raises; an attack already at its
# target is left alone, and so is any skill named as a buff.
#
# Each normal skill and its enraged twin (id + 1000) take the same factor. These are absolute
# values: totalAtk on each row is the vanilla value times the factor. A row that another template
# reads through shareId carries the change to that template too, as the comments name.
# provenance: policy

