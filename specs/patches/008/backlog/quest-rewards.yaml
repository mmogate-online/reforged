# Quest reward blocks restated for patch 008, one entry per quest, in quest id order.
# Each block is upserted whole: a compensations collection is replace-all, so every reward a
# quest keeps (experience, gold, reputation, tokens, items) is written out with it.
#
# A quest's huntingZoneId is its quest group, the quest id divided by 100; the world server
# refuses a reward row filed under any other group.
#
# One-time zone quests carry most of a region's enchanting Alkahest (item 15) and, in Arcadia,
# its Valkyon Commendations, spread by quest experience. A class-bag quest repeats each amount
# on every class row, because only the row of the player's own class pays out. One-time quest
# gold is 2.4 times the earlier value in Arcadia and twice on the Island of Dawn.
#
# The retired Tier 3 Alkahest is no longer an enchant input, so the quests that paid it pay the
# base Alkahest at the same counts. The early Arcadia story quests give no Revelation gear
# piece, since that gear is earned through the lane, and Saddle Up offers only the two mounts
# the start kit does not already grant.
# provenance: policy

