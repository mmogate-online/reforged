# Quest reward blocks restated for patch 008, one entry per quest, in quest id order.
# Each block is upserted whole: a compensations collection is replace-all, so every reward a
# quest keeps (experience, gold, reputation, tokens, items) is written out with it.
#
# A quest's huntingZoneId is its quest group, the quest id divided by 100; the world server
# refuses a reward row filed under any other group.
#
# The retired Tier 3 Alkahest is no longer an enchant input, so the quests that paid it pay the
# base Alkahest (item 15) at the same counts. The early Arcadia story quests give no
# Revelation gear piece, since that gear is earned through the lane, and Saddle Up offers only
# the two mounts the start kit does not already grant.
# provenance: policy

