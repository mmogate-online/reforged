# Bandages: usable again, out of combat only, and healing more than a potion for that limit.
# Vanilla retires them as non combat items with an unusable tooltip; a disposable item type
# brings them back. Every bandage effect, Medicated included, is cancelled when combat starts.
# A plain bandage heals 1.5 times the common Healing Potion of its tier and a Medicated one
# twice the Major potion, over the classic durations. Each effect's max equals its tick value
# times the duration in seconds plus one, the shape every bandage row already has.
# An effect list is replaced whole on update, so each row restates every attribute it carries.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

items:
  update:
    - { id: 125, changes: { combatItemType: DISPOSAL } }  # Keener's Bandage
