# Lane gear drop beam: a lane piece on the ground shows a light beam, seen only by the party
# that owns the drop, so a piece a monster drops is not lost in a fight.
# The beam is an item field read where the item lies, so every piece that monster loot can drop
# carries it, whichever bag drops it; a piece no loot bag holds needs none.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: drop-effects
    use:
      definitions:
        - SignatureDropBeam

items:
