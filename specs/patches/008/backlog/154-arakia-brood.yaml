# Arakia's adds: the egg sacs she lays below half health, the Defenders that hatch from a sac she
# bites, the spiderlings she looses at a fifth and the hunters that keep coming below a tenth.
# A summon names a member of the summoner's own party, so every template is a hidden member of
# her party and the rules here only place them around her. Every add despawns when she dies or
# her fight resets, so a pull that leashes starts clean.
# An egg carries a hidden mark from birth and her bite can hit nothing else. A Defender renews a
# shield on her every few seconds, found by the mark she carries, so the shield ends soon after
# the Defender does.
# A spiderling is born with a fuse. Until it burns down it rolls at players, knocking them down,
# leaps at those beyond reach, and spits a venom that stacks and outlasts any cleanse. Then it
# marks one player, runs at them and bursts beside them, unless killed first. A hunter is the same spider that only hunts.
# A burst costs a fixed slice of health and leaves venom; one never kills a healthy character, several
# ignored ones do. The burst names a target and a range because a skill with neither is cast
# where the caster stands. A template owns a row for every skill its AI names, used or not: the
# server refuses to start otherwise, which is why the hunter has an AI of its own.
# All are her own model family: the rolling spider shares her animation set, so its rows, her
# heavy attack among them, play unchanged. A reach counted from the caster scales with its size.
# provenance: policy

