# Lanok, Arakia and Barraq fight as world bosses, in HP phases. At 80, 60, 40 and 15% HP each
# roars and adds a stack of one phase buff (power, attack speed and move speed), so the fight
# ramps without a wall. Each step fires while its own hidden step marker is absent, so a step
# that burst damage skipped still lands. From the sixth minute of combat a boss adds a stack of a
# far stronger enrage buff every two minutes, up to three, a damage check; the first stack is
# announced on screen. From 15% its enraged combos join its calm mode; from 5% it pants every 30
# seconds, the opening to finish it. The buffs and step markers land on their caster only, so the
# three bosses share them.
# Each base attack is set so the boss's heaviest move kills only once the enrage has stacked
# twice, and its health so that a party, not one player, brings it down.
# Arakia alone also leaps in venom from 70% to 51%, lays egg sacs every two minutes from half to
# 21% and looses spiderlings every two minutes from a fifth; her venom outlasts any cleanse. A sac
# she reaches and bites hatches a Defender that shields her while it lives.
# The sacs and the brood are summoned by their own short-term entries, answering the mark the call
# left on her: chained after the call a summon is lost whenever a stagger cuts the chain.
# The custom skills sit on ids no vanilla monster uses, because the client keys a skill's visuals
# to its id and a reused id plays another monster's effects.
# From 60% she turns on ranged players, healers and raisers. A short-term-target entry fires on an
# HP crossing at once; an ai update restates the attack section, so every work is restated.
# provenance: policy

