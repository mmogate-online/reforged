# Lanok fights in HP phases. At 80, 60, 40 and 15% HP he roars and adds a stack of one phase
# buff (power, attack speed and move speed), so the fight ramps without a wall. Each step fires
# while its own hidden step marker is absent, so a step that burst damage skipped still lands.
# From the sixth minute of combat he adds a stack of a far stronger enrage buff every two
# minutes, up to three, a damage check; the first stack is announced on screen. From 15% his
# enraged combos join his calm mode; from 5% he pants every 30 seconds, the opening to finish him.
# His base attack is set so his heaviest move kills only once the enrage has stacked twice, and
# his health so that a party, not one player, brings him down.
# A short-term-target entry is the only AI section that fires on an HP crossing at once, and an ai
# update restates the whole attack section, so every work and pattern below is restated.
# provenance: policy

