spec:
  version: "1.0"
  schema: v92

# Arcadia revive points: a player who dies in the Fey Forest, Valley of Titans,
# Celestial Hills or Tuwangi Mire wakes at the nearest camp of that region instead
# of walking back from Lumbertown.
#
# The revive point is read from the AreaData section the player stands in; there is
# no nearest-camp logic in the server, so each section carries its camp's point.
# Each point is the camp's TeleportPoint landing spot. Sections nearer Lumbertown
# than to any camp, and the Lumbertown sections themselves, keep the town.
#
# Partial upserts: only the revive fields are written. The recall scroll keeps its
# Lumbertown destination, and fences and every other attribute stay untouched.
# provenance: policy

areaSections:
  upsert:

    # ---- ANC_A_P ----

    # Section 4: Faevine Vale Camp.
    - continentId: 7001
      areaName: "ANC_A_P"
      sectionId: 4
      recallReviveContinentId: 7001
      recallRevivePos: "110525,-10490,2899"

