# Valkyon Quartermasters in Velika, Lumbertown and Crescentia: Hestan, Tamsin and Calder. Each
# opens the island quartermaster's store, so every town sells the same goods at the same price
# and one store change reaches all four quartermasters.
#
# A shop NPC needs its speech condition and its dialog as well as the template: the shop menu is
# drawn inside the dialog window, so an NPC with neither cannot be clicked. The quartermaster
# store carries no service icon, so no row here sets one. A villagerMenus upsert replaces the
# villager's whole menu list. New spawns change the npc location table, so the npc location
# prune belongs after the apply. dir is degrees, counter-clockwise from +x.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: reforged-villagers
    use:
      definitions:
        - ReforgedVillager
        - VillagerSpawn
        - VillagerTerritory

npcs:
  upsert:
    - huntingZoneId: 63
      id: 1120
      $extends: ReforgedVillager
      name: "Valkyon Quartermaster Hestan"
      shapeId: 530020                       # Klaon 60,1039
      basicActionId: 5000800
      scale: 1
      race: Human
      gender: male
    - huntingZoneId: 60
      id: 1104
      $extends: ReforgedVillager
      name: "Valkyon Quartermaster Tamsin"
      shapeId: 510310                       # Madlene 63,1124
      basicActionId: 5001200
      scale: 1
      race: Human
      gender: female
    - huntingZoneId: 59
      id: 1104
      $extends: ReforgedVillager
      name: "Valkyon Quartermaster Calder"
      shapeId: 500083                       # Ridam 63,1141
      basicActionId: 5000800
      scale: 1
      race: Human
      gender: male

territoryGroups:
  upsert:
    - huntingZoneId: 63
      groupId: 6300051
      desc: "Reforged Vendors, Velika"

territories:
  upsert:
    - huntingZoneId: 63
      groupId: 6300051
      territoryId: 6309700
      $extends: VillagerTerritory
      desc: "Valkyon Quartermaster, Velika"
      fences:
        - [-399, 8607, 2179.18]
        - [-99, 8607, 2179.18]
        - [-99, 8907, 2179.18]
        - [-399, 8907, 2179.18]
    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000042
      $extends: VillagerTerritory
      desc: "Valkyon Quartermaster, Lumbertown"
      fences:
        - [88502, -5192, 1076.75]
        - [88802, -5192, 1076.75]
        - [88802, -4892, 1076.75]
        - [88502, -4892, 1076.75]
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900036
      $extends: VillagerTerritory
      desc: "Valkyon Quartermaster, Crescentia"
      fences:
        - [95998, 16166, 2882.22]
        - [96298, 16166, 2882.22]
        - [96298, 16466, 2882.22]
        - [95998, 16466, 2882.22]

territorySpawns:
  upsert:
    - huntingZoneId: 63
      groupId: 6300051
      territoryId: 6309700
      npcInstanceId: 6311662
      npcTemplateId: 1120
      $extends: VillagerSpawn
      desc: "Valkyon Quartermaster Hestan"
      pos: [-249.3, 8757.0, 2179.18]
      dir: 213
    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000042
      npcInstanceId: 6004063
      npcTemplateId: 1104
      $extends: VillagerSpawn
      desc: "Valkyon Quartermaster Tamsin"
      pos: [88651.8, -5041.9, 1076.75]
      dir: 248
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900036
      npcInstanceId: 5900433
      npcTemplateId: 1104
      $extends: VillagerSpawn
      desc: "Valkyon Quartermaster Calder"
      pos: [96148.3, 16315.8, 2882.22]
      dir: 69

creatureStrings:
  upsert:
    - { huntingZoneId: 63, templateId: 1120, name: "Hestan", gender: male, race: Human, title: "Valkyon Quartermaster" }
    - { huntingZoneId: 60, templateId: 1104, name: "Tamsin", gender: female, race: Human, title: "Valkyon Quartermaster" }
    - { huntingZoneId: 59, templateId: 1104, name: "Calder", gender: male, race: Human, title: "Valkyon Quartermaster" }

speechConditions:
  upsert:
    - huntingZoneId: 63
      templateId: 1120
      note: "Valkyon Quartermaster Hestan"
      normal:
        - { id: 1, paramType: random }
      popup: []
    - huntingZoneId: 60
      templateId: 1104
      note: "Valkyon Quartermaster Tamsin"
      normal:
        - { id: 1, paramType: random }
      popup: []
    - huntingZoneId: 59
      templateId: 1104
      note: "Valkyon Quartermaster Calder"
      normal:
        - { id: 1, paramType: random }
      popup: []

# voiceTypeId is the voice of the NPC whose model was copied.
villagerDialogs:
  upsert:
    - huntingZoneId: 63
      id: 1120
      voiceTypeId: 8
      texts:
        - id: 1
          huntingZoneId: 63
          villagerId: 1120
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Quartermaster Hestan, Valkyon Federation. Our headquarters is right here in Velika, and so is my store. Bring me your Commendations."
    - huntingZoneId: 60
      id: 1104
      voiceTypeId: 17
      texts:
        - id: 1
          huntingZoneId: 60
          villagerId: 1104
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "The army needs Fey Forest timber, and it needs new soldiers too. I supply the soldiers. Bring me your Commendations."
    - huntingZoneId: 59
      id: 1104
      voiceTypeId: 5
      texts:
        - id: 1
          huntingZoneId: 59
          villagerId: 1104
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Conscripts guard Crescentia against the devan brigands, and I keep them supplied. Your Commendations buy from the same crates."

villagerMenus:
  upsert:
    - huntingZoneId: 63
      npcTemplateId: 1120
      menus:
        - { type: MedalStore, id: 9999012 }
    - huntingZoneId: 60
      npcTemplateId: 1104
      menus:
        - { type: MedalStore, id: 9999012 }
    - huntingZoneId: 59
      npcTemplateId: 1104
      menus:
        - { type: MedalStore, id: 9999012 }

npcLocStrings:
  upsert:
    - huntingZoneId: 63
      templateId: 1120
      continent: 7005
      markers:
        - [-249, 8757, 2179]
    - huntingZoneId: 60
      templateId: 1104
      continent: 7001
      markers:
        - [88652, -5042, 1077]
    - huntingZoneId: 59
      templateId: 1104
      continent: 7001
      markers:
        - [96148, 16316, 2882]
