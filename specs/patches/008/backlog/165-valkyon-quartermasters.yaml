# voiceTypeId is the voice of the NPC whose model was copied.
villagerDialogs:
  upsert:
    - huntingZoneId: 63
      id: 1120
      voiceTypeId: 8
      texts:
        - id: 1
          huntingZoneId: 63
          villagerId: 1120
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Quartermaster Hestan, Valkyon Federation. Our headquarters is right here in Velika, and so is my store. Bring me your Commendations."
    - huntingZoneId: 60
      id: 1104
      voiceTypeId: 17
      texts:
        - id: 1
          huntingZoneId: 60
          villagerId: 1104
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "The army needs Fey Forest timber, and it needs new soldiers too. I supply the soldiers. Bring me your Commendations."
    - huntingZoneId: 59
      id: 1104
      voiceTypeId: 5
      texts:
        - id: 1
          huntingZoneId: 59
          villagerId: 1104
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Conscripts guard Crescentia against the devan brigands, and I keep them supplied. Your Commendations buy from the same crates."

