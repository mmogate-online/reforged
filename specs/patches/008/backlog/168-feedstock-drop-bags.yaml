# Feedstock drops on the field monsters of the leveling regions. Every enchant step spends two
# Feedstock per Alkahest, and dismantling alone pays about half of that, so each monster with a
# loot row also drops Feedstock directly, small and frequent. Three bags, each its own ground pile
# so a party shares a kill without splitting a stack: one guaranteed, one at half chance for one
# or two, and one chance bag for one or two that carries the rest of the region's need. The third
# chance falls region by region as salvage and the other drops cover more of it.
# The rows already repeat bag ids, so each bag takes the next free id of its row and a name of
# its own for the next spec to select it by.
# provenance: policy
spec:
  version: "1.0"
  schema: v92

