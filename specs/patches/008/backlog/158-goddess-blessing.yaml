# Goddess's Blessing takes its classic one hour cooldown, and the Quick Goddess's Blessing is
# the fast alternative: a one minute cooldown in a group of its own, so using one never locks out
# the other, paid for with Weakness after the revive. A normal revive applies nothing.
# The Quick item and its revive skill are the vanilla Blessing and its skill transcribed whole
# under their own ids. Trap: Weakness must come before the invincibility in the skill's list, or
# the invincibility refuses it. Weakness cuts the per skill damage multiplier, 25% a stack, two
# stacks; it survives death, and level 99 puts it above every player cleanse.
# Each region sells its own copies, usable in it and every earlier region: the item flag
# useOnlyTerritory plus the item's id in the enableItemId list of each allowed AreaData section.
# The client never sees that list, so each tooltip names the regions. The item list is one
# string, never merged, so a section that already allowed an item restates it. Only items on the
# server's revive list revive in place; it spends the first listed copy a player holds and does
# not fall through, so newer regions' copies are listed first.
# provenance: policy

