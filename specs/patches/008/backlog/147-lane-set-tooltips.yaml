# Lane gear set lines: every piece of a lane set names its set in the first line of its tooltip,
# the way the Visionmaker set does, and a piece an evolution step takes further names the set it
# evolves into on the second line. The item name never carries the set.
# A tooltip is one string, so each value is restated whole: the set line, the evolution line,
# then whatever line the piece already carried (a flavour line, the Potential Unlock block, the
# unlocked line, a trade warning), unchanged and in its old order.
# Bastion and Demonia pieces already opened with a set line; it is rewritten in the singular so
# every set reads the same. Pieces whose tooltip already matches are not restated.
# Demonia and Flawless Demonia have no step out of them that needs an enchant, so they carry the
# set line alone; an unlock by scroll is told by the Potential Unlock block instead.
# provenance: policy

