# The six vanilla medal stores are retired. Their tokens no longer drop, no longer come from
# quests, event rewards or boxes, and no longer open a store: each token is inert and its
# tooltip says so, matching how vanilla retired its classic consumables.
#
# The right-click link, the store menus, every list hanging off them and every price row in
# these tokens leave together. The loader checks the medal price of every buy list item,
# referenced or not, so a list left behind without its price rows, or the reverse, stops the
# world server.
#
# Quest reward blocks are replace-all, so each one is restated whole without the token row.
# Event, box and gacha rewards are removed one row at a time. Three lists are written twice in
# the vanilla file and one delete removes one copy, so those ids are listed twice.
#
# provenance: policy

