# Weapon enchant glow: these weapons draw the glow of their real enchant step.
# The glow is drawn by the client alone. A weapon's changeEnchantFxId names a remap row that
# replaces the real step with a drawn one; remap row 1000 draws every step from 0 to 15 as
# step 1, so a weapon carrying it never shows its enchant level. A value of 0 names no remap,
# a shape vanilla weapons already ship. The field lives on both item tables, so the client
# item sync must carry it for the change to show.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

items:
  update:
    - id:
        - 10121  # Pathfinder Pair
        - 10122  # Duty's Lance
        - 10123  # Pathsweeper
        - 10124  # Chopper
        - 10125  # Harvest Focus
        - 10126  # Arrowsvine
        - 10127  # Staff of Redemption
        - 10128  # Wand of the Frond
        - 55020  # Nobleshot
        - 82020  # Warfists
        - 58186  # Trailcover
        - 59068  # Pathdancer
        - 280000  # Unlocked Blood & Gore
        - 280001  # Unlocked Bloodstrike
        - 280002  # Unlocked Cruelblade
        - 280003  # Unlocked Bloodshatter
        - 280004  # Unlocked Heartcoil
        - 280005  # Unlocked Airheart
        - 280006  # Unlocked Tuskrender
        - 280007  # Unlocked Bloodhorn
        - 280051  # Unlocked Hemoblaster
        - 280054  # Unlocked Hemobloom
        - 280057  # Unlocked Truncuspear
        - 280060  # Unlocked Bloody Knuckles
      changes: { changeEnchantFxId: 0 }
