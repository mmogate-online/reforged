      achieveConditionId: 0

npcs:
  upsert:
    - huntingZoneId: 59
      id: 1105
      $extends: _merchant
      name: "Crystal Merchant Lyrene"
      shapeId: 510390                       # Anqui 63,1125
      basicActionId: 5001200
      scale: 1
      race: Human
      gender: female

territories:
  upsert:
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900037
      $extends: _villagerTerritory
      desc: "Crystal Merchant, Crescentia"
      fences:
        - [97006, 16341, 2893.59]
        - [97306, 16341, 2893.59]
        - [97306, 16641, 2893.59]
        - [97006, 16641, 2893.59]

territorySpawns:
  upsert:
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900037
      npcInstanceId: 5900434
      npcTemplateId: 1105
      $extends: _villagerSpawn
      desc: "Crystal Merchant Lyrene"
      pos: [97155.6, 16491.2, 2893.59]
      dir: 269

creatureStrings:
  upsert:
    - { huntingZoneId: 59, templateId: 1105, name: "Lyrene", gender: female, race: Human, title: "Crystal Merchant" }

speechConditions:
  upsert:
    - huntingZoneId: 59
      templateId: 1105
      note: "Crystal Merchant Lyrene"
      normal:
        - { id: 1, paramType: random }
      popup: []

# voiceTypeId is the voice of the NPC whose model was copied.
villagerDialogs:
  upsert:
    - huntingZoneId: 59
      id: 1105
      voiceTypeId: 14
      texts:
        - id: 1
          huntingZoneId: 59
          villagerId: 1105
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "The deva attacks have left me with few crystals. What I have is yours, for a fair price."

villagerMenus:
  upsert:
    - huntingZoneId: 59
      npcTemplateId: 1105
      menus:
        - { type: Merchant, id: 100 }

npcLocStrings:
  upsert:
    - huntingZoneId: 59
      templateId: 1105
      continent: 7001
      markers:
        - [97156, 16491, 2894]
