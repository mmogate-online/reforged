    invincible: true
    aiid: 100
    size: medium
    resourceType: medium
    resourceSize: 100
    class: ""
    collideOnMove: false
    isObjectNpc: false
    isWideBroadcaster: false
    isFreeNamed: false
    isLightParty: false
    elite: false
    showAggroTarget: false
    showShorttermTarget: false
    dontTurn: false
    partyMember: 0
    spawnScriptId: 0
    despawnScriptId: 0
    pcDespawnScriptId: 0
    villagerVolumeOffset: ""
    villagerVolumeActiveRange: 0
    villagerVolumeHalfHeight: 0
    villagerVolumeInteractionDist: 0
    namePlate:
      deathNameplateHeight: 0
    abnormalityResistanceOverride:
      resetTime: 60000
    stat:
      maxHp: 10000
      walkSpeed: 60
      runSpeed: 110
      atk: 100
      def: 2000
      exp: 1
      level: 40
    npcOnly:
      onDeathSkill: 0
    anger:
