# The low-level crystal merchants sell tier 2 Common accessory crystals for gold on a third
# tab. A menu upsert replaces its whole tab list, so the weapon and armor tabs are restated
# as they are. Menu 100 is shared by every merchant bound to it, so each gains the tab.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

buyMenuLists:
  upsert:
    - id: 100
      stringId: 100
      desc: "저렙 크리스탈  상점 !"
      itemLists:
        - id: 1001
          stringed: 10001
        - id: 1002
          stringed: 10002
        - id: 1003
          stringed: 1433

buyLists:
  upsert:
    - id: 1003
      items:
