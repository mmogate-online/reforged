# Arcadia hunts: the rare named monsters of Oblivion Woods, Tuwangi Mire, the Valley of Titans
# and the Celestial Hills return on the hunt tiers. Dur Barak, Garangka and the Crisaka and
# Abrata pair return in 25 to 30 minutes; Lanok, Arakia and Barraq in 50 to 60. Barraq also
# returns to his post when pulled away, as the other two do, so a pull resets his fight.
#
# The respawn is a base plus a random addition, so the window sits below its ceiling. Crisaka
# and Abrata share a party, which carries its own respawn pair; the party and both members must
# change together, or the slower one wins. Values are milliseconds. Arakia now leads a party
# of her own, so her respawn pair sits on the party and on her row together. Her hidden members
# carry no respawn wait, as in every party that summons, so her summons can always call them.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

territoryParties:
  update:
    - huntingZoneId: 6
      groupId: 600036
      territoryId: 600641
      partyId: 600406
      changes:
        partyRespawnTime: 1500000
        partyRespawnRandomTime: 300000
  upsert:
    # Arakia leads her own party: a summon can only call a member of the summoner's party, and
    # the hidden members are the egg sacs, Defenders, spiderlings and hunters her fight calls.
    # Nothing else spawns.
