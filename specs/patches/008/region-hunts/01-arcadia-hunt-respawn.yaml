# Arcadia hunts: the rare named monsters of Oblivion Woods, Tuwangi Mire, the Valley of Titans
# and the Celestial Hills return on the hunt tiers. Dur Barak, Garangka and the Crisaka and
# Abrata pair return in 25 to 30 minutes; Lanok, Arakia and Barraq in 50 to 60.
#
# The respawn is a base plus a random addition, so the window sits below its ceiling. Crisaka
# and Abrata share a party, which carries its own respawn pair; the party and both members must
# change together, or the slower one wins. Values are milliseconds.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

