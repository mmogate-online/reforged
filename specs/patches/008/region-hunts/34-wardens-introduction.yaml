questDialogs:
  upsert:
    - huntingZoneId: 618
      id: 17
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1100
          pages:
            - social: 0
              content: "Bram sent you to Garrick in Lumbertown. Garrick entered your name in his ledger.<BR><BR>Bram gave you credits from the Arcadian Wardens. He recommended the designs for the parts of your gear."
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1100
          pages:
            - social: 4
              content: "These designs cost Arcadian Wardens credits. Outriders need sound gear on the timber road. I sell the designs for it.<BR><BR>Speak to Garrick, the Wardens' quartermaster, in Lumbertown Plaza."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Your name is in my ledger, soldier. I run the Wardens' store. Each day's assignments protecting loggers go in the ledger too.<BR><BR>In Crescentia, Sylvara is our quartermaster; Ysolde sells the region's designs. Return to Bram."
        - id: 4
          npcZoneId: 60
          prevId: 3
          villagerId: 1100
          pages:
            - social: 4
              content: "Take these credits as the Wardens' welcome to the timber road. The Wardens need soldiers with sound gear.<BR><BR>I'd save them for Recipe: Outrider's Ferrule and Recipe: Outrider's Lining."
    - huntingZoneId: 618
      id: 18
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1100
          pages:
            - social: 0
              content: "Bram asked you to give Ysolde a spoken message in Crescentia. He asked you to deliver it whenever you reached the town."
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1100
          pages:
            - social: 4
              content: "Ysolde sells the same regional designs in Crescentia. I'd like my customers to survive those woods.<BR><BR>Ask her to introduce you to the Wardens' quartermaster. Give Ysolde that message whenever you reach Crescentia."
        - id: 3
          npcZoneId: 59
          prevId: 2
          villagerId: 1100
          pages:
            - social: 4
              content: "Bram wants you to meet the quartermaster? I can arrange that. Trade here depends on soldiers keeping the caravans safe.<BR><BR>Speak to Sylvara, the Wardens' quartermaster, in Crescentia Plaza."
        - id: 4
          npcZoneId: 59
          prevId: 3
          villagerId: 1101
          pages:
            - social: 4
              content: "Frightened guesses make poor measurements. I prefer to examine tracks.<BR><BR>You can buy gear from the Wardens' store here. My daily assignments deal with the threats around Crescentia. Return to Ysolde."
        - id: 5
          npcZoneId: 59
          prevId: 4
          villagerId: 1100
          pages:
            - social: 4
              content: "Your arrival deserves more than another warning about devas. These credits come from the Wardens.<BR><BR>The part designs would be a useful purchase. Customers who survive the woods can buy again. Thank you for carrying Bram's message."

