# Arcadian Wardens introduction: two one-time quests that let a newcomer meet the faction and
# pay its first credits, sized to the part designs its point store sells.
#
# The quests sit in the faction's own quest group, 618, whose reward table reaches the client
# and whose quest log row is named after the faction; neither is a daily, so the faction's
# daily pool does not list them.
#
# The second quest is offered by the first quest's giver as the first completes (its linked
# quest and its prerequisite), and every step of it is played in Crescentia, so the player is
# never sent back to Lumbertown. Both open at the level at which the faction appears.
#
# The reward is points only, with no reputation experience, so grade still comes from the
# dailies alone. A reward block is replaced whole on upsert.
# provenance: policy

