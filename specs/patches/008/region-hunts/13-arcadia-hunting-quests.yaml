# Arcadia hunting quests: per hunt encounter, a one-time discovery quest and a repeatable
# hunting quest it unlocks, both paying the Arcadia Hunt Mark and nothing else.
#
# A quest with no giver (the 0,0 start NPC) lists on the chapter house board of every hub
# city, under its quest group's region heading, and any reward officer takes the turn-in. That
# is why the text names the officer by city and never a single NPC, and why each quest sits in
# its monster's own zone group.
#
# Both quests use the board's repeat task. The repeatable one loops without end inside a quest
# taken once, as the vanilla suppression orders do; the discovery quest runs the same task for
# one finite round, so it completes and unlocks the repeatable one. Crisaka and Abrata spawn as
# one party, so a kill of either credits their quests.
#
# Trap: the dungeon entry trigger is written as 0 on purpose. The server leaves that field
# unset when the element is absent, and a leftover non-zero value makes the quest count as
# dungeon-triggered, so it silently drops off the board.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: region-hunt-tokens
    use:
      variables:
        - ARCADIA_HUNT_TOKEN

definitions:
