          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>Refugees on the roads of the Valley of Titans have one more thing to fear than the Gutrends. {@LinkCreature:6#5003#Arakia}, a spider larger than a wagon, stalks the roads and takes travelers where they walk.<BR><BR>Hunt her down and kill her.<BR><BR>The marks on your map show every place she has been sighted. She walks only one of them at a time. Each party that fights her takes its own share of the spoils.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "The roads are safer tonight. Not safe; the valley is never safe.<BR><BR>When she returns, the standing orders are yours to take."
