        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>The kumases of the Celestial Hills have come for the old magic of the ruins, and the Scions of Lok are behind them. The strongest of them, {@LinkCreature:7#101#Barraq} the Thunderwalker, guards the ruins as if the stones were already his.<BR><BR>Those secrets must not fall to the Scions. Find Barraq and kill him. He is beyond most soldiers in Arcadia; do not go alone.<BR><BR>The marks on your map show every place he has been sighted. He walks only one of them at a time. Each party that fights him takes its own share of the spoils.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
