        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>The Gutrends of the Valley of Titans fight with weapons they never forged, and the crest of Lok was found on their chieftain. Two Scions of Lok, {@LinkCreature:6#5001#Crisaka} and {@LinkCreature:6#5002#Abrata}, ride the valley together, and wherever they pass, the Gutrends grow bolder.<BR><BR>Bring them down. The fall of either one is proof enough for these orders.<BR><BR>The marks on your map show every place they have been sighted. They walk only one of them at a time. Each party that fights them takes its own share of the spoils.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "One less pair of hands arming the Gutrends.<BR><BR>The Scions will send them back; they always do. When they return, the standing orders are yours to take."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
