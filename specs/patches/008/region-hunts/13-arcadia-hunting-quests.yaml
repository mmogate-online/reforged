    header:
      startTaskId: 1
      linkedQuest: 101
      recommendedPartySize: 1
      questDialogue: 2
      summaryInfo: 100
      designersNote: ""
      questType: Guild
      repeatType: OneTime
      cancellable: Allowed
      assemblyCategory: 0
      giverNpc: { huntingZone: 0, templateId: 0 }
      dungeonEntryTrigger: 0
    requirements:
      minLevel: 11
      maxLevel: 70
  _huntTask:
    taskId: 1
    type: RepeatTask
    nextTaskId: 0
    journalScript: 2
    hasReward: true
    cinematicId: 0
    body:
      repeatTarget: "사냥"
      repeatCount: 1
      deliveryQuantity: 1
      iconId: 119
      sequentialDistribution: "미적용"
      targetNpc: { huntingZone: 0, templateId: 0 }
      normalDialogue: 3
      incompleteDialogue: 4
  _discoveryTask:
    $extends: _huntTask
    body:
      repeatMethod: "유한"
      maxFlagCount: 1
  _repeatableTask:
    $extends: _huntTask
    body:
      repeatMethod: "무한"
      maxFlagCount: 10
  _boardText:
    npcZoneId: 0
    villagerId: 0

