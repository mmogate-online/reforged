            - social: 5
              content: "Hunting Orders<BR><BR>{@LinkCreature:6#5001#Crisaka} and {@LinkCreature:6#5002#Abrata} ride the Valley of Titans again, and the Gutrend camps are restless.<BR><BR>These orders stand for as long as the Scions send them. Bring them down, report in, and take the orders again. The fall of either one is proof enough.<BR><BR>The marks on your map show where they have been sighted, not where they stand now.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
