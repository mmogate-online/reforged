        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>The Frog King is back. {@LinkCreature:5#17#Garangka} rules the Tuwangi Mire again, and the surveyors have pulled back to the edge of the marsh.<BR><BR>These orders stand for as long as it returns. End it, report in, and take the orders again.<BR><BR>The marks on your map show where it has been sighted, not where it stands now.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
