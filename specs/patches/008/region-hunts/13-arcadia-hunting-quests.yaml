# Text 2 is the briefing the board shows, 3 the turn-in, 4 the reply while the kill is
# outstanding. The board speaks for no NPC, so every text names the 0,0 speaker.
questDialogs:
  upsert:
    - huntingZoneId: 2
      id: 51
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>Loggers coming back from the Fey Forest swear the Long Tusk herds have a lord now: a warthog the size of a hay cart that the camps call the Boarlord. The refugee kitchens need those herds, and the herds will not come near the treeline while he leads them.<BR><BR>Find {@LinkCreature:2#507#Garash Bloodtusk} and bring him down.<BR><BR>The marks on your map show every place he has been sighted. He walks only one of them at a time. Each party that fights him takes its own share of the spoils.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "So the Boarlord bleeds like any other boar. Good.<BR><BR>He will be back; beasts like him always are. When he is, the standing orders are yours to take."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
    - huntingZoneId: 2
      id: 52
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>{@LinkCreature:2#507#Garash Bloodtusk} has taken the Long Tusk herds again. Every time he returns, the loggers lose another day at the treeline.<BR><BR>These orders stand for as long as he keeps coming back. Bring him down, report in, and take the orders again.<BR><BR>The marks on your map show where he has been sighted, not where he stands now.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "Another day for the loggers. Your marks, as promised."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
    - huntingZoneId: 2
      id: 53
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>Faeries from the Faerie Pond came to Lumbertown with a warning. {@LinkCreature:2#510#Tradon} was once one of their guardians. The ill wind took him as it took the unicorns, and now he strikes at anyone who walks the forest, fey or human.<BR><BR>The loyal faeries cannot bring themselves to do it. Put him to rest.<BR><BR>The marks on your map show every place he has been sighted. He walks only one of them at a time. Each party that fights him takes its own share of the spoils.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "The faeries asked to be told when it was done. I will send word to the pond.<BR><BR>If the ill wind raises him again, the standing orders are yours to take."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
    - huntingZoneId: 2
      id: 54
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>{@LinkCreature:2#510#Tradon} walks the Fey Forest again. Whatever the ill wind is, it is not finished with him.<BR><BR>These orders stand for as long as he returns. Put him to rest again, report in, and take the orders again.<BR><BR>The marks on your map show where he has been sighted, not where he stands now.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "Rest again, guardian. Your marks."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
    - huntingZoneId: 3
      id: 51
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>The dead of Berzerad Cemetery were honored soldiers once. Since the devas' nexus spirit pulled them back, they march again, and the Furious Dragoons march behind one of their own: {@LinkCreature:3#21#Dur Barak}, the Dragoon Doommaster.<BR><BR>Cut down the one who leads them, and the dragoons lose their order for a time.<BR><BR>The marks on your map show every place he has been sighted. Each party that fights him takes its own share of the spoils.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "Crescentia will sleep easier tonight.<BR><BR>The dead do not stay down in that cemetery, and neither will he. When he rises, the standing orders are yours to take."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
    - huntingZoneId: 3
      id: 52
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>{@LinkCreature:3#21#Dur Barak} has risen again in Berzerad Cemetery, and his dragoons are forming ranks behind him.<BR><BR>These orders stand for as long as the dead keep rising. Cut him down, report in, and take the orders again.<BR><BR>The marks on your map show where he has been sighted.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "Down again. Your marks, and the cemetery's thanks."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
    - huntingZoneId: 3
      id: 53
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>Something older than the devas walks Oblivion Woods. The scouts call it {@LinkCreature:3#22#Lanok}, the Forgotten Destroyer: a giant that attacks everything in sight and leaves nothing standing on the caravan route.<BR><BR>The federation wants it destroyed at all costs. Take a party; you will want one.<BR><BR>The marks on your map show every place it has been sighted. It walks only one of them at a time. Each party that fights it takes its own share of the spoils.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "You brought down the Forgotten Destroyer. Few in Crescentia will believe it until they see the road open.<BR><BR>Giants like that do not stay gone. When it returns, the standing orders are yours to take."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
    - huntingZoneId: 3
      id: 54
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>{@LinkCreature:3#22#Lanok} is back in Oblivion Woods, and the caravans have stopped again.<BR><BR>These orders stand for as long as it returns. Destroy it, report in, and take the orders again.<BR><BR>The marks on your map show where it has been sighted, not where it stands now.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "The road is open again, for now. Your marks."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
    - huntingZoneId: 5
      id: 51
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Hunting Orders<BR><BR>The tuwangi overseers ride garangkas into battle, but the largest of them answers to no rider. Ackerly's surveyors call it the Frog King, {@LinkCreature:5#17#Garangka}, and it has swallowed more of their gear than the swamp has.<BR><BR>The survey of Tuwangi Mire cannot go on while it hunts the marsh. End it.<BR><BR>The marks on your map show every place it has been sighted. It walks only one of them at a time. Each party that fights it takes its own share of the spoils.<BR><BR>Report to the mission officer in Lumbertown or Crescentia when the hunt is done."
        - $extends: _boardText
          id: 3
          prevId: 2
          pages:
            - social: 5
              content: "The surveyors will want to see the size of it before they believe you. Let them.<BR><BR>The mire will crown its king again soon enough. When it does, the standing orders are yours to take."
        - $extends: _boardText
          id: 4
          pages:
            - social: 0
              content: "These orders stand until the kill is made. Come back with proof."
    - huntingZoneId: 5
      id: 52
