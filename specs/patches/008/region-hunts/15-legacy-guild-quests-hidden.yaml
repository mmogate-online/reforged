# Hide the legacy guild quests from the chapter house board.
#
# The board lists every quest without a giver that the reader can start, whatever city the
# board stands in, so these quests would sit beside the region hunting quests for any guild
# member in their level band. Their rewards were emptied long ago, so they are switched off
# rather than left listed.
#
# A quest is switched off by an unsatisfiable prerequisite on quest 99999, written into the
# datasheet as the ref 999,99. The sentinel REPLACES any real prerequisite rather than joining
# it: the corpus never carries both on one quest. Guild quests the vanilla data already shut
# this way are not listed here.
# provenance: policy

