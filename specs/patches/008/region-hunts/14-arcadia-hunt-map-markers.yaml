# Arcadia hunts: map markers for every place a hunt monster can appear.
#
# Each hunt monster spawns at one random candidate point of its territory, so its quest link
# lists every candidate rather than the single spawn point the generated registry carries.
# A player learns where the monster may be, never where it stands now. The points are the
# territory's random spawn candidates, rounded to whole units. Crisaka and Abrata spawn as one
# party, so they share one list.
#
# A markers list replaces the row's whole list. Any generated marker spec that covers these
# zones must sort before this one, or it puts the single spawn point back.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

