# Arcadia Hunt Mark: the token Arcadia's hunting quests pay and its hunt token vendor takes.
#
# Shaped as the vanilla dungeon coin: no trade, no personal or guild bank, so it stays with
# the character that earned it, and a vendor sell price of zero, so it never becomes gold. The
# loader refuses any bind type on a stackable item, so the lock comes from those flags alone.
# It carries no right-click shop: it is spent by walking to the vendor.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: region-hunt-tokens
    use:
      variables:
        - ARCADIA_HUNT_TOKEN

items:
  upsert:
    - id: $ARCADIA_HUNT_TOKEN
      name: arcadia_hunt_token
      combatItemType: NO_COMBAT
      combatItemSubType: etc
      category: etc
      rank: 0
      rareGrade: 2
      level: 1
      requiredLevel: 1
      searchable: true
      conversion: false
      sortingNumber: 0
      dropType: 2
      buyPrice: 0
      sellPrice: 0
      divide: 0
      maxStack: 99999
      slotLimit: 0
      coolTimeGroup: 0
      itemUseCount: 0
      maxDropUnit: 9999
      enchantEnable: false
      tradable: false
      boundType: None
      destroyable: true
      dismantlable: false
      warehouseStorable: false
      guildWarehouseStorable: false
      storeSellable: false
      obtainable: true
      relocatable: true
      artisanable: false
      unidentifiedItemGrade: 0
      masterpieceRate: 0
      linkEquipmentId: 0
      linkLookInfoId: 0
      changeLook: false
      extractLook: false
      changeColorEnable: false
      requiredGuildMaster: false
      requiredEquipmentType: NO_COMBAT
      linkCrestId: 0
      linkCustomizingId: 0
      linkSkillId: 0
      linkPetAdultId: 0
      linkPetOrbId: 0
      icon: Icon_Items.hunt_arcadia_token_Tex
      dropSilhouette: Item_Drop.SM.Recipe_SM
      dropSound: InterfaceSound.Drop_ItemCUE.Drop_ScrollCue
      equipSound: InterfaceSound.Equip_ItemCUE.Equip_ScrollCue
      defaultValue: 0

itemStrings:
  upsert:
    - id: $ARCADIA_HUNT_TOKEN
      name: "Arcadia Hunt Mark"
      toolTip: "A bone tally stamped with the seal of Lumbertown and Crescentia, paid to those who bring down the great beasts and warlords that roam Arcadia.$BR$BR<font color = '#FF0000'>Cannot be traded, banked, or stored in a guild bank.</font>$BR$BR<font color = '#41FF3A'>[Usage]</font>$BRExchange with a Bounty Broker in Lumbertown or Crescentia."
