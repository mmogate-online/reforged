# Arcadia hunt token vendors: a Bounty Broker in Lumbertown and one in Crescentia, each opening
# the hunt token shop. They carry the same title as the Island of Dawn brokers because they do
# the same job: take a region's hunt token and pay out its catalog.
#
# They are new villager templates standing on the points the vanilla T-cat Exchanger (template
# 9000) used. Template 9000 itself is not reused: its model and name belong to the cash shop
# currency. The models and voices are the Island of Dawn brokers'. An NPC with no speech
# condition and no dialog cannot be clicked, because the shop menu is drawn inside the dialog
# window. A villagerMenus upsert replaces the villager's whole menu list. The spawns join the
# region vendor groups, so the npc location prune belongs after the apply.
# dir is degrees, counter-clockwise from +x.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: reforged-villagers
    use:
      definitions:
        - ReforgedVillager
        - VillagerSpawn
        - VillagerTerritory

definitions:
  _broker:
    $extends: ReforgedVillager
    scale: 1

npcs:
  upsert:
    - huntingZoneId: 60
      id: 1102
      $extends: _broker
      name: "Bounty Broker Corvin"
      shapeId: 510560                       # Hollis 64,1013
      basicActionId: 5000800
      race: Human
      gender: male
    - huntingZoneId: 59
      id: 1102
      $extends: _broker
      name: "Bounty Broker Tharos"
      shapeId: 510535                       # Hazzir 213,1055
      basicActionId: 5001700
      race: Aman
      gender: male

territories:
  upsert:
    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000033
      $extends: VillagerTerritory
      desc: "Bounty Broker, Lumbertown"
      fences:
        - [89038.44, -3697.80, 842.89]
        - [88941.62, -3764.40, 846.26]
        - [89010.99, -3847.65, 850.92]
        - [89075.09, -3801.64, 847.07]
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900024
      $extends: VillagerTerritory
      desc: "Bounty Broker, Crescentia"
      fences:
        - [96254.62, 17027.38, 2891.37]
        - [96125.45, 17030.20, 2888.44]
        - [96110.14, 16951.48, 2887.66]
        - [96189.91, 16851.25, 2883.66]
        - [96290.21, 16894.44, 2887.06]

territorySpawns:
  upsert:
    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000033
      npcInstanceId: 6004061
      npcTemplateId: 1102
      $extends: VillagerSpawn
      desc: "Bounty Broker Corvin"
      pos: [89026.20, -3774.97, 846.18]
      dir: -155
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900024
      npcInstanceId: 5900431
      npcTemplateId: 1102
      $extends: VillagerSpawn
      desc: "Bounty Broker Tharos"
      pos: [96140.53, 16986.53, 2888.25]
      dir: -88

creatureStrings:
  upsert:
    - { huntingZoneId: 60, templateId: 1102, name: "Corvin", gender: male, race: Human, title: "Bounty Broker" }
    - { huntingZoneId: 59, templateId: 1102, name: "Tharos", gender: male, race: Aman, title: "Bounty Broker" }

speechConditions:
  upsert:
    - huntingZoneId: 60
      templateId: 1102
      note: "Bounty Broker Corvin"
      normal:
        - { id: 1, paramType: random }
      popup: []
    - huntingZoneId: 59
      templateId: 1102
      note: "Bounty Broker Tharos"
      normal:
        - { id: 1, paramType: random }
      popup: []

# voiceTypeId is the voice of the NPC whose model was copied.
villagerDialogs:
  upsert:
    - huntingZoneId: 60
      id: 1102
      voiceTypeId: 4
      texts:
        - id: 1
          huntingZoneId: 60
          villagerId: 1102
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Velika counts timber, not beasts. I count beasts. Every hunt token you bring back is one less monster on the Timber Road, and I pay for that in crystals, structures and a Kumas who knows these woods better than you do."
    - huntingZoneId: 59
      id: 1102
      voiceTypeId: 171
      texts:
        - id: 1
          huntingZoneId: 59
          villagerId: 1102
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "The things past the walls grow bigger every season, and the conscripts grow fewer. Bring down the worst of them, bring me your hunt tokens, and pick something worth the scars."

villagerMenus:
  upsert:
    - huntingZoneId: 60
      npcTemplateId: 1102
      guideEffectId: 120
      menus:
        - { type: MedalStore, id: 9999020 }
    - huntingZoneId: 59
      npcTemplateId: 1102
      guideEffectId: 120
      menus:
        - { type: MedalStore, id: 9999020 }

npcLocStrings:
  upsert:
    - huntingZoneId: 60
      templateId: 1102
      continent: 7001
      markers:
        - [89026, -3775, 846]
    - huntingZoneId: 59
      templateId: 1102
      continent: 7001
      markers:
        - [96141, 16987, 2888]
