  upsert:
    - { huntingZoneId: 60, templateId: 9000, name: "Tikat", gender: male, race: popori, title: "Hunt Token Exchange" }
    - { huntingZoneId: 59, templateId: 9000, name: "Tikat", gender: male, race: popori, title: "Hunt Token Exchange" }

villagerDialogs:
  upsert:
    - huntingZoneId: 60
      id: 9000
      voiceTypeId: 167
      texts:
        - id: 1
          huntingZoneId: 60
          villagerId: 9000
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Velika counts timber, not beasts. I count beasts. Every hunt token you bring back is one less monster on the Timber Road, and I pay for that in crystals, structures and a Kumas who knows these woods better than you do."
    - huntingZoneId: 59
      id: 9000
      voiceTypeId: 167
      texts:
        - id: 1
          huntingZoneId: 59
          villagerId: 9000
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "The things past the walls grow bigger every season, and the conscripts grow fewer. Bring down the worst of them, bring me your hunt tokens, and pick something worth the scars."

