# Arcadia hunt token vendor: Tikat returns to his old posts in Lumbertown and Crescentia and
# opens the hunt token shop.
#
# The template, its speech condition and its dialog record already exist in both zones; only
# the spawn, the title, the dialog text and the menu are written here. A villagerMenus upsert
# replaces the villager's whole menu list, which retires the old event exchange menu. The
# spawns join the region vendor groups, and the location registry gets their two points.
# dir is degrees, counter-clockwise from +x.
# provenance: policy

