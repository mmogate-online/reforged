# Arcadia hunt token vendors: a Bounty Broker in Lumbertown and one in Crescentia, each opening
# the hunt token shop. They carry the same title as the Island of Dawn brokers because they do
# the same job: take a region's hunt token and pay out its catalog.
#
# They are new villager templates standing on the points the vanilla T-cat Exchanger (template
# 9000) used. Template 9000 itself is not reused: its model and name belong to the cash shop
# currency. The models and voices are the Island of Dawn brokers'. An NPC with no speech
# condition and no dialog cannot be clicked, because the shop menu is drawn inside the dialog
# window. A villagerMenus upsert replaces the villager's whole menu list. The spawns join the
# region vendor groups, so the npc location prune belongs after the apply.
# dir is degrees, counter-clockwise from +x.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

