# Arcadia hunt token shop: what the Bounty Brokers sell for the Arcadia hunt token (item 95314)
# in Lumbertown and Crescentia. Both cities bind the same menu.
#
# The base catalog is the region's tier of chosen Fine crystals and the random dyad structures;
# the featured tab holds the permanent Forest Keeper Kumas book. A menu has at most five tabs
# and carries one currency.
#
# The price is buyPriceMedal in the exchange rows. priceRevision is a revision index that the
# server never reads as a cost, and vanilla writes 1 there.
# provenance: policy

