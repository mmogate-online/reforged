# Arcadian Wardens dailies: fifteen faction 618 daily quests and the faction's daily pool.
# Garrick in Lumbertown and Sylvara in Crescentia each give and take back their own dailies;
# a quest can name only one giver, so no daily is offered in both towns.
#
# Grade 1 already lists quests, because the faction starts at grade 1 and standing comes
# from these dailies alone. Higher grades widen the pool rather than gate single quests, so
# every quest asks only for grade 1.
#
# The server loader refuses the whole pool file, and stops the boot, when a grade's weights
# do not sum to exactly 100 or its giveCount exceeds the quests it lists. Validation checks
# neither: recount both by hand after any edit to the pool.
#
# The pair under questPool is the quest id and its weight, under the names groupId and index.
# A hunt-and-deliver task takes its delivery count from targetCount.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

