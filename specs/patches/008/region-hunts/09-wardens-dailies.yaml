questDialogs:
  upsert:
    - huntingZoneId: 60
      id: 61
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Refugees keep coming in from the forest and over the hill, and the kitchens are short again. Some of them are boiling tree bark for soup.<BR><BR>The Long Tusk Warthogs at the edge of the forest are fat and close. They are also aggressive, and the Warthog Brutes are worse. Bring down both."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Good. I'll send the haulers out for the carcasses.<BR><BR>One more line for the ledger: the kitchens stayed open another day."
    - huntingZoneId: 60
      id: 62
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Not every faerie in this forest is our enemy. The ones at the Faerie Pond kept faith. The Faerie Insurgents did not.<BR><BR>The insurgents hoard faerie dust, and they steal what they cannot gather. I want that dust out of rebel hands."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "That is a good haul of dust.<BR><BR>It stays under lock in my store until someone at the Faerie Pond can say whose it was."
        - id: 4
          npcZoneId: 60
          villagerId: 1101
          pages:
            - social: 0
              content: "Nothing yet? The insurgents are all over the forest. They are not hard to find."
    - huntingZoneId: 60
      id: 63
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Volos gave his word that the centaurs would keep the peace, and most of them do.<BR><BR>The Centaurs who ride with the faerie vigilantes do not. They have trampled logging crews before, and they will do it again. Break up their bands."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Good. Volos may not thank us for it, but the loggers will."
    - huntingZoneId: 60
      id: 64
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "A runner came from the logging crews this morning. They want an escort, and I have no escort to give them.<BR><BR>So you walk the forest where they work instead. This is what the runner told me."
        - id: 11
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Slinking Sabertooths. They used to hunt warthogs. Now they wait for the loggers. Kill them before they learn when the crews go out."
        - id: 12
          npcZoneId: 60
          prevId: 11
          villagerId: 1101
          pages:
            - social: 4
              content: "No more sabertooths where the crews work? I'll tell them they can go back out tomorrow."
        - id: 21
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "A crew dropped their tools and ran. Centaur Insurgents took the axes, and Sabertooths prowl the ground where the crew fell back. Bring those axes home. A logger without an axe is just one more refugee."
        - id: 22
          npcZoneId: 60
          prevId: 21
          villagerId: 1101
          pages:
            - social: 4
              content: "These still have an edge on them. The crew will be back at the stacks before noon."
        - id: 23
          npcZoneId: 60
          villagerId: 1101
          pages:
            - social: 0
              content: "The crew is still sitting idle. They need those axes."
    - huntingZoneId: 60
      id: 65
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Two jobs in the north of the forest, and I won't pretend they are the same. The Hulking Sabertooths near Faevine Vale Camp kill loggers. Those you hunt.<BR><BR>The Feral Unicorns are different. The ill wind took them, and Aeir asked that they be put down as a mercy. Do it cleanly."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "It's done, then.<BR><BR>Teroz will call it a good day. I'll write it down as a necessary one."
    - huntingZoneId: 60
      id: 66
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Niralia says that when a monster that came now and then starts coming every day, something is pushing it. The Stonebeaks in Blood Run come every day now.<BR><BR>They are a distraction more than a danger, but they move in bands behind a Stonebeak Fighter. Kill the Fighters."
        - id: 3
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Without their Fighters the bands drift apart. The soldiers in Blood Run can watch the road again instead of the sky."
    - huntingZoneId: 60
      id: 67
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Garkior is dead, but Scarwood has not healed. Klaon wants to know why.<BR><BR>The Bloated Sporewalkers and the Merciless Jalmaraks that lead the faerie renegades there are soaked in whatever is wrong with that ground. Bring back samples of it."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Careful, it stains.<BR><BR>I'll take these to Klaon myself. If he learns anything, the Wardens will hear it first."
        - id: 4
          npcZoneId: 60
          villagerId: 1101
          pages:
            - social: 0
              content: "Klaon has asked me twice today. He needs those samples."
    - huntingZoneId: 60
      id: 68
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "The road to Crescentia is open again, but the devas still raid it. They just choose their caravans more carefully now.<BR><BR>The Devan Robbers and Devan Scrappers carry written orders. Bring me those orders and I will know which caravans they want."
        - id: 3
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Routes, times, and marks on a map. They knew more than I would like.<BR><BR>The next caravan takes a different road."
        - id: 4
          npcZoneId: 59
          villagerId: 1101
          pages:
            - social: 0
              content: "The next caravan leaves soon. I need those orders before it does."
    - huntingZoneId: 60
      id: 69
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "The devas overran these woods once, and they act as though they mean to do it again.<BR><BR>Here is today's trouble."
        - id: 11
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "The Devan Brigands stole supplies from Crescentia's families, and they are not finished. Every one you stop is one raid fewer on a family's stores."
        - id: 12
          npcZoneId: 59
          prevId: 11
          villagerId: 1101
          pages:
            - social: 4
              content: "The families will sleep easier tonight. So will I."
        - id: 21
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "The Agitated Sporewalkers carry spores fused with the souls of the dead. Esedran wants samples. I want them gone. Do both."
        - id: 22
          npcZoneId: 59
          prevId: 21
          villagerId: 1101
          pages:
            - social: 4
              content: "They are warm. They should not be warm. Esedran will want these at once."
        - id: 23
          npcZoneId: 59
          villagerId: 1101
          pages:
            - social: 0
              content: "Esedran keeps asking. He wants them fresh."
        - id: 31
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "The Devan Arcanists hold their ground with dark magic, and their amulets carry it. Kill them and break the amulets where they fall."
        - id: 32
          npcZoneId: 59
          prevId: 31
          villagerId: 1101
          pages:
            - social: 4
              content: "Good. Each arcanist gone loosens their hold on the woods."
    - huntingZoneId: 60
      id: 70
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "The Gutrends wiped out Colchester, the whole village. Crescentia has not forgotten, and neither have the Wardens who came from the valley.<BR><BR>In the northern camp every band follows a Gutrend Kulkari, a Gutrend Clawtamer or a Gutrend Brigand, and each of them wears a token for every raid. Take the tokens."
        - id: 3
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "So many.<BR><BR>I will count them tonight, for the ones who fell. Then I will burn them."
        - id: 4
          npcZoneId: 59
          villagerId: 1101
          pages:
            - social: 0
              content: "The tokens, please. Each one is a raid that already happened."
    - huntingZoneId: 60
      id: 71
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Not every refugee from the valley made it over the hill to us. Some live in the camps up north, with nothing left.<BR><BR>Gutrend Raiders circle those camps looking for anyone too weak to run. Walk the camp edges and put them down."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Good. I'll send what blankets we can spare with the next wagon.<BR><BR>They lost everything once. Not again, if I can help it."
    - huntingZoneId: 60
      id: 72
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Two kinds of trouble come to the edges of Crescentia, and the town fears both.<BR><BR>Here is where I need you today."
        - id: 11
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "The dead in Berzerad Cemetery still walk. The devas' nexus spirit called them back, and the Furious Dragoons lead them. They served Crescentia in life. Give them rest."
        - id: 12
          npcZoneId: 59
          prevId: 11
          villagerId: 1101
          pages:
            - social: 4
              content: "Thank you. I hope they find peace this time."
        - id: 21
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Hyenas are coming down to the farms near the Valley of Titans. They have already killed animals at Echo Ranch. Thin out the Starving Hyenas before they take more than animals."
        - id: 22
          npcZoneId: 59
          prevId: 21
          villagerId: 1101
          pages:
            - social: 4
              content: "The farmers keep their herds tonight, and those herds feed this town."
    - huntingZoneId: 60
      id: 73
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 59
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "The Gutrends in the southern camp are gathering strength. I would rather they did not.<BR><BR>Today you take some of it away from them."
        - id: 11
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "The Gutrend Seers are the hardest of them to deal with, and the bands follow them. Kill the Seers."
        - id: 12
          npcZoneId: 59
          prevId: 11
          villagerId: 1101
          pages:
            - social: 4
              content: "Without their Seers the bands will argue among themselves. Good."
        - id: 21
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "The Gutrends keep their strength up by eating warthogs. Hunt the Hillwalker Warthogs and Great Tusk Warthogs around their camp, and bring me tusks so I know the herds are thinned, not just scattered."
        - id: 22
          npcZoneId: 59
          prevId: 21
          villagerId: 1101
          pages:
            - social: 4
              content: "Hungry Gutrends make poor raiders. Mirim had the right idea."
        - id: 23
          npcZoneId: 59
          villagerId: 1101
          pages:
            - social: 0
              content: "Scattered herds come back. Bring me the tusks."
        - id: 31
          npcZoneId: 59
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "The Gutrends eat Scavenging Bears when they can, and drive them at our camps when they cannot. Either way, fewer bears is better for us."
        - id: 32
          npcZoneId: 59
          prevId: 31
          villagerId: 1101
          pages:
            - social: 4
              content: "One less thing the Gutrends can use against us."
    - huntingZoneId: 60
      id: 74
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Ackerly is still waiting on his survey of Tuwangi Mire, and the surveyor cannot work. Muddy Sporewalkers block every path he tries.<BR><BR>Inky Sabertooths attack anyone who goes in, our people and the friendly tuwangis alike. Kill both, and bring specimens. The survey needs to know what it is up against."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Specimens, and a clear path. Ackerly will be pleased, which is rare.<BR><BR>The tuwangis who help us will be glad of it too."
        - id: 4
          npcZoneId: 60
          villagerId: 1101
          pages:
            - social: 0
              content: "Ackerly asked me again this morning. I had nothing to show him."
    - huntingZoneId: 60
      id: 75
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 0
              content: ""
        - id: 2
          npcZoneId: 60
          prevId: 0
          villagerId: 1101
          pages:
            - social: 4
              content: "Magistrate Arn keeps sending soldiers into the Celestial Hills, and it is never enough. The Red Fang Orcans are massing against Casidhe's Stand.<BR><BR>Go and help. Kill the Lean Hyenas along the way too. They hunt the road the Mysterium researchers use east of the Sanctum."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "Back from the hills in one piece. Good.<BR><BR>Casidhe held that ground with her life. It is good to see someone still holding it."

