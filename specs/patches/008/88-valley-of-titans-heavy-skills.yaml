# Valley of Titans (zone 6): every hostile monster's long telegraphed attacks hit hard enough to
# punish a player who does not dodge them, by the same rule as the Oblivion Woods spec. Their quick
# attacks and their base attack are left as they are.
#
# How hard follows how long the attack takes to play: the skill's animation length in
# AnimationData over its timeRate (the AnimSeq duration on monster rows is 0). An attack of four
# seconds or more aims at about two thirds of the arriving player's health per landed use, one of
# three to four seconds at about half. The factor that reaches the aim is rounded up to a whole
# step, two at least, so an attack lands at or above its aim. A factor only ever raises; an attack
# already at its target is left alone, and so is any skill named as a buff.
#
# Each entry names a monster (npc-ids) and the attacks of it that take one factor (npc-skill-ids):
# the skill rows of each normal skill and of its enraged form. A monster with no rows of its own
# casts its shareId template's, so the change lands there, and any other template that casts those
# rows takes it too. Rows are named by id, never by animation: one monster's attacks share
# animations (a combo reuses its opening move), so an animation can reach a second attack.
# `strict` fails the apply when any named monster or row is missing.
#
# TRAP: `multiply` is a delta from the file's current values, not an absolute target. It is safe
# under a whole-patch migrate, which reads from the server repo's committed baseline; a bare
# single-spec apply against the working tree compounds it.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: npc-ids
    use:
      variables:
        - VT_GRAZING_NORUK
        - VT_STOMPING_NORUK
        - VT_RAVENOUS_HYENA
        - VT_HYENA_STALKER
        - VT_STARVING_HYENA
        - VT_GUTREND_KULKARI
        - VT_GUTREND_HYENA_1
        - VT_GUTREND_CLAWTAMER
        - VT_GUTREND_HYENA_2
        - VT_GUTREND_BRIGAND
        - VT_GUTREND_PILLAGER
        - VT_GUTREND_RAIDER
        - VT_GUTREND_SKULLCRUSHER
        - VT_HILLWALKER_WARTHOG
        - VT_GREAT_TUSK_WARTHOG
        - VT_SCAVENGING_BEAR
        - VT_RAVENOUS_BEAR
        - VT_GUTREND_REAPER
        - VT_GUTREND_SEER
        - VT_GUTREND_JUGGERNAUT
        - VT_SCION_JUSTICAR
        - VT_LOKIAN_BATTLERAGER
        - VT_LOKIAN_REAVER
        - VT_LOKIAN_REAPMASTER
        - VT_LAKRAX
        - VT_TORAX
  - from: npc-skill-ids
    use:
      variables:
        - VT_GRAZING_NORUK_DASH_ATTACK
        - VT_GRAZING_NORUK_DOUBLE_UPPERCUT
        - VT_STOMPING_NORUK_DOUBLE_UPPERCUT
        - VT_RAVENOUS_HYENA_DASH_ATTACK
        - VT_STARVING_HYENA_DASH_ATTACK
        - VT_GUTREND_KULKARI_SPIN_ATTACK
        - VT_GUTREND_KULKARI_CLAW
        - VT_GUTREND_HYENA_1_DASH_ATTACK
        - VT_GUTREND_CLAWTAMER_SHIELD_CHARGE
        - VT_GUTREND_HYENA_2_DASH_ATTACK
        - VT_GUTREND_BRIGAND_SPIN_ATTACK
        - VT_GUTREND_BRIGAND_CLAW
        - VT_GUTREND_PILLAGER_SHIELD_CHARGE
        - VT_GUTREND_RAIDER_SHIELD_CHARGE
        - VT_GUTREND_SKULLCRUSHER_HEAVY
        - VT_HILLWALKER_WARTHOG_CHARGE
        - VT_GREAT_TUSK_WARTHOG_CHARGE
        - VT_SCAVENGING_BEAR_POUNCE
        - VT_RAVENOUS_BEAR_POUNCE
        - VT_GUTREND_REAPER_HEAVY
        - VT_GUTREND_SEER_HEAVY
        - VT_GUTREND_JUGGERNAUT_SHIELD_CHARGE
        - VT_SCION_JUSTICAR_HEAVY
        - VT_LOKIAN_BATTLERAGER_HEAVY
        - VT_LOKIAN_REAVER_HEAVY
        - VT_LOKIAN_REAPMASTER_HEAVY
        - VT_LAKRAX_CLAW

npcSkills:
  updateWhere:
    strict: true
    entries:
      # Skill 1102, atk03 (6.8 s).
      - filter:
          huntingZoneId: 6
          npc.id: $VT_GRAZING_NORUK
          id: $VT_GRAZING_NORUK_DASH_ATTACK
        changes:
          totalAtk: { multiply: 2 }
      # Skill 1103, atk02 (4.6 s).
      - filter:
          huntingZoneId: 6
          npc.id: $VT_GRAZING_NORUK
          id: $VT_GRAZING_NORUK_DOUBLE_UPPERCUT
        changes:
          totalAtk: { multiply: 3 }
      # Skill 1103, atk02 (4.6 s).
      - filter:
          huntingZoneId: 6
          npc.id: $VT_STOMPING_NORUK
          id: $VT_STOMPING_NORUK_DOUBLE_UPPERCUT
