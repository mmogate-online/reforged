# Revelation drop route: the pieces inside each bag the previous spec appends. A bag and its
# items cannot be added in one entry, because the bag must exist before an item is selected
# into it. Shares are written to the datasheet's 1e-8 resolution with the remainder on the last
# item, so each bag sums to exactly 1.
# provenance: policy
spec:
  version: "1.0"
  schema: v92

eCompensations:
