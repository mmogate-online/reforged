# Oblivion Woods: the three Devan captains Tuebenius, Basenius and Kulsilva return in 20 to 22
# seconds, so the captain fight that pays a full set of Hornmasks is never a wait.
#
# A captain in a party carries the party's respawn pair and its own, and every member its own;
# all of them must change, or the slower one wins. Basenius's paired Arcanist already returns in
# 20 to 22 seconds. Values are milliseconds.
# provenance: policy

