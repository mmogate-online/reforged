# Arcadia's field monsters drop the classic crafting inputs often enough for a crafter. Lane gear
# takes Paverune of Shara or Arun and a refined material, and leather takes its hide, so every
# ordinary monster of a level band reaches one floor rate: monsters of levels 11 to 16 drop a
# rune on a quarter of their kills and Dawnhide on a third, monsters of levels 17 to 22 a rune on
# about a sixth and Dawnhide on close to half. A monster already above a floor keeps its rate.
#
# The vanilla bags stay as they are. Each monster below the floor gains a second bag holding the
# difference, since two bags rolled on one kill add their rates. This spec adds the bags; the next
# fills them, because a bag must exist before an item is selected into it.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

