# Profession designs stop dropping in Arcadia. A design found in the field would let a crafter
# level past the region's band, so designs come from the crafters' guild alone.
#
# Bags holding only designs are removed whole. Mixed bags lose just the designs and keep every
# other row as it was. A bag is named by its id and bagName, which is unique within one
# monster's loot; one bag id can hold different designs on different monsters of a zone.
#
# provenance: policy

spec:
  version: "1.0"
  schema: v92

eCompensations:
  update:
    # Fey Forest
    - huntingZoneId: 2
      npcTemplateId: [3, 4, 5, 6, 7, 10, 13, 22, 32, 34, 56, 57, 203, 209, 210, 259]
      changes:
        removeItemBags:
          - { id: 3, bagName: "도안" }
          - { id: 10, bagName: "도안1" }

