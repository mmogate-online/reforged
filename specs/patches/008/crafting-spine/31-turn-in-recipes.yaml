# Valkyon Craftworks turn-in recipes: one per turn-in item, under the guild's heading in each
# profession's crafting window, in the band of its daily. A band 1 recipe pays Crafting Skill
# from 1 to 100 and a band 50 recipe from 50 to 150, at the rate of every recipe below 150.
#
# Inputs are the raw materials Arcadia's monsters and nodes yield beyond what the gear parts
# need, plus the profession's apprentice kit, so a daily drains that surplus. The loader refuses
# a recipe that names a critical result with a zero critical rate, so the rate is set and the
# critical result is the same single item. A recipe's id equals the id of its design item.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

itemProduceRecipes:
