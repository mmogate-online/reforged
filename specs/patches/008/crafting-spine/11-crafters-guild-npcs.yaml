  _villagerTerritory:
    type: normal
    addMaxZ: 256.000000
    subtractMinZ: 0.000000
    eventId: 0
    randomPosMinDist: 100.000000
    peaceMoveNpcCheckDist: 100.000000
    attribute:
      abnormality: 0
      achieveConditionId: 0

npcs:
  upsert:
    - huntingZoneId: 60
      id: 1103
      $extends: _supervisor
      name: "Valkyon Craftworks Supervisor Aldric"
      shapeId: 203105                       # Maius 63,1604
      basicActionId: 5000800
      scale: 1
      race: Human
      gender: male
    - huntingZoneId: 59
      id: 1103
      $extends: _supervisor
      name: "Valkyon Craftworks Supervisor Dharva"
      shapeId: 510220                       # Palam 63,1192
      basicActionId: 5102200
      scale: 1
      race: Aman
      gender: female

territories:
  upsert:
    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000041
      $extends: _villagerTerritory
      desc: "Valkyon Craftworks Supervisor, Lumbertown"
      fences:
