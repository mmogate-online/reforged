# Valkyon Craftworks supervisors: Aldric in Lumbertown and Dharva in Crescentia. Each opens the
# guild's design store.
#
# A villagerMenus upsert replaces the villager's whole menu list. The spawns join the region
# vendor groups, so the npc location prune belongs after the apply. dir is degrees,
# counter-clockwise from +x.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

definitions:
  # Villager envelope; aiid 100 is the villager idle AI, so neither supervisor wanders.
  _supervisor:
    villager: true
    invincible: true
    aiid: 100
    size: medium
    resourceType: medium
    resourceSize: 100
    class: ""
    collideOnMove: false
    isObjectNpc: false
    isWideBroadcaster: false
    isFreeNamed: false
    isLightParty: false
    elite: false
    showAggroTarget: false
    showShorttermTarget: false
    dontTurn: false
    partyMember: 0
    spawnScriptId: 0
    despawnScriptId: 0
    pcDespawnScriptId: 0
    villagerVolumeOffset: ""
    villagerVolumeActiveRange: 0
    villagerVolumeHalfHeight: 0
    villagerVolumeInteractionDist: 0
    namePlate:
      deathNameplateHeight: 0
    abnormalityResistanceOverride:
      resetTime: 60000
    stat:
      maxHp: 10000
      walkSpeed: 60
      runSpeed: 110
      atk: 100
      def: 2000
      exp: 1
      level: 40
    npcOnly:
      onDeathSkill: 0
    anger:
      gaugeSize: 403799
      time: 16633
      moveSpeedUpRate: 1.6
      accumRateWhenHpLow: 1.0
      accumRateWhenHpMed: 1
      accumRateWhenHpHigh: 1.0
      modeOnProbabilityWhenPartyMemberDead: 0.2
    critical:
      str: 30
