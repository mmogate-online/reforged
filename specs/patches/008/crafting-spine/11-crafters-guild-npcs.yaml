      npcTemplateId: 1103
      $extends: _villagerSpawn
      desc: "Valkyon Craftworks Supervisor Aldric"
      pos: [89149.62, -3702.68, 842.37]
      dir: 178
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900035
