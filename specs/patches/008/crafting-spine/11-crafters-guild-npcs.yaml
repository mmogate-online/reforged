# Valkyon Craftworks supervisors: Aldric in Lumbertown and Dharva in Crescentia. Each opens the
# guild's design store.
#
# A villagerMenus upsert replaces the villager's whole menu list. The spawns join the region
# vendor groups, so the npc location prune belongs after the apply. dir is degrees,
# counter-clockwise from +x.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: reforged-villagers
    use:
      definitions:
        - ReforgedVillager
        - VillagerSpawn
        - VillagerTerritory

npcs:
  upsert:
    - huntingZoneId: 60
      id: 1103
      $extends: ReforgedVillager
      name: "Valkyon Craftworks Supervisor Aldric"
      shapeId: 203105                       # Maius 63,1604
      basicActionId: 5000800
      scale: 1
      race: Human
      gender: male
    - huntingZoneId: 59
      id: 1103
      $extends: ReforgedVillager
      name: "Valkyon Craftworks Supervisor Dharva"
      shapeId: 510220                       # Palam 63,1192
      basicActionId: 5102200
      scale: 1
      race: Aman
      gender: female

territories:
  upsert:
    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000041
      $extends: VillagerTerritory
      desc: "Valkyon Craftworks Supervisor, Lumbertown"
      fences:
        - [89000, -3853, 842]
        - [89300, -3853, 842]
        - [89300, -3553, 842]
        - [89000, -3553, 842]
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900035
      $extends: VillagerTerritory
      desc: "Valkyon Craftworks Supervisor, Crescentia"
      fences:
        - [96406, 16470, 2899]
        - [96706, 16470, 2899]
        - [96706, 16770, 2899]
        - [96406, 16770, 2899]

territorySpawns:
  upsert:
    - huntingZoneId: 60
      groupId: 6000003
      territoryId: 6000041
      npcInstanceId: 6004062
      npcTemplateId: 1103
      $extends: VillagerSpawn
      desc: "Valkyon Craftworks Supervisor Aldric"
      pos: [89149.62, -3702.68, 842.37]
      dir: 178
    - huntingZoneId: 59
      groupId: 5900006
      territoryId: 5900035
      npcInstanceId: 5900432
      npcTemplateId: 1103
      $extends: VillagerSpawn
      desc: "Valkyon Craftworks Supervisor Dharva"
      pos: [96555.57, 16619.80, 2898.57]
      dir: 174

creatureStrings:
  upsert:
    - { huntingZoneId: 60, templateId: 1103, name: "Aldric", gender: male, race: Human, title: "Valkyon Craftworks Supervisor" }
    - { huntingZoneId: 59, templateId: 1103, name: "Dharva", gender: female, race: Aman, title: "Valkyon Craftworks Supervisor" }

speechConditions:
  upsert:
    - huntingZoneId: 60
      templateId: 1103
      note: "Valkyon Craftworks Supervisor Aldric"
      normal:
        - { id: 1, paramType: random }
      popup: []
    - huntingZoneId: 59
      templateId: 1103
      note: "Valkyon Craftworks Supervisor Dharva"
      normal:
        - { id: 1, paramType: random }
      popup: []

# voiceTypeId is the voice of the NPC whose model was copied.
villagerDialogs:
  upsert:
    - huntingZoneId: 60
      id: 1103
      voiceTypeId: 28
      texts:
        - id: 1
          huntingZoneId: 60
          villagerId: 1103
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Every piece that leaves this town passes my inspection first. The camps cannot afford a bad blade."
    - huntingZoneId: 59
      id: 1103
      voiceTypeId: 115
      texts:
        - id: 1
          huntingZoneId: 59
          villagerId: 1103
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Bring me good work and I will find it a soldier. Bring me bad work and I will find you a whetstone."

# guideEffectId 104 is the icon every vanilla reputation quartermaster wears.
villagerMenus:
  upsert:
    - huntingZoneId: 60
      npcTemplateId: 1103
      guideEffectId: 104
      menus:
        - { type: Merchant, id: 922 }
    - huntingZoneId: 59
      npcTemplateId: 1103
      guideEffectId: 104
      menus:
        - { type: Merchant, id: 922 }

npcLocStrings:
  upsert:
    - huntingZoneId: 60
      templateId: 1103
      continent: 7001
      markers:
        - [89150, -3703, 842]
    - huntingZoneId: 59
      templateId: 1103
      continent: 7001
      markers:
        - [96556, 16620, 2899]
