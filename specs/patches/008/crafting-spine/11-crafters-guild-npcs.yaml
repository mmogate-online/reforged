creatureStrings:
  upsert:
    - { huntingZoneId: 60, templateId: 1103, name: "Aldric", gender: male, race: Human, title: "Valkyon Craftworks Supervisor" }
    - { huntingZoneId: 59, templateId: 1103, name: "Dharva", gender: female, race: Aman, title: "Valkyon Craftworks Supervisor" }

speechConditions:
  upsert:
    - huntingZoneId: 60
      templateId: 1103
      note: "Valkyon Craftworks Supervisor Aldric"
      normal:
        - { id: 1, paramType: random }
      popup: []
    - huntingZoneId: 59
      templateId: 1103
      note: "Valkyon Craftworks Supervisor Dharva"
      normal:
        - { id: 1, paramType: random }
      popup: []

# voiceTypeId is the voice of the NPC whose model was copied.
villagerDialogs:
  upsert:
    - huntingZoneId: 60
      id: 1103
      voiceTypeId: 28
      texts:
        - id: 1
          huntingZoneId: 60
          villagerId: 1103
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Every piece that leaves this town passes my inspection first. The camps cannot afford a bad blade."
    - huntingZoneId: 59
      id: 1103
      voiceTypeId: 115
      texts:
        - id: 1
          huntingZoneId: 59
          villagerId: 1103
          prevId: 0
          endSocial: 14
          pages:
            - social: 4
              text: "Bring me good work and I will find it a soldier. Bring me bad work and I will find you a whetstone."

# guideEffectId 104 is the icon every vanilla reputation quartermaster wears.
villagerMenus:
  upsert:
    - huntingZoneId: 60
      npcTemplateId: 1103
      guideEffectId: 104
      menus:
        - { type: Merchant, id: 922 }
    - huntingZoneId: 59
      npcTemplateId: 1103
      guideEffectId: 104
      menus:
        - { type: Merchant, id: 922 }

npcLocStrings:
  upsert:
    - huntingZoneId: 60
      templateId: 1103
      continent: 7001
      markers:
        - [89150, -3703, 842]
    - huntingZoneId: 59
      templateId: 1103
      continent: 7001
      markers:
        - [96556, 16620, 2899]
