      texts:
        - { id: 1, pages: [] }
        - { $extends: _dharvaText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - { $extends: _dharvaText, id: 2, prevId: 0, pages: [{ social: 4, content: "Tribune Jodoc has more volunteers than armor.<BR><BR>Bring me Riveted Plate Bundles. We can use the plates to reinforce their armor." }] }
