        - { $extends: _aldricText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - { $extends: _aldricText, id: 2, prevId: 0, pages: [{ social: 4, content: "The Arcadia Guard needs to repair damaged mail. Replacement armor is scarce.<BR><BR>Bring me Mail Ring Bundles so the guards can mend their armor." }] }
