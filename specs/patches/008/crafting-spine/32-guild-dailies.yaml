        - { $extends: _aldricText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - { $extends: _aldricText, id: 2, prevId: 0, pages: [{ social: 4, content: "Jaram says the army requisitions the axe heads. The Arcadia Guard still needs spears to protect Lumbertown.<BR><BR>Bring me Spearhead Bundles for the town's guards." }] }
