# Valkyon Craftworks dailies: six faction 621 daily quests and the guild's daily pool, two a day
# at every grade. Each asks for one crafted turn-in item, handed back to the supervisor who gave
# it; Aldric in Lumbertown and Dharva in Crescentia each give three. Guild standing comes from
# these dailies alone.
#
# A daily is offered only from the pool whose id equals its quest group (the id divided by 100),
# so every quest here sits in group 621, the guild's own id. A delivery task needs its
# completion button text, or the world server stops at boot.
#
# The server loader refuses the whole pool file, and stops the boot, when a grade's weights do
# not sum to exactly 100 or its giveCount exceeds the quests it lists. Recount both by hand after
# any edit to the pool. The pair under questPool is the quest id and its weight, under the names
# groupId and index.
# provenance: policy

