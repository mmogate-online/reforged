        - { $extends: _dharvaText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - { $extends: _dharvaText, id: 2, prevId: 0, pages: [{ social: 4, content: "Crescentia's conscripts are tired from the night watch.<BR><BR>Bring me Field Tonic Cases to help them stay awake." }] }
        - { $extends: _dharvaText, id: 3, prevId: 2, pages: [{ social: 4, content: "These tonics pass inspection. Jodoc will send them to the conscripts.<BR><BR>Valkyon Craftworks thanks you." }] }
        - { $extends: _dharvaText, id: 4, pages: [{ social: 0, content: "The conscripts still need tonic for the night watch." }] }
    - huntingZoneId: 621
      id: 6
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _dharvaText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - { $extends: _dharvaText, id: 2, prevId: 0, pages: [{ social: 4, content: "Caravans near Crescentia are still raided. The vigilantes need more arrows.<BR><BR>Bring me Arrowhead Bundles to supply the town's defenders." }] }
        - { $extends: _dharvaText, id: 3, prevId: 2, pages: [{ social: 4, content: "These arrowheads are well made. We will fit them to shafts tonight.<BR><BR>Valkyon Craftworks thanks you." }] }
        - { $extends: _dharvaText, id: 4, pages: [{ social: 0, content: "The vigilantes need more arrows. Bring the arrowheads." }] }
    - huntingZoneId: 621
      id: 7
