        - { $extends: _aldricText, id: 2, prevId: 0, pages: [{ social: 4, content: "Klaon needs more remedies for Lumbertown's sick refugees. His shelves are empty again.<BR><BR>Bring me Field Salve Cases, whether you make them or buy them. They must pass inspection." }] }
        - { $extends: _aldricText, id: 3, prevId: 2, pages: [{ social: 4, content: "Sealed and sound. These go to Klaon tonight.<BR><BR>Valkyon Craftworks thanks you." }] }
