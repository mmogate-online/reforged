# Valkyon Craftworks order recipes: one Trial piece per profession and band, under a Valkyon
# Craftworks heading in each profession's crafting window. A band 1 recipe pays Crafting Skill
# from 1 to 100 and a band 50 recipe from 50 to 150, so a crafter always has one that pays.
#
# Inputs are one Arcadia gathered material per profession and the profession's apprentice kit,
# so the route needs no guild standing and no other profession. A craft costs few Production
# Points and pays proficiency at the same rate per point. The loader refuses a recipe that names
# a critical result with a zero critical rate. A recipe's id equals the id of its design item.
# provenance: policy

