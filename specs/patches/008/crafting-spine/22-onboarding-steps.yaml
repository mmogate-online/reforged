questDialogs:
  upsert:
    - huntingZoneId: 621
      id: 8
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Valkyon Craftworks<BR><BR>Lumbertown is short of remedies for the sick and the wounded. Alchemists are needed.<BR><BR>Report to Aldric."
        - $extends: _aldricText
          id: 3
          prevId: 2
          pages:
            - social: 4
              content: "Klaon keeps every sick refugee in this town alive on what he can brew, and it is never enough.<BR><BR>Take this recipe. Make Trial Salves until you know the work, and hand them to the mission officer. Each one is inspected before it goes out."
    - huntingZoneId: 621
      id: 9
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Valkyon Craftworks<BR><BR>Salves keep the refugees on their feet. The Arcadia Guard needs something stronger.<BR><BR>Report to Aldric."
        - $extends: _aldricText
          id: 3
          prevId: 2
          pages:
            - social: 4
              content: "Your salves pass. The Arcadia Guard needs a tincture that lasts a whole patrol, not a salve that wears off on the road.<BR><BR>This recipe is harder. Make Trial Tinctures and send them through the mission officer, as before."
    - huntingZoneId: 621
      id: 10
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Valkyon Craftworks<BR><BR>Crescentia's defenders are short of weapons. Weaponcrafters are needed.<BR><BR>Report to Dharva."
        - $extends: _dharvaText
          id: 3
          prevId: 2
          pages:
            - social: 4
              content: "Jodoc's young slayers are still waiting for proper blades.<BR><BR>Start with the blank. A flaw in the blank stays in the finished blade. Make Trial Blade Blanks and hand them to the mission officer for inspection."
    - huntingZoneId: 621
      id: 11
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Valkyon Craftworks<BR><BR>Crescentia needs heavier blades than a beginner can forge.<BR><BR>Report to Dharva."
        - $extends: _dharvaText
          id: 3
          prevId: 2
          pages:
            - social: 4
              content: "Your blanks pass. Now make one heavy enough for a greatsword, and true enough that it does not bend on a deva's shield.<BR><BR>Make Trial Greatsword Blanks. The mission officer knows where to send them."
    - huntingZoneId: 621
      id: 12
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Valkyon Craftworks<BR><BR>Lumbertown's archers and guards are short of armor. Armorcrafters are needed.<BR><BR>Report to Aldric."
        - $extends: _aldricText
          id: 3
          prevId: 2
          pages:
            - social: 4
              content: "Prefect Daven has more archers than armor to put on them.<BR><BR>Leather first. It forgives a beginner's mistakes. Make Trial Leather Panels and hand them to the mission officer for inspection."
    - huntingZoneId: 621
      id: 13
      voiceTypeId: 0
      texts:
        - { id: 1, pages: [] }
        - { $extends: _boardText, id: 100, prevId: 0, pages: [{ social: 0, content: "" }] }
        - $extends: _boardText
          id: 2
          prevId: 0
          pages:
            - social: 5
              content: "Valkyon Craftworks<BR><BR>The Arcadia Guard needs mail that holds against a centaur's charge.<BR><BR>Report to Aldric."
        - $extends: _aldricText
          id: 3
          prevId: 2
          pages:
            - social: 4
              content: "Your leather passes. Mail is slower work, and a bad ring costs a soldier more than a bad stitch.<BR><BR>Make Trial Mail Panels and send them through the mission officer."

