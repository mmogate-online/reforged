# Valkyon Craftworks onboarding steps: one per profession and band, taken once from the Crafting
# tab of the chapter house board. Each sends the crafter to the guild supervisor its text names,
# who pays the design of the band's Trial piece. A band 50 step requires the band 1 step of the
# same profession.
#
# A quest with no giver (the 0,0 start NPC) lists on the board of every hub city; its tab is
# the assembly category. The board bulletin speaks as nobody, and the visit's closing text is
# spoken by the supervisor.
#
# Trap: the dungeon entry trigger is written as 0 on purpose. The server leaves that field
# unset when the element is absent, and a leftover non-zero value makes the quest count as
# dungeon-triggered, so it silently drops off the board.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

definitions:
  _onboardingQuest:
    header:
      startTaskId: 1
      linkedQuest: 101
      recommendedPartySize: 1
      recommendedLevel: 11
      questDialogue: 2
      summaryInfo: 100
      designersNote: ""
      questType: Guild
      repeatType: OneTime
      cancellable: Allowed
      assemblyCategory: 2
      giverNpc: { huntingZone: 0, templateId: 0 }
      dungeonEntryTrigger: 0
    requirements:
      minLevel: 11
      maxLevel: 70
  _visitTask:
    taskId: 1
    type: VisitTask
    nextTaskId: 0
    journalScript: 2
    hasReward: true
    body:
      dialogueId: 3
      visitCinematicId: 0
  _boardText:
    npcZoneId: 0
    villagerId: 0
  _aldricText:
    npcZoneId: 60
    villagerId: 1103
  _dharvaText:
    npcZoneId: 59
    villagerId: 1103

quests:
  upsert:
    # Remedies for the Camps (Alchemy, band 1)
    - id: 62108
      $extends: _onboardingQuest
      header: { questNumber: 62108, questTitle: "@quest:62108001", startPopup: "@quest:62108002", endPopup: "@quest:62108003" }
      tasks:
        - $extends: _visitTask
          journalText: "@quest:62108005"
          body:
            npcId: { huntingZone: 60, templateId: 1103 }
            completionButtonText: "@quest:62108004"
    # A Stronger Tincture (Alchemy, band 50)
    - id: 62109
      $extends: _onboardingQuest
      header: { questNumber: 62109, questTitle: "@quest:62109001", startPopup: "@quest:62109002", endPopup: "@quest:62109003" }
      requirements: { prerequisites: [62108] }
      tasks:
        - $extends: _visitTask
          journalText: "@quest:62109005"
          body:
            npcId: { huntingZone: 60, templateId: 1103 }
            completionButtonText: "@quest:62109004"
    # Arms for Crescentia (Weaponcrafting, band 1)
    - id: 62110
      $extends: _onboardingQuest
      header: { questNumber: 62110, questTitle: "@quest:62110001", startPopup: "@quest:62110002", endPopup: "@quest:62110003" }
      tasks:
        - $extends: _visitTask
          journalText: "@quest:62110005"
          body:
            npcId: { huntingZone: 59, templateId: 1103 }
            completionButtonText: "@quest:62110004"
    # Blades for the Slayers (Weaponcrafting, band 50)
    - id: 62111
      $extends: _onboardingQuest
      header: { questNumber: 62111, questTitle: "@quest:62111001", startPopup: "@quest:62111002", endPopup: "@quest:62111003" }
      requirements: { prerequisites: [62110] }
      tasks:
        - $extends: _visitTask
          journalText: "@quest:62111005"
          body:
            npcId: { huntingZone: 59, templateId: 1103 }
            completionButtonText: "@quest:62111004"
    # Armor for Lumbertown (Armorcrafting, band 1)
    - id: 62112
      $extends: _onboardingQuest
      header: { questNumber: 62112, questTitle: "@quest:62112001", startPopup: "@quest:62112002", endPopup: "@quest:62112003" }
      tasks:
        - $extends: _visitTask
          journalText: "@quest:62112005"
          body:
            npcId: { huntingZone: 60, templateId: 1103 }
            completionButtonText: "@quest:62112004"
    # Heavier Mail (Armorcrafting, band 50)
    - id: 62113
      $extends: _onboardingQuest
      header: { questNumber: 62113, questTitle: "@quest:62113001", startPopup: "@quest:62113002", endPopup: "@quest:62113003" }
      requirements: { prerequisites: [62112] }
      tasks:
        - $extends: _visitTask
          journalText: "@quest:62113005"
          body:
            npcId: { huntingZone: 60, templateId: 1103 }
            completionButtonText: "@quest:62113004"

