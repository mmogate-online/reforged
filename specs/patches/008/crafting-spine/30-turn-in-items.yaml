# Valkyon Craftworks turn-in items: the crafted goods the guild's dailies ask for, one per
# profession and band, and the designs that teach them. A turn-in item is used for nothing but a
# daily, so a crafter who levelled the recipe can sell it to a player who drew the daily.
#
# The goods trade freely and are worth nothing to a vendor, so a daily is their only sink. The
# designs are sold for gold at the guild vendor, behind guild grade 2, and the isReputation flag
# is what draws them locked below that grade. A design teaches the recipe whose id equals its
# own.
# provenance: policy

