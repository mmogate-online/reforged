# Classic consumables, tooltips: the classic text of every tier I to III potion, elixir,
# draught and restorative, both grades, and of the tier I scrolls, bursts, Eclipse, Dash and
# Heart, in place of the retirement notice. Names do not change.
# Trap: the client renders $hpDiff as 0 in an item tooltip, while $mpDiff resolves. The
# healing potions and draughts therefore state their heal as a number, which must match the
# HpDiff of the item skill each one links to.
# provenance: ported-from-v31

