# Arcadia's field monsters drop the classic crafting inputs: the items inside the bags the
# previous spec adds. The rune bag gives Paverune of Shara or Paverune of Arun, one of the two at
# even odds, as the vanilla rune bag does; the hide bag gives one Dawnhide.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

eCompensations:
  update:
    - huntingZoneId: 2
      npcTemplateId: [3, 4, 5, 6, 7, 10, 13, 22, 32, 34, 56, 57, 203, 209, 210, 259]
      changes:
        updateItemBags:
          - id: 110
            bagName: "Regional Runes"
            expect: 1
            addItems: [{ templateId: 501, name: "Paverune of Shara", min: 1, max: 1, probability: 0.5 }, { templateId: 511, name: "Paverune of Arun", min: 1, max: 1, probability: 0.5 }]
