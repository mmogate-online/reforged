# Valkyon Craftworks design vendor: the region's profession designs and the guild's turn-in
# designs, one tab per profession, every row opening at guild grade 2. A Merchant menu charges
# gold and only checks the grade. The turn-in designs carry their isReputation flag where they
# are created, because they do not exist yet when this spec applies.
#
# A list gated by a faction needs a ReputationItem row under that faction for every item it
# sells, or the server refuses to start; a row with grade or points 0 is dropped, so the rows
# carry points by convention. The isReputation flag draws a row locked below its grade, and it
# is global: a flagged item is refused below the grade in every store that sells it.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

buyMenuLists:
  upsert:
    - id: 922
      stringId: 922
      desc: "Valkyon Craftworks Designs"
      itemLists:
