# Valkyon Craftworks Requisitions: one repeatable board quest per Trial piece, each asking for
# five of them and paying a little gold and no guild standing. Crafting the pieces is what levels
# the profession. Each opens once its onboarding step is done.
#
# A quest with no giver (the 0,0 start NPC) lists on the Crafting tab of every hub city's board,
# and a delivery to the 0,0 target is taken by any board reward officer, which is why the text
# names the officer by city and the closing text names no speaker. A repeatable quest returns to
# the board as soon as it is handed in.
#
# Trap: the dungeon entry trigger is written as 0 on purpose. The server leaves that field
# unset when the element is absent, and a leftover non-zero value makes the quest count as
# dungeon-triggered, so it silently drops off the board.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

definitions:
  _requisition:
    header:
      startTaskId: 1
      linkedQuest: 101
      recommendedPartySize: 1
      recommendedLevel: 11
      questDialogue: 2
      summaryInfo: 100
      designersNote: ""
      questType: Guild
      repeatType: Repeatable
      cancellable: Allowed
      assemblyCategory: 2
      giverNpc: { huntingZone: 0, templateId: 0 }
      dungeonEntryTrigger: 0
    requirements:
      minLevel: 11
      maxLevel: 70
  _deliverTask:
    taskId: 1
    type: DeliverItemTask
    nextTaskId: 0
    journalScript: 2
    hasReward: true
    cinematicId: 0
    timeLimitSetting: [0, 0]
    body:
      itemCount: 5
      targetNpc: { huntingZone: 0, templateId: 0 }
      completionDialogue: 3
      incompleteDialogue: 4
  _boardText:
    npcZoneId: 0
    villagerId: 0

quests:
