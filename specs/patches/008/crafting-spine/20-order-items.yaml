# Valkyon Craftworks order items: one Trial piece per profession and band, and the design that
# teaches it. A Trial piece exists only to be handed in for a Requisition, so it is crafted for
# Crafting Skill, never sold.
#
# Both kinds stay with the character that made or earned them: no trade, no bank, no guild bank,
# no vendor sale, and a price of zero. The loader refuses any bind type on a stackable item, so
# the lock comes from those flags alone. The designs are paid by the guild's onboarding steps and
# sold nowhere. A design teaches the recipe whose id equals its own.
# provenance: policy

