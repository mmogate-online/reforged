# Classic consumables, instant heals: each potion and draught restores the classic share of
# a character's health or mana at its tier level, counting the gear a character wears there.
# The heal sits on the item skill's first self area; the mana potions' projectile area is untouched.
# The healing items' tooltips state these HP values as numbers; a change here changes them too.
# provenance: policy

spec:
  version: "1.0"
  schema: v92

definitions:
  Hp:
    targetingLists:
      - targetings:
          - areas:
              - effect:
                  hpDiff:
                    value: $V
  Mp:
    targetingLists:
      - targetings:
          - areas:
              - effect:
                  mpDiff:
                    value: $V

commonSkills:
  update:
    - { category: Common, id: 60220100, changes: { $extends: Hp, $with: { V: 2110 } } }  # Healing Potion I: 600 -> 2110
