# Kugai to Revelation item icons. A texture added to the Icon_Items package must also be listed
# under that package in the resource registry before an item's icon can name it, and the
# registry names each texture in full, package included.
# provenance: policy
spec:
  version: "1.0"
  schema: v92

resourceSummaries:
  addTextures:
    - name: Icon_Items
      textures:
        - name: Icon_Items.evo_va_sabertooth_fang_Tex
        - name: Icon_Items.evo_va_lumbertown_mission_writ_Tex
        - name: Icon_Items.evo_va_outriders_ferrule_Tex
        - name: Icon_Items.evo_va_centaur_shield_scrap_Tex
        - name: Icon_Items.evo_va_outriders_lining_Tex
        - name: Icon_Items.evo_va_warthog_rawhide_Tex
        - name: Icon_Items.evo_va_palisade_tanbark_Tex
        - name: Icon_Items.evo_recipe_outriders_ferrule_Tex
        - name: Icon_Items.evo_recipe_outriders_lining_Tex
