# Classic shop contents for the fixed merchants of this region: which tabs each
# menu opens and what each tab sells, as the classic data has them.
#
# A menu upsert REPLACES its tab list and a catalog upsert REPLACES its items, so a
# tab or an item the live server added and the classic data never had is removed by
# restating the row; there is no delete op and none is needed. A catalog the live
# menu referenced and the classic menu does not is left in the file, unreferenced.
#
# A store's title and its tab labels resolve through the NPC string table, so the
# labels this server has no row for are restored beside the stores that need them:
# without them a store opens blank and its tabs render unnamed.
#
# provenance: ported-from-v31

