# Classic territory state for hunting zone 63: spawns,
# parties, fences and territory attributes as the classic data places them.
# Territories and groups that exist only on the live server are deleted; a parent delete
# cascades to its spawns, so no child delete precedes it. Shared rows are restated in full
# where any classic attribute differs, and untouched where none does. The `_territory`,
# `_spawn` and `_party` bases hold the modal value of each field over this file's rows;
# a row states only its identity, its geometry and what departs from the base.
#
# Placements ported with voidSpawn true are parked: the rows, their territories and
# parties stay in the file and nothing spawns from them until a later patch restates
# them without the flag.
#
# provenance: ported-from-v31

