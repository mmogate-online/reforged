# Classic destination lists for the Velika city teleportals and the two Free Traders Hall
# teleportals. The hall entrance had been dropped from every city teleportal and the two
# in-hall teleportals had no destination list at all, so their NPCs stood and did nothing.
#
# Each list is restated whole rather than edited one destination at a time: a destination
# carries its entry cost as a child row, and only the list-level form writes that child.
#
# Velika is mounted on continent 1 in the classic data and on 7005 here; the destinations
# are remapped accordingly and are otherwise the classic rows.
#
# provenance: ported-from-v31

