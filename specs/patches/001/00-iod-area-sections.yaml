# and its nested 64007 re-enabled, and one section removed.
#
# TRAP: do NOT re-add classic sections 13017, 13020 and 13027. They are not missing;
# they survive under the renumbered ids 13032-13034, and re-adding them would lay
# duplicate fences over the camp-teleport cluster.
#
# Section 13035 (Ruined Temple) has no classic counterpart and carries cosmetic labels
# only, so it is deleted together with its subtree.
#
# Full re-adds and re-enables extend area-section-standard.ClassicSection and list only
# their deviations from it. The three realigns deliberately do NOT extend it: they are
# partial upserts that merge into a live section, and pulling in the archetype defaults
# would overwrite attributes those sections must keep. 13030 additionally restates its
# whole fence ring, because a fence list is replace-all rather than merged.
#
# provenance: ported-from-v31

