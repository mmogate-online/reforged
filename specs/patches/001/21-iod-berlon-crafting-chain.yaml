# ==============================================================================
# Spec: 21 - IoD Berlon Crafting-Intro Chain (padding Level 2, AUTHORED)
# ==============================================================================
# Six one-time linear quests (1353-1358) authored for Island of Dawn's early
# progression: Berlon (64,1011, Baraka scholar at the Tower Base) recruits the
# player into a garrison-self-sufficiency crafting loop, gather -> brew per
# material cycle (heal / mana / focus). AUTHORED contextual content per DOCTRINE
# rule 4 Level 2, NOT a restoration; each quest is logged in the divergence log
# as category "authored".
#
# Design source of record (all decisions pre-made and validated GO):
#   docs/plans/classic-restoration/iod/data/padding-level2-berlon-proposal.md
#   docs/plans/classic-restoration/iod/PADDING-BRIEF.md (approved design seed 1)
#   Doctrine: docs/plans/classic-restoration/DOCTRINE.md rule 4 (Level 2),
#     mechanical-adaptation whitelist entry 2 (new-class rows) does NOT apply here
#     (rewards are universal allpay bags, no class-scoped rows).
#
# Chain (giver = Berlon 64,1011 for every quest; pure NPC-accept, no autoAccept):
#   1353 First Gather (Verdra Fibers)   -> 1354 First Brew (Healing Potion I)
#   1355 Mana Gather (Sun Essence)      -> 1356 Mana Brew  (Mana Potion I)
#   1357 Scroll Gather (Krymetal Ore)   -> 1358 Scroll Craft (Crit Power Scroll)
#   Gate: 1353 requires early story quest 1301 (First Rays of Sunlight, the
#   universal IoD opener) + minLevel 3; each later quest requires the prior +
#   its level band (3/3/5/5/7/7). Levels pinned per the proposal's XP table.
#
# Gather objectives (CollectTask) verified against live IoD collection nodes
# (CollectionGiftTable primary drop, area 13_ATW_Death_P):
#   collection 1  Verdra Plant (Herb)   -> item 1001 Verdra Fibers
#   collection 301 Sun Essence (Energy) -> item 1003 Sun Essence
#   collection 101 Krymetal Ore (Mine)  -> item 1002 Krymetal Ore
# SEQUENCING (revised after live test, 2026-07-21): the craft step must not force
# a re-gather. So each GATHER quest turn-in has Berlon RETURN the gathered material
# plus the kit AND grant the recipe DESIGN, so the CRAFT quest is pure crafting (the
# player already holds one full batch of inputs + the recipe). The craft quest
# REQUIRES the full batch (clear objective), and Berlon RETURNS part of it as the
# reward (keep-2 handled in the reward, not the objective text):
#   1353 gather 10 fibers  -> reward: Recipe 91213 + 10 Verdra Fibers + 2 kits
#   1354 craft: brew + deliver 5 Healing Potion I (recipe 91213); reward returns 2
#   1355 gather 8 essence  -> reward: Recipe 91221 + 8 Sun Essence + 2 kits
#   1356 craft: brew + deliver 5 Mana Potion I (recipe 91221); reward returns 2
#   1357 gather 20 ore     -> reward: Recipe 91282 + 20 Krymetal Ore + 1 Scroll Kit
#   1358 craft: brew + deliver 2 Crit Power Scroll (recipe 91282); reward returns 1
# Berlon's completion line says to keep the returned portion (minimal, in character).
# The recipe designs (91213/91221/91282) are restored to their v31 identity by
# spec 22 (they are deprecated "Worn Recipe" junk on v92); the player USES the
# design to learn the recipe before crafting. The crafted products (6000/6016/6197)
# are made usable by spec 22 as well. Craft objectives use DeliverItemTask (there is
# no "craft item" task type); with inputs pre-supplied, "just crafting" is achieved
# by pre-loading the batch, not by the task type.
#
# CRAFTING HINT (out of lore, per user): the mechanical "open My Character then
# Craft" hint lives in the craft step's JOURNAL objective line (저널Text), separate
# from Berlon's dialog. No keybind token exists in the engine (keys are hardcoded,
# cf. quest 1382 "Press [F]"), so the keybind-safe menu path is used, not a key.
#
# Rewards (QuestCompensationData_13, allpay bags; XP/gold from the proposal's
# anti-punishment calibration = combat base + 10x per-kill XP, gold = 10% XP;
# XP/gold unchanged from the first cut, only the item bags changed):
#   1353 2300/230 + Recipe 91213 + Verdra Fibers 1001 x10 + kit 1616 x2
#   1354 2300/230 + Apprentice Alchemical Kit 1616 x5 ("pack")
#   1355 3100/310 + Recipe 91221 + Sun Essence 1003 x8 + kit 1616 x2
#   1356 3100/310 + Apprentice Alchemical Kit 1616 x5 ("pack")
#   1357 4000/400 + Recipe 91282 + Krymetal Ore 1002 x20 + Scroll Kit 1611 x1
#   1358 4000/400 + Apprentice Scroll Kit 1611 x5 ("pack")
# ("pack" size 5, a bonus for the craft step; the exact craft inputs come from the
# preceding gather quest, so no re-gather.) LIVE-CHECK: confirm the restored recipe
# design actually unlocks crafting on the v92 server (vs base recipes being
# auto-available with Alchemy proficiency); giving the design is safe either way.
#
# QUEST-LINK MARKUP CORRECTION (data-verified 2026-07-21): the token is
#   {@LinkCreature:hz#tmpl#Name}, NOT {@LinkNpc} (0 occurrences of {@LinkNpc} in
#   any QuestDialog/StrSheet_Quest; {@LinkCreature} is the universal NPC+mob token,
#   e.g. the live NPC link {@LinkCreature:64#1029#Kiriya}, and it renders in
#   StrSheet_Quest journal strings too, 860 uses). Tokens used here:
#     {@LinkCreature:64#1011#Berlon}  turn-in locator in each journalText2
#     {@LinkCreature:64#1030#Annukha}  scroll-cycle field-test foil (1357/1358)
#   Both templates are spawned in TerritoryData_64 (Berlon 6400015, Annukha next
#   to him), so gen_npcloc.py --prune emits an NpcLoc entry for each and both
#   tokens resolve. Gather targets are collections (no creature token; named in
#   plain text per the proposal). No dead links.
#
# STORY-GROUP REGISTRATION DELIBERATELY OMITTED. QuestGroupList.xml is server-only
#   (no client sync entity), so a new StoryGroup id would be invisible to the
#   client, and the only existing IoD groups (1 "World of TERA", 2 "Into the
#   Tainted Gorge") are the story spine, semantically wrong for a crafting side
#   arc. Every existing IoD side quest (1334, 1348, 1321, ...) is ungrouped and
#   functions as a yellow quest; this chain follows that precedent. questHuntingZones
#   also needs no op (HZ 13 row already present). If a grouped journal arc is later
#   wanted, revisit with a client-side group definition. (User-flagged decision.)
#
# Client sync: quests + questStrings (StrSheet_Quest, shard-routed) + questDialogs
#   (QuestDialog, IdSorted) all sync via migrate. QuestCompensationData is
#   server-only. NpcLoc regen (gen_npcloc.py --prune) is the post-apply client leg.
#
# DeliverItemTask item element: the craft turn-in gates on holding the crafted items
#   via the task's item requirement, which the DSL now writes to the correct <아이템지정>
#   element natively (datasheetlang 30220450, adopted 2026-07-21). An earlier build
#   emitted <전달아이템지정> (wrong for 아이템전달Task), which let the turn-in complete
#   on talking to Berlon (premature completion caught in live test); the interim
#   fixup for that is RETIRED and deleted. Filed+DELIVERED:
#   docs/dsl-requests/2026-07-21-deliveritemtask-wrong-item-element.md.
#
# Task Header <JournalScript>: authored natively via the task `journalScript` field
#   (journalScript: 2 = the briefing dialog id, the stock 1334 convention). The
#   CLIENT Quest XSD requires this element (Quest_Tasks_Task_Header sequence), so a
#   DSL-created quest without it fails `dsl sync -e Quest` with E650. The DSL added
#   the field (datasheetlang cd080461, adopted 2026-07-21), retiring the former
#   companion fixup (fix_berlon_journalscript.py, deleted). Filed+DELIVERED:
#   docs/dsl-requests/2026-07-21-quest-journalscript-field.md.
#
# CLIENT SYNC NOTE: new low-id quests (1353-1358) insert into the client IdSorted
#   Quest/QuestDialog layout, so a full sync renumbers every higher-id shard (~4900
#   client files). Content-safe (verified: client quest set == server, 0 dropped,
#   0 dupes) but a large client-dc diff. The manifest-narrowed sync in migrate
#   cannot place new IdSorted shards (E680), so sync these entities with a full
#   `dsl sync -e Quest -e QuestDialog -e StrSheet_Quest` after the batch apply.
#
# Idempotent: upsert only (quests/questStrings/questDialogs/questCompensations).
#   Applied via migrate --patch 001 batch replay ONLY. Validated with dsl validate.
# ==============================================================================

spec:
  version: "1.0"
  schema: v92

