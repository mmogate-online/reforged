# ---- 3. Quest dialogs (6) ------------------------------------------------------
# Per quest: Text 1 (system placeholder), Text 100 (summary, empty page, ref
# summaryInfo=100), Text 2 (briefing, ref questDialogue=2, social 4), Text 3
# (completion, ref completionDialogue=3), Text 4 (incomplete/retry, ref
# incompleteDialogue=4). Speaker = Berlon (villagerId 1011, npcZoneId 64) except
# the system Text 1. <BR><BR> splits; briefings end by naming the next stop.
questDialogs:
  upsert:
    # 1353 (huntingZone 13, dialog id 53) ----------------------------------
    - huntingZoneId: 13
      id: 53
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          prevId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 100
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 0
        - id: 2
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 4
              content: "Our garrison bleeds through field supplies faster than the federation can ship them, <PCCLASS:lcase>. If this island is to keep us, we must first learn to let it.<BR><BR>Begin with the Verdra Plants that grow around the Tower Base. Bring me ten measures of their fiber, and Oriyn willing, we will draw our own healing from this soil."
        - id: 3
          npcZoneId: 64
          prevId: 2
          villagerId: 1011
          pages:
            - social: 4
              content: "Good, and more than clean. Keep the fibers, recruit: as thread they feed no one, but as Healing Potions they are worth their weight. Take this recipe with them, and we begin."
        - id: 4
          npcZoneId: 64
          villagerId: 1011
          pages:
            - social: 0
              content: "The Verdra Plants will not empty themselves, recruit. Ten measures of fiber, no fewer."
    # 1354 (dialog id 54) --------------------------------------------------
    - huntingZoneId: 13
      id: 54
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          prevId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 100
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 0
        - id: 2
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 4
              content: "You have the fiber, the kit, and the recipe now, <PCNAME>. Brew five Healing Potions and bring the batch to me for the garrison stores."
        - id: 3
          npcZoneId: 64
          prevId: 2
          villagerId: 1011
          pages:
            - social: 4
              content: "Five, and well brewed. Keep two for your own belt, recruit; the rest strengthen the garrison."
        - id: 4
          npcZoneId: 64
          villagerId: 1011
          pages:
            - social: 0
              content: "Five Healing Potions, recruit. The station is patient; I am rather less so."
    # 1355 (dialog id 55) --------------------------------------------------
    - huntingZoneId: 13
      id: 55
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          prevId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 100
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 0
        - id: 2
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 4
              content: "Healing keeps a soldier standing, <PCCLASS:lcase>, but mana keeps them fighting. The island offers that too, if we stoop to gather it.<BR><BR>Sun Essence settles where the light pools near the Tower Base. Bring me eight measures, and we will teach this ground to refill a caster's reserves."
        - id: 3
          npcZoneId: 64
          prevId: 2
          villagerId: 1011
          pages:
            - social: 4
              content: "Light, caught and kept. Take it back, recruit, and the recipe with it. Mana Potions will not brew themselves, but you have the makings now."
        - id: 4
          npcZoneId: 64
          villagerId: 1011
          pages:
            - social: 0
              content: "The Sun Essence waits on no one, recruit. Eight measures, gathered whole."
    # 1356 (dialog id 56) --------------------------------------------------
    - huntingZoneId: 13
      id: 56
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          prevId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 100
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 0
        - id: 2
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 4
              content: "The essence is caught and yours again, <PCNAME>. Bind it into five Mana Potions with the kit and the recipe, and bring the batch to me."
        - id: 3
          npcZoneId: 64
          prevId: 2
          villagerId: 1011
          pages:
            - social: 4
              content: "Five, and elegantly done. Keep two for yourself, recruit; the rest go to the casters."
        - id: 4
          npcZoneId: 64
          villagerId: 1011
          pages:
            - social: 0
              content: "Five Mana Potions, recruit, or the casters go thirsty. Back to the station."
    # 1357 (dialog id 57) --------------------------------------------------
    - huntingZoneId: 13
      id: 57
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          prevId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 100
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 0
        - id: 2
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 4
              content: "Potions keep a body whole, <PCCLASS:lcase>, but a war is won by focus. {@LinkCreature:64#1030#Annukha} has been pacing this post for days, itching to test her edge in the gorge.<BR><BR>Bring me twenty Krymetal Ore from the seams near the Tower Base, and we will grind it into something worth her while."
        - id: 3
          npcZoneId: 64
          prevId: 2
          villagerId: 1011
          pages:
            - social: 4
              content: "Twenty, and clean. Keep the ore, recruit, and take the scribing method with it: {@LinkCreature:64#1030#Annukha} will have her scrolls soon enough."
        - id: 4
          npcZoneId: 64
          villagerId: 1011
          pages:
            - social: 0
              content: "Twenty Krymetal Ore, recruit. The seams run deep; keep at them."
    # 1358 (dialog id 58) --------------------------------------------------
    - huntingZoneId: 13
      id: 58
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          prevId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 100
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 0
        - id: 2
          npcZoneId: 64
          prevId: 0
          villagerId: 1011
          pages:
            - social: 4
              content: "The last art, <PCNAME>. With the Scroll Kit and the recipe, grind the ore and scribe two Crit Power Scrolls. Bring them to me when the ink is dry."
        - id: 3
          npcZoneId: 64
          prevId: 2
          villagerId: 1011
          pages:
            - social: 4
              content: "Self-healing, self-supplied, self-sharpened. Keep one scroll to test your own edge in the gorge, recruit; the other goes to {@LinkCreature:64#1030#Annukha}. The federation may yet make a home of this island, and you helped lay the first stone. For the federation."
        - id: 4
          npcZoneId: 64
          villagerId: 1011
          pages:
            - social: 0
              content: "Two scrolls, recruit, no fewer. {@LinkCreature:64#1030#Annukha} grows no more patient."

