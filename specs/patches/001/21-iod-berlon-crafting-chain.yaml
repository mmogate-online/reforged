# ---- 2. Quest strings: 6 per quest (title, start, end, button, journal x2) ----
# Button text carries literal quotes, per the IoD convention.
questStrings:
  upsert:
    # 1353 -----------------------------------------------------------------
    - id: 1353001
      string: "A Fiber of Their Being"
    - id: 1353002
      string: "The island grows what the federation cannot ship. Gather Verdra Fibers from the plants near the Tower Base."
    - id: 1353003
      string: "Raw fiber, but the making of a cure lies folded within it."
    - id: 1353004
      string: '"For the federation!"'
    - id: 1353005
      string: "Gather 10 Verdra Fibers from the Verdra Plants near the Tower Base."
    - id: 1353006
      string: "Bring the fibers to {@LinkCreature:64#1011#Berlon} at the Tower Base."
    # 1354 -----------------------------------------------------------------
    - id: 1354001
      string: "An Ounce of Prevention"
    - id: 1354002
      string: "You have the recipe now. Brew five Healing Potions and bring them to me."
    - id: 1354003
      string: "Drawn from island soil, and welcome. The garrison stands a little longer for them."
    - id: 1354004
      string: '"For the federation!"'
    - id: 1354005
      string: "Craft Healing Potion I: open My Character, then Craft."
    - id: 1354006
      string: "Deliver 5 Healing Potion I to {@LinkCreature:64#1011#Berlon} at the Tower Base."
    # 1355 -----------------------------------------------------------------
    - id: 1355001
      string: "Essence of the Matter"
    - id: 1355002
      string: "A blade needs mana as much as blood. Gather Sun Essence where the light pools near the Tower Base."
    - id: 1355003
      string: "Captured light. Crude, but it will answer when we call it."
    - id: 1355004
      string: '"For the federation!"'
    - id: 1355005
      string: "Gather 8 Sun Essence from the Energy nodes near the Tower Base."
    - id: 1355006
      string: "Bring the essence to {@LinkCreature:64#1011#Berlon} at the Tower Base."
    # 1356 -----------------------------------------------------------------
    - id: 1356001
      string: "Mana from Heaven"
    - id: 1356002
      string: "You have the recipe. Refine the Sun Essence into five Mana Potions and bring them to me."
    - id: 1356003
      string: "Borrowed daylight, bottled. Our casters need never run dry on this island."
    - id: 1356004
      string: '"For the federation!"'
    - id: 1356005
      string: "Craft Mana Potion I: open My Character, then Craft."
    - id: 1356006
      string: "Deliver 5 Mana Potion I to {@LinkCreature:64#1011#Berlon} at the Tower Base."
    # 1357 -----------------------------------------------------------------
    - id: 1357001
      string: "The Ore the Merrier"
    - id: 1357002
      string: "Focus favors the sharp of mind. Mine Krymetal Ore from the seams near the Tower Base."
    - id: 1357003
      string: "Good ore, and enough of it. Annukha will be pleased to see it put to use."
    - id: 1357004
      string: '"For the federation!"'
    - id: 1357005
      string: "Mine 20 Krymetal Ore from the seams near the Tower Base."
    - id: 1357006
      string: "Bring the ore to {@LinkCreature:64#1011#Berlon} at the Tower Base."
    # 1358 -----------------------------------------------------------------
    - id: 1358001
      string: "Scroll With It"
    - id: 1358002
      string: "You have the recipe. Scribe the ore into two Crit Power Scrolls and bring them to me."
    - id: 1358003
      string: "Island-made, and sharp. The island arms its own now."
    - id: 1358004
      string: '"For the federation!"'
    - id: 1358005
