# Berlon's crafting-intro chain on the Island of Dawn: six one-time quests
# (1353-1358) from Berlon (64,1011), alternating gather and craft.
#
# There is no "craft item" task type, so each craft step is a DeliverItemTask on
# the finished product. To keep that from forcing a re-gather, the preceding
# gather quest RETURNS the gathered materials plus the recipe design as its
# reward, so the player enters the craft step already holding one full batch.
# Spec 22 restores those recipe designs and the crafted consumables to usable
# strings; without it the chain cannot be finished.
#
# NPC links use {@LinkCreature:hz#tmpl#Name}. {@LinkNpc} does not exist;
# {@LinkCreature} is the universal NPC and mob token.
#
# Every task sets journalScript because the client Quest XSD requires
# <JournalScript> in the task header; without it `dsl sync -e Quest` fails E650.
#
# No StoryGroup registration: QuestGroupList is server-only with no client sync
# entity, so a new group id would be invisible to the client, and IoD side
# quests are ungrouped by convention.
#
# These are new low ids in the client's IdSorted Quest/QuestDialog layout, which
# a manifest-narrowed sync cannot place (E680); sync those entities broadly.

spec:
  version: "1.0"
  schema: v92

# ---- 1. Quest bodies (6) ------------------------------------------------------
quests:
  upsert:
    # -- 1353 First Gather: gather Verdra Fibers 1001 x10 --------------------
    - id: 1353
      header:
        questNumber: 1353
        questTitle: "@quest:1353001"
        questType: General
        repeatType: OneTime
        cancellable: Allowed
        startTaskId: 1
        linkedQuest: 1354
        giverNpc: "64,1011"
        recommendedPartySize: 1
        recommendedLevel: 3
        summaryInfo: 100
        questDialogue: 2
        startPopup: "@quest:1353002"
        endPopup: "@quest:1353003"
      requirements:
        minLevel: 3
        prerequisites: [1301]
      tasks:
        - taskId: 1
          type: CollectTask
          nextTaskId: 0
          hasReward: true
          journalScript: 2
          journalText: "@quest:1353005"
          journalText2: "@quest:1353006"
          body:
            itemId: 1
            deliveryItems:
