# IoD Quest Rewards - Patch 001 (v31-primary restoration)
# Restores the Island of Dawn band (quest ids 1300-1399, hz 13) quest rewards.
#
# Provenance:
#   Doctrine: docs/plans/classic-restoration/DOCTRINE.md (v31-primary; v31 ported 1:1).
#   Source:   v31 server CompensationData/QuestCompensationData_13.xml
#             (Z:\tera pserver\v31.04\...\Datasheet). v92's band comp rows are all
#             empty self-closed stubs, so the whole band reward sheet is restored from v31.
#   Diff:     docs/plans/classic-restoration/iod/data/quests-diff.md/.json (Rewards: PORT ALL 65).
#   Rulings:  iod/TRACKER.md quests-diff rulings 4 (new-class rows) and 5 (class-gate deferred).
#   Generator: tools/dc-restore/gen_v31_reward_specs.py (re-run to regenerate).
#
# Scope: exactly the 65 band quest files present in both v31 and v92. v31 comp rows
#   outside that set are not ported here.
#
# New-class adaptation rows appended to the 15 class-scoped quests
#   (1303 1304 1305 1310 1315 1316 1317 1319 1322 1323 1325 1326 1330 1331 1347),
#   INTERNAL names fighter/assassin/glaiver (server QuestCompensationData namespace;
#   never client CCompensation names). engineer already has v31 rows; soulless omitted.
#   - Armor: same templateId as the classic piece (v92 requiredClass lists the new
#     wearer: mail->FIGHTER, leather->GLAIVER, robe->ASSASSIN).
#   - Weapon: own class weapon at requiredLevel nearest the classic tier (ties->lower).
#
# Doctrine rule 1 fix: v31 quest 1310's armor block is corrupted (engineer row is a
#   stray '15019' text token); restored to the 15019 block engineer row (per quest 1305).
#
# Class-list encoding: v31 emits one <Item> per class, and the DSL keys comp Item
#   rows by templateId+class+race (fix d79aca90, adopted 2026-07-21), so per-class
#   duplicate-templateId rows survive apply. This spec mirrors the v31 source rows
#   verbatim: one row per (templateId, class). Shared-by-type armor (e.g. 17703 ->
#   lancer + berserker + engineer) is three rows, and each new-class append is its
#   own row. Semicolon-joined class lists are no longer emitted (the previous
#   workaround for the old collapse defect is removed; the writer now rejects them
#   with E207).
#
# QuestCompensationData is server-only (no client sync).

