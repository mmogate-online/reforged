# Island of Dawn world map (world 1 / guard 2): re-enable the Tower Base town section
# and revert the field section's mapId to the classic WMap_ATW_Field_01.
#
# newWorldMap upsert ALWAYS clears a section's npc list and recreates whatever is
# supplied, and always rewrites the world and guard desc. The current marker roster and
# the Korean dev desc labels are therefore restated verbatim, so that a mapId-only
# change does not silently wipe them.
#
# The duplicate hidden field section is deliberately NOT removed here: newWorldMap
# exposes only a world-level delete, with no section-level delete on the spec surface.
# That section is already visibleInMap="false", so leaving it in place is inert.
#
# provenance: ported-from-v31

spec:
  version: "1.0"
  schema: v92

newWorldMap:
