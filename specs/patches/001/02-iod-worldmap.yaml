# IoD World Map - Patch 001 (classic restoration, v31-primary)
#
# Doctrine: docs/plans/classic-restoration/DOCTRINE.md (v31 wins on divergence).
# Source of truth: v31 server WorldMap/NewWorldMapData.xml (World 1 / Guard 2).
# Diff artifact: docs/plans/classic-restoration/iod/data/worldmap-diff.md / .json
# Tracker ruling 3 (TRACKER.md "Diff artifacts" section, 2026-07-20):
#   - Re-enable sec6 Tower Base town (asset-safe, MapDefine ships in client).
#   - Revert sec7 (13001 field) mapId from WMap_ATW_Death_Field to WMap_ATW_Field_01.
#   - Remove sec9 (13001 duplicate hidden field).
#
# This spec carries TWO of the three ruled ops. The sec9 removal is NOT expressible
# in DSL: newWorldMap exposes only a world-level delete (DeleteNewWorldMapOperation
# -> DeleteWorldEntryCommand); there is no section-level delete on the spec surface
# (the section-delete command exists in the runtime but is unreachable). Logged in
# docs/dsl-requests/2026-07-20-newworldmap-section-delete.md and flagged to the
# orchestrator. sec9 is already visibleInMap="false" (hidden), so leaving it in
# place is cosmetically inert pending the DSL capability.
#
# sec7 note: the DSL always clears a section's npc list on upsert, then recreates
# whatever is supplied. The v31 op is mapId-only, and the v92 sec7 markers point at
# the KEPT camp cluster (13032-34, ruling 1), so the exact live v92 marker roster is
# re-supplied verbatim to preserve it while the mapId reverts. NOT included: the old
# 9034/9053 sync-compat ops (Phase 5 conditional salvage only, added if client sync
# fails E650).
#
# World/guard desc values are the exact v92/v31 (identical) Korean dev labels; they
# are re-supplied because upsert always rewrites world/guard desc, and must not be
# clobbered.

