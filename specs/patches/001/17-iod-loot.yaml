# Island of Dawn (zone 13) — difficulty-weighted loot table
#
# Difficulty scoring: sqrt(maxHp * atk) per mob, scaled to base_prob=0.4 at mean.
# Environmental mobs (creature playStyle, HP<50): floored at 0.01.
# Probability range: [0.01, 0.8].
# Drop qty also scales by ceil(base_qty * sqrt(score_ratio)) — bosses drop more per trigger.
#
# To adjust rates edit the constants in generate_iod_loot.py and re-run.
# Idempotency: upsert — safe to re-apply against any baseline.

