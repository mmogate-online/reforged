# IoD Shops - Patch 001 (classic-restoration, v31-primary doctrine)
# Restores Island of Dawn merchant shop state to the v31 baseline.
#
# Provenance:
#   Doctrine : docs/plans/classic-restoration/DOCTRINE.md (v31 wins on divergence).
#   Source of truth : v31 server datasheet, read via the datasheet-v31 MCP
#              audit_shop_inventory (BuyMenuList 100 / 16064 / 16090 / 250) on 2026-07-20.
#   Diff artifact : docs/plans/classic-restoration/iod/data/shops-diff.md + shops-diff.json.
#   Rulings : TRACKER.md "Diff artifacts" shops entry (rulings 1-5) AND the USER DECISION
#              2026-07-20 that supersedes the shared-store deferrals (see side-effects block).
#
# Adjudicated merchant scope (USER DECISION 2026-07-20 supersedes the earlier option-(a)
# deferral - shared stores now PORT to v31 game-wide, side effects accepted + documented):
#   Viator  64,1004  Merchant 100   -> tabs 1001/1002 restored (blast radius 1: 60,1002)
#   Rutgar  64,1005  Merchant 16064 -> exclusive tab 16064 restored (add 98032) + shared tabs 1601/1602 restored
#   Sandom  213,1054 Merchant 16090 -> shares tabs 1601/1602 (restored below); exclusive tab 16090 = v31 MATCH (no op)
#   Ashley  313,1002 Merchant 250   -> binding restored + store 250 content (tabs 2501/2502/2505) restored to v31
#   Ainah   364,1001 Merchant 250   -> shares store 250 (content restored below); binding already v92-correct
#
# Still NOT touched (ruled OMIT / KEEP; out of this spec):
#   store 315 (OMIT, seasonal, 33/37 ids absent; Tikat 64,9000 spawn removed by spec 12),
#   store 1008 + Ellonia binding (KEEP v92 medal binding), zone-13 hub merchant layer (KEEP-INERT).
#
# --- Shared-store side effects (USER DECISION 2026-07-20: accepted and documented) ------
# The earlier option-(a) deferral of shared BuyLists 1601/1602 and store 250 content is
# SUPERSEDED. Shared stores are ported to v31 game-wide; buyLists upsert is replace-all, so
# every menu referencing a ported list gets the v31 content. Blast radii and item-level
# side effects (measured against v92 BuyMenuList.xml / shops-diff.json):
#
#   BuyList 1601 - shared by 31 store menus (30 non-IoD). Reverts to the v31 classic set.
#     non-IoD merchants LOSE (v92-only, dropped): 139093, 206046, 206049, 206600, 206610, 206620
#     non-IoD merchants GAIN (v31): 91, 92, 93, 98, 99, 94203, 94204, 94205, 94206 (200001 unchanged)
#     v31 ids SKIPPED (absent from v92 ItemTemplate): 213307, 219000
#   BuyList 1602 - shared by 34 store menus (33 non-IoD). Reverts to the v31 classic set.
#     non-IoD merchants LOSE: 6550, 6551, 6552, 6560, 6561, 6562, 200997, 200998, 200999
#     non-IoD merchants GAIN: 125, 126, 127, 128, 7154, 7155, 6283, 6284, 6285, 6286, 6287, 6288, 6289, 6290, 6291, 6292
#     v31 ids skipped: none (all 16 valid in v92)
#   Store 250 tabs 2501/2502/2505 - shared by 35 non-IoD merchants. Reverts to v31.
#     tab 2501 LOSE: 1189, 6550, 6551, 6552, 6560, 6561, 6562, 21355, 200997, 200998, 200999, 202015
#              GAIN: 171, 172, 173, 174, 175, 176, 177 (194 unchanged)
#     tab 2502 (classic charm tab, EMPTY in v92) GAIN: 94206 + 178-193 + 70019-70034 (33 items); LOSE none
#     tab 2505 LOSE (27 v92-only teleport scrolls): 71472, 72025, 80001, 80004, 83299, 83300, 83301,
#              83302, 83304, 83305, 83307, 83400, 83401, 83402, 83403, 83404, 83405, 83406, 83407,
#              83408, 83409, 83410, 83411, 83412, 83415, 84317, 96079
#              GAIN: 72026 (net: tab reverts from 47 items to the v31 21-scroll set)
#     v31 ids skipped: none (all 62 store-250 items valid in v92)
# ----------------------------------------------------------------------------------------

