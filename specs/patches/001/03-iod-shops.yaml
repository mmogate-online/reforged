# Island of Dawn merchant shops restored to their classic (v31) catalogues:
# Viator's crystal tabs, Rutgar's exclusive general-goods tab, Ashley's missing
# Merchant binding, and the shared lists Rutgar, Sandom, Ashley and Ainah draw on.
#
# buyLists upsert is REPLACE-ALL, and a BuyList belongs to every menu that
# references it, so the shared lists cannot be restored for this island alone:
# list 1601 is referenced by 31 menus, 1602 by 34, and store 250's tabs
# 2501/2502/2505 by 35 merchants outside the island. Restoring them hands the
# classic set to all of those merchants too. That blast radius is accepted
# deliberately, and it is why the rows below are the FULL classic catalogue for
# each list rather than an island-only delta.
#
# Classic ids with no v92 ItemTemplate row are omitted rather than stubbed: list
# 1601 drops 213307 and 219000 for that reason, and nothing else is missing.
#
# Store 315 (the seasonal T-cat exchanger) is not restored, because most of its
# catalogue no longer exists; its spawn is removed by spec 12. Menu 210 (Mahadam)
# already matches the classic data, so it carries no op.
#
# provenance: ported-from-v31

spec:
  version: "1.0"
  schema: v92

