# Island of Dawn quest-giver spawns: six hunting-zone 213 villagers that have an
# NpcData_213 template but no TerritoryData spawn at all, placed as single fixed
# points at their classic quest-marker positions.
#
# EN client and KR server names differ for most island villagers (EN Kamarnu = KR
# Rabram, Jehan = Beres, Lorin = Mayer, Ayrdoss = Eredos, Clovis = Muriel). That is a
# localization split, not a rename, so identity is matched on (huntingZoneId,
# templateId) and never on the name.
#
# Neither shared archetype fits. spawn-restore-standard is mob-tuned (randomPos,
# aggressive and return defaults, mob view and respawn values), and the npc-standard
# archetypes must not be extended by a restoration spawn, because the field overlap is
# only partial and the unmatched defaults get injected into the row. The envelopes are
# therefore spec-local definitions, mirrored field for field from the villager group
# already living in this same file, with identity, position and fences per row.
#
# Headings are not carried by the marker source and these templates were never spawned
# in the classic data, so no authored dir exists: every row uses 0 and is tuned in game.
#
# Ids are taken from free ranges adjacent to the existing villager block: group
# 1300006, territories 1300468..1300473, npc instances 1305901..1305906.
#
# provenance: padding-level-1

spec:
  version: "1.0"
  schema: v92

definitions:
  # Villager quest-giver spawn envelope. Every field is the modal villager value
  # read directly from group 1300005 NPCs in this same file. Per-row keys
  # (npcInstanceId, npcTemplateId, desc, pos) are supplied at each upsert.
  _questGiverSpawn:
    memberId: 0
    ai: 100
    randomPos: false
    spawnCount: 1
    offsetZ: 0
    dir: 0                       # provisional; heading unrecoverable, tune in-game
    respawnTime: 10000
    respawnRandomTime: "20000"
    delaySpawnTimeWhenWorldStart: 0
    isAggressiveMonster: false
    isReturn: false
    isReturnMyTerritory: false
    conditionalSpawn: false
    returnDistance: 0
    moveInTerritory: false
    questPatrol: false
    peaceStateNoMoving: false
    cautionStateNoMoving: false
    voidSpawn: false
    viewRadius: 300
    viewAngle: 130
    alertRadius: 400
    alertAngle: 360
    aggroShareGroupId: 0
    aggroSendToPartyDistance: 400
    aggroSendToClanDistance: 300
    aggroSendToTerritory: ""
    aggroIgnorePartyId: ""
    aggroReceiveOnlyInSight: false
    excludeAggroLimit: false
    escapeLocation: [0, 0, 0]
    popupMsg: ""
    msgProb: 0
    msgInterval: 0
    msgBroadcastingChannel: false
    randomGroupId: 0

  # Small fixed-point quest-giver territory envelope. Fences and desc are per-row.
  _questGiverTerritory:
    type: normal
    addMaxZ: 256.000000
    subtractMinZ: 0.000000
    eventId: 0
    randomPosMinDist: 100.000000
    peaceMoveNpcCheckDist: 100.000000
    attribute:
      abnormality: 0
      achieveConditionId: 0

territoryGroups:
  upsert:
    - huntingZoneId: 213
      groupId: 1300006
      desc: "Dawn Garden Restored Quest Givers"

