# IoD ECompensation Drops - Patch 001 (v31-primary restoration)
# Restores the v31 open-world mob-drop path for the First Expedition armor set
# in Island of Dawn hunting zone 13.
#
# Provenance:
#   Approval: user-approved 2026-07-21 (IoD padding session, final spec).
#   Source:   v31 server CompensationData/ECompensation_13.xml, Compensation
#             npcTemplateId=300945 "타락한 테론 대장" (Corrupted Theron Chief),
#             lines 150-193 (Z:\tera pserver\v31.04\...\Datasheet).
#   Artifact: docs/plans/classic-restoration/iod/data/padding-first-expedition.md
#             (v31 ECompensation_13 section; option 3 "faithful-restoration extra").
#   Purpose:  restores the classic non-quest drop acquisition path for the First
#             Expedition set. In v31, NPC 300945 drops the 9 First Expedition armor
#             pieces (body 15022/15019/15025, hand 15023/15020/15026,
#             feet 15024/15021/15027) at 1/3 each per slot bag, plus the matching
#             First Expedition weapon set and the mob's normal gold/materials/ring/orb.
#
# v92 state: the entire v31 natural-mob table in ECompensation_13.xml is commented
#   out (lines 3-450); only new fierce-variant stubs (7001-7009) and the Sinus Thief
#   (9001) are active. NPC 300945 has NO active entry, and even the commented copy was
#   already stripped of the weapon bag (id=5) and the three armor bags (id=6/7/8).
#   This upsert re-creates NPC 300945 as an active entry matching v31 1:1.
#
# Class-scoping: ECompensation ItemBags are NOT class-scoped (no per-class rows, no
#   itemBag=class). Each armor bag drops all three armor-class variants at 1/3, and the
#   engine hands the wearable piece to any looter. No new-class (fighter/assassin/
#   glaiver) append is required, and no soulless omission applies. This differs from the
#   class-scoped QuestCompensationData rows, which do need the new-class whitelist rows.
#
# Fidelity: bag ids, bagNames, probabilities, wValues, and the derived `t` cache strings
#   are copied verbatim from v31. Item `name` labels keep the v31 Korean internal names
#   (functionally inert; templateId is the key). eCompensations is server-only (no client
#   sync). No divergence from v31.

