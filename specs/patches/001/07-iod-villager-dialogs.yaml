# ==============================================================================
# Spec: 07 - IoD Villager Dialogs (speechConditions)
# ==============================================================================
# Carried over under the v31-primary classic-restoration doctrine
# (docs/plans/classic-restoration/DOCTRINE.md) per the salvage-manifest CARRY-OVER
# verdict for retired spec 11-iod-villager-dialogs
# (docs/plans/classic-restoration/iod/data/salvage-manifest.md).
#
# Renumbered 11 -> 07. Op content is carried over verbatim, EXCEPT the op roster was
# re-derived against the v31 spawn set as the manifest requires: the current v92
# baseline TerritoryData is verified IDENTICAL to v31 (spawns-diff artifact), so each
# op is kept only if its (huntingZone, templateId) has a standing spawn in the baseline
# TerritoryData_13/64/213/313/364/436.xml (policy-territory Npcs included). Ops for
# villagers with a v31 SpeechCondition but no spawn in scope (dormant/cut content) are
# dropped. One documented exception is kept: 213/1036 (Leander shrine variant) is
# engine-spawned and confirmed present per the spawns-diff artifact, so its dialog is
# retained though it is correctly absent from TerritoryData.
#
# Original provenance (retired v17-reference spec):
#   Roster/scope: docs/plans/iod-alpha-content-loop/data/v31-dialogs.json
#     ("present" arrays = every IoD villager that carried a v31 SpeechCondition).
#   Param attributes (type + value) read straight from the original v31 .condition
#     source files. Generator: tools/dc-restore/gen_speech_specs.py (deterministic).
#
# Each upsert restores one villager's classic .condition file
# (VillagerData/{HHHH}0000{TTTTTT}.condition): its Villager note plus the
# ordered Normal Text slots with their Param type and value. Popup is empty
# throughout (no gap villager carries a Popup slot). Upsert keeps it idempotent.
#
# Encoded decisions:
#   * Zone 364 (villagers): the v31 files nest a malformed <Text type="random"/>
#     instead of <Param type="random"/>. Read by position, they restore as
#     paramType: random, matching every other single-slot IoD villager.
#   * friendly slots carry their reputation thresholds from the v31 source:
#     64/1001 #2=200 #3=800. (64/1002 carried #2=100 in v31 but is dropped here:
#     no standing baseline spawn.)
#   * 64/9000 (T-cat/Tikat): EXCLUDED per user decision 2026-07-20. The NPC is out of
#     the baseline entirely: spec 12-iod-tcat-removal deletes his TerritoryData_64
#     spawn, so the standing-spawn roster rule drops his dialog op with him. (His v31
#     store 315 was already ruled unrecoverable: 33 of 37 items absent from v92.)
#   * Excluded (no standing baseline spawn): 64/8000 Ellonia (verified 0 spawns).
#     Other settled removals (213/1054,1150,1152,1153,1501) were never in the
#     survey's dialog set.
# ==============================================================================

