# ==============================================================================
# Spec: 14 - IoD Quest Enables (padding Level 1, Wave A)
# ==============================================================================
# Enables 25 sentinel-disabled IoD quests (1300-1399 band) by replacing the
# never-satisfiable prerequisite 99,99 (id 9999) with the real anchor, or by
# clearing the prerequisite entirely for quests that are v17-line roots.
# Quest bodies stay v31-faithful; rewards were already ported by patch 001
# spec 04. Plus one doctrine rule 1 internal-consistency dialog fix (1322).
#
# Doctrine: docs/plans/classic-restoration/DOCTRINE.md, rule 4 (Level 1 padding:
#   re-enable gate-clean disabled quests on their recovered v17 wiring).
# Source artifacts (adjudicated 2026-07-20):
#   docs/plans/classic-restoration/iod/data/padding-quest-gates.md
#   docs/plans/classic-restoration/iod/data/padding-overlap-rewards.md
#   docs/plans/classic-restoration/iod/data/padding-level1-proposal.md
#
# Enable mechanics (per quest-data schema, requirements.prerequisites):
#   * prerequisites: [] clears the prereq block AND the logic operator together
#     (canonical "no prerequisites"); idempotent. Used for v17-root quests.
#   * prerequisites: [<qid>] replaces the 9999 sentinel with the anchor quest id
#     (written as the huntingZone,offset ref qid//100,qid%100). Idempotent.
#
# Chain co-enablement (all anchors are either live quests or co-enabled here):
#   1322(root) -> {1318, 1323};  1329(live) -> {1351, 1352, 1386 -> 1328};
#   1345(root) -> 1346;  1335 -> 1337 -> 1338;  1343 -> 1344.
#
# RE-ANCHOR adaptations (ship differs from the v17 parent; divergence-logged):
#   1335: anchored on live 1309 (v17 parent 1310 stays disabled as an
#         AWKWARD-DUPLICATE cut subplot; re-anchor unstrands the gate-clean
#         courier branch 1335/1337/1338 without pulling 1310 in).
#   1343: anchored on live 1316 (v17 parent 1315; 1343 is a lore-reveal branch,
#         gated post-climax so its reveal cannot precede the compressed story).
#   1344: anchored on 1343 (v17 wiring; listed because it chains off a
#         re-anchored quest, so it cannot start until 1343 is live).
#
# Auto-accept safety: verified NONE of the enabled quests carries 즉시수주
#   (autoAccept) behind a prerequisite, so staged re-enable cannot strand a
#   character on a mid-chain auto-accept quest.
#
# Collections axis (tracker ruling 3, resolved 2026-07-20): the v92 bodies of the
#   collect quests carry remapped collection ids with NO placed nodes in IoD
#   (1336: 403, 1341: 405). The v31 ids ARE placed in the live
#   CollectionTerritory_13 files, so the collect tasks are retargeted to the v31
#   ids (doctrine: v31 wins). Items, quantities, and target NPCs already match
#   v31. 1334 is fixed in spec 17, which owns its enable.
#
# Op groups: quests (25 prereq rewrites + 2 collection retargets) + questDialogs
#   (1 text token fix, 1322).
# ==============================================================================

spec:
  version: "1.0"
  schema: v92

# ---- 1. Quest prerequisite rewrites (25) --------------------------------------
quests:
  update:
    # -- v17-line roots: clear the sentinel, no anchor (10) --------------------
    - id: 1302            # Another Fine Mess
