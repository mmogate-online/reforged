spec:
  version: "1.0"
  schema: v92

imports:
  - from: spawn-restore-standard

# IoD padding Wave B: mob-habitat restoration (patch 001, classic-restoration).
#
# Doctrine:
#   rule 4 : fence geometry recovered from the v17.11 client TerritoryData.
#   rule 5 : mob habitat replication from v17; MOBS ONLY. Every group is an
#            APPROXIMATION (v17 geometry + v31 same-family donor attributes) and
#            is divergence-logged; no v17 group carried per-territory spawn points,
#            so template-per-territory placement is round-robin over the v17 roster.
#
# Generator : reforged/tools/dc-restore/gen_habitat_specs.py (deterministic).
# Inputs    : docs/plans/classic-restoration/iod/data/padding-habitat-gaps.json
#             docs/plans/classic-restoration/iod/data/padding-npcloc-sweep.json
#             v31 TerritoryData_13 (donor populations), v92 NpcData_13 (family/name).
#
# Spawn-density fix (padding-density-fixes.md adjudication, 2026-07-21):
#   Quest-served groups were too sparse for their quest kill targets. Two levers:
#   1300036 (quest 1349 Mini Orcan, 48-kill tpl 4): roster forced to [4] on all 4
#           territories, spawnCount 5  -> 20 concurrent tpl 4 (was 2).
#   1300038 (quest 1349 tpl 5): roster kept, spawnCount 2 -> 8 concurrent tpl 5.
#   Bespoke groups 1300060/1300061 now emit ONE small square territory (+/-150 u)
#           per NpcLoc marker instead of one convex hull per template, using every
#           marker; templates split by drop weight (302:303 = 6:4 over 10 markers;
#           300944:300941 = 10:7 over 17 markers). spawnCount stays 1 per marker.
#   Superseded prior bespoke territories are removed (see territories.delete below).
#
# Scope: 17 replicated v17 mob groups + 2 bespoke quest-target groups (one territory
#   per NpcLoc marker), all HZ 13; 244 territories, 244 spawns total. Territories/
#   spawns extend the spawn-restore-standard archetypes; each row carries only its
#   deviations.
#
# Adjudicated DECISION defaults (no clean same-family v31 donor):
#   1300033 Rockcrawler   : roster 300541/300542/300540; generic combat profile
#                           (spawnCount 1, respawnTime 20000, randomPos true, ai 6).
#   1300058 Stone Head    : roster 301; environment profile from donor 1300054.
#   1300029 corrupt Terron: FIGHTABLE roster 300942/300943/300945; density copied
#                           from Black Rift group 1300041.
#   bespoke 1348 (302/303) and 1319 (300941/300944): generic combat profile,
#                           per-marker territories (density fix).
#
# Group ids (v17 originals, verified free in both eras): 1300031, 1300032, 1300033, 1300034, 1300036, 1300037, 1300038, 1300057, 1300058, 1300022, 1300025, 1300028, 1300029, 1300030, 1300019, 1300020, 1300021
# Bespoke group ids (adjacent-free, both eras): 1300060, 1300061
# Territory ids from 13014260; instance ids from 13472950 (both above the live max in both eras).
# Position sanity: every spawn position falls inside its fence (0 clamps).

