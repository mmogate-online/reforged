# Charm Skill Buff Injection - Patch 001
# Injects a TargetingList into every charm-linked skill so using the item applies the
# matching buff abnormality from 14-charm-abnormalities to the user AND nearby allies
# (allyExceptMe r500 maxCount 19 + me r30: the BHS party food-buff pattern, e.g.
# Traditional Bleakfields BBQ skill 60950532, matching classic charm behavior). Replaces the
# hand-made spike TargetingLists on skills 60246100/60246200/60246330 and deletes the
# superseded spike abnormalities 488000003-488000006 with their icon and string rows.
# Requires DSL >= a7cf8d11 (Area type/maxCount/rangeAngle authoring).
# Generated by tools/dc-restore/gen_charm_specs.py

spec:
  version: "1.0"
  schema: v92

definitions:
  # BHS party food-buff area pair (Bleakfields BBQ skill 60950532)
  # $ABN binds at the _charmCast/_charmCastTriple call sites (scope inheritance)
  _charmArea:
    minRadius: 0.0
    maxHeight: 60.0
    minHeight: 0.0
    rangeAngle: 360.0
    offsetDistance: 0.0
    offsetAngle: 0.0
    rotateAngle: 0.0
    effect:
      atk: 0.0
      abnormalityOnCommon:
        id: $ABN
        abnormalityRate: 1.0

  _charmAllyArea:
    $extends: _charmArea
    type: allyExceptMe
    maxCount: 19
    maxRadius: 500.0
    selectMethod: dir

  _charmSelfArea:
    $extends: _charmArea
    type: me
    maxCount: 1
    maxRadius: 30.0
    selectMethod: dist

  _charmTargetingBase:
    method: normal
    id: -1
    time: 0
    interval: 0
    until: 0
    mpBonusTypeB: 0
    combinedArea: false
    cost:
      hp: 0
      mp: 0
      anger: 0

  # Single-buff charm skill: buffs the user and nearby allies
  _charmCast:
    $params: [ABN]
    category: Common
    changes:
      targetingLists:
        - targetingIndex: 0
          targetings:
            - $extends: _charmTargetingBase
              areas:
                - $extends: _charmAllyArea
                  $with: { ABN: $ABN }
                - $extends: _charmSelfArea
                  $with: { ABN: $ABN }

  # Triple charm skill (trios): one buff per kind
  _charmCastTriple:
    $params: [ABN1, ABN2, ABN3]
    category: Common
    changes:
      targetingLists:
        - targetingIndex: 0
          targetings:
            - $extends: _charmTargetingBase
              areas:
                - $extends: _charmAllyArea
                  $with: { ABN: $ABN1 }
                - $extends: _charmSelfArea
                  $with: { ABN: $ABN1 }
                - $extends: _charmAllyArea
                  $with: { ABN: $ABN2 }
                - $extends: _charmSelfArea
                  $with: { ABN: $ABN2 }
                - $extends: _charmAllyArea
                  $with: { ABN: $ABN3 }
                - $extends: _charmSelfArea
                  $with: { ABN: $ABN3 }

