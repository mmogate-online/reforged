# Charm buffs: correct the four families whose effect rows were written in the charm
# system's own vocabulary instead of the abnormality one.
#
# THE TWO EFFECT ENUMERATIONS ARE NOT THE SAME ONE. They agree on types 1-9 and
# 14-16, which is why most charm families behave, and they part company above 100.
# Attack speed is type 101 to the charm tables and type 24 here. Damage reflection is
# type 102 there and type 110 here. Type 101 as an abnormality is not a stat at all:
# it restores a fraction of maximum HP on a combat trigger, so every attack-speed
# charm was healing its holder to full.
#
# TYPES 51, 52 AND 110 READ THE VALUE AS THE BONUS ITSELF, NOT AS A MULTIPLIER. The
# charm tables state every bonus in 1 + x form, and carrying that form into these
# three types inflates the effect roughly a hundredfold. Type 24 does take a
# multiplier, so the attack-speed numbers are unchanged and only the type code moves.
#
# The charm system expressed regeneration as a multiplier on the natural regen rate.
# No abnormality effect type modifies that rate, so types 51 and 52, a fixed share of
# the maximum per tick, are the nearest available shape and the magnitudes below are
# a fresh choice rather than a carried one.
#
# provenance: policy

spec:
  version: "1.0"
  schema: v92

definitions:
  charmBuffBase:
    property: 4
    category: "4"
    time: 1800000
    isBuff: true
    isShow: "True"
    mobSize: "all"
    priority: 7
    maxStackCount: 1
    levelOver: 1
    levelUnder: 127
    notCareDeath: true
    notCareBattleField: true
    group: "doping"

  # Every shipped type 110 row is method 3 on a one-second tick with this clamp pair.
  reflectRow:
    $params: [VALUE]
    type: 110
    method: 3
    value: $VALUE
    tickInterval: 1
    min: -10000000
    max: 10000000

abnormalities:
  upsert:
    # --- Attack speed: type 101 -> 24, multiplier unchanged ---

    # Speed Charm
    - id: 488000012
      $extends: charmBuffBase
      name: "Charm_Named_Speed"
      kind: 9814
      level: 3
      effects:
        - type: 24
          method: 3
          value: "1.06"
          tickInterval: 0
          appearEffectId: 10045001
          effectPart: "FXBottom"
      abnormalityStrings:
        name: "Speed Charm"
        tooltip: "Attack speed increased by 6%. Lasts 30 minutes and persists through death."
    # Greater Speed Charm
    - id: 488000028
      $extends: charmBuffBase
      name: "Charm_Greater_Speed"
      kind: 9814
      level: 4
