          method: 3
          value: "1.08"
          tickInterval: 0
          appearEffectId: 10045001
          effectPart: "FXBottom"
      abnormalityStrings:
        name: "Greater Speed Charm"
        tooltip: "Attack speed increased by 8%. Lasts 30 minutes and persists through death."

    # --- Damage reflection: type 102 -> 110, multiplier -> bonus ---

    # Mirror Charm
    - id: 488000020
      $extends: charmBuffBase
