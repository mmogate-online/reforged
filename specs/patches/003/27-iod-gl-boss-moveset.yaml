# The charge should hit harder than the spin, which is the heaviest thing the boss
# otherwise throws. The multiplier is the one the model donor uses between the same two
# skills, applied to this template's own numbers rather than copied as an absolute.
#
# It is applied to EFFECTIVE damage, not to totalAtk. What reaches a player is totalAtk
# scaled by the skill's own `Effect atk`, and these two skills do not share one: the spin
# is 0.25 and the charge 0.18. Matching the donor's raw totalAtk ratio reproduces the
# donor exactly and still lands the charge BELOW the spin, which is the trap here.
npcSkills:
  update:
    - huntingZoneId: 13
      templateId: 2003
      skillId: 1106
      changes:
        totalAtk: 15180.0
    - huntingZoneId: 13
      templateId: 2003
      skillId: 2106
      changes:
        totalAtk: 16445.0

    # The thrown bomb, and the only thing the boss can reach a kiting player with.
    # Four times the zone's scale, which is a straight multiple of the damage dealt
    # because this skill's `Effect atk` is 1 and it lands one hit rather than ticking.
    # It stays under the charge and about level with the spin per use, so distance is
    # punished without the bomb becoming the fight.
    - huntingZoneId: 13
      templateId: 2003
      skillId: 1104
      changes:
        totalAtk: 9867.80
    - huntingZoneId: 13
      templateId: 2003
      skillId: 2104
      changes:
        totalAtk: 10690.08
