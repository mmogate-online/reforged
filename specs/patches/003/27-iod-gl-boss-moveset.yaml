# Island of Dawn Guardian Legion: the boss's own AI, and the damage on its charge.
#
# AI 201 is AI 200 plus three behaviours. It exists as a SEPARATE RECORD because an
# AI is referenced by id from a template, so two templates sharing one record cannot
# behave differently. The raider keeps 200; only the Warlord points at 201.
#
# The three additions are the model's charge and its two evasive hops. Every Orcan on
# this animation set already carries the skill rows for them; what the island's own AI
# never had was a Work driving them, which is why they were never seen. Both halves are
# required: a Work declares the behaviour, and a Tension info row with a non-zero prob is
# what lets it be chosen. A Work no tension names never runs.
#
# The charge carried totalAtk 0, so it played and did nothing. Its damage is set here
# rather than in the skills spec, which is generated and reproduces the donor verbatim.
#
# provenance: carry-over

