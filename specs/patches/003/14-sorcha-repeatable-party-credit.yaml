      - { type: spawn, huntingZoneId: 437, territoryId: "43700349", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 4 }
      - { type: spawn, huntingZoneId: 437, territoryId: "43700372", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 4 }
      - { type: spawn, huntingZoneId: 437, territoryId: "43700376", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 8 }  # breather
      - { type: spawn, huntingZoneId: 437, territoryId: "43700354", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 0,   next: "time", nextValue: 4 }
      - { type: spawn, huntingZoneId: 437, territoryId: "43700350", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 4 }
      - { type: spawn, huntingZoneId: 437, territoryId: "43700377", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 9 }  # breather
      - { type: spawn, huntingZoneId: 437, territoryId: "43700360", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 4 }
      - { type: spawn, huntingZoneId: 437, territoryId: "43700351", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 4 }
      - { type: spawn, huntingZoneId: 437, territoryId: "43700374", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 4 }
      - { type: spawn, huntingZoneId: 437, territoryId: "43700379", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 4 }   # rear group
      - { type: spawn, huntingZoneId: 437, territoryId: "43700352", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: 8 }  # breather
