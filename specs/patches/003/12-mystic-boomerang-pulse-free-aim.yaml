# Mystic Boomerang Pulse: free vertical aim.
#
# provenance: policy
#
# Every rank of the orb ships its projectile row with shootForward="true" and
# shootForwardType="Upper", which sends the orb out at a fixed angle instead of
# where the caster is aiming. Clearing shootForward is the only release a spec can
# express: attributes cannot be removed, so shootForwardType stays on the row.
#
# projectileSkills rows merge by POSITION, not by id. Each rank here carries exactly
# one row, so one entry per skill is unambiguous. A skill with several rows would
# need one entry per row, in file order.
#
# The ladder is ten level ranks plus three rank-10 variants, and the class ships
# eleven race and gender files, so every rank is listed once per variant.

spec:
  version: "1.0"
  schema: v92

# The change is identical on every row, so it lives here once and each entry below
# carries only the file it lands in and the rank it targets.
definitions:
  FreeAim:
    changes:
      targetingLists:
        - targetings:
            - projectileSkills:
                - shootForward: false

userSkills:
