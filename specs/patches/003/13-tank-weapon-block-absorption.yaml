# Tank weapon block absorption: Patch 003
# Raises flat block absorption by 20% on tank weapons usable at the level 10 cap.
#
# Block absorption is a Passivity of type 109 (flat, method 2) that a weapon references
# as a FIXED passive through the ItemTemplate linkPassivityId list. It is never a random
# roll: no passivity pool reachable from a tank weapon carries a type 109 member, so
# editing pools would change nothing.
#
# Every rung is written as an absolute value, not a multiplier, for two reasons: the
# passivities entity supports neither updateWhere nor multiply/add transforms, and an
# absolute value stays correct when the patch is reapplied from its baseline.
#
# Bands are class-keyed: 12xxxx Lancer, 13xxxx Brawler, 14xxxx Berserker, 15xxxx Warrior.
# The absorption gap between them is deliberate; a flat multiplier preserves it.
#
# provenance: policy

