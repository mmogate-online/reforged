# Gear dismantle: point in-scope gear at its refund row
#
# Every combat gear item at ranks 1 to 4 requiring character level 60 or below gains a
# decompositionId and the dismantlable flag, one block per rank, grade and slot class.
#
# Both attributes are needed together. The flag on its own leaves the dismantle tool with
# no row to resolve, which is the state most gear in this band was already in: marked
# dismantleable, refunding nothing.
#
# The id groups are named package exports rather than literals here, so the membership of
# each group has one source and this spec stays readable as the change it makes.
#
# Selection is by id because a filter naming combat item type, subtype or category cannot
# be evaluated across the item files: they carry values outside the ranges the schema
# accepts, and the filter fails on the first one it meets.

