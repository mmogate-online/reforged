# Gear dismantle refunds: the rank and grade ladder
#
# One row per rank, grade and slot class for gear at ranks 1 to 4. The dismantle tool
# resolves a refund through ItemTemplate@decompositionId into this file. The
# EnchantDecomposition table in EnchantData.xml is keyed by the same three axes but is not
# the table the tool reads, so a refund authored only there pays nothing.
#
# A Decomposition row carries no rank, grade or slot axis of its own, so a ladder on those
# axes can only be expressed as one row per combination. Ids 100 to 159 come from the 1 to
# 2000 band this file's own header reserves for rules applied in bulk to many items, where
# a desc is mandatory.
#
# upsert REPLACES the record completely, so each row states its whole intended state.
# FixedOutput is authored without enchantStep, which is the majority convention here.

spec:
  version: "1.0"
  schema: v92

decompositions:
  upsert:
    # rank 1
    - id: 100
      desc: "rank 1 grade 0 weapon gear dismantle"
      fixedOutputs:
        - outputs:
            - templateId: 94101
              amount: 6
