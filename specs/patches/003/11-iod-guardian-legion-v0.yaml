spec:
  version: "1.0"
  schema: v92

imports:
  - from: spawn-restore-standard
  - from: fieldevent

# Island of Dawn Guardian Legion field event: one NPC spawns inside a bounded mission
# area, the progress bar is bound to its HP, and killing it completes the mission.
#
# AUTHORED CONTENT, NOT RESTORATION. The field event subsystem has no classic
# counterpart at all: no FieldData_*, no FieldEvent.xml, no StrSheet_Field and no
# channelType="field" continent existed then, so there is nothing to restore from.
#
# TEMPLATE 902 IS THE ONLY SAFE MONSTER HERE. Every other Orcan in this camp is
# quest-load-bearing (13,4 and 13,5 -> quest 1349; 13,901 -> 1311 and 1337; 13,1002 and
# 13,1003 -> 1309), so spawning one as an event mob would hand out free quest credit.
# 902 is defined, has never been spawned and is referenced by no quest, achievement or
# territory, and it shares shapeId 300710 with Dwarf Orcan so it still reads as an
# Orcan minion.
#
# This spec adds FieldData_13.xml, a NEW shard in an IdSorted client layout, and
# continent 13 sorts first, so every existing Field shard shifts by one. Narrowed sync
# cannot place a new shard (E680): apply the patch with --no-narrow.

# ---------------------------------------------------------------------------
# Territory group and territories
# ---------------------------------------------------------------------------
# TERRITORY TYPE IS THE EASY WAY TO GET THIS WRONG. Ordinary hunting-zone territories
# are type="normal" and spawn at world start; event-owned territories must be
# type="quest" so they only ever exist while the event runs. A normal-type event
# territory would put these mobs in the live world permanently. Hence `type: quest`
# overriding spawn-restore-standard.ClassicTerritory, whose type is normal by design.

territoryGroups:
  upsert:
    - huntingZoneId: 13
      groupId: 1300062
      desc: "IoD Guardian Legion: Orcan Raiders (field event v0)"

territories:
  upsert:
    # Mission boundary: a bare fence with no spawns, referenced as `startTerritoryId`,
    # marking the area the mission occupies. Covers the staging pad, the boss spawn and
    # the approach to the Orcan Bivouac.
    - huntingZoneId: 13
      groupId: 1300062
      territoryId: 13017000
      $extends: spawn-restore-standard.ClassicTerritory
      type: quest
      addMaxZ: 300.000000
      subtractMinZ: 500.000000
      desc: "GL Orcan Raiders: mission boundary"
      fences:
        - [49500.0, -80200.0, -4700.0]
        - [52500.0, -80200.0, -4650.0]
        - [52500.0, -77500.0, -4700.0]
        - [49500.0, -77500.0, -4780.0]

    # Staging pad: the small "stand here to start" trigger read by the
    # userCountInTerritory group below.
    - huntingZoneId: 13
      groupId: 1300062
      territoryId: 13017010
      $extends: spawn-restore-standard.ClassicTerritory
      type: quest
      addMaxZ: 300.000000
      subtractMinZ: 500.000000
      desc: "GL Orcan Raiders: staging pad (start trigger)"
      fences:
        - [51810.0, -79070.0, -4632.0]
        - [52110.0, -79070.0, -4632.0]
        - [52110.0, -78770.0, -4632.0]
        - [51810.0, -78770.0, -4632.0]

    # Boss spawn. Activated only by the event's spawn task, never at world start.
    - huntingZoneId: 13
      groupId: 1300062
      territoryId: 13017020
      $extends: spawn-restore-standard.ClassicTerritory
      type: quest
      addMaxZ: 300.000000
      subtractMinZ: 500.000000
      desc: "GL Orcan Raiders: boss spawn"
      fences:
        - [51250.0, -79450.0, -4660.0]
        - [51550.0, -79450.0, -4660.0]
        - [51550.0, -79150.0, -4660.0]
        - [51250.0, -79150.0, -4660.0]

# ---------------------------------------------------------------------------
# The one event NPC
# ---------------------------------------------------------------------------

territorySpawns:
  upsert:
    # spawnCount MUST stay 1: `progressType: npcHp` binds the mission bar to a single
    # instance. Aggressive so it engages on approach rather than needing to be pulled.
    - huntingZoneId: 13
      groupId: 1300062
      territoryId: 13017020
      npcInstanceId: 13017021
      npcTemplateId: 902
      $extends: spawn-restore-standard.RestoreSpawnAggressive
      memberId: 1
      desc: "GL Orcan Raiders: event boss (tpl 902 Dwarf Guardian)"
      pos: [51400.0, -79300.0, -4660.0]
      spawnCount: 1
      ai: 31
      aggroSendToPartyDistance: 1000

# ---------------------------------------------------------------------------
# Mission strings
# ---------------------------------------------------------------------------
# Guide step text is NOT authored here: the shipped generic steps are reused instead
# (@field:100001 "Defeat {target}.", @field:111111 "Mission Complete").
#
# Ids follow the existing {continent4}{eventIdx2}{seq3} convention: continent 13 padded
# to 0013 plus event index 01 gives title 001301 (stored as 1301) and body lines
# 001301NNN (stored as 1301NNN). Deviating from it risks colliding with another
# continent's block.

fieldStrings:
  upsert:
    - id: 1301
      string: "<font color='#ffbb00'>Orcan Raiders</font>"
    - id: 13010
      string: "Orcan raiders are massing on the ruins east of the Orcan Bivouac. Break their advance."
    - id: 1301001
      string: "Orcan raiders are advancing. Defeat their champion."
    - id: 1301002
      string: "The Orcan advance is broken."
    - id: 1301003
      string: "The Orcan raiders hold the ruins. The Guardian Legion withdraws."
    - id: 1301930
      string: "Mission ends in 30 seconds."
    - id: 1301920
      string: "Mission ends in 20 seconds."
    - id: 1301910
      string: "Mission ends in 10 seconds."

# ---------------------------------------------------------------------------
# The mission
# ---------------------------------------------------------------------------

fieldEvents:
  upsert:
    - continentId: 13
      id: 1
      startTerritoryId:
        zoneId: 13
        territoryId: 13017000
      startPos: [51959.0, -78919.0, -4631.0]
      startDir: 318
      revivePos: [51959.0, -78919.0, -4631.0]
      # 7777 is the shared "Guardian Legion Mission Zone" row in StrSheet_Region, used
      # by every mission. Reused rather than authoring an island-specific name.
      reviveTownNameId: 7777
      revivalRecoveryRate: 1

      # Entry gates. Headcounts follow the other `small` missions. The level band
      # brackets the camp it sits in (quest 1349 here is minLevel 7) and stays well
      # clear of the 65-70 missions, so the two tiers never share a rotation slot.
      conditions:
        - { type: maxMemberCount, value: 15 }
        - { type: teleportMemberCount, value: 10 }
        - { type: minLevel, value: 7 }
        - { type: maxLevel, value: 15 }

      # 330s is the standard duration for a `small` mission. The rotation group at the
      # foot of this file must use the same value or instances will overlap or gap.
      clearCondition:
        progressTime: 330
        endWhenProgressFull: false
        endIntervalTime: 30

      # The bar is rebound to the boss's HP by the progressType task below, so maxValue
      # is not what actually drives it. standardPlayerCount is 5 rather than the usual
      # 30 because this is a low-level event for a handful of players.
      progress:
        maxValue: 100000
        dividerPercent: [100]
        isSharedChannel: false
        syncNpcHpInterval: 3
        standardPlayerCount: 5

      # Contribution scoring, taken from an existing small mission. It is calibrated
      # for level-65 damage, so a low-level party will not reach the participation
      # threshold; this needs recalibrating before rewards matter here.
      eventPoint:
        points:
          - { id: 1, type: dealing, value: 1.45 }

      # Objective panel. Two steps, both reusing shared strings.
      guide:
        titleString: "@field:1301"
        description: "@field:13010"
        eventSize: small
        tasks:
          - id: 1
            target: "@creature:13#902"
            string: "@field:100001"
            iconId: 3
            markers:
              - markerType: MARKER_FIELD_EVENT_AREA_03
                markerPos: "51400,-79300,-4660"
                markerScaleX: 0.5
                markerScaleY: 0.5
          - id: 2
            target: ""
            string: "@field:111111"
            iconId: 1

      # AutoEventBalance is deliberately OMITTED. Its abnormality ladder (77770001 to
      # 77770030) is tuned for level-65 stat scales and has no low-level equivalent, so
      # attaching it here would apply level-65 scaling to a low-level fight. Omitting
      # it is a legal shape: other shipped missions carry no AutoEventBalance either.

      # ---------------------------------------------------------------------
      # Encounter script. Keyless and REPLACED WHOLE on every apply: there is no way to
      # edit one group or task in place, so this block must always be the complete
      # script. Structure follows the smallest shipped playable mission, minus its
      # participant-buff and anti-idle loops (both drive level-65 abnormalities).
      #
      # Flag names are free text the engine only compares, so English is used here.
      # `name` on a flag group is a comma list meaning AND, which is how phase gates
      # are built.
      #
      # progressTimer values are SECONDS REMAINING, counting down from progressTime, so
      # the opening beats carry the large numbers and the closing ones the small.
      # ---------------------------------------------------------------------
      eventGroups:
        # Set up. Shipped events also despawn the underlying world territories here and
        # respawn them at `isEventNpc="false"` on teardown. This one does not: the only
        # world territories in this footprint are the Orcan groups quest 1349 needs, so
        # clearing them would break that quest for anyone in the zone. The cost is that
        # event mobs share ground with the live patrol.
        - type: initialize
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskFlag, $with: { NAME: oneshot, VALUE: 1, NEXT: none } }
                    - { $extends: fieldevent.taskGuide, $with: { GUIDE_ID: "1", GUIDE_TYPE: add, NEXT: none } }

        # Open. Banner at 10 seconds in.
        - type: progressTimer
          value: "320"
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskMessage, $with: { STRING: "@field:1301001", NEXT: none }, style: combat }

        # Arm. uniqueId on a userCountInTerritory group is a TERRITORY pair, not an
        # npc pair; the two readings share the attribute and are told apart by group
        # type. One player on the staging pad is enough.
        - type: userCountInTerritory
          uniqueId: "13,13017010"
          value: "1"
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskFlag, $with: { NAME: ready, VALUE: 1, NEXT: none } }

        # Drive. progressType MUST be the FIRST task in its group: that ordering is a
        # real constraint, not a convention, and it is how the bar learns what it
        # measures. Here it binds to the boss's HP, so the mission is completable
        # without the contribution scoring being calibrated.
        - type: flag
          name: "ready"
          repeat: false
          events:
            - eventTaskGroups:
                - eventTasks:
                    - $extends: fieldevent.taskProgressType
                      $with: { PROGRESS_TYPE: npcHp }
                      targetNpcId: { huntingZone: 13, templateId: 902 }
                    - { $extends: fieldevent.taskPoint, $with: { POINT_ID: 1, TURN: "on" } }
                    - { $extends: fieldevent.taskSpawn, $with: { HUNTING_ZONE: 13, TERRITORY: 13017020, NEXT: none } }

        # Complete.
        - type: progress
          value: "100"
          repeat: false
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskFlag, $with: { NAME: success, VALUE: 1, NEXT: none } }

        # Success branch. Latched on `oneshot`, which it clears first, so exactly one
        # of success and timeout can ever run.
        - type: flag
          name: "success,oneshot"
          repeat: false
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskFlag, $with: { NAME: oneshot, VALUE: 0, NEXT: none } }
                    - { $extends: fieldevent.taskGuide, $with: { GUIDE_ID: "1", GUIDE_TYPE: complete, NEXT: none } }
                    - { $extends: fieldevent.taskMessage, $with: { STRING: "@field:1301002", NEXT: none }, style: combat }
                    - { $extends: fieldevent.taskGuide, $with: { GUIDE_ID: "1", GUIDE_TYPE: remove, NEXT: none } }
                    - { $extends: fieldevent.taskGuide, $with: { GUIDE_ID: "2", GUIDE_TYPE: add, NEXT: none } }

        # Expiry.
        - type: progressTimer
          value: "0"
          repeat: false
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskFlag, $with: { NAME: timeout, VALUE: 1, NEXT: none } }

        # Failure branch.
        - type: flag
          name: "timeout,oneshot"
          repeat: false
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskFlag, $with: { NAME: oneshot, VALUE: 0, NEXT: none } }
                    - { $extends: fieldevent.taskDespawn, $with: { HUNTING_ZONE: 13, TERRITORY: 13017020, NEXT: none } }
                    - { $extends: fieldevent.taskMessage, $with: { STRING: "@field:1301003", NEXT: none }, style: combat }
                    - { $extends: fieldevent.taskGuide, $with: { GUIDE_ID: "1", GUIDE_TYPE: remove, NEXT: none } }
                    - { $extends: fieldevent.taskGuide, $with: { GUIDE_ID: "2", GUIDE_TYPE: add, NEXT: none } }

        # Close. Missions end on this 30/20/10 warning ladder.
        - type: progressTimer
          value: "30"
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskMessage, $with: { STRING: "@field:1301930", NEXT: none } }
        - type: progressTimer
          value: "20"
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskMessage, $with: { STRING: "@field:1301920", NEXT: none } }
        - type: progressTimer
          value: "10"
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskMessage, $with: { STRING: "@field:1301910", NEXT: none } }

        - type: beforeEndEvent
          events:
            - eventTaskGroups:
                - eventTasks: []

        # Teardown. Despawns only what the event created; there is no world-restore
        # half because nothing in the world was despawned at setup.
        - type: beforeDeleteEvent
          events:
            - eventTaskGroups:
                - eventTasks:
                    - { $extends: fieldevent.taskDespawn, $with: { HUNTING_ZONE: 13, TERRITORY: 13017020, NEXT: none } }

# ---------------------------------------------------------------------------
# Global field event config
# ---------------------------------------------------------------------------
# fieldEventConfig is a KEYLESS SINGLETON: sections sit directly under it with no
# create/update wrapper and no `changes` block.
#
# `worldMapUi` is a SCALAR section and patches, so naming showMinLevel leaves
# showMaxLevel and bottomUITitleStrId alone.
#
# `rotationGroups` is a LIST SECTION and REPLACES WHOLE, so every pre-existing group is
# restated below verbatim: dropping one would silently unschedule the missions in it,
# and an event that belongs to no rotation group never fires at all.
#
# One consequence, accepted: the file also carried a sixth group commented out and
# labelled off (continent 2000 event 2, serverOpenDelay 14400, startInterval 14400,
# randomRotation false). Comments are not authorable, so replacing this section drops
# that block permanently. It was already inactive; the cadence is recorded here instead.

fieldEventConfig:
  # The world-map mission list is gated GLOBALLY, not per event, so a low-level mission
  # cannot appear at all unless this floor comes down. Widening it also lists the
  # level-65 missions for low-level players, but each mission's own Condition minLevel
  # still blocks entry, so the cost is UI clutter rather than an exploit.
  worldMapUi:
    showMinLevel: 1

  rotationGroups:
    # Advanced (small) guardian missions. Pre-existing, restated verbatim.
    - serverOpenDelay: 30
      startInterval: 990
      randomRotation: true
      events:
        - { continentId: 7003, eventId: 1 }
        - { continentId: 7014, eventId: 2 }
        - { continentId: 7001, eventId: 2 }
        - { continentId: 7012, eventId: 1 }
    # Rare (medium). Pre-existing, restated verbatim.
    - serverOpenDelay: 30
      startInterval: 660
      randomRotation: true
      events:
        - { continentId: 7011, eventId: 1 }
        - { continentId: 7015, eventId: 1 }
    # Flying rare (medium). Pre-existing, restated verbatim.
    - serverOpenDelay: 30
      startInterval: 440
      randomRotation: true
      events:
        - { continentId: 7003, eventId: 2 }
        - { continentId: 7021, eventId: 1 }
    # Legendary. Pre-existing, restated verbatim.
    - serverOpenDelay: 1800
      startInterval: 3600
      randomRotation: false
      events:
        - { continentId: 7005, eventId: 1 }
    # Sky-island transit missions. Pre-existing, restated verbatim.
    - serverOpenDelay: 30
      startInterval: 330
      randomRotation: false
      events:
        - { continentId: 7022, eventId: 90 }
        - { continentId: 7011, eventId: 91 }
        - { continentId: 7013, eventId: 92 }
        - { continentId: 7003, eventId: 93 }
        - { continentId: 7001, eventId: 94 }
        - { continentId: 7031, eventId: 95 }
    # Island of Dawn Orcan Raiders. Kept in its own single-member group with
    # randomRotation false so it runs deterministically instead of competing for a slot
    # with the level-65 wheel. startInterval equals the mission's progressTime, so
    # instances run back to back and it is effectively always available.
    - serverOpenDelay: 30
      startInterval: 330
      randomRotation: false
      events:
        - { continentId: 13, eventId: 1 }
