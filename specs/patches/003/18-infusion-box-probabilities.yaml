# Infusion boxes: even odds across every reward
#
# Each box holds one pool and is meant to draw from it evenly. The odds were
# left to `equalProbability`, which truncates the equal share to two decimal
# places and gives the remainder to the first entry. The weapon pools hold 195
# rewards, so the share truncated to 0.00 and the first reward took the whole
# probability: those three boxes awarded one fixed warrior weapon every time.
# The armour pools stayed random but leaned hard on their first entry.
#
# So the odds are stated per reward here, and `equalProbability` must not be
# used for any pool this size.
#
# `changes.randomRewards` replaces the whole group, so every reward is restated.
# Auto-generated by tools/gear-infusion/generate_infusion_boxes.py
# DO NOT EDIT MANUALLY

