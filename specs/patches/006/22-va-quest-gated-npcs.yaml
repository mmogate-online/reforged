# Five villagers whose appearance the live server tied to quests of its own
# re-authored story chain: Samael and Elleon in Velika, Chama and Kantusa in
# Oblivion Woods, and Ciebel's hide condition. This patch replaces that chain with
# the classic one, and a gate on a quest that no longer exists never opens, so the
# NPC would never stand. The classic data gates none of the five.
# `questVillager` returns to the classic value where the classic file states one.
#
# A gate is a PAIR, and the server counts the quest ids against the task ids and
# refuses the whole NpcData file when they disagree. So a cleared quest id must have
# its task id cleared in the same op. `default` is the only spelling that clears one:
# naming the attribute under `changes` can only set it to a value, and `0` is a value.
# A `hideQuestId` of `0` paired with a `hideQuestTaskId` of `0` appears nowhere in the
# data the server accepts.
#
# provenance: ported-from-v31

spec:
  version: "1.0"
  schema: v92

npcs:
  update:
    - huntingZoneId: 63
      id: 1138            # Samael
      changes:
        questVillager: true
        default: [appearQuestId, appearQuestTaskId, hideQuestId, hideQuestTaskId]
    - huntingZoneId: 63
      id: 1166            # Elleon
      changes:
        questVillager: true
        default: [appearQuestId, appearQuestTaskId, hideQuestId, hideQuestTaskId]
    - huntingZoneId: 63
      id: 1167            # Ciebel
      changes:
        default: [hideQuestId, hideQuestTaskId]
    - huntingZoneId: 203
      id: 1013            # Chama
      changes:
        default: [appearQuestId, appearQuestTaskId, hideQuestId, hideQuestTaskId]
    - huntingZoneId: 203
      id: 1030            # Kantusa
      changes:
        questVillager: true
        default: [appearQuestId, appearQuestTaskId, hideQuestId, hideQuestTaskId]
