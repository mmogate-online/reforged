# Quest journal registrations for the ported quests: a quest is listed under the story
# group its classic header names, removed from any other group it was listed in, and a
# deleted quest is unregistered. A quest is never registered in two groups. A group the
# file lacks is created here with the ported quest as its whole membership, and a
# registration appends at the group end.
#
# Every heading and label here is display text the client schema requires on each
# registration, so it is taken from the client's own file, or from the quest's English
# title where the client does not carry the quest. The server file's own labels are
# never a source: they are Chinese and Russian, and a registration built from them
# would ship that to players.
#
# provenance: ported-from-v31

