# and no op names it. Rows, a placement at the previous patch close and none now (a parked
# voidSpawn row still counts as placed): its rows are deleted. Rows and no placement at
# either point: never territory-spawned in this era, possibly spawned by a quest script
# the territory files do not show, so the rows stay as inert wiring. Placed, no rows, and
# a classic client dialog shard: that shard's lines are upserted in the server row shape.
#
# provenance: policy

