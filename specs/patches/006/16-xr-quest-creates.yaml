            - social: 0
              content: "General Samael dispatched you to Popolion to investigate some wild rumors. Unchecked aggression raged across the landscape and bizarre aberrations attacked the locals.<BR><BR>You encountered a pair of baraka scholars, Bedoram and Brohua, who investigated the source of the trouble. Bedoram traced the problem to a relic known as a dementalith, but warned you that such a device is a massive investment and that the danger was greater than it first appeared."
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Mission Orders<BR><BR>Report to General Samael at once. All other orders rescinded."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1137
          pages:
            - social: 4
              content: "We're keeping it quiet, but Poporia is in trouble and Consul Dougal ordered me to have someone investigate.<BR><BR>Head to Popolion and investigate the source of this disturbance, but take no chances. Whatever the problem, it mustn't spread to Val Aureum or other provinces. Do you understand me?<BR><BR>If stopping this threat means burning Popolion to the ground, then that's what you do."
        - id: 4
          npcZoneId: 67
          prevId: 3
          villagerId: 1007
          pages:
            - social: 4
              content: "You're the federation agent? Not a moment too soon! The bad news? Trouble everywhere outside Popolion. Is it a disease? A curse? There's talk about vampir blood magic, but no one knows anything.<BR><BR>The good news? Not much. Two baraka scholars have been braving the woods seeking answers, but it's dangerous out there. Find {@LinkCreature:215#1019#Brohua} at the camp southwest of here and see what you can do to help."
        - id: 5
          npcZoneId: 215
          prevId: 4
          villagerId: 1019
          pages:
            - social: 4
              content: "Outside aid at last! If nothing else, it's comforting to talk to someone sane! I am Bedoram's assistant at your service. Nothing much to report yet, although we have concluded that this is less a plague or curse than an...emanation? Hard to say. What we do know is that the longer you stay, the deeper it affects you.<BR><BR>It has affected my colleagues, though I don't think they realize it yet.<NEXTPAGEBUTTON>\"Where is Bedoram?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "He's moving our gear to a new camp northwest of here. We're mapping the strength field of the—oh, I won't bore you.<BR><BR>I am more concerned with all the {@LinkCreature:15#6#disturbed constructs} near our camp. I've seen them slaughter travelers, but Prefect Paka's holding back his troops. He's convinced we're about to be overrun by farmers.<BR><BR>Could you deal with them?"
        - id: 6
          npcZoneId: 215
          prevId: 5
          villagerId: 1019
          pages:
            - social: 4
              content: "I'm grateful to you.<BR><BR>As soon as I pack up here, I will go back to Popolion.<BR><BR><PCNAME>, would you check in with Bedoram? He may need assistance. He headed north so he probably passed through Camp Retribution. Go there and ask Centurion {@LinkCreature:215#1010$$Amallen} if he knows of Bedoram's whereabouts."
        - id: 7
          npcZoneId: 215
          prevId: 6
          villagerId: 1010
          pages:
            - social: 4
              content: "What's that? You're looking for {@LinkCreature:215#1027$$Bedoram}?<BR><BR>He stopped briefly on his way to Camp Redemption to get his equipment from the caravan.<BR><BR>Go find him. Our lives may depend on the outcome of his research."
        - id: 8
          npcZoneId: 215
          prevId: 7
          villagerId: 1027
          pages:
            - social: 4
              content: "The caravan is long overdue. Whatever shall I do?<BR><BR>Without my instruments, I cannot isolate the source of the troubles. Did Paka actually send the—<BR><BR>Wait, what was that? A distress signal! The caravan is in trouble! You must help them! Quickly! I'll {@LinkCreature:215#1027#teleport you}."
        - id: 9
          npcZoneId: 215
          prevId: 8
          villagerId: 1027
          pages:
            - social: 4
              content: "Thanks be to Oriyn! You saved the caravan, and my equipment.<BR><BR>Now, I must take field-strength readings, then cross-compare against our earlier data. Oh, and I'll need fresh chemical residue!<BR><BR>Could you gather the chemical samples I need? The field causes physical changes over time. I must see the blood of the, ahem, {@LinkCreature:15#14#blood fiends}."
        - id: 10
          npcZoneId: 215
          prevId: 9
          villagerId: 1027
          pages:
            - social: 4
              content: "Excellent!<BR><BR>I'm almost done entering the new data. Once I add this blood, the analyzer will determine the drift in your samples and compare them.<BR><BR>If I am right, they'll be the same."
        - id: 11
          npcZoneId: 215
          villagerId: 1027
          pages:
            - social: 0
              content: "I still need that blood, <PCNAME>. Those {@LinkCreature:15#14#blood fiends} are the key.<BR><BR>I've asked for the bare minimum sufficient for my tests!"
        - id: 12
          npcZoneId: 215
          prevId: 10
          villagerId: 1027
          pages:
            - social: 4
              content: "This isn't a plague, thankfully, nor is it a primal curse. It's...oh, no!<BR><BR>Blood magic—and powerful blood magic at that. It would take a large group of arcanists to achieve this effect, or possibly an artifact.<NEXTPAGEBUTTON>\"What kind of artifact?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Good question!<BR><BR>I've seen similar effects before, but dementaliths were always involved. Yes. They're powerful enough to cause this.<BR><BR>I'll tell you this, though. Whoever would deploy such a device must have an agenda, and be ruthless enough to pay any price for success.<BR><BR>By Oriyn's light, what a mess."
    - huntingZoneId: 23
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "The elin princesses Rida and Arin were locked in a feud over heraldry. The dispute over the new design for a Poporia Kingdom flag got ugly when Rida fled Pora Elinu and raised an army.<BR><BR>Lienyn recruited you to resolve the dispute as the queen was unavailable. Princess Arin wanted your help to brew a draught to compel Rida back to her side."
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Mission Orders<BR><BR>The Kingdom of Poporia, a vital part of the Valkyon Federation, requests assistance in Pora Elinu.<BR><BR>Report to Commander Seir in Velika for further details."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1102
          pages:
            - social: 4
              content: "Good to see you again, <PCNAME>. You've proven yourself to be capable and resourceful. Now we'll see if you can be delicate as well.<BR><BR>The Kingdom of Poporia asked for you specifically for this mission.<NEXTPAGEBUTTON>\"How may I serve?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "There's a dispute between two royal princesses, Arin and Rida. The queen is communing with the goddess Seren and isn't available. The kingdom wants an outsider to help resolve this, to avoid a political nightmare.<BR><BR> If you ask me, it's already a political nightmare.<BR><BR>{@LinkCreature:68#1007#Lienyn} in Pora Elinu has the details."
        - id: 4
          npcZoneId: 68
          prevId: 3
          villagerId: 1007
          pages:
            - social: 4
              content: "Greetings, <PCNAME>. Commander Seir speaks well of your skills...and your discretion. I need someone to mediate a dispute between the royals. It's an internal matter requiring an outside perspective.<BR><BR>You have a deft touch, I understand.<NEXTPAGEBUTTON>\"How can I help?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Princesses Rida and Arin are feuding, and the argument has divided the kingdom. The queen would normally intervene, but she remains in seclusion and can't be disturbed.<BR><BR>Speak with Princess Arin and hear her out, but try to sway her for the good of the kingdom! She won't give in easily, but if this were an easy task, we'd not need you. Done ordering."
        - id: 5
          npcZoneId: 223
          prevId: 4
          villagerId: 1002
          pages:
            - social: 4
              content: "This is an internal matter, but I deign to accept your presence. You certainly can't make matters worse!<BR><BR>We're designing a new flag for the kingdom. Rida, that...intractable bovine, insists on a truly ridiculous symbol, while my design uses a more suitable one. The issue has divided us all!<NEXTPAGEBUTTON>\"You're fighting over art?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Not just art! Our nation's symbol!<BR><BR>The officials voted to adopt my image. Princess Rida's simply stubborn. Not to mention the fact her symbol is a squirrel! Gauche.<BR><BR>The fox is a clearly superior symbol and resonates with our people. How can we not stand and fight?"
        - id: 6
          npcZoneId: 223
          prevId: 5
          villagerId: 1002
          pages:
            - social: 4
              content: "The votes were clear. My symbol won by a full individual vote. It wasn't even close.<BR><BR>It's not my fault the squirrel princess is nuts!<BR><BR>When she lost the vote, she ran out of the assembly and went off on this foolish crusade. She's raising an army!<BR><BR>We need to stand united, under one banner. My banner, to be precise.<NEXTPAGEBUTTON>\"What can I do to help?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Well, first you can tell Rida she's being foolish and stubborn. Then you can help me make her a drink.<BR><BR>If you bring me some <font color='#0080FF'><A href=\"markmap:loc=7002#-38335.6172,46082.5313,1267.9902&type=1&name=Dewdrop Buds\">dewdrop buds</A></FONT>, I'll brew a dazzling cocktail. It tastes great and makes people much more receptive to suggestion. Simple!"
        - id: 7
          npcZoneId: 223
          prevId: 6
          villagerId: 1002
          pages:
            - social: 4
              content: "Perfect! Now, we lack only something of the person we're charming.<BR><BR>Don't look horrified. This is my sister—I'd never hurt her!<BR><BR>If you climb to the top of the tallest tree in eastern Pora Elinu, you'll find Sujai, Rida's maid. She should be able to obtain a <b>strand of Rida's hair</b>. Bring that back to me and we'll be set!<NEXTPAGEBUTTON>\"Why can't you go?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Because I am a princess and you are not. It would be beneath me because...it's so tall!<BR><BR>Now, hurry along!"
        - id: 8
          npcZoneId: 223
          villagerId: 1002
          pages:
            - social: 0
              content: "I just need those dewdrop buds, and this whole sordid affair is behind us! Now, off with you."
        - id: 9
          npcZoneId: 223
          prevId: 7
          villagerId: 1042
          pages:
            - social: 4
              content: "By Seren's tears, who are you?<BR><BR>Arin sent you? I can't take sides in this—I'm just a maid!<BR><BR>A strand of hair? Of course I could get that, but I'd never do anything to harm Princess Rida! I'm a loyal daughter of the kingdom!<NEXTPAGEBUTTON>\"No harm will come to her.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Well, you have an honest face, and I want the princesses to stop arguing.<BR><BR>It's just a flag! Seren guide us!<BR><BR>As you wish, <PCNAME>. Take this bracelet—it's made of her hair. So long as you do her no harm, you have my permission to use it."
        - id: 10
          npcZoneId: 223
          prevId: 9
          villagerId: 1002
          pages:
            - social: 4
              content: "You have the hair! You are a skilled negotiator indeed, <PCNAME>!<BR><BR>Please, accept this reward with the thanks of a grateful princess."
        - id: 11
          npcZoneId: 223
          villagerId: 1002
          pages:
            - social: 0
    - huntingZoneId: 121
      id: 16
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 22002
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 22002
          pages:
            - social: 1
              content: "What we need are echelon trophies. Unfortunately, you'll need to spread out across the world to find them.<BR><BR>Try these spots:<BR><BR>Balder's Temple (Normal)—{@linkcreature:425#8005#Auricadis}<BR>Balder’s Temple (1 person)—{@linkcreature:825#6000#Nightmare Glaciernus}<BR>Argon Core—{@linkcreature:426#20000#Meldita}<BR>Manaya's Core—{@linkcreature:727#2007#Shandra Manaya}"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 22002
          pages:
            - social: 4
              content: "Oh good—this token will help us become the richest power this world has ever seen!<BR><BR>Thank you!"
        - id: 4
          npcZoneId: 63
          villagerId: 22002
          pages:
            - social: 0
              content: "For profit!"
    - huntingZoneId: 121
      id: 17
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 22008
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 22008
          pages:
            - social: 1
              content: "We've got to get you trained up, <PCNAME>!<BR><BR>Oh, I know you think you've been training for a while now, but however good you think you are, you have to be better to be part of the Free Traders Collective.<BR><BR>You'll need to kill a {@linkcreature:124#102#Cyclops}, a {@linkcreature:125#103#Dracoloth}, or a {@linkcreature:126#104#Vulcan Render}. You'll get a heart token when you do.<BR><BR>Once you've finished, bring your token back."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 22008
          pages:
            - social: 4
              content: "Good job. I can already tell you're going to be an asset to the collective."
        - id: 4
          npcZoneId: 63
          villagerId: 22008
          pages:
            - social: 0
              content: "For the Free Traders Collective!"
    - huntingZoneId: 151
      id: 3
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "As you show an interest in alliances, Korino introduces you to the alliance recruiters."
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Like most secrets, everyone knows about our secret research territory. So now some powerhouses have made alliances outside the federation's rule to control the mining and distribution of noctenium.<BR><BR>These powerhouses desire a pocket realm with their own access to noctenium. No one's tried to seize this one, so they must have found pocket realms of their own."
        - id: 3
          npcZoneId: 151
          prevId: 2
          villagerId: 1003
          pages:
            - social: 4
              content: "You want to join an alliance? I'm an expert on noctenium, not alliances. But if it'll get you out of my hair, I can send you to the cities where the alliances congregate.<BR><BR>Meet with a recruiter in Velika, Allemantheia, or Kaiator. I'm sure they'd love to sell you on their power-hungry groups. Which alliance do you think you're interested in?"
        - id: 4
          npcZoneId: 151
          prevId: 2
          villagerId: 1003
          pages:
            - social: 4
              content: "I gave you a scroll to Velika. Teleport there and ask Robenit your questions about the Free Traders Collective."
        - id: 5
          npcZoneId: 151
          prevId: 2
          villagerId: 1003
          pages:
            - social: 4
              content: "You have a scroll to Allemantheia. You can teleport there and ask Lasri about the Enlightened Union."
        - id: 6
          npcZoneId: 151
          prevId: 2
          villagerId: 1003
          pages:
            - social: 4
              content: "Use the teleport scroll to Kaiator and ask Donnelly about the Iron Order."
        - id: 7
          npcZoneId: 63
          prevId: 3
          villagerId: 220044
          pages:
            - social: 4
              content: "Are you interested in an alliance?<BR><BR>Guild masters can join an alliance right away and the entire guild benefits. Guild members can only ask the guild master to make a good choice.<BR><BR>Do you have a preference? I'm sure your guild master will appreciate knowing that information."
        - id: 8
          npcZoneId: 72
          prevId: 3
          villagerId: 220046
          pages:
            - social: 4
              content: "Oh, you are interested in joining an alliance?<BR><BR> I can sign up guild masters right away. But guild members should discuss their preference with their guild master. Any guild master will appreciate such good information."
        - id: 9
          npcZoneId: 84
          prevId: 3
          villagerId: 220045
          pages:
            - social: 4
              content: "Interested in joining an alliance?<BR><BR>Only guild masters can join right away. For guild members, I suggest you talk to your guild master about which to join."
    - huntingZoneId: 487
      id: 2
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1006
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1006
          pages:
            - social: 4
              content: "It isn't enough to cut off the head to this insidious threat. We must remove their means to threaten us in the future.<BR><BR>Use this explosive to destroy any {@LinkCreature:487#102#weapon chests} in the bastion."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1007
          pages:
            - social: 4
              content: "Well done, soldier. Well done indeed.<BR><BR>Farewell."
    - huntingZoneId: 487
      id: 91
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 5
              content: "We're still mopping up Scions down in the bastion and could use some help, <PCNAME>.<BR><BR>Head into the bastion and kill {@LinkCreature:487#1001#devan assassins}, {@LinkCreature:487#1002#shamans}, {@LinkCreature:487#1003#butchers}, and {@LinkCreature:487#1004#bodyguards}.<BR><BR>Report back to me when you're done."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1032
          pages:
            - social: 5
              content: "Great to work with you again. You're an incredible soldier."
        - id: 4
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 0
              content: "The sooner you get down there, the sooner the Scions stop breathing."
    - huntingZoneId: 487
      id: 92
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 5
              content: "Some of the Scion heavy hitters still lurk in the bastion. Until we've secured those tunnels, Oblivion Woods isn't safe.<BR><BR>Take out {@LinkCreature:487#2002#bastion mystics}, {@LinkCreature:487#2003#sorcerers}, {@LinkCreature:487#2004#reapers}, {@LinkCreature:487#3001#lancers}, and {@LinkCreature:487#3002#slayers}.<BR><BR>Report back to me when you've sent 'em all back to the Dream."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1032
          pages:
            - social: 5
              content: "I'm glad we had a veteran like you around. I could've sent a squad of less-experienced soldiers to do that job—and probably lost most of them. Thanks."
        - id: 4
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 0
              content: "Don't come back until you've got enough badges to make me proud."
    - huntingZoneId: 901
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "You're quite the swashbuckling <PCCLASS:lcase>.<BR><BR>Are you ready to take on the pirate's life again?"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1256
          pages:
            - social: 0
              content: "You're quite good at this! I expected no less."
    - huntingZoneId: 901
      id: 2
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "I've been waiting for you, <PCNAME>!<BR><BR>I knew great heroes like you wouldn't miss a chance to prove their strength and honor. Ha ha!<BR><BR>Welcome to Fraywind Canyon, where heroes become legends."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1256
          pages:
            - social: 0
              content: "You're quite good at this! I expected no less."
    - huntingZoneId: 901
      id: 4
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Hey, <PCName>!<BR><BR>If you win in the Wintera snowfield, I'll give you a special gift!"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 9005
          pages:
            - social: 0
              content: "Congratulations! You won!<BR><BR>I hope you enjoyed the game.<BR><BR>Come back soon and bring more friends—Wintera only lasts so long!"
    - huntingZoneId: 901
      id: 9
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "There's never been a \"true hero\" born. Soldiers rush into battle, and fate hands them a choice. The ones that make the right choice, they're the ones who get to be heroes.<BR><BR>Onward to glory!"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1256
          pages:
            - social: 0
              content: "You did a hero's work out there, <PCNAME>. Allies and enemies alike are going to remember you for a long time."
    - huntingZoneId: 901
      id: 10
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
