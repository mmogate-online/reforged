        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "You're quite the swashbuckling <PCCLASS:lcase>.<BR><BR>Are you ready to take on the pirate's life again?"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1256
          pages:
            - social: 0
              content: "You're quite good at this! I expected no less."
    - huntingZoneId: 901
      id: 12
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Everybody knows of the values of rock candies, by now. Cutthroat Harbor is packed with treasurehunters, despite the fact not all could return safely.<BR><BR><PCNAME>, are you also seeking the treasure?<BR>If you obtain some of them, could you, please, let me have a look?<BR><BR>I will surely reciprocate!"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1256
          pages:
            - social: 0
              content: "You came back safely, what a relief. So how abou them rock candies?<BR><BR>From the looks on your face, it didn't go all too well, did it?<BR>Well, no worries. We should all glad to be alive.<BR><BR>I sincerely thank you for showing me those treasures.<BR>After all, it is not an everyday sight to see, when you can't leave the post like myself."

questStrings:
  upsert:
    - id: 1501001
      string: "Circle the Wagons"
    - id: 1501002
      string: "\"I'll leave right away.\""
    - id: 1501003
      string: "Report to Commander Samael."
    - id: 1501004
      string: "\"Of course, I'll do what I can.\""
    - id: 1501005
      string: "Report to Prefect Paka in Popolion."
    - id: 1501006
      string: "\"It's as good as done.\""
    - id: 1501007
      string: "Look for Brohua at Camp Vigilance."
    - id: 1501008
      string: "Drive back the disturbed constructs around Camp Vigilance."
    - id: 1501009
      string: "\"For the federation.\""
