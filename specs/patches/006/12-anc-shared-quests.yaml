# Classic quest bodies for the Arcadia quests the live server also carries, restated
# whole from the classic data: header, requirements, trigger and every task. The quest
# file is deleted first, by the reset spec that runs ahead of these, then built again
# here. An update cannot reach the whole difference: there is no spelling that clears a
# header value or a task item bag the classic file leaves empty, so the live value
# would survive. Each quest's briefing dialog is restated whole where it differs, and
# every quest string in the quest's id range that differs is restated beside it.
#
# 24 quests in the region stay unobtainable by prerequisite, as the classic data ships
# them: 17 carry the disabling prerequisite themselves and 7 follow one that does.
#
# provenance: ported-from-v31

