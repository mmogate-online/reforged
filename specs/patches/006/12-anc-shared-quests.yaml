questDialogs:
  upsert:
    - huntingZoneId: 3
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "The devas of Oblivion Woods were seizing control of roads and threatening the town of Crescentia. Prefect Daven sent you from Lumbertown to help protect merchants and locals from the well-armed devan brigands. You defeated the deva's assault leader, Tuebenius, and secured the trade routes."
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Mission Orders<BR><BR>Reinforcements required in Oblivion Woods to repel devan encroachment. Soldiers available for reassignment should report to Prefect Daven in Lumbertown at once."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1014
          pages:
            - social: 4
              content: "You're needed in Crescentia. Devan brigands are menacing trade routes into town, and the townspeople are afraid for their lives.<BR><BR>Take the northeast gate, and follow that road over the bridge.<BR><BR>Latton's on patrol near there, so he can help with directions to Oblivion Woods. Check in with Neacal when you get to Bulwark Camp."
        - id: 4
          npcZoneId: 60
          prevId: 3
          villagerId: 1007
          pages:
            - social: 4
              content: "Bulwark Camp? Sure. I know how to get there.<BR><BR>Cross the bridge here, and follow the path to the cave. Head through there and follow the light. You'll see Bulwark Camp on your left as you come out.<BR><BR>Easy peasy."
        - id: 5
          npcZoneId: 203
          prevId: 4
          villagerId: 1004
          pages:
            - social: 4
              content: "Welcome to Oblivion Woods. Your stay is certain to be bloody, I just hope it's THEIR blood.<BR><BR>The devas have choked off the road to Crescentia. Our job is to reopen the trade route and protect the town. If you go east from here you'll find my scout, Chama. He's going to need some help."
        - id: 6
          npcZoneId: 203
          prevId: 5
          villagerId: 1013
          pages:
            - social: 4
              content: "Neacal sent you? Outstanding! I could do this all by myself but we're suppose to share the glory and all that.<BR><BR>I'm stalking the devan commander, a bloodthirsty cur called Tuebenius. He's clever and ruthless, and he's got to die.<BR><BR>He's northeast of here, not far at all. Kill him and the devas will be confused and unorganized. We can go in and mop up what's left!"
        - id: 7
          npcZoneId: 203
          prevId: 6
          villagerId: 1004
          pages:
            - social: 4
              content: "Tuebenius is dead? Outstanding! He was the mastermind behind their strategy. With him gone, we can break through to Crescentia.<BR><BR>You punch through their lines and find Jodoc in Crescentia. I'll send word to Daven.<BR><BR>Head up the hill, then take the next road you see going south."
        - id: 8
          npcZoneId: 59
          prevId: 7
          villagerId: 1009
          pages:
            - social: 4
              content: "It's good to see a new face. Means the road to Lumbertown is open again, or at least marginally passable. I take it we have you to thank?<BR><BR>The devas have been a bloody thorn in our sides for awhile. With soldiers like you to help us, we might push back and secure the woods.<BR><BR>You have my thanks!"
    - huntingZoneId: 3
      id: 2
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 59
          villagerId: 1009
          pages:
            - social: 0
              content: "You were called upon to kill a devan warlord named Dakanius and find a young scout named Kantusa, who'd infiltrated devan territory.<BR><BR>You found Kantusa gravely wounded. She told you the devas were working with the Scions of Lok. You ventured into Deva Silva and killed Dakanius and encountered the same group you faced in Scarwood and the Island of Dawn—though you still don't know what they're after."
        - id: 2
          npcZoneId: 59
          villagerId: 1009
          pages:
            - social: 4
              content: "I appreciate you reporting in, but you'd best make your manners with Magistrate Corann. He's as anxious for news as the rest of us.<BR><BR>Don't worry. You won't be in town long. It's time to take the initiative, and you're going to be the edge Crescentia needs to win!"
        - id: 3
          npcZoneId: 59
          prevId: 2
          villagerId: 1001
          pages:
            - social: 4
              content: "Hmph. Things in Lumbertown aren't good, but that's nothing new. Of course the devas are expanding, but why now? What would they gain from controlling the roads at this moment? What stirred them up?<BR><BR>I'm giving Jodoc orders to deal with the devan menace, whatever the cost. Report back to him for orders, soldier."
        - id: 4
          npcZoneId: 59
          prevId: 3
          villagerId: 1009
          pages:
            - social: 4
              content: "We've heard tales of a deva called Dakanius. He might be their warlord or general, or at least aspire to such things.<BR><BR>The vanguards in Arcadia are watching for him. Why don't you speak with Hendry, out at Vanguard Outpost, north of the crossroads. It may be that you'll have a shot at taking out Dakanius."
        - id: 5
          npcZoneId: 59
          villagerId: 1009
          pages:
            - social: 0
              content: "I hear Magistrate Corann's got information about this Dakanius. I'd like to take a look at it. Bring it by, will you?"
        - id: 6
          npcZoneId: 203
          prevId: 4
          villagerId: 1007
          pages:
            - social: 4
              content: "You're talking about Kantusa. She volunteered to spy on the devas. She's Niralia's niece. Good girl.<BR><BR>She's in disguise deep in deva territory. She was supposed to check in yesterday, but I haven't heard from her. If you're going into Deva Silva, find her. We're worried sick."
        - id: 7
          npcZoneId: 203
          prevId: 6
          villagerId: 1030
          pages:
            - social: 4
              content: "Dakanius...cooperates with...the Scions of Lok."
        - id: 8
          npcZoneId: 203
          prevId: 7
          villagerId: 1030
          pages:
            - social: 4
              content: "He must be...stopped. Seek him out...north of Deva Silva...<BR><BR>Find {@LinkObject:32#Dakanius} and stop...him!<NEXTPAGEBUTTON>\"Don't die on me!\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "It's no use...I'm done for...<BR><BR>Avenge me...against the Scions of Lok..."
        - id: 9
          npcZoneId: 203
          prevId: 8
          villagerId: 1007
          pages:
            - social: 4
              content: "I'm glad that bastard's dead, but he wasn't worth Kantusa's life. I've never heard of these Scions of Lok, have you?<BR><BR>Oh, really? Twice now? Remarkable. I wish we knew what they wanted—what they were after.<BR><BR>Pity about Kantusa. She was a fine, brave girl.<BR><BR>Please excuse me, <PCNAME>. I have to give Niralia the bad news."
    - huntingZoneId: 5
      id: 35
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 205
          villagerId: 1022
          pages:
            - social: 0
        - id: 2
          npcZoneId: 205
          villagerId: 1022
          pages:
            - social: 0
              content: "Will you help us?<BR><BR>Pangari is great magician, very powerful, but without the <FONT COLOR='#660000'>sun essences</FONT>, for his potions, he can do nothing!<BR><BR>Sun essences can be found all around—even some monsters carry them. If you can't find any out in the field, then you might be able to buy them, but they're so expensive!"
        - id: 3
          npcZoneId: 205
          prevId: 2
          villagerId: 1022
          pages:
            - social: 0
              content: "Yay! Done, and quickly! This will help Pangari greatly.<BR><BR>Thank you, thank you!"
        - id: 4
          npcZoneId: 205
          villagerId: 1022
          pages:
            - social: 0
              content: "Ingredients? Where are the sun essences? Did you collect them?"
    - huntingZoneId: 6
      id: 2
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 206
          villagerId: 1003
          pages:
            - social: 0
              content: "After discovering devas at Mags Kulkar, you defeated Gutrend Chief Krashar and retrieved a Lok token. Now you have proof that the devas and the Scions of Lok are somehow involved with the recent Gutrend invasion."
        - id: 2
          npcZoneId: 206
          villagerId: 1003
          pages:
            - social: 4
              content: "Gutrends are not usually this aggressive—we've never had them take out an entire village before.<BR><BR>Lisadore has been observing them in their territory. She may have some information by now if you can find her."
        - id: 3
          npcZoneId: 206
          prevId: 2
          villagerId: 1041
          pages:
            - social: 4
              content: "Sozia sent you out here, did she? Good. My scout Ethia reported that the Gutrends might have some sort of special weapons.<BR><BR>Take out a few of the Gutrend {@LinkCreature:6#2061#sentries} and {@LinkCreature:6#2051#reapers}. Let's see if we can find anything unusual."
        - id: 4
          npcZoneId: 206
          prevId: 3
          villagerId: 1041
          pages:
            - social: 4
              content: "These look like ordinary kulkari sticks and stones to me. <BR><BR>Ethia's scouting around Mags Kulkari, due south from here. See if you can figure out what she's on about."
        - id: 5
          npcZoneId: 206
          villagerId: 1041
          pages:
            - social: 0
              content: "Let's look at weapons from a different group this time.<BR><BR>Bring them from the Gutrend {@LinkCreature:6#2061#sentries} and {@LinkCreature:6#2051#reapers}."
        - id: 6
          npcZoneId: 206
          prevId: 4
          villagerId: 1006
          pages:
            - social: 4
              content: "Well, if she read the reports I've been sending...<BR><BR>What I said was, I've seen kulkari moving a lot of heavy {@LinkObject:33#crates} into Mags Kulkar. My guess is it's weapons, and not those stone things they're using now.<BR><BR>Break open a few and bring me some proof.<NEXTPAGEBUTTON>\"You want the weapons?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Yes, and find {@LinkCreature:6#7031#Krashar}, the chief. He'll know where those crates are coming from.<BR><BR>Of course, I doubt he'll tell you voluntarily..."
        - id: 7
          npcZoneId: 206
          prevId: 6
          villagerId: 1006
          pages:
            - social: 4
              content: "Devas? The crates were full of devas? And Krashar's dead? Fine with me, as long as you got the information I need.<NEXTPAGEBUTTON>\"This is what I found.\"</NEXTPAGEBUTTON>"
            - social: 0
              content: "A crest? I don't know of any Gutrend crests...<BR><BR>It's one of Lok's! The Gutrends aren't associated with Lok—or, they weren't.<BR><BR>Hurry. Vindicator Camp needs to know that devas and Scions of Lok are involved with the Gutrends! Take this to Crevan there."
        - id: 8
          npcZoneId: 206
          villagerId: 1006
          pages:
            - social: 0
              content: "Have you found anything? We have to find out what's going on!"
        - id: 9
          npcZoneId: 206
          prevId: 7
          villagerId: 1021
          pages:
            - social: 4
              content: "A crest of Lok! You found this on Krashar? That's...well, that's very odd.<BR><BR>I'm not entirely sure what it means. But I intend to find out."
        - id: 10
          npcZoneId: 206
          villagerId: 1021
          pages:
            - social: 0
              content: "Have you found out anything about those Gutrends?"
    - huntingZoneId: 6
      id: 3
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 206
          villagerId: 1021
          pages:
            - social: 0
              content: "With the kulkari threat blunted, the federation turned its attention to an outpost controlled by the Scions of Lok.<BR><BR>Isla, who's kept tabs on the Scions, ordered you to hurt the local Scion garrison and take out their justicars, reavers, and mystics. You did so and returned to Isla, who postulated that the Scions of Lok are gathering power for a specific purpose—one that remains a mystery."
        - id: 2
          npcZoneId: 206
          villagerId: 1021
          pages:
            - social: 4
              content: "We have an officer keeping tabs on the Scions of Lok. This information would certainly be useful to her.<BR><BR>Report this to Isla at the Valselok Shrine."
        - id: 3
          npcZoneId: 206
          prevId: 2
          villagerId: 1042
          pages:
            - social: 4
              content: "These Scions are keeping busy. They've blocked this pass for nearly a week. Whatever they're doing inside, they don't want others to see it.<NEXTPAGEBUTTON>\"We must get in there!\"</NEXTPAGEBUTTON>"
            - social: 0
              content: "Agreed, but we need to do more than gather information. Kill any {@LinkCreature:6#3011#Scion justicars}, and {@LinkCreature:6#3031#Lokian reavers} and {@LinkCreature:6#3032#mystics}.<BR><BR>Weakening their forces now can only help us. After all, at some point we're going to have to dig them out of this little grotto.<BR><BR>Take the field!"
        - id: 4
          npcZoneId: 206
          villagerId: 1042
          pages:
            - social: 0
              content: "Did you get through to the shrine? Did you thin out their ranks?"
        - id: 5
          npcZoneId: 206
          prevId: 3
          villagerId: 1042
          pages:
            - social: 4
              content: "This is the fourth group of Scions you've come across. If what you've told me is true, they're not just carving out a place for themselves—they're collecting something.<BR><BR>I'm just a simple soldier, but you first prepare for a fight by gathering the resources necessary for it. Perhaps the Scions are doing the same.<BR><BR>Perhaps they have plans for the power they're gathering...."
    - huntingZoneId: 6
      id: 4
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 206
          villagerId: 1042
          pages:
            - social: 0
              content: "Isla asked you to kill Dakarius—a Scion leader—and recover any clues about the location of the Scion stronghold. You killed Dakarius and recovered some Scion records that talk about using the teleportal.<BR><BR>You used the teleportal and found yourself in the Bastion of Lok's armory—in Oblivion Woods! You talked with several cultists and learned that the Scions are stockpiling weapons and energy. They think they can resurrect Lok himself! You gave the information to Isla, who took it to Daven personally."
        - id: 2
          npcZoneId: 206
          villagerId: 1042
          pages:
            - social: 4
              content: "We managed to get a bit more information. Turns out the local leader is someone named {@LinkCreature:6#7041#Dakarius}. If you can get in there and get him out of the way, they'd be disorganized—vulnerable.<BR><BR>It might also be a prime chance to gather intelligence on the Scions.<NEXTPAGEBUTTON>\"I can do that.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Good. Dakarius is surely in charge of it. Once you've eliminated him, search the Altar of Anguish. If Dakarius doesn't have anything useful on him, the altar's the next logical location to find their secrets. I'm particularly interested as to the whereabouts of their stronghold."
        - id: 3
          npcZoneId: 420
          prevId: 2
          villagerId: 1002
          pages:
            - social: 0
              content: "Who are you? I haven't seen you around here before.<BR><BR>Ah, you must've come through the teleportal. Are those federation fools still flailing about? Hah! They've no idea we're in Oblivion Woods.<BR><BR>Things on our end go well. We're stocking arms and troops at a record pace and our arcanists are collecting energy at an unprecedented rate. We might be ahead of schedule!"
        - id: 4
          npcZoneId: 420
          prevId: 2
          villagerId: 1003
          pages:
            - social: 0
              content: "Hey, keener! What took you so long? Tetra is furious!<BR><BR>You don't want to anger her. Nothing says we have to gather vitae from others. Your blood can power the magic just as well...."
        - id: 5
          npcZoneId: 420
          prevId: 2
          villagerId: 1004
          pages:
            - social: 0
              content: "Our forces gather in the Bastion of Lok, away from prying eyes, but soon we'll have no need to hide.<BR><BR>Our illustrious 'ally' has kept his word and left our enemies vulnerable. If all goes well, Arcadia will be the first province to destabilize.<BR><BR>Perhaps then our prayers will be answered and Lok will be resurrected. Imagine the eternal gratitude of a god!"
        - id: 6
          npcZoneId: 420
          prevId: 3
          villagerId: 1005
          pages:
            - social: 4
              content: "Why the disgusting disguises? Never mind. Why are there two keeners here? I've never seen your dumb face before and the other one before looked even dumber. We need to start recruiting a better class of believers.<NEXTPAGEBUTTON>\"What other one?\"</NEXTPAGEBUTTON>"
            - social: 0
              content: "What? You didn't come with her? Over near the teleportal. She's gawking at everything like it's a mystery to her how it came to be here.<BR><BR>Get her where she needs to be. I don't have time to play nursemaid to you all! Blast and damnation, what do they see in you fools?"
        - id: 7
          npcZoneId: 420
          prevId: 6
          villagerId: 1006
          pages:
            - social: 4
              content: "You took so long that I got worried, so I followed you. I watched you go through the teleportal. This place is incredible. What secrets does it hold?<NEXTPAGEBUTTON>\"Here's what I've learned...\"</NEXTPAGEBUTTON>"
            - social: 0
              content: "They're gathering power? Why?<BR><BR>You must be joking. Surely they don't actually think they can resurrect Lok! That's ludicrous. It would take an obscene amount of power—literally a divine amount—to do such a thing.<BR><BR>Still, they're amassing arms for something. They certainly think a fight is coming. We must be ready. I'll report this to Daven. Wish me luck!"
    - huntingZoneId: 6
      id: 5
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "You were sent to Oblivion Woods to help scout out the Bastion of Lok. You were late, however, and Hendry had already dispatched the team. You hurried to catch up, only to encounter the slain bodies of the scouting party—and one survivor.<BR><BR>The mission had failed, but the scout gave you his notes before swearing never to return to service. Hendry accepted the notes gratefully and decided to let the deserter go in peace."
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 4
              content: "Mission Orders<BR><BR>We've made the decision to take out the Bastion of Lok and hopefully put an end to their necromantic plot.<BR><BR>Report to Prefect Daven in Lumbertown."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1014
          pages:
            - social: 4
              content: "Isla's report speaks highly of you, <PCNAME>. Good work getting the Scions to speak so freely.<BR><BR>Find {@LinkCreature:203#1007#Hendry} over at the Vanguard Outpost. He's in command of the mission to scout out the Bastion of Lok. I'd like you to be a part of it.<BR><BR>For Valkyon!"
        - id: 4
          npcZoneId: 203
          prevId: 3
          villagerId: 1007
          pages:
            - social: 4
              content: "We're getting close. I can feel it. We'll hit the cult hard and take them down. To do that, though, we first have to find their base.<BR><BR>I sent out a scouting party, but they've yet to report back.<BR><BR>Their route runs through the Bestial Vale. Look for them, but be careful. We mustn't alert the Scions to our plans!"
        - id: 5
          npcZoneId: 203
          prevId: 4
          villagerId: 1026
          pages:
            - social: 0
              content: "(This is one of the scouts.<BR><BR>You see signs of an intense struggle.)"
        - id: 6
          npcZoneId: 203
          prevId: 4
          villagerId: 1027
          pages:
            - social: 0
              content: "(It's another scout.<BR><BR>Ugly wounds cover the corpse.)"
        - id: 7
          npcZoneId: 203
          prevId: 4
          villagerId: 1034
          pages:
            - social: 0
              content: "(Another dead scout.<BR><BR>Spattered blood surrounds the body.)"
        - id: 8
          npcZoneId: 203
          prevId: 5
          villagerId: 1033
          pages:
            - social: 4
              content: "No. No! Get away! Not me too. Not me too!<NEXTPAGEBUTTON>\"Calm down. What happened?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Here, take it! These are our notes about the bastion. We made it inside, but they spotted us. We ran, but not fast enough.<BR><BR>Take the notes back to Hendry. Let him do what he will. I'm not going back—not ever!"
        - id: 9
          npcZoneId: 203
          prevId: 8
          villagerId: 1007
          pages:
            - social: 4
              content: "What? Dead?<BR><BR>Blast! I felt certain they wouldn't raise an alarm—you certainly didn't.<BR><BR>As for Ausdan... Everyone has a breaking point, <PCNAME>. Once we're finished, I'll report him as killed in action.<BR><BR>Thanks for seeing this through."
        - id: 10
          npcZoneId: 203
          villagerId: 1007
          pages:
            - social: 0
              content: "Hmm?"
    - huntingZoneId: 6
      id: 22
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 206
          villagerId: 1011
          pages:
            - social: 0
        - id: 2
          npcZoneId: 206
          villagerId: 1011
          pages:
            - social: 5
              content: "Our weapons are thrashed from dealing with the Gutrends day in and day out. We need to fix them desperately, but haven't got the resources.<BR><BR>I've got so many other things to fix that I can't just leave to find the <font color='#660000'>krymetal ore</font> we need—but if you don't have any pressing business, maybe you could collect some for me?"
        - id: 3
          npcZoneId: 206
          prevId: 2
          villagerId: 1011
          pages:
            - social: 5
              content: "Excellent! This is just what I need to make the repairs! Thanks so much."
        - id: 4
          npcZoneId: 206
          villagerId: 1011
          pages:
            - social: 0
              content: "Please—without that ore, our soldiers can't fight!"

