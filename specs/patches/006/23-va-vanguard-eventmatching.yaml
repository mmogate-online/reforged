# The Vanguard Request board's activity-finder entries, one per daily quest.
#
# This patch removes the live server's Vanguard daily quests, and the world server
# resolves every `questId` on this file at load: an entry naming a quest that is not
# there stops the whole datasheet load, with no message naming the file. So the
# entries go with the quests, in the same patch, or the server does not start.
#
# provenance: policy

spec:
  version: "1.0"
  schema: v92

eventMatchingEvents:
