# The Celestial Hills escort instance, restored to the quest it hosts.
#
# The instance names its quest in four places: the restore target, both quest
# entry conditions, and the questId on every event group that scripts the escort.
# The live server had re-scripted the continent for a later story chain, and this
# patch restores the classic one, so all four must move together. They are also
# the only gate: an entrant whose quest does not match is refused with no message
# of any kind, so a half-moved gate reads in game as a teleport that does nothing.
#
# The event groups are restated whole because a dungeon's nested collections are
# replaced wholesale rather than merged. There is no way to edit one attribute of
# one event in place, so the unchanged groups are carried here verbatim.
#
# provenance: ported-from-v31

