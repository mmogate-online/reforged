# Hunting zone 7 quest rewards (quest ids 700-799), restored from the classic
# QuestCompensationData. Each upsert replaces the quest's whole reward block, so every
# block below states the reward in full. A quest whose current row already matches the
# classic source is omitted, and a quest retired from the zone has its row deleted.
# Generated, do not hand-edit.
#
# Scope is the 34 quests of this zone kept in the current era; classic rows outside that
# set are not ported.
#
# Class-scoped quests carry ONE ROW PER (templateId, class), mirroring the classic source.
# The DSL keys compensation Item rows by templateId + class + race, so duplicate
# templateIds survive an apply, while a semicolon-joined class list is rejected (E207).
# Class names are the server-side INTERNAL ones (fighter/assassin/glaiver), never the
# client CCompensation names.
#
# Rows for classes that postdate the classic data are appended: armor reuses the classic
# piece's templateId, since requiredClass already lists the new wearer, and weapons are
# that class's own weapon at the requiredLevel nearest the classic tier.
#
# QuestCompensationData has a client leg (the quest log reward panel), so this needs a sync.
#
# provenance: ported-from-v31

