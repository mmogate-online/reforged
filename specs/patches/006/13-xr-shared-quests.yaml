questDialogs:
  upsert:
    - huntingZoneId: 8
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          pages:
            - content: "Fraya asked you to track down Akasha, who kidnapped Serion, a living embodiment of the Core energy that powers high elf civilization. You arrived in Castanica, where Elleon told you that Akasha was working with gulas from the Hungry Caverns.<BR><BR>You infiltrated the Hungry Caverns, defeated the head gula, Gluorn, and discovered that Akasha had likely fled to Fyrmount."
        - id: 2
          pages:
            - social: 5
              content: "Mission Orders<BR><BR>We have received new information about the Core.<BR><BR>Report to Commander Fraya at Allemantheia Headquarters immediately."
        - id: 3
          npcZoneId: 518
          prevId: 2
          villagerId: 1001
          pages:
            - social: 5
              content: "I'll get straight to the point, <PCNAME>. Akasha has left Southern Shara, and it's almost certain she took the Core with her. I put in a word with our colleagues in Velika, and Priestess Ciebel thinks she's found Akasha already.<NEXTPAGEBUTTON>\"Let's go.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Allemantheia cannot spare me in this state. You'll have to go alone.<BR><BR>Talk to Ciebel in Velika. And hurry. Every day without the Core brings Allemantheia closer to slipping into the sands."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1167
          pages:
            - social: 5
              content: "I was hoping Fraya would send you, <PCNAME>. I sensed two powerful presences—one emanating an elven serenity, the other seething with barely suppressed rage—enter the Hungry Caverns.<NEXTPAGEBUTTON>\"And one is Akasha?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Yes. The echoes are fading, but she can't have gone far.<BR><BR>Go to Castanica first. Elleon is there."
        - id: 5
          npcZoneId: 61
          prevId: 4
          villagerId: 1104
          pages:
            - social: 5
              content: "<PCNAME>! Wherever I go, I hear of your exploits. We were blindsided in Allemantheia, but this time, we'll regain the Core.<NEXTPAGEBUTTON>\"You know where it is?\"</NEXTPAGEBUTTON>"
            - social: 5
              content: "Ciebel gave me a few leads. You know how good her sources are!<BR><BR>Someone matching Akasha's description has been seen among the gulas. It's not much, but it's a lead.<BR><BR>{@LinkCreature:61#1105#Fraya} might have more details for you."
        - id: 6
          npcZoneId: 61
          prevId: 5
          villagerId: 1105
          pages:
            - social: 5
              content: "Akasha is hiding among the gulas, and I'm not sure why. Why bring the Core here?<BR><BR>I have my own suspicions...suspicions that drew me here, even though I'm needed back home. Also, here is in the scope of Velika.<BR><BR>Regardless of my problems, we need the Core back. Check in with Smernav at the Gula Avenger Outpost. He'll get you inside the caverns."
        - id: 7
          npcZoneId: 208
          prevId: 6
          villagerId: 1002
          pages:
            - social: 5
              content: "Elleon and Fraya sent you? Well, I hope you like a good fight. The gulas will give you all you can handle.<BR><BR>The most dangerous of them is the enforcer {@LinkCreature:8#8021#Dulinka} and his mekkitar guards.<BR><BR>They're in the innermost part of the first floor; take them out, and you may gain some advantage."
        - id: 8
          npcZoneId: 208
          prevId: 7
          villagerId: 1015
          pages:
            - social: 5
              content: "Don't hurt me! It's not my fault!<BR><BR>Sure, I kept a high elf prisoner, but I didn't eat him!<BR><BR>Look at me! I'm skin and bones! The high elf smelled so...so delicious. But I was a good gula. He still has all his fingers and toes!<NEXTPAGEBUTTON>\"Where is he now?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "The high elf? Akasha has him, I bet.<BR><BR>First I was supposed to move the elf along with the supplies, but then Akasha changed plans.<BR><BR>Now the orders say just move the supplies, not the tasty, juicy elf. My ledger says so!"
        - id: 9
          npcZoneId: 61
          prevId: 8
          villagerId: 1105
          pages:
            - social: 5
              content: "The ledger confirms what we thought—Akasha has kidnapped the Core, and she's taking him to Fyrmount."
    - huntingZoneId: 9
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          pages:
            - content: "Elleon needed help proving that Samael is betraying the Valkyon Federation. Samael realized you were onto him and used Bruke to set up a trap, but you managed to escape."
        - id: 2
          pages:
            - content: "Dear <PCNAME>,<BR><BR>There might be a way to prove Samael's guilt, but it won't be easy to manage alone.<BR><BR>Let us meet in the City of Wheels.<BR><BR>For the federation!<BR><BR>—Elleon."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1166
          pages:
            - social: 4
              content: "Thanks for coming so quickly.<BR><BR>Samael has deployed the Justicars, his handpicked agents, to Ostgarath. It's the first time he's ever ordered the entire corps to one place.<BR><BR>He's up to something, and we're going to find out what. Our fame prevents us from intervening directly, but there are other ways, eh?<NEXTPAGEBUTTON>\"I'll take care of it.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Good enthusiasm, but it's not that simple. Samael didn't get this far without a certain amount of paranoia.<BR><BR>Samael won't issue orders for Ostgarath to anyone he doesn't trust, but if someone else in the chain of command sent you....<BR><BR>Consult with Priestess Ciebel. Perhaps she can facilitate the journey."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1167
          pages:
            - social: 4
              content: "Recommendation letter?<BR><BR>Anything to aid the cause of justice. We'll simply tell Samael that your unique skills are required in Ostgarath.<BR><BR>Even the general would not be so foolish as to deny a request from Velik. She doesn't appreciate it when mortals spurn her...suggestions.<BR><BR>The arc of your career is quite remarkable. We continue to watch with great interest."
        - id: 5
          npcZoneId: 63
          prevId: 4
          villagerId: 1137
          pages:
            - social: 4
              content: "So Ciebel is handling troop deployments now? You'd think praying to Velik would be a full-time job.<BR><BR>She should leave military matters to soldiers. You don't see me kneeling before the huntress statue every morning, do you?<BR><BR>If you're determined to get to Ostgarath, though, I won't stop you. Far be it from me to ignore orders from a goddess."
        - id: 6
          npcZoneId: 63
          prevId: 5
          villagerId: 1166
          pages:
            - social: 4
              content: "Ciebel remains as subtle as ever. She takes a great interest in the most promising young soldiers.<BR><BR>Head to Ostgarath and scope out the situation. Talk to the officers in Cutthroat Harbor and find Jelena, if possible.<BR><BR>She has a talent for turning up in the most interesting places, eh?"
        - id: 7
          npcZoneId: 62
          prevId: 6
          villagerId: 1001
          pages:
            - social: 12
              content: "You're from the Valkyon Federation? I was starting to believe that was a myth.<BR><BR>I mean, I can tell my children that the federation will protect us from the slave traders, but they're getting a little too old to find comfort in folktales.<BR><BR>It's all we can do to keep order in the towns. My authority doesn't reach further than the end of my staff.<BR><BR>And no, I haven't seen anyone named Jelena."
        - id: 8
          npcZoneId: 62
          prevId: 6
          villagerId: 1007
          pages:
            - social: 4
              content: "You're here to stay, right? We had a whole column of hard-looking soldiers march through here the other day, but they kept right on marching.<BR><BR>Orders, they said. Off to Mistmoor Island they went.<BR><BR>Weird place for the Justicars to go, but who really knows what they do."
        - id: 9
          npcZoneId: 62
          prevId: 6
          villagerId: 1013
          pages:
            - social: 4
              content: "Ever heard of the Kazuur Syndicate? Mostly gulas and devas working together and they're paying for information about some kind of relic.<BR><BR>Even if I knew something—which I don't—I know better than to deal with a gula.<BR><BR>When they have you for dinner, they have YOU for dinner, if you know what I mean."
        - id: 10
          npcZoneId: 62
          prevId: 6
          villagerId: 1014
          pages:
            - social: 4
              content: "Federation this, federation that. Whatever.<BR><BR>As far as I'm concerned, the federation forgot about anyone not actually fighting the argons. Cutthroat Harbor can...hic!<BR><BR>Hic! Excuse me...feelin' a little woozy...hic!<NEXTPAGEBUTTON>\"Stay awake!\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "I'm fine. Fine!<BR><BR>Watch yourself. Everyone in town seems tense. Especially those sailors who showed up a couple nights ago. Now they were an odd bunch—even for this town! Hic!"
        - id: 11
          npcZoneId: 62
          prevId: 7
          villagerId: 1018
          pages:
            - social: 4
              content: "Til victory, <PCNAME>. Have you assessed the situation around here?<NEXTPAGEBUTTON>\"Indeed I have.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "We'll look into these mysterious \"sailors.\" They must be odd indeed to stand out in Cutthroat Harbor.<BR><BR>Meanwhile, focus on the Justicars. Coordinate with Jelena. She's lurking around the outskirts of the harbor. We must discover what they're after. Samael ordered them here for a reason.<BR><BR>If it's good for him, it must be bad for us."
        - id: 12
          npcZoneId: 62
          prevId: 11
          villagerId: 1035
          pages:
            - social: 4
              content: "Good to see you, <PCNAME>. Bruke and the Justicars are definitely up to something on Mistmoor Island. I've \"intercepted\" a number of messengers recently. The messages are encoded, but the sheer volume of them suggests something big.<BR><BR>Your job is to check it out firsthand. I'm going to see whether I can make some more \"interceptions\" over at the Vindicator Base Camp.<BR><BR>{@LinkCreature:62#1038#Baliconus} will direct you to the island."
        - id: 13
          npcZoneId: 62
          prevId: 12
          villagerId: 1038
          pages:
            - social: 4
              content: "The Vindicator Base Camp? It's towards the center of Mistmoor Island. You can't miss it, but you might find the road dangerous. The Red Lash pirates are close allies of the Kazuur Syndicate and call the island home.<BR><BR>Countless dreams die on Mistmoor Island. They deal in slaves there. Compassion is, I'm afraid, in short supply."
        - id: 14
          npcZoneId: 12
          prevId: 13
          villagerId: 24
          pages:
            - social: 4
              content: "Well, well, well...if it isn't Jelena's biggest fan. I'm not surprised to see you, <PCNAME>. You turn up more often than a hungry popo.<BR><BR>Still, there's no reason you can't be of service to the Justicars. I'm on a little...diplomatic mission, shall we say? Why don't you tag along? It'd be instructive and give you a chance to show off your fighting prowess.<BR><BR>Hah! I managed to say it with a straight face."
        - id: 15
          npcZoneId: 9
          villagerId: 1
          pages:
            - content: "As a wise man once said, you've got to keep your eye on the big picture out here. There are many paths to power, <PCNAME>, and it's the victor who writes the history scrolls.<BR><BR>For example, we occasionally deal with less-than-desirable elements—it's just business, after all—but as long as we get what we want, does it really matter?<BR><BR>Walk with me and keep your weapon handy. Mistmoor can get a little rough."
        - id: 16
          npcZoneId: 212
          prevId: 14
          villagerId: 1033
          pages:
            - social: 8
              content: "Don't be alarmed—they're just gulas. We're here for business, not dinner.<BR><BR>We're making a deal for a very important relic and I want you to retrieve it for me.<BR><BR>The gulas want to control the setting, so they've chosen a site far from prying eyes. Use the teleportal.<BR><BR>Do what you're told, for once."
        - id: 17
          npcZoneId: 212
          prevId: 16
          villagerId: 1035
          pages:
            - social: 4
              content: "Something doesn't feel right... It's all too easy. <PCNAME>—Bruke might well have engineered a trap.<BR><BR>Whether we find relics or not, we must quickly find out what the Justicars are up to and make it out of here alive.<BR><BR>There's no time to waste. Use the {@LinkCreature:212#1030#teleportal} and get to the rendezvous in the Mysterious Jungle.<BR><BR>I'll scrounge up some help, but until then, you're on your own. Be careful!"
        - id: 18
          npcZoneId: 212
          prevId: 17
          villagerId: 1030
          pages:
            - social: 4
              content: "(This teleportal takes you to the rendezvous site in the Mysterious Jungle.)"
        - id: 19
          npcZoneId: 212
          prevId: 18
          villagerId: 1035
          pages:
            - social: 4
              content: "We're lucky to have made it out of there alive. Now, let's take a look at what we retrieved from Bruke.<BR><BR>What's this? Samael knew all along—this was a trap! Rather elaborate, too. Samael doesn't seem able to think three or four moves ahead. We mustn't underestimate him again.<BR><BR>Samael will no doubt seek retribution for this.<BR><BR>We must hurry!"
        - id: 20
          npcZoneId: 212
          villagerId: 1035
          pages:
            - content: "We need evidence—something incontrovertible. This mission is for naught if we can't face the deeper threat Velik warned you about."
    - huntingZoneId: 13
      id: 17
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 64
          villagerId: 1001
          pages:
            - content: "Adria and Teil thanked you for your valorous service, but said your skills are needed elsewhere.<BR><BR>They directed you to the flight master, who put you on a pegasus and sent you on a dizzying flight to Velika, where Legate Troius personally welcomed you!"
        - id: 2
          npcZoneId: 64
          villagerId: 1001
          pages:
            - social: 4
              content: "Word is spreading about everything you've done for us here, <PCNAME>. And it's reaching some very well-connected ears.<BR><BR>Report to <b>Councilor Teil</b>, he's eager to talk to you."
        - id: 3
          npcZoneId: 64
          prevId: 2
          villagerId: 1009
          pages:
            - social: 4
              content: "In the name of the Valkyon Federation, I'd like to extend our thanks for everything you've done. Adria, Sersine, and Leander speak quite highly of you.<BR><BR>The federation needs good soldiers elsewhere, however. With Karascha's death, we can make do here. It's time for you to go to Velika!<BR><NEXTPAGEBUTTON>\"Yes, sir!\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "{@linkcreature:213#1001#Taleb} will help you arrange your return to Arun.<BR><BR>He's just on the other side of this pavilion."
        - id: 4
          npcZoneId: 213
          prevId: 3
          villagerId: 1001
          pages:
            - social: 4
              content: "I've been expecting you, <PCNAME>.<BR><BR>We've adjusted your orders so that you remain on detached duty. This should let you search for Elleon without too much interference, but you're still expected to complete any orders you're given.<BR><BR>And on a personal note, I hope you enjoy the pegasus flight to Velika. There's some really impressive scenery around the city.<BR><BR>Flight Manager Leiyane will get you saddled up."
        - id: 5
          npcZoneId: 213
          prevId: 4
          villagerId: 1016
          pages:
            - social: 4
              content: "Pegasus travel is for long journeys—like back to the mainland and the capital, Velika.<BR><BR>Just click the <font color='#660000'>Take a Flight</font> button and choose your destination. It's that easy!<BR><BR>For your first trip, select <B>Velika</B> as your destination.<BR><BR>Oh, and please turn off any magical devices until you've reached your cruising altitude."
        - id: 6
          npcZoneId: 63
          prevId: 5
          villagerId: 1107
          pages:
            - social: 4
              content: "<PCNAME>! I have been waiting for you.<BR>My name is Troius, and let me be the first to welcome you to Velika the City of Glory!<BR><BR>I must admit, I haven't seen orders like yours before, but they're all filed and registered. Even Commander Seir was impressed, and sent me here to wait for your arrival."
    - huntingZoneId: 15
      id: 5
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          pages:
            - content: "Bruke issued an execution order on Jelena, and made you the executioner. Instead of bringing Bruke her head, you warned Jelena, who fled.<BR><BR>You returned to Samael in Velika just in time for him to read Bruke's scathing report on your activities in Popolion. You escaped punishment, but Samael seems to be watching you more closely than ever."
        - id: 2
          pages:
            - social: 4
              content: "Mission Orders<BR><BR>Bruke has issued an execution order for the traitor, Jelena. He demands that <PCNAME> find Jelena and bring her head to him at once."
        - id: 3
          npcZoneId: 216
          prevId: 2
          villagerId: 1032
          pages:
            - social: 4
              content: "What? Bruke issued an execution order? On me?<BR><BR>What a...charmer. \"Bring me her head?\" Who talks like that?<BR><BR>Believe me, I'm no traitor. I wish there was time to explain. Suffice it to say, justicars and rangers don't get along.<NEXTPAGEBUTTON>\"What will you do?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "What can I do? Run, obviously.<BR><BR>Tell your superiors you couldn’t find me. You won't even have to lie. Just close your eyes for the next five seconds.<BR><BR>Until we meet again, and you can bet we’ll meet again."
        - id: 4
          npcZoneId: 215
          prevId: 3
          villagerId: 1012
          pages:
            - social: 4
              content: "What? You let her get away? You incompetent fool!<BR><BR>I don’t care what you did in Sinestral Manor, this will stain your career as a soldier forever!"
        - id: 5
          npcZoneId: 215
          prevId: 4
          villagerId: 1012
          pages:
            - social: 4
              content: "I find it hard to believe she escaped without a trace. I think you're lying—I can see it in your eyes. My report will reflect that.<BR><BR>Well, you're a problem for General Samael now. Report to him immediately. Once he reads my report, you'll be lucky if you're not locked up as a traitor."
        - id: 6
          npcZoneId: 63
          prevId: 5
          villagerId: 1137
          pages:
            - social: 4
              content: "I just read Bruke's report, <PCNAME>. It says you let a known traitor escape.<BR><BR>On the other hand, it seems you were also instrumental in halting the instability there. How do I make sure you get what's coming to you? Decisions, decisions.<BR><BR>Well, you fulfilled your orders. That will have to do for now. In the future, however, if Bruke tells you to jump, you ask how high—and then jump even higher.<BR><BR>Dismissed."
    - huntingZoneId: 20
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          pages:
            - content: "Goddess Velik, the guardian deity of Velika, wished to see you. You answered Priestess Ciebel's short questions, then were granted an audience with Velik. She warned you of a hidden threat to Velika and asked for your aid."
        - id: 2
          pages:
            - content: "Mission Orders<BR><BR>Return to Velika at once and report to General Samael. All other orders are rescinded."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1137
          pages:
            - social: 4
              content: "Ah, <PCNAME>. It seems that Velik herself would like to reward you for the work you've done here.<BR><BR>{@LinkCreature:63#1167#Velik's Priestess Ciebel} is waiting for you near the idol of the goddess. I suggest you not keep her waiting."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1167
          pages:
            - social: 4
              content: "<PCNAME>, at last. What sort of soldier are you? Velik is seeking soldiers who are capable of more than simple obedience to orders. The Valkyon Federation needs champions—more than it might realize.<BR><BR>Are you a dutiful follower or an independent thinker?<NEXTPAGEBUTTON>\"A dutiful thinker.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Excellent answer! Well said.<BR><BR>There is, perhaps, a deeper need for those such as yourself than any realize just yet. Our world is coming to a turning point. How will the Dream take shape?<BR><BR>It will be soldiers like you who shall decide.<BR><BR>Thank you, <PCNAME>. A most pleasant chat.<BR><BR>Velik will see you now."
        - id: 5
          npcZoneId: 409
          prevId: 4
          villagerId: 1001
          pages:
            - social: 4
              content: "We meet at last, <PCNAME>. I've watched your brief, but illustrious, career. You've served with courage, honor, and, most importantly, compassion.<BR><BR>I have need of soldiers like you."
        - id: 6
          npcZoneId: 63
          prevId: 5
          villagerId: 1167
          pages:
            - social: 4
              content: "You've returned. Remember what the goddess said to you. You must defend the city—and the Dream itself.<BR><BR>Return now to Samael. Farewell."
        - id: 7
          npcZoneId: 63
          prevId: 6
          villagerId: 1137
          pages:
            - social: 4
              content: "Have you met the goddess?<NEXTPAGEBUTTON>\"I have.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "You should be humbled. She doesn't meet with just anyone, you know.<BR><BR>She must see something special in you.<BR><BR>I wonder what. Hah!"
    - huntingZoneId: 20
      id: 2
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 1137
          pages:
            - content: "Samael is under orders to investigate reports of a new Scion hideout in the Tenebrous Mines. He dispatched you to Chebika to coordinate with the Justicars, but the search produced nothing of value. Indeed, you became convinced the rumor was a setup of some sort.<BR><BR>The Justicars, however, ignored your remarks and insisted the threat was genuine."
        - id: 2
          npcZoneId: 63
          villagerId: 1137
          pages:
            - social: 4
              content: "Commander Seir's got a burr in his britches about these Scions of Lok. He wants someone more experienced, but I think you can handle it.<BR><BR>Reports came in about a Scion base in the Tenebrous Mines. Meet Primus Jakarian in Chebika and tell him I've given you operational command over the mission. Sack the base and kill its leaders."
        - id: 3
          npcZoneId: 65
          prevId: 2
          villagerId: 1009
          pages:
            - social: 12
              content: "Sorry to make you come all this way for nothing, but I scouted it and found nothing there. It's just an old mine with a giant weapon sticking out of it. The usual.<BR><BR>You can return to Velika, if you wish. Job well done!<NEXTPAGEBUTTON>\"I'll see for myself, thanks.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Suit yourself. Lupus is still at the mines dealing with some problem with the walking dead.<BR><BR>You can lend a hand. Head out the western gate and report to Kusbert."
        - id: 4
          npcZoneId: 65
          prevId: 3
          villagerId: 1029
          pages:
            - social: 4
              content: "Glad to see you, <PCCLASS:lcase>. The Justicars could really use an extra body in the Tenebrous Mines. Head up the hill and report to Lupus."
        - id: 5
          npcZoneId: 220
          prevId: 4
          villagerId: 1035
          pages:
            - social: 4
              content: "I'm so glad to have some help.<BR><BR>No time for recriminations, just find {@LinkCreature:20#30012000#zombie slaves} and kill them. Take anything you find to Ruanal. He's hiding in the Halls of Gloom.<BR><BR>We've much to do and no time to talk. We have to get to the bottom of this Scion mystery. Get moving!"
        - id: 6
          npcZoneId: 220
          prevId: 5
          villagerId: 1028
          pages:
            - social: 12
              content: "Thank the gods. I've been hiding for ages! Wait, you're not a justicar...how did you find me?<BR><BR>No matter. No matter. What do you have there?<NEXTPAGEBUTTON>\"Journals I found on the zombie slaves.\"</NEXTPAGEBUTTON>"
            - social: 12
              content: "This...what an incredible find. It tells the location of a Scion hidden weapon they plan to use to take over the mine!<BR><BR>Listen <PCCLASS:lcase>, it's of the utmost importance you get this intelligence to Talfryn right away. He's at the Reliquary Station in the Halls of Shadow.<BR><BR>Tell him the weapon is in the Halls of Shadow. Go now!"
        - id: 7
          npcZoneId: 220
          villagerId: 1028
          pages:
            - content: "Talfryn, Reliquary Station, Halls of Shadow—go!"
        - id: 8
          npcZoneId: 220
          prevId: 6
          villagerId: 1013
          pages:
            - social: 4
              content: "A hidden weapon you say? On the second floor...<BR><BR>I need you to get down there—and I mean now! Find that weapon, or weapons, or whatever they have down there.<BR><BR>Take what you find to Jesper in the Central Camp on the third floor.<BR><BR>Got it? Move, soldier!"
        - id: 9
          npcZoneId: 220
          prevId: 8
          villagerId: 1037
          pages:
            - content: "(There is an old hammer inside this crate.)"
        - id: 10
          npcZoneId: 220
          prevId: 8
          villagerId: 1038
          pages:
            - content: "(You find a rusty pair of scissors inside this crate.)"
        - id: 11
          npcZoneId: 220
          prevId: 9
          villagerId: 1039
          pages:
            - social: 4
              content: "These don't look like the shockingly dangerous weapons I'd have expected. Maybe they do something...else?<BR><BR>I expect there is some power within that we can't detect.<NEXTPAGEBUTTON>\"I expect we were set up.\"</NEXTPAGEBUTTON>"
            - social: 8
              content: "What? That's not possible. Just look at these weapons! They're heinous!"
        - id: 12
          npcZoneId: 220
          villagerId: 1039
          pages:
            - content: "Have you found the weapons yet?"
    - huntingZoneId: 20
      id: 3
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 220
          villagerId: 1039
          pages:
            - content: "Justicars ordered you to kill the weapons supplier hiding in the Tenebrous Mines.<BR><BR>You pursued the hooded figure, but when you caught him, hypnotic energy permeated the room and you fought! Before you could finish the Black Hood, Jelena intervened and you discovered the Black Hood to be none other than a hypnotized Elleon.<BR><BR>The supply base in the Tenebrous Mines was an elaborate ruse to kill Elleon, and you were to do the dark deed.<BR><BR>In Velika, you were chastised by Samael, who clearly wanted Elleon dead."
        - id: 2
          npcZoneId: 220
          villagerId: 1039
          pages:
            - social: 4
              content: "Now that we have the weapons, we have to cut off the source. We've heard about someone they call the Black Hood—an infamous arms smuggler. I tracked him down while you were gone. If you go through the <font color='#0080FF'><A href=\"markmap:loc=7003#-30657.6289,-34483.0313,-1932.3782&type=1&name=Door of Dimension\">teleportal</A></font> in the Halls of Utterdark, you'll find him.<BR><BR>Kill the Black Hood and report to {@LinkCreature:65#1100#Bruke} in Chebika when the deed is done.<NEXTPAGEBUTTON>\"As ordered.\"</NEXTPAGEBUTTON>"
            - social: 8
              content: "Listen closely, <PCNAME>. Above all else, at any cost, you are to kill the Black Hood—no matter who it is. They're a threat to the federation. If Samael wasn't watching out for us, they'd probably have half our enemies encamped outside Velika's gates.<BR><BR>Do your duty. Take the Black Hood out!"
        - id: 3
          npcZoneId: 421
          prevId: 2
          villagerId: 1002
          pages:
            - social: 4
              content: "It was a trap! Blast! Another wager lost to Jelena.<BR><BR>Here's what we'll do. Report back and tell them that the Black Hood got away. Don't let on that you know who I am. Let's see how they react, what their next move is.<BR><BR>We'll meet up again in Velika."
        - id: 4
          npcZoneId: 65
          prevId: 3
          villagerId: 1100
          pages:
            - social: 4
              content: "You what? Missed him?! You missed and he got away? How? Why aren't you badly wounded?<BR><BR>You've done it now. General Samael will have your guts for garters.<BR><BR>Get out of here and report back to the general."
        - id: 5
          npcZoneId: 63
          prevId: 4
          villagerId: 1137
          pages:
            - social: 12
              content: "He's not dead?! Did Lupus not make it clear that we needed you to kill him? This was our opportunity.<NEXTPAGEBUTTON>\"Well, I did destroy the supply base.\"</NEXTPAGEBUTTON>"
            - social: 12
              content: "Bah! Like that matters.<BR><BR>Just...just get out! Damn!"
        - id: 6
          npcZoneId: 63
          prevId: 5
          villagerId: 1166
          pages:
            - social: 4
              content: "He was angry, was he? Even though you destroyed the entire supply base, such as it was?<BR><BR>It's as I thought, then. He was targeting me. The \"supply base\" was a ruse!<BR><BR>That means we're on the right path, though. Samael's protecting the Scions of Lok—but why?<NEXTPAGEBUTTON>\"Perhaps he's been bribed?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Doubtful. Samael's a brute, but he considers himself honorable. He'd never accept a bribe, though that doesn't mean he isn't getting something out of an arrangement.<BR><BR>We need proof, if we're to get to the bottom of this. The investigation will continue, but remain cautious. Samael's suspicions will not be easily allayed in the future."
    - huntingZoneId: 25
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          pages:
            - content: "Despite Samael's death, and against all expectations, the Scions of Lok managed to regroup. As their first order of business, they planned to resurrect Samael and claim the magic of the ancient giants to exact their revenge against the federation.<BR><BR>Scions of Lok woke the giants and interrogated them to discover the location of the magic they sought. You rescued the giants and prevented their magic from falling into the hands of the Scions."
        - id: 2
          pages:
            - content: "Mission Orders<BR><BR>Return to Velika at once. There are new disturbing reports of Scion activity. This must be dealt with immediately.<BR><BR>—Seir"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1102
          pages:
            - social: 4
              content: "We're not sure what's going on, but the Scions of Lok were spotted gathering in the Dark Cathedral. Elleon's taking a small task force there and asked for you personally.<BR><BR>If the full extent of the Scion conspiracy was known, it would shake the Valkyon Federation to the core. Speak with Elleon and help him contain this mess.<BR><BR>Dismissed."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1168
          pages:
            - social: 4
              content: "One trustworthy ally is more valuable than an entire company of soldiers. It's good to see you again. Did Seir explain the situation?<NEXTPAGEBUTTON>\"Scions of Lok are causing trouble?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "More than ever! The Scions of Lok have pledged to bring down Velika to avenge Samael's death—and Lok's continued unliving status.<BR><BR>Jelena's rangers spotted a number of Scions in Val Aureum, specifically around the Colossal Ruins. Elsine, a dear cousin, desperately needs a masterful soldier.<BR><BR>We're sending you, though. Hah!"
        - id: 5
          npcZoneId: 66
          prevId: 4
          villagerId: 1023
          pages:
            - social: 4
              content: "Elleon speaks rather highly of you. We're grateful to have your assistance on this mission.<BR><BR>I've seen Scions of Lok rummaging through the relics in Colossal Ruins. We can't let them get their hands on anything that might bring them more power. Please explain the situation to Primus Baruch. Together, perhaps we can stop them."
        - id: 6
          npcZoneId: 66
          prevId: 5
          villagerId: 1001
          pages:
            - social: 4
              content: "Scions of Lok? Oh, that's just what we need! I've only just convinced Turrek that the federation is an asset against the kulkari. Now he'll think we drew the Scions of Lok to Tulufan.<BR><BR>Luckily you're here. It's not safe for Elsine to continue at the ruins, but I need more information about what's going on out there.<BR><BR>Tribune Kardelen's monitoring the situation right now at Camp Marrakeen. See what you can do for him!"
        - id: 7
          npcZoneId: 218
          prevId: 6
          villagerId: 1003
          pages:
            - social: 4
              content: "Welcome, <PCNAME>. I'd love to help you with your crisis but neither you nor I will get any information if we can't get closer.<BR><BR>The Desert Fire tribe has turned violent—really violent—so a direct approach is unwise! We might kill a lot of them, but they'll kill too many of us in the process.<BR><BR>Something's definitely stirred them up and I'd love to know what it is. See if you can get the Desert Fire {@LinkCreature:18#8#destroyers}, {@LinkCreature:18#3#ragers}, and {@LinkCreature:18#9#prophets} to talk. If they're not in a talking mood, we'll think of something else."
        - id: 8
          npcZoneId: 218
          prevId: 7
          villagerId: 1003
          pages:
            - social: 4
              content: "Secrets? Power? Sounds like they're involved in something big.<BR><BR>Those names...Ynorr? Surtr? Worlkir? Those sound giantish.<BR><BR>We need an expert for this. Dinian built a career on giant history. Ask him."
        - id: 9
          npcZoneId: 218
          prevId: 8
          villagerId: 1001
          pages:
            - social: 4
              content: "Those are the names of legendary giants.<BR><BR>When the gods warred against the giants' empire, these three constructed a powerful weapon and sealed it away, just in case. Then they sealed themselves away to keep the weapon's location a secret.<BR><BR>If they're talking about them...<BR><BR>Oh no! The Scions must have found the giants and are trying to recover the weapon. We have to inform Mirak at once."
        - id: 10
          npcZoneId: 218
          prevId: 9
          villagerId: 1022
          pages:
            - social: 4
              content: "It's time to get more information, and I think the Scion leaders might have just what we need. Adarak and Jerexis must have plans or orders or something.<BR><BR>As luck would have it, they were recently sighted to the west. Go. See if you can find {@LinkCreature:18#107#Adarak} and {@LinkCreature:18#108#Jerexis} and have a little chat."
        - id: 11
          npcZoneId: 218
          prevId: 10
          villagerId: 1022
          pages:
            - social: 4
              content: "According to this, the Scions of Lok found the sleeping giants. After waking them up, they bound them to an agonal stone and tortured them for information. The giants must still be alive!<BR><BR>Locate Nema and let her know. We have to find a way to save them."
        - id: 12
          npcZoneId: 218
          villagerId: 1022
          pages:
            - content: "How did they find it? How can we stop them?"
        - id: 13
          npcZoneId: 218
          prevId: 11
          villagerId: 1007
          pages:
            - social: 4
              content: "We've been trying to locate the Vault of Glory—the ruins where the giants sleep—for a while, but it seems the Scions of Lok beat us to the punch. The {@LinkCreature:218#1501#teleportal} at the center of the Temple of Tithus is most likely the entrance to the Vault of Glory.<BR><BR>You'll have to get in, eliminate the Scions of Lok and destroy the agonal stone.<BR><BR>Good luck."
        - id: 14
          npcZoneId: 218
          prevId: 13
          villagerId: 1501
          pages:
            - social: 4
              content: "(Enter the Vault of Glory and save the giants.)"
        - id: 15
          npcZoneId: 422
          prevId: 14
          villagerId: 1003
          pages:
            - social: 4
              content: "The Scions of Lok stole a tome detailing the defenses around our weapons. You must destroy that tome before they use the artifacts. It's too much power for mortals."
        - id: 16
          npcZoneId: 422
          prevId: 14
          villagerId: 1007
          pages:
            - social: 4
              content: "Our magic was second to none. We challenged the gods—and nearly won.<BR><BR>Our pride made us rush, however, and the gods united against us. They seared most of our kind from the world in a day of fire.<BR><BR>Should the Scions fulfill their dark plans, it may well happen again."
        - id: 17
          npcZoneId: 422
          prevId: 14
          villagerId: 1005
          pages:
            - social: 4
              content: "The Scions of Lok obtained the information about our magic. We held out as long as we could, but it was too much. They left us bound and in excruciating pain as punishment.<BR><BR>You must recover the tome they seek. Only when it is destroyed will we be safe from their machinations."
        - id: 18
          npcZoneId: 218
          prevId: 15
          villagerId: 1022
          pages:
            - social: 4
              content: "The Scions of Lok have already woken the sleeping giants? We're too late, then."
    - huntingZoneId: 25
      id: 5
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          pages:
            - content: "Having annihilated the Lok believers, you returned to Velika.<BR><BR>Commander Seir organized a ceremony to celebrate your achievements, and Elleon complimented you for playing a pivotal role in bringing down the Scions of Lok."
        - id: 2
          pages:
            - content: "Mission Orders<BR><BR>Report to Baruch in Tulufan when circumstances permit."
        - id: 3
          npcZoneId: 66
          prevId: 2
          villagerId: 1001
          pages:
            - social: 4
              content: "There you are! Glad to see you made it back.<BR><BR>Velika's planned an event to celebrate the defeat of the Scions of Lok! They want you there right away. Troius will be waiting for you at the pegasus platform."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1107
          pages:
            - social: 4
              content: "<PCNAME>, I heard about how you helped Elleon. Tremendous job!<BR><BR>You have to tell Uriela you're here. She wanted to talk to you."
        - id: 5
          npcZoneId: 63
          prevId: 4
          villagerId: 1101
          pages:
            - social: 4
              content: "<PCNAME>! Everyone's talking about your gallantry and heroism today!<BR><BR>Commander Seir is waiting for you inside."
        - id: 6
          npcZoneId: 63
          prevId: 5
          villagerId: 1102
          pages:
            - social: 4
              content: "You've done great work, <PCNAME>! Your toppling the Scions of Lok—again—is no mean feat.<BR><BR>We are proud to have you in our ranks. You're a credit to the service and the entire federation!<BR><BR>Elleon is looking for you as well. Don't keep him waiting."
        - id: 7
          npcZoneId: 63
          prevId: 6
          villagerId: 1169
          pages:
            - social: 4
              content: "It's hard to chastise a hero for being late to their own celebration, though we were thinking of ways to try!<BR><BR>Come! Let's not keep Seir waiting any longer. He so adores this sort of thing."
        - id: 8
          npcZoneId: 63
          prevId: 7
          villagerId: 1169
          pages:
            - social: 4
              content: "Your courage helped uncover the traitorous Samael, the insidious Scions of Lok, and not one, but two threats to kill Velik.<BR><BR>The Valkyon Federation is still in danger—our work is never done, but with allies like you, we can dream of a brighter future.<BR><BR>It's been a tremendous honor to work with you, <PCNAME>. We shall, as always, remember."
    - huntingZoneId: 27
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          pages:
            - content: "Summoned to Velika, you met with Commander Seir and Priestess Ciebel, and were briefed on the growing crisis in Allemantheia.<BR><BR>They dispatched you to the high elf capital to meet with Commander Fraya, one of the high elves' greatest heroes. Fraya explained a power struggle was underway and she hoped the influence of an outsider would stabilize things."
        - id: 2
          pages:
            - social: 5
              content: "Mission Orders<BR><BR>You are requested and required to return to Velika for immediate reassignment.<BR><BR>Report to Commander Seir as soon as possible."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1102
          pages:
            - social: 5
              content: "Welcome back, <PCNAME>. It's been too long. Reports speak well of you, as I would expect.<BR><BR>A request for assistance has come to us from Allemantheia, from a person no less notable than Fraya, one of their most distinguished commanders.<BR><BR>I can offer no details, but be delicate and be wary.<BR><BR>Also, Ciebel has asked to speak with you before you leave."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1167
          pages:
            - social: 5
              content: "You have done well thus far, <PCNAME>. Velik wishes you to know that the shadow that threatened Velika now looms over the desert, and is darker than before. Be cautious in Allemantheia—be ever watchful for the danger that lurks in the shadows."
        - id: 5
          npcZoneId: 72
          prevId: 4
          villagerId: 1132
          pages:
            - social: 5
              content: "Welcome to Allemantheia, <PCNAME>. Your flight went well?<BR><BR>The Desert Jewel is grateful for your assistance, as am I.<BR><BR>You must be wondering why you were summoned.<NEXTPAGEBUTTON>\"Very much.\"</NEXTPAGEBUTTON>"
            - social: 5
              content: "Power in Allemantheia is shared between the federation, the elders, and the Mysterium. It's a delicate balance. We need an outsider, and your name was agreed upon by all three groups.<BR><BR>The Mysterium is pleased with you after your work in the Celestial Hills, and your own commanders exult over your cunning and courage.<NEXTPAGEBUTTON>\"And the elders?\"</NEXTPAGEBUTTON>"
            - social: 5
              content: "More acquiescent than exultant. Still, that is a great victory. I don't want to give you the wrong impressions or mislead you.<BR><BR>Fraya waits to speak with you. She's not only our greatest soldier, but a true inspiration. Speak to {@LinkCreature:72#1103#Arshadh} first."
        - id: 6
          npcZoneId: 72
          prevId: 5
          villagerId: 1103
          pages:
            - social: 5
              content: "Greetings, <PCNAME>. Fraya is waiting for you inside."
        - id: 7
          npcZoneId: 518
          prevId: 6
          villagerId: 1001
          pages:
            - social: 5
              content: "Elleon's new friend arrives at last! Welcome to Allemantheia! Thank you for making the journey.<BR><BR>There are a number of issues facing this city. Some require a deft touch—an outsider's touch. Sharing power in this city is something of a dance. It's intricate, it requires exquisite timing, and if one missteps, it hurts for a long time."
        - id: 8
          npcZoneId: 518
          prevId: 7
          villagerId: 1001
          pages:
            - social: 5
              content: "As an outsider, you have certain latitude in how you conduct business. Still, there are skeptics. Your work will reflect upon us all.<BR><BR>Not that there's any pressure."
    - huntingZoneId: 84
      id: 21
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 84
          villagerId: 1217
          pages:
            - social: 0
        - id: 2
          npcZoneId: 84
          villagerId: 1217
          pages:
            - social: 4
              content: "Hey, you wouldn't want to help out some fellow soldiers, would you?<BR><BR>My comrades and I have a hankering for succulent barbecued pigling, but we've done something to piss off Tapa, the guy who sells it.<BR><BR>I think he's off his medication, but the point is, we're hungry!"
        - id: 3
          npcZoneId: 84
          prevId: 2
          villagerId: 1208
          pages:
            - social: 4
              content: "If the mouthwatering aroma of my signature sauce lead you nose-first to my shop, then I have some bad news.<BR><BR>I'm fresh out of pork, the preferred special sauce delivery method.<BR><BR>Look around. Do you see any piglings? No? Well if you want barbecue, get me some pig! You can find them just about anywhere...anywhere but here, that is."
        - id: 4
          npcZoneId: 84
          prevId: 2
          villagerId: 1208
          pages:
            - social: 4
              content: "If you hurry, I'll let you let me keep the surplus."
        - id: 5
          npcZoneId: 84
          prevId: 2
          villagerId: 1208
          pages:
            - social: 4
              content: "There's a ways to go for barbecue, yet! But it's worth the wait, I promise you."
        - id: 6
          npcZoneId: 84
          prevId: 2
          villagerId: 1208
          pages:
            - social: 4
              content: "It's astounding the lengths folks will go to for my barbecued pigling."
        - id: 7
          npcZoneId: 84
          prevId: 2
          villagerId: 1208
          pages:
            - social: 4
              content: "Wow, you must really want some barbecue! Hurry back. I have to pack up at some point."
        - id: 8
          npcZoneId: 84
          prevId: 2
          villagerId: 1208
          pages:
            - social: 5
              content: "Ah, the pig hunter returns.<BR><BR>To show my appreciation for all this extra meat you've brought me, I’m going to slice one of these guys up and throw a slab on the grill right away.<BR><BR>Won't take a minute."
        - id: 9
          npcZoneId: 84
          villagerId: 1208
          pages:
            - content: "Did you get me some pigling? The more the merrier."
        - id: 10
          npcZoneId: 84
          prevId: 8
          villagerId: 1217
          pages:
            - social: 4
              content: "Wow! You had to hunt the pigling yourself? There aren't any piglings for miles!<BR><BR>You really went above and beyond. Your dedication to the federation is...wow! We're incredibly grateful.<BR><BR>You've got new friends for life."
    - huntingZoneId: 172
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          pages:
            - content: "Prepare for a new mission by traveling to the Velika Outskirts. Help secure the supplies, then report to the airship dock."
        - id: 2
          pages:
            - social: 4
              content: "[Seir]<BR><BR>My dear friend,<BR><BR>The Mysterium traced the recent demokron incursions to Northern Arun, and believe we can send a force to investigate.<BR><BR>You have never failed the Valkyon Federation, so I call upon you again to lend us your skill. Dougal will lead this mission, but he'll need someone tough to do the dangerous part.<BR><BR>We have developed a new airship called a sky cruiser. It will ferry your mission to the north. I need you to check on the supplies, then report aboard the sky cruiser.<BR><BR>Nari, down at the docks, is expecting you.<BR><BR>~Seir"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1507
          pages:
            - social: 4
              content: "Isn't it wonderful? So much bustle and activity!<BR>What can I do for you?<NEXTPAGEBUTTON>\"Seir sent me to you.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "I see. You're going north aboard the sky cruiser? That's great!<BR><BR>It's much more powerful than our normal airships.<BR><BR>Bound for Northern Arun and adventure! Doesn't it make your heart race?<NEXTPAGEBUTTON>\"Where exactly is this sky cruiser?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "See it there, hovering to the west?<BR><BR>Listen, the sky cruiser won't leave for the next couple of hours, but I could use some help.<NEXTPAGEBUTTON>\"What do you need?\"</NEXTPAGEBUTTON>"
            - content: "We're coordinating supplies for the sky cruiser, but we've hit a few snags.<BR><BR>Jemo can put you to work. It's all for your new mission! Done talking."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1242
          pages:
            - social: 4
              content: "A sight for sore eyes! If we don't get these supplies loaded, my fur will fall out!<BR><BR>The supply wagon left before we could get the emberbloom oil. Burns slow and doesn't smoke, which makes it ideal for airships.<NEXTPAGEBUTTON>\"How much do you need?\"</NEXTPAGEBUTTON>"
            - content: "Not much! Not much!<BR><BR>See those sheep? They love to eat emberblooms. Pick a few flowers and bring them to me.<BR><BR>I'll do the rest."
        - id: 5
          npcZoneId: 63
          prevId: 4
          villagerId: 1242
          pages:
            - social: 4
              content: "Good, good. Those will do. A little squeeze....<BR><BR>Done! One crate, just like the quartermaster ordered.<BR><BR>Just one step left.<NEXTPAGEBUTTON>\"Delivering it?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "Correct!<BR><BR>A trader named Tonas just left for the airship platform. His wagon's quite slow though, so you can probably catch up.<NEXTPAGEBUTTON>\"That's all?\"</NEXTPAGEBUTTON>"
            - content: "Nothing more.<BR><BR>Thank you!"
        - id: 6
          npcZoneId: 63
          villagerId: 1242
          pages:
            - content: "You don't have enough. Keep picking emberblooms."
        - id: 7
          npcZoneId: 63
          prevId: 5
          villagerId: 1534
          pages:
            - social: 4
              content: "I didn't see it. It just came out of nowhere and smacked my wagon.<BR><BR>The horses panicked and tore their harnesses free.<BR><BR><NEXTPAGEBUTTON>\"Perhaps I can help.\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "I'm grateful, but the impact cracked my axles. I need to fix the wagon first.<BR><BR>The trouble is, I don't have anything to improvise for the repair.<NEXTPAGEBUTTON>\"So you need wood?\"</NEXTPAGEBUTTON>"
            - content: "Yes! Those ghilliedhus or mycanars might do the trick, but not without a fight.<BR><BR>I need a handful of strong boughs. See what you can do while I find my tools."
        - id: 8
          npcZoneId: 63
          prevId: 7
          villagerId: 1534
          pages:
            - social: 4
              content: "Are they gone?<NEXTPAGEBUTTON>\"Who?\"</NEXTPAGEBUTTON>"
            - social: 4
              content: "These blasted bears attacked the wagon! They ate some supplies, cracked my seat, and made me soil my pants before my guards drove them off!<BR><BR>I need to make up for the lost food.<NEXTPAGEBUTTON>\"Would bear meat do?\"</NEXTPAGEBUTTON>"
            - content: "Hah! It would indeed. Velik bless you!<BR><BR>Thank you, thank you so much!<BR><BR>You bring me some meat and I'll get these axles fixed."
        - id: 9
          npcZoneId: 63
          villagerId: 1534
          pages:
            - content: "I can't make repairs with less than five boughs. Can you get some more?"
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 1534
          pages:
            - social: 4
              content: "<PCNAME>, you're the best!<BR><BR>I'll get this shipment to the airship dock and buy some new horses.<BR><BR>Thanks. May Velik guide you on your hunt!"
        - id: 11
          npcZoneId: 63
          villagerId: 1534
          pages:
            - content: "Time is running out, soldier."
    - huntingZoneId: 172
      id: 3
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 1566
          pages:
            - content: "Help Canen preparing the recruits who will board Elkaia. The recruits seem uneasy on such long expedition."
        - id: 2
          npcZoneId: 63
          villagerId: 1566
          pages:
            - social: 4
              content: "This isn't the first mission north, you know. We sent another group not too long ago.<BR><BR>No one likes to talk about it, but we fear the worst. Take care of yourself, <PCNAME>. The federation can't afford to lose you, too.<BR><BR>Please check with Caenia to make sure all the personnel are prepared."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1532
          pages:
            - social: 4
              content: "<PCNAME>? I greet you. I've read of your exploits. Nice to work with a soldier like you.<BR><BR>Unfortunately, some of the others are as formidable as a bucket of apples. Can you round them up? I think your presence might inspire them."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1535
          pages:
            - social: 4
              content: "Stomach…cramping. Gods above, what did we eat?<BR><BR>Can’t go back… like this…<BR><BR>Find…Tilda. Bring us a cure."
        - id: 5
          npcZoneId: 63
          prevId: 4
          villagerId: 1564
          pages:
            - social: 4
              content: "Those fools! I warned them not to drink my elixirs. The concentration is too strong. They're poisoned!<NEXTPAGEBUTTON>\"What's the cure?\"</NEXTPAGEBUTTON>"
            - content: "Well, my entire stock is loaded aboard the sky cruiser. I don't have any tonics.<BR><BR>We could use macerated herbs…that is, already chewed.<BR><BR>Disgusting, I know, but it will save their lives.<BR><BR>Probably."
        - id: 6
          npcZoneId: 63
          prevId: 5
          villagerId: 1535
          pages:
            - social: 4
              content: "Ack! What foul poultice is this? It's worse than vampir blood!<BR><BR>What about Actol? Hurt, er, help him, too."
        - id: 7
          npcZoneId: 63
          villagerId: 1535
          pages:
            - content: "What did the apothecary say?"
        - id: 8
          npcZoneId: 63
          prevId: 6
          villagerId: 1536
          pages:
            - social: 4
              content: "I knew Eduyar grabbed the wrong elixir. My guts feel like a dracoloth is rampaging around inside.<BR><BR>Gack! What is this? Are you trying to speed my return to the Dream?<BR><BR>"
        - id: 9
          npcZoneId: 63
          prevId: 8
          villagerId: 1532
          pages:
            - social: 4
              content: "Poisoned? And you saved them by feeding them… Hah!<BR><BR>That'll teach them to pilfer our supplies. Nicely handled."
    - huntingZoneId: 172
      id: 4
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 1532
          pages:
            - content: "Listen about the mission from Dougal. Dougal is determined to bring success to this mission."
        - id: 2
          npcZoneId: 63
          villagerId: 1532
          pages:
            - social: 4
              content: "We can start boarding once the recruits come back.<BR><BR>I shouldn't keep Zolyn waiting. Let her know the supplies and soldiers are ready to go."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1522
          pages:
            - social: 4
              content: "Hmph. <PCNAME>. I know your reputation. Nature reaps and you're her sickle.<BR><BR>I don't suppose you know Syona, the elin princess?<NEXTPAGEBUTTON>\"I'm afraid not.\"</NEXTPAGEBUTTON>"
            - content: "No matter.<BR><BR>Well, you got our supplies squared away and our troopers back on their feet. That's more than the rest of these tuwangis can say!<BR><BR>Here's the sky cruiser's actuator. Dougal's waiting for it."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1521
          pages:
            - social: 4
              content: "Good to see you again, <PCNAME>! I'm glad we got you assigned to this mission.<NEXTPAGEBUTTON>\"This is for you.\"</NEXTPAGEBUTTON>"
            - content: "The actuator. Now we can finally leave. Excellent.<BR><BR>We're headed to Northern Arun. We believe the demokrons origin lies there…and a more personal mystery.<BR><BR>We'll talk more later."
        - id: 5
          npcZoneId: 63
          prevId: 4
          villagerId: 1521
          pages:
            - social: 4
              content: "Let's board now. I want to get under way.<BR><BR>Pyon will transport you to the ship when you're ready."
        - id: 6
          npcZoneId: 823
          prevId: 5
          villagerId: 1000
          pages:
            - social: 4
              content: "Welcome aboard! Isn't she magnificent? Larger than a sailing warship, capable of ferrying a full company of troops.<BR><BR>I'm not privy to all her secrets, but I know a lot of argon technology led to the sky cruisers."
        - id: 7
          npcZoneId: 172
          villagerId: 4
          pages:
            - content: "If you're ready, I'll show you to your cabin."
        - id: 8
          npcZoneId: 823
          prevId: 6
          villagerId: 1005
          pages:
            - social: 4
              content: "You saved Actol and I, <PCNAME>. Thank you.<BR><BR>Don't worry; no more filching elixirs for us."
    - huntingZoneId: 487
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1007
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1007
          pages:
            - social: 4
              content: "Our scouts gave up their lives for this information.<BR><BR>The report revealed the location of the <FONT COLOR='#0080FF'><A href=\"markmap:loc=7001#119975,25514,2814&type=1&name=Bastion Entrance\">bastion entrance</A></FONT> and gave us the name of their commander—{@LinkCreature:487#101}.<BR><BR>Get your final briefing from {@LinkCreature:203#1006} in {@Rgn:3005}, and then get in there."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1006
          pages:
            - social: 4
              content: "Centurion {@LinkCreature:203#1007} sent you? Good.<BR><BR>One of our scouts, {@LinkCreature:203#1033}, is in place outside the bastion. He'll point out the entrance. Once you're inside, find {@LinkCreature:487#1111}.<BR><BR>Let's take the fight to the Scions!"
        - id: 4
          npcZoneId: 203
          prevId: 3
          villagerId: 1033
          pages:
            - social: 4
              content: "Hold it right there!<NEXTPAGEBUTTON>\"I'm on your side.\"</NEXTPAGEBUTTON>"
            - social: 9
              content: "Sorry, <PCCLASS:lcase>. I'm in a lot of pain, but my eyes are still sharp.<BR><BR>The entrance is over to the right from here. Take the path on my left to the cave entrance. I've seen the enemies going in and out, probably via a <font color='#0080FF'><A href=\"markmap:loc=7001#119975,25514,2814&type=1&name=Teleportal\">teleportal</A></font>. Grapine's inside in disguise.<BR><BR>Those wretches killed most of my unit—don't be gentle with them!"
        - id: 5
          npcZoneId: 487
          prevId: 4
          villagerId: 1111
          pages:
            - social: 4
              content: "The Scions are amassing weapons and power. I don't know the whole plan, but Murdranak thinks he's going to govern Arcadia in the name of someone else.<BR><BR>How did things get so bad?<NEXTPAGEBUTTON>\"Why do they amass this power?\"</NEXTPAGEBUTTON>"
            - content: "I've heard too many stories to say for certain, but the most credible ones talk about a ritual—an apotheosis.<BR><BR>Beware, <PCNAME>—{@LinkCreature:487#101#Murdranak} commands a {@LinkCreature:487#3006#bloodbound vulcan}.<BR><BR>You'll need to kill the golem {@LinkCreature:487#1006#Soulcrusher} blocking the way first."
        - id: 6
          npcZoneId: 203
          prevId: 5
          villagerId: 1007
          pages:
            - social: 4
              content: "Their deaths bring me great comfort.<BR><BR>Dismissed!"
    - huntingZoneId: 487
      id: 21
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1022
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1022
          pages:
            - content: "Cultists in that cave, huh? Fascinating stuff.<BR><BR>Listen, though, they carry tokens with onyx set into them. Onyx is pretty valuable.<BR><BR>Bring me those tokens, and I'll gladly pay you for them."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1022
          pages:
            - social: 5
              content: "Eh, they're smaller than I'd hoped.<BR><BR>Still, you did the job, and I appreciate that. Take this, and thanks."
        - id: 4
          npcZoneId: 203
          villagerId: 1022
          pages:
            - content: "I'll pay for them. I will.<BR><BR>Go on, now."
    - huntingZoneId: 487
      id: 22
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 5
              content: "My orders are to scout out the Bastion of Lok and hit the Scions hard, but a basilisk injured my leg.<BR><BR>I can't go down there like this—I'll be dead in moments.<BR><BR>We need to strike the Scions in their lair. Will you go in my stead?"
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1032
          pages:
            - social: 5
              content: "I see bloodied badges. Excellent. That means the Scions of Lok can spend some time grieving over their dead for a change.<BR><BR>Couldn't have done it without you. Well done."
        - id: 4
          npcZoneId: 203
          villagerId: 1032
          pages:
            - content: "We must strike at the Scions of Lok. I can't do it, <PCNAME>. The mission falls to you."
    - huntingZoneId: 487
      id: 23
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 5
              content: "I don't know what the Scions are up to down there, but they've got a lot of demonic allies. Imps, to be precise.<BR><BR>If the Scions can bind demons to do their work, it'll make them tougher to defeat. Head into the bastion and kill the Scions' imps."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1032
          pages:
            - social: 5
              content: "You succeeded? Splendid!<BR><BR>I can't stand demons, even the little ones. We're well rid of them."
    - huntingZoneId: 487
      id: 24
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1032
          pages:
            - social: 5
              content: "The Scions released some hyenas with vicious bites. The wounds fester and heal slowly, keeping our troops at sick call rather than on duty.<BR><BR>Killing these hyenas will weaken the Scions and strengthen us. Make it happen...and bring me their fangs."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1032
          pages:
            - social: 5
              content: "Nasty brutes, aren't they?<BR><BR>More than a few outriders will sleep better knowing you put those beasts down."
        - id: 4
          npcZoneId: 203
          villagerId: 1032
          pages:
            - content: "I can't just take your word for it. My superiors won't take mine. Kill those hyenas and bring me their fangs."
    - huntingZoneId: 487
      id: 25
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1022
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1022
          pages:
            - social: 5
              content: "A good merchant knows how to turn a profit. I got great leather from an adventurer that came through here not so long ago.<BR><BR>Made great gloves out of it—the woodcutters just loved them.<NEXTPAGEBUTTON>\"Neat.\"</NEXTPAGEBUTTON>"
            - content: "Yes. I tried to get more of that leather to make more of those gloves, but I can't take down the animal that bears it.<BR><BR>If you can head into the cave and pick up some of that leather for me, I'll pay you very well."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1022
          pages:
            - social: 5
              content: "You've brought so much leather! Thank you! This is exactly the sort of thing I'll need."
        - id: 4
          npcZoneId: 203
          villagerId: 1022
          pages:
            - content: "I really need to get that leather. Please help me out."
    - huntingZoneId: 487
      id: 27
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 487
          villagerId: 1112
          pages:
            - social: 0
        - id: 2
          npcZoneId: 487
          villagerId: 1112
          pages:
            - content: "There is a suspicious blueprint between the books on the old bookshelf. <BR><BR>(Take the blueprint and examine it.)<BR><BR>It describes how to control the strange-looking stone in the center of the room."
        - id: 3
          npcZoneId: 487
          prevId: 2
          villagerId: 1114
          pages:
            - content: "(You follow the instructions on the blueprint, but nothing happens.)"
        - id: 4
          npcZoneId: 59
          prevId: 3
          villagerId: 1009
          pages:
            - content: "Hmm. Interesting information you've provided me. I'll see what I can do with it.<BR><BR>Thank you."
    - huntingZoneId: 487
      id: 28
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 487
          villagerId: 1113
          pages:
            - social: 0
        - id: 2
          npcZoneId: 487
          villagerId: 1113
          pages:
            - content: "(This book is written in a foreign language. Jodoc should probably see it.)"
        - id: 3
          npcZoneId: 59
          prevId: 2
          villagerId: 1009
          pages:
            - social: 5
              content: "Well, let's see. I'm not as proficient as I once was, but this appears to be a hierarchy of some kind.<BR><BR>I'll send it to Velika and see what they can make of it."
    - huntingZoneId: 605
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 4
              content: "You here to help?<NEXTPAGEBUTTON>\"Sure. What can I do for you?\"</NEXTPAGEBUTTON>"
            - content: "Can you lend a hand to {@LinkCreature:63#3002#Taratia}? She's trying to track down some crafting materials we desperately need."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
              content: "So, {@LinkCreature:63#3003#Elthienne} sent someone to help me, eh? About time!<BR><BR>For days we've been telling customers to look elsewhere for items we should have in stock.<BR><BR>Can you help me get what I need?"
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 5
              content: "Thanks. Now I can fill all those backorders.<BR><BR>Thank {@LinkCreature:63#3003#Elthienne} for sending you my way. Then pants her and kick her in the shins. Joking!"
        - id: 7
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "I need verdra fiber. You know what that is, right?"
        - id: 8
          npcZoneId: 63
          prevId: 6
          villagerId: 3002
          pages:
            - social: 5
              content: "Whoohoo! Stuff!<BR><BR>Tell {@LinkCreature:63#3003#Elthienne} this is a huge help.<BR><BR>Thanks, <PCNAME>!"
        - id: 9
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "Do you have the goods?<BR><BR>The dawnhide? I don't see it...<BR><BR>Seriously? Why in Velik's name are you still here?<BR><BR>Do you know how popular dawnhide is?"
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3003
          pages:
            - social: 4
              content: "<PCNAME>, you're entirely too helpful. Come back and be \"too helpful\" any time!<BR><BR>Seriously, we're lucky to have you around."
    - huntingZoneId: 605
      id: 2
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 4
              content: "You're a sight for sore eyes. I'm drowning in work!<BR><BR>You want to make a little extra money?<NEXTPAGEBUTTON>\"You know it.\"</NEXTPAGEBUTTON>"
            - content: "Great! {@LinkCreature:63#3002#Taratia} has a long list of simple tasks that need doing—well, as simple as anything is with her."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
              content: "Ah, perfect timing! Can you go on a little gathering mission for me?<BR><BR>Elthienne will have my horny head if I don't get some things checked off this list."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 5
              content: "This is immensely helpful. You're so amazing. I totally want to be you when I grow up. Seriously!<BR><BR>Tell {@LinkCreature:63#3003#Elthienne} what I said. Not that she'll believe it. She thinks I'm a total screw up."
        - id: 7
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "Sylva fiber? Sylva fiber, where are you? Sylva fiber? Anyone?<BR><BR>No? Darn. I guess I'll just stand around and see if any shows up."
        - id: 8
          npcZoneId: 63
          prevId: 6
          villagerId: 3002
          pages:
            - social: 5
              content: "Yes! This is the stuff. You're the best!<BR><BR>{@LinkCreature:63#3003#Elthienne} has something for you. I bet you can't guess what it is!"
        - id: 9
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "Are you hiding greenhide somewhere?"
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3003
          pages:
            - social: 4
              content: "Your reward, as promised. And a well-deserved one at that. I know working with Taratia can be...stressful."
    - huntingZoneId: 605
      id: 3
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 4
              content: "Have some time on your hands, <PCNAME>?<NEXTPAGEBUTTON>\"As a matter of fact, I do.\"</NEXTPAGEBUTTON>"
            - content: "{@LinkCreature:63#3002#Taratia} needs a hand. Poor thing only has two—as she keeps telling me. What I wouldn't give for a trained cephalopod.<BR><BR>Anyway, I'm sure she can put your idle hands to work."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
              content: "Did {@LinkCreature:63#3003#Elthienne} tell you I couldn't handle this on my own? She has some nerve. I'll show her what I'm made of, she'll see...<BR><BR>Sorry. I'm a little on edge today. I have a \"friend\" visiting from out of town.<BR><BR>All right, well go to it then."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 5
              content: "Thanks, friend.<BR><BR>{@LinkCreature:63#3003#Elthienne} has a little something for your trouble."
        - id: 7
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "Where’s the shetla fiber I asked you to get? This is making me look bad, you realize."
        - id: 8
          npcZoneId: 63
          prevId: 6
          villagerId: 3002
          pages:
            - social: 5
              content: "Ah, this is high quality rough hide. Nice work.<BR><BR>You know the drill. {@LinkCreature:63#3003#Elthienne} holds the key to the treasury."
        - id: 9
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "Did you get the rough hide? My hide will be rough if you don't get a move on."
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3003
          pages:
            - social: 4
              content: "Thanks, <PCNAME>! Taratia has you to thank for her continued employment."
    - huntingZoneId: 605
      id: 4
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 4
              content: "I never get sick of seeing your smiling face, <PCNAME>.<NEXTPAGEBUTTON>\"Nor I yours.\"</NEXTPAGEBUTTON>"
            - content: "I just love small talk, don't you? Let's stand here all day and say nice things to each other.<BR><BR>Or, you could go see if {@LinkCreature:63#3002#Taratia} has any work for you. I know how much you enjoy that."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
              content: "I know this gathering business must be utterly beneath you, but you're just here for the money anyway, right?<BR><BR>I know, I know, we're all in this together. \"For the federation\" and so forth.<BR><BR>Well, enjoy the outside world while you get today's shipments. I sure as shetla never get to see it."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 5
              content: "Toira fiber. This stuff is infinitely useful if you know what to do with it.<BR><BR>Thank you! Tell {@LinkCreature:63#3003#Elthienne} I'll have her item crafted in no time."
        - id: 7
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "Get me the toira fiber, or I swear I'll cry like a baby. You don't want to see that, do you?"
        - id: 8
          npcZoneId: 63
          prevId: 6
          villagerId: 3002
          pages:
            - social: 5
              content: "{@LinkCreature:63#3003#Elthienne} thinks this stuff is the sabertooth's nighty. She knows so little about crafting. You should see her in a workshop. It's actually pretty funny."
        - id: 9
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "You see this face? This is the face of someone who needs bloodhide."
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3003
          pages:
            - social: 4
              content: "Did {@LinkCreature:63#3002#Taratia} tell you I'm no good at crafting? That witch!<BR><BR>I made this stylish belt, I'll have you know."
    - huntingZoneId: 605
      id: 5
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 4
              content: "A copper coin for your thoughts? Specifically, what are your thoughts on gathering?<NEXTPAGEBUTTON>\"Never turn down the opportunity.\"</NEXTPAGEBUTTON>"
            - content: "I knew you'd say that.<BR><BR>{@LinkCreature:63#3002#Taratia} knows our current needs. She's my little gath-master. I just made that up."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
              content: "\"Gath-master?\" You're kidding, right? That woman, I swear.<BR><BR>As usual, I need some pretty rare materials. I know you can handle it, <PCNAME>."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 5
              content: "Amazing! It must not have been easy to get this."
        - id: 7
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "I know, luria fiber isn't easy to come by."
        - id: 8
          npcZoneId: 63
          prevId: 6
          villagerId: 3002
          pages:
            - social: 5
              content: "All right! Now I can take a break!"
        - id: 9
          npcZoneId: 63
          villagerId: 3002
          pages:
            - content: "No gravehide, no compensation. Sorry to say, it's that simple. But you already knew that."
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3003
          pages:
            - social: 4
              content: "You know what? You need an awesome nickname, too. From now on, I shall call you the Great Doer! Like, do-er, you know? Someone who does stuff?<BR><BR>Oh man, that's just terrible, isn't it?"
    - huntingZoneId: 605
      id: 6
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 4
              content: "You must be really bored. I mean, there's a war going on, and here you are chatting me up.<NEXTPAGEBUTTON>\"Yeah...\"</NEXTPAGEBUTTON>"
            - content: "I noticed it the moment I laid my eyes on you. Just a bored, lazy, no good <PCCLASS:lcase>. Heh.<BR><BR>Go ask {@LinkCreature:63#3002#Taratia} to play twenty questions with you."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
              content: "Hee-hee. Yeah, we're all going a little mad, aren't we?<BR><BR>Twenty questions is possibly the best game ever, but I need materials, and I need them delivered yesterday to Santia in the workshop.<BR><BR>So, another time?"
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 3
          villagerId: 1098
          pages:
            - social: 5
              content: "Sun essence. You ever wonder where this stuff comes from? I mean, really? Yeah, me either."
        - id: 7
          npcZoneId: 63
          villagerId: 1098
          pages:
            - content: "You don't actually have to travel to the sun to get sun essence. You know that, right?"
        - id: 8
          npcZoneId: 63
          prevId: 3
          villagerId: 1098
          pages:
            - social: 5
              content: "Thanks, <PCNAME>. Taratia was right about you. Trustworthy, fast, and efficient."
        - id: 9
          npcZoneId: 63
          villagerId: 1098
          pages:
            - content: "Are you the one Taratia sent to bring me krymetal ore? Well, where is it?"
        - id: 10
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 4
              content: "In all seriousness, one of these days we all need to get together for drinks and laughs. Someday, when all of this is over, maybe."
    - huntingZoneId: 605
      id: 7
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 4
              content: "Unbelievable!<BR><BR>I’m so busy, I don’t even have time to drink a flask of water. And here you are wandering around town with nothing to do!<NEXTPAGEBUTTON>\"That's me.\"</NEXTPAGEBUTTON>"
            - content: "{@LinkCreature:63#3002#Taratia} needs help, as usual. She's on my last nerve, I tell you."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
              content: "Thank the gods I don't trust that you're here. {@LinkCreature:63#3003#Elthienne}'s ready to kill me!<BR><BR>I'm supposed to keep track of all the materials we need for our work, and that's not even counting our general merchant supply. Hunt down the supplies, and deliver things all over town. Her expectations are ridiculous!"
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 1098
          pages:
            - social: 5
              content: "You’re pretty good at tracking down materials. Velika could use a few more like you.<BR><BR>Give {@LinkCreature:63#3002#Taratia} my thanks."
        - id: 7
          npcZoneId: 63
          villagerId: 1098
          pages:
            - content: "Why are you here? Is something wrong?"
        - id: 8
          npcZoneId: 63
          prevId: 6
          villagerId: 1098
          pages:
            - social: 5
              content: "Thank you kindly, <PCNAME>.<BR><BR>The Hands of Velika do extraordinary work. Tell {@LinkCreature:63#3002#Taratia} I said thank you."
        - id: 9
          npcZoneId: 63
          villagerId: 1098
          pages:
            - content: "You here to craft? Wait, you're the one who's bringing me the supplies from Taratia, yes?"
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3002
          pages:
            - social: 4
              content: "Great work, as usual, <PCNAME>."
    - huntingZoneId: 605
      id: 8
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 4
              content: "You'll never believe this, but {@LinkCreature:63#3002#Taratia}'s gone and got herself drunk on firewhiskey—in the middle of the day! I gave her a piece of my mind, but she's useless to me in that state.<NEXTPAGEBUTTON>\"Anything I can do?\"</NEXTPAGEBUTTON>"
            - content: "Well, give her this leather of water and see if you can get her to make enough sense to give you some of her daily tasks. She's slurring her words, but I'm sure you can manage."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
              content: "You! I love you...did I ever tell you that? No, I really love you, <PCNAME>. Lots and lots and...what? Oh, her? She's dumb! You hear that Elthienne?<BR><BR>Huh? You want to help me with stuff? Okay."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 1098
          pages:
            - social: 5
              content: "Have you seen {@LinkCreature:63#3002#Taratia} today? What's gotten into that girl? Thank you for taking over for her. She fell three times on the way here this morning. By the time she arrived, she'd lost half my order. It's probably strewn across Velika."
        - id: 7
          npcZoneId: 63
          villagerId: 1098
          pages:
            - content: "Star Essence isn't easy to get, right? <BR><BR>Sorry you have to fix Taratia's mess."
        - id: 8
          npcZoneId: 63
          prevId: 6
          villagerId: 1098
          pages:
            - social: 5
              content: "You got the normetal ore?<BR><BR>Great job. You’re pretty good.<BR>Please tell {@LinkCreature:63#3002#Taratia} that I said thank you."
        - id: 9
          npcZoneId: 63
          villagerId: 1098
          pages:
            - content: "Normetal Ore, right!<BR><BR>It was supposed to be in today's delivery."
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3002
          pages:
            - social: 4
              content: "I—I just love you!"
