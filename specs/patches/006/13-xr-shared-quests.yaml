    - huntingZoneId: 605
      id: 20
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 4
              content: "Hey, <PCCLASS:lcase>, or should I call you, \"crafty-pants?\"<BR><BR>No? Let's make a deal—you talk to {@LinkCreature:63#3003#Elthienne} and take a few things off our \"to craft\" list, and I'll just call you <PCNAME> from now on. Sound good?"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - content: "{@LinkCreature:63#3002#Taratia} called you what? I think \"Your Royal Craftiness of Craftania Kingdom\" more suits you.<BR><BR>Still not satisfied? Well, aren't you hard to please!<BR><BR>So—<PCNAME>—now that the Hand of Velika hazing portion of the day is over, how would you like to craft some items for {@LinkCreature:63#3001#Barian}? Great!"
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 7
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 8
          npcZoneId: 63
          prevId: 2
          villagerId: 3001
          pages:
            - social: 5
              content: "Look at these! They're so well crafted! I'd expect nothing less from craft royalty.<BR><BR>Ha! Word spreads fast through the Hands.<BR><BR>See {@LinkCreature:63#3002#Taratia} for more abuse, and your payment."
        - id: 9
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Make some krysteel ingots and bring them to me. It would be immensely helpful."
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3001
          pages:
            - social: 5
              content: "Nice work! Say, you wouldn't want to be the Hands of Velika court crafter, would you? No?<BR><BR>Sorry, Elthienne put me up to it. You're welcome here anytime.<BR><BR>{@LinkCreature:63#3002#Taratia} has your payment."
        - id: 11
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft some deosilex and bring your finished work to me.<BR><BR>Thank you in advance, <PCNAME>."
        - id: 12
          npcZoneId: 63
          prevId: 10
          villagerId: 3001
          pages:
            - social: 5
              content: "You're very good.<BR><BR>{@LinkCreature:63#3002#Taratia} is good, too, but you're...better. Let's just leave it at that.<BR><BR>See your crafting competition for payment."
        - id: 13
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft some salisleather and bring it back here, would you?<BR><BR>Thanks, <PCNAME>."
        - id: 14
          npcZoneId: 63
          prevId: 12
          villagerId: 3001
          pages:
            - social: 5
              content: "Thanks very much!<BR><BR>{@LinkCreature:63#3002#Taratia} will pay you for this fine work."
        - id: 15
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft some verdracloth and bring it to me.<BR><BR>Try not to have too much fun."
        - id: 16
          npcZoneId: 63
          prevId: 14
          villagerId: 3002
          pages:
            - social: 4
              content: "Not bad, <PCNAME>. Not bad at all.<BR><BR>You should know that the Hands of Velika are very impressed with your work. Come back and see us any time!"
    - huntingZoneId: 605
      id: 21
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 4
              content: "Would you like to do some crafting today? Please say \"yes!\"<BR><BR>Wonderful! It's my day off. Not officially. Actually...I told {@LinkCreature:63#3003#Elthienne} I'm sick, so I'm sure she'll need your fine crafting skills.<BR><BR>See? We both win!"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - content: "Good to see you!<BR><BR>Taratia is sick, and Barian needs a highly-skilled crafter today. Actually, I'm sure he'll be happier to work with you. And a day without Taratia bugging me is like a vacation day. Deliver your completed work to {@LinkCreature:63#3001#Barian}."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 7
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 8
          npcZoneId: 63
          prevId: 2
          villagerId: 3001
          pages:
            - social: 5
              content: "Fabulous work, as usual.<BR><BR>{@LinkCreature:63#3002#Taratia} will settle up with you. I hear she's feeling well enough to make payments."
        - id: 9
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Make linsteel ingots and bring them to me.<BR><BR>Oh, by the way, are you interested in joining the Hands of Velika? Did I already ask you that? Not interested?<BR><BR>I understand, soldier, you're very busy."
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3001
          pages:
            - social: 5
              content: "Thanks, <PCNAME>.<BR><BR>See {@LinkCreature:63#3002#Taratia} for payment. I hear she's feeling well enough to pay bills."
        - id: 11
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Make some aerosilex and bring it to me. Should be no problem if you have the chops...and I know you do."
        - id: 12
          npcZoneId: 63
          prevId: 10
          villagerId: 3001
          pages:
            - social: 5
              content: "<PCNAME>, that was fast!<BR><BR>Tell {@LinkCreature:63#3002#Taratia} I said you deserve a tip, especially as she's playing hooky today."
        - id: 13
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Make some boscleather and bring it to me as soon as you're finished. I need it for some armor I'm working on.<BR><BR> Elthienne plans to send a Hands of Velika member out on a dangerous mission. We Hands make sure our members are well-protected in the field."
        - id: 14
          npcZoneId: 63
          prevId: 12
          villagerId: 3001
          pages:
            - social: 5
              content: "I hope you'll come back soon, <PCNAME>. Your work is top-notch.<BR><BR>Oh, will you tell {@LinkCreature:63#3002#Taratia} I said she's a lying sack of hyena dung? Sure, she's sick. We can't all take a mental health day, you know."
        - id: 15
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft some sylvacloth and bring it to me.<BR><BR>Thanks for all your hard work, <PCNAME>."
        - id: 16
          npcZoneId: 63
          prevId: 14
          villagerId: 3002
          pages:
            - social: 4
              content: "Nice work. You're giving me a run for my money, that's for sure.<BR><BR>Guess I'd better not take too many \"sick\" days with you around. I'll be out of a job!"
    - huntingZoneId: 605
      id: 22
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 4
              content: "Do you ever wonder what my role is around here? All I seem to do is send you to Elthienne and then pay you when she sends you back.<BR><BR>But, I've got one job, dammit, and I'm going to do it!<BR><BR>Go see {@LinkCreature:63#3003#Elthienne}. There. Done."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - content: "About time Taratia sent you over here. That girl is such a slacker!<BR><BR>This is a high-pressure career. If it's not crafting, it's collecting parts for crafting.<BR><BR>By the way, today, it's crafting. Deliver your completed work to {@LinkCreature:63#3001#Barian}."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 7
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 8
          npcZoneId: 63
          prevId: 2
          villagerId: 3001
          pages:
            - social: 5
              content: "Thanks, <PCNAME>.<BR><BR>{@LinkCreature:63#3002#Taratia} has payment for you.<BR><BR>Hope to see you again soon!"
        - id: 9
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Make norsteel ingots and bring them to me as soon as you're able.<BR><BR>Much appreciated."
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3001
          pages:
            - social: 5
              content: "Wonderful!<BR><BR>{@LinkCreature:63#3002#Taratia} will pay you.<BR><BR>Help out again next time!"
        - id: 11
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft some astrosilex and return to me. Watch out for snakes!<BR><BR>Just kidding. There are no snakes in Velika. Had you going, though."
        - id: 12
          npcZoneId: 63
          prevId: 10
          villagerId: 3001
          pages:
            - social: 5
              content: "Thanks, <PCNAME>.<BR><BR>{@LinkCreature:63#3002#Taratia} has payment for you."
        - id: 13
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Make some marleather and bring it here.<BR><BR>Many thanks."
        - id: 14
          npcZoneId: 63
          prevId: 12
          villagerId: 3001
          pages:
            - social: 5
              content: "You've outdone yourself. Thanks a million!<BR><BR>I hope {@LinkCreature:63#3002#Taratia} is paying you what you're worth."
        - id: 15
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Make shetlacloth and deliver it to me.<BR><BR>Thanks, <PCNAME>. We don't deserve you!"
        - id: 16
          npcZoneId: 63
          prevId: 14
          villagerId: 3002
          pages:
            - social: 4
              content: "{@LinkCreature:63#3001#Barian} tells me that he's pleased with your work. In fact, everyone in the Hands of Velika appreciates your service.<BR><BR>Funny, no one ever tells me how good I am at sending you to see people.<BR><BR>Ah, well. See you around."
    - huntingZoneId: 605
      id: 23
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 4
              content: "Wow! We've sent you on a lot of boring crafting missions, but it's because your work is outstanding.<BR><BR>Rare, high quality materials are how we support the precious cause we're all fighting for, and your support to the Hands of Velika is appreciated.<BR><BR>Enough of me blubbering. Go talk to {@LinkCreature:63#3003#Elthienne}."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - content: "I hate to keep asking you, but could you craft some items for {@LinkCreature:63#3001#Barian}? Supplies are low, and we have to keep them coming in to stay in business.<BR><BR>Without our merchant trade, there would be no Hands of Velika. Yeah. We're that important."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 7
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 8
          npcZoneId: 63
          prevId: 2
          villagerId: 3001
          pages:
            - social: 5
              content: "If it isn't my favorite crafter. This looks great.<BR><BR>See {@LinkCreature:63#3002#Taratia} for your well-deserved compensation."
        - id: 9
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft celesium plate and bring it to me. It's a special order for a customer I can't let down.<BR><BR>We have to keep our customers happy, you know."
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3001
          pages:
            - social: 5
              content: "Thanks, <PCNAME>. Fine work.<BR><BR>{@LinkCreature:63#3002#Taratia} made a good call when she recruited you."
        - id: 11
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft cryosilex and deliver it to me as soon as you can.<BR><BR>You're a life-saver."
        - id: 12
          npcZoneId: 63
          prevId: 10
          villagerId: 3001
          pages:
            - social: 5
              content: "Thank you.<BR><BR>{@LinkCreature:63#3002#Taratia} has your payment."
        - id: 13
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft hemeleather and bring it here quickly.<BR><BR>But don't cut corners. I need the highest quality material you can manage."
        - id: 14
          npcZoneId: 63
          prevId: 12
          villagerId: 3001
          pages:
            - social: 5
              content: "Thanks, <PCNAME>. I wish I had a cookie to give you, to show you my gratitude.<BR><BR>{@LinkCreature:63#3002#Taratia} might have a cookie. Why don't you go ask her? Tell her I'll pay her back."
        - id: 15
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft toiracloth, and make haste!<BR><BR>These customers and their special orders are going to be the death of me."
        - id: 16
          npcZoneId: 63
          prevId: 14
          villagerId: 3002
          pages:
            - social: 4
              content: "Wow, <PCNAME>! Not only do you work hard and produce quality materials, you're fast!<BR><BR>Thanks."
    - huntingZoneId: 605
      id: 24
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3002
          pages:
            - social: 4
              content: "Soldier, my comrades and I require assistance, and you look like a pretty capable <PCCLASS:lcase>.<BR><BR>What's in it for you, you ask? Well, besides getting to know me, the Hands of Velika reward generously for a job well done.<BR><BR>If your interest is thoroughly piqued, go talk to {@LinkCreature:63#3003#Elthienne} over there."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - content: "So, you spoke to Taratia? She's persuasive, eh? That's why we keep her around! I kid. Actually, no, that is why.<BR><BR>Listen, if you want to help, we desperately need an item crafted. But this is no pair of booties for your sister's kid. We need someone highly skilled.<BR><BR>Does that describe you? Good. Deliver your completed craft to Barian. You'll be compensated, of course."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 7
          npcZoneId: 63
          prevId: 2
          villagerId: 3003
          pages:
            - social: 0
        - id: 8
          npcZoneId: 63
          prevId: 2
          villagerId: 3001
          pages:
            - social: 5
              content: "Wonderful!<BR><BR>Pay {@LinkCreature:63#3002#Taratia} another visit if you want to get paid.<BR><BR>See what I did there? \"Pay her\" to get \"paid?\" I kill me. Done talking."
        - id: 9
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Xersteel ingot. Xersteel ingot. Xersteel ingot.<BR><BR>Don't you just love the way that sounds?<BR><BR>Only thing better is the way it looks. Craft me one, will you?"
        - id: 10
          npcZoneId: 63
          prevId: 8
          villagerId: 3001
          pages:
            - social: 5
              content: "Wonderful!<BR><BR>See {@LinkCreature:63#3002#Taratia} if you want to see your reward.<BR><BR>See what I did there? \"See her\" if you want to \"see\" your reward. Wait, that wasn't funny at all."
        - id: 11
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft some galvasilex and bring it to me. Rest assured, you'll be handsomely rewarded."
        - id: 12
          npcZoneId: 63
          prevId: 10
          villagerId: 3001
          pages:
            - social: 5
              content: "Wonderful!<BR><BR>Off you go to see {@LinkCreature:63#3002#Taratia}. We're done here."
        - id: 13
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Craft cereleather. Bring it to me.<BR><BR>It couldn't be more straightforward."
        - id: 14
          npcZoneId: 63
          prevId: 12
          villagerId: 3001
          pages:
            - social: 5
              content: "Wonderful!<BR><BR>{@LinkCreature:63#3002#Taratia} has a little something for you."
        - id: 15
          npcZoneId: 63
          villagerId: 3001
          pages:
            - content: "Today's crafting job is luriacloth. Are you game, or should I just craft it myself?"
        - id: 16
          npcZoneId: 63
          prevId: 14
          villagerId: 3002
          pages:
            - social: 4
              content: "You're on fire! And coming from a castanic, that's saying a lot.<BR><BR>Your aid to the Hands of Velika and our cause will not be forgotten. Please visit us again."
    - huntingZoneId: 605
      id: 28
      voiceTypeId: 0
      texts:
        - id: 1
          pages: []
        - id: 100
          pages:
            - social: 0
        - id: 2
          pages:
            - social: 4
              content: "[Hands of Velika]<BR><BR>{@LinkCreature:63#3001#Barian}, of the Hands of Velika, wishes to see you right away. In Velika."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3001
          pages:
            - social: 4
              content: "Word of your accomplishments reached Velika some time ago, and rumors of your exploits have been spreading like wildfire ever since. That's why we called you here.<BR><BR>The Hands of Velika is a merchant group like no other. You see, in times like these, the Hands feel that upstanding members of society who wish to live to a ripe old age must wear many hats.<BR><BR>Velika's big and there's lots that needs doing during war times.<BR><BR>Your talents would be paramount to our cause—which is also your cause, <PCNAME>.<BR><BR>Will you help us?"

