            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3003
          pages:
            - social: 4
              content: "I have a job for you!<NEXTPAGEBUTTON>\"Oh yeah?\"</NEXTPAGEBUTTON>"
            - content: "Well, {@LinkCreature:63#3002#Taratia} has a job for you. But I gave her the job she's going to give to you so, in a sense, I have a job for you."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 4
              content: "<PCNAME>, I have a job for you! Well, technically, Elthienne has a job for you, cause she gives me my jobs. But I guess you knew that."
        - id: 4
          npcZoneId: 63
          prevId: 2
          villagerId: 3002
          pages:
            - social: 0
        - id: 5
          npcZoneId: 63
          prevId: 2
