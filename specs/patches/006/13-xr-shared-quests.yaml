          pages:
            - social: 4
        - id: 6
          npcZoneId: 63
          prevId: 2
          villagerId: 1098
          pages:
            - social: 5
              content: "{@LinkCreature:63#3002#Taratia} speaks highly of you. I can see why.<BR><BR> Thank you, <PCNAME>."
        - id: 7
          npcZoneId: 63
          villagerId: 1098
          pages:
            - content: "Any luck with the lightning essence?"
        - id: 8
          npcZoneId: 63
          prevId: 6
          villagerId: 1098
          pages:
