questDialogs:
  upsert:
    - huntingZoneId: 63
      id: 62
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "[Recall Order] <BR><BR>{@Rgn:63009} is supplying experienced soldiers with war horses. All soldiers who receive this message are to return to {@Rgn:63009}.<BR><BR>Consul {@LinkCreature:63#1160}"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1160
          pages:
            - social: 0
              content: "Welcome back, <PCNAME>. We figured it’s not right to let an experienced soldier like you continue walking around on foot.<BR><BR>Providing those who serve the Valkyon Federation with the supplies they need is the least we can do. Wait here. I will make the necessary arrangements for you to claim your war horse."
        - id: 4
          npcZoneId: 60
          prevId: 3
          villagerId: 1909
          pages:
            - social: 0
              content: "Are you the <PCNAME> {@Creature:63#1160} mentioned? I’ve prepared a gift for you, in the stable here. You can choose from Brownie, the bay gelding; Ash, the Arcadian dapple; or Grey, the Velikan gray. They're all good breeds, and will serve you well."
    - huntingZoneId: 63
      id: 86
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Do you know what our problem is? No, not argons. Pirates!<BR><BR>The sneaky bastards are stealing our supplies and killing good soldiers. We have to stop this.<BR><BR>The only way to deal with pirates is to think like a pirate. Join a team in Corsairs' Stronghold, and learn how those sea robbers act!<BR><BR>[Corsairs' Stronghold is accessible through the Battleground Matching system.]"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1256
          pages:
            - social: 4
              content: "Well done!<BR><BR>Great exploits in the battleground earn you Bellicarium credits. Bring those credits to me to purchase your choice of reward items. It's just like pirate's booty!<BR><BR>Don't you feel more like a pirate already?"
