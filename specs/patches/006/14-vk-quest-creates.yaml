    - huntingZoneId: 63
      id: 89
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "[Mysterious Summons]<BR><BR>If you would live your life on your terms, not those dictated by the weak, meet {@LinkCreature:63#1260} in Velika."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1260
          pages:
            - social: 0
              content: "I sense you have quite a few battles under your belt.<BR><BR>If you've the temerity to be bold, to ignore the fears of the inferior, and to strike when you wish to, speak with me again.<BR><BR>I'll guide your next steps when you're ready."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1260
          pages:
            - social: 0
              content: "Law and order are structures designed by the sheep to keep the wolves at bay. The sheep are content with their lot in life. Are you?<NEXTPAGEBUTTON>\"I'm certainly no sheep.\"</NEXTPAGEBUTTON>"
            - social: 0
              content: "Well then, seize your destiny, my friend—by force if necessary.<BR><BR>By making the <font color='#FF0000'>Outlaw Declaration</font>, you'll tell the world that you choose your own path to power.<BR><BR>Once the declaration is made, you will become an outlaw. You will be able to attack others, and they can attack you. The gods protect the truly weak, but what would be the point of troubling yourself with them?<NEXTPAGEBUTTON>\"I like real challenges.\"</NEXTPAGEBUTTON>"
            - social: 0
              content: "Be warned, my friend—the more you fight, the more your infamy grows. Depending on how infamous you get, you might end up drawing the wrath of the gods.<BR><BR>Trifling restrictions, really, and a small price to pay for freedom, I say.<BR><BR>The choice is yours...."

