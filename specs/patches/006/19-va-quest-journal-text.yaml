# The quest journal's own labels live in QuestGroupList: the region name on each hunting
# zone, the heading on each story group, and the per-quest label inside a group. The client
# schema requires all three, so once this family is projected to the client whatever the
# server holds is what a player reads, and the server rows carried Chinese and Russian text
# where the shipped client carried English. These updates put the client's own text on the
# server rows, so the projection changes memberships and nothing a player sees.
#
# provenance: policy

