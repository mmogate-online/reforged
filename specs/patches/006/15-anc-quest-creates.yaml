              content: "Oh no, could you not find them? Was my theory all wrong?<BR><BR>Oh, please look again! I want so much to find some proof to this."
    - huntingZoneId: 3
      id: 68
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 59
          villagerId: 1031
          pages:
            - social: 0
              content: "Avatar Weapon Mission Quest"
        - id: 2
          npcZoneId: 59
          villagerId: 1031
          pages:
            - social: 0
              content: "Rumor has it that the trap hunter in Crescentia, Roson, recently discovered an ancient relic with a magical power.<BR><BR>No one goes into detail about it, though! What's that about? You can't just throw out phrases like \"magical relic\" and then not give any more information!<BR><BR>Tell you what: Go to the source for me. Talk to Roson, ask her what's really going on with that relic."
        - id: 3
          npcZoneId: 59
          prevId: 2
          villagerId: 1031
          pages:
            - social: 0
              content: "What? They're saying I have a relic? How ridiculous!<BR><BR>Let this be a lesson to you: People talk before they know the whole story, and they repeat things before they ask for all the facts.<BR><BR>What I have is the general area to find pieces of relics. One piece doesn't really do anything. You have to gather a bunch of them.<NEXTPAGEBUTTON>&quot;But...gather them for what?&quot;</NEXTPAGEBUTTON>"
            - social: 0
              content: "I've recently uncovered an ancient legend about the gods and their relics.<BR><BR>If you collect enough pieces to make a whole relic, you can create an amazing weapon and acquire the power of the gods! An avatar weapon.<NEXTPAGEBUTTON>&quot;That sounds...fake.&quot;</NEXTPAGEBUTTON>"
            - social: 0
              content: "I know! But that's what my studies suggest. That's why I'm hunting for relics—I need to test this theory and see if what they say is true.<BR><BR>Except I'm having a hard time getting the relics. I've never been much of a fighter, and the relic pieces are usually found on monsters attracted to the relic energy. I'm a much better researcher.<BR><BR>But...you're an experienced fighter, right? Maybe you could...y'know. And then come back and show me what you've found?"
        - id: 4
          npcZoneId: 59
          prevId: 3
          villagerId: 1031
          pages:
            - social: 0
              content: "Did you find it? Is it true?<BR><BR>Oh, was my theory correct? I have to know!<NEXTPAGEBUTTON>&quot;Look at this.&quot;</NEXTPAGEBUTTON>"
            - social: 0
              content: "Oh my...that's incredible! Such a fine scepter...this is a true adventurer's weapon!<BR><BR>And you've confirmed my research! Thank you!<BR><BR>In return, why don't you keep this scepter? I think you would have much more use for it than I ever would.<BR><BR>There are supposed to be more relics hidden across the continent! I'll bet it wouldn't be hard for someone like you to find them all. Keep looking, and good luck on your future travels!"
        - id: 5
          npcZoneId: 59
          villagerId: 1031
          pages:
            - social: 0
              content: "Oh no, could you not find them? Was my theory all wrong?<BR><BR>Oh, please look again! I want so much to find some proof to this."
    - huntingZoneId: 6
      id: 91
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 206
          villagerId: 1020
          pages:
            - social: 0
        - id: 2
          npcZoneId: 206
          villagerId: 1020
          pages:
            - social: 0
              content: "The Gutrend tribe is wreaking havoc in the ruins of Colchester. You're to put a stop to it.<BR><BR>Kill the {@LinkCreature:6#1062#Gutrend pillagers} and {@LinkCreature:6#1061#brigands} in Colchester.<BR><BR>Report to Dakona north of Echo Ranch when your mission is complete."
        - id: 3
          npcZoneId: 206
          prevId: 2
          villagerId: 1020
          pages:
            - social: 5
              content: "Excellent work. The federation appreciates your efforts!"
        - id: 4
          npcZoneId: 206
          villagerId: 1020
          pages:
            - social: 0
              content: "I would love to reward you. Unfortunately, you have to do something useful first.<BR><BR>Come back when you have."
    - huntingZoneId: 6
      id: 92
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 206
          villagerId: 1022
          pages:
            - social: 0
        - id: 2
          npcZoneId: 206
          villagerId: 1022
          pages:
            - social: 0
              content: "The Scions of Lok have established a foothold and erected the Valselok Shrine. They must be stopped, or at least slowed.<BR><BR>Hunt down the {@LinkCreature:6#3031#Lokian reavers} and {@LinkCreature:6#3032#mystics} around the shrine.<BR><BR>Report to Embarr near the shrine when your mission is complete."
        - id: 3
          npcZoneId: 206
          prevId: 2
          villagerId: 1022
          pages:
            - social: 5
              content: "They can't let go of Lok. Why revere a dead god?<BR><BR>Anyway, let's see what you have."
        - id: 4
          npcZoneId: 206
          villagerId: 1022
          pages:
            - social: 0
              content: "It looks like you haven't completed your mission yet."
    - huntingZoneId: 6
      id: 93
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 206
          villagerId: 1021
          pages:
            - social: 0
        - id: 2
          npcZoneId: 206
          villagerId: 1021
          pages:
            - social: 0
              content: "The bear population is becoming, well, unbearable. They've got to go.<BR><BR>Hunt some {@LinkCreature:6#2041#ravenous bears} and thin out their numbers.<BR><BR>Report to Miljean at Vindicator Camp when your mission is complete."
        - id: 3
          npcZoneId: 206
          prevId: 2
          villagerId: 1009
          pages:
            - social: 5
              content: "Thank you for your hard work!"
        - id: 4
          npcZoneId: 206
          villagerId: 1009
          pages:
            - social: 0
              content: "It doesn't look like you've completed your mission yet."
    - huntingZoneId: 7
      id: 22
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 207
          villagerId: 1006
          pages:
            - social: 0
        - id: 2
          npcZoneId: 207
          villagerId: 1006
          pages:
            - social: 5
              content: "The kobolds are sneaking around to flank us from behind. The fools act like we can't see them skulking out there.<BR><BR>Kobolds are a pain in the ass but we need to keep them at bay as long as possible. Think you can cut a swath through them? If they fear us, they're not going to be so anxious to swarm our position.<BR><BR>Kill as many {@LinkCreature:7#9#Red Fang kobold minions} as you can. I doubt you'll run out."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1006
          pages:
            - social: 5
              content: "That should make them think twice, or thrice. Thanks, <PCNAME>. Perhaps we can get five minutes of sleep now."
    - huntingZoneId: 7
      id: 23
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 207
          villagerId: 1007
          pages:
            - social: 0
        - id: 2
          npcZoneId: 207
          villagerId: 1007
          pages:
            - social: 5
              content: "We can't sleep because of these bloody orcans. I'm sick of it! Drustan says we hold our position, but I need some sleep or I'll get bitchy.<BR><BR>Their encampments are to the west. Snatch some of their rations and bring them back here. When they get hungry, they'll start fighting over the food, and that's time they're not fighting us!"
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1007
          pages:
            - social: 5
              content: "Great work! I wish I could see their faces when they start running out of food.<BR><BR>Blast and damnation! That's food? Ugh. The reek is worse than a slaughterhouse. I'd eat it but I'd never get it near my mouth. We'll just burn it instead."
        - id: 4
          npcZoneId: 207
          villagerId: 1007
          pages:
            - social: 0
              content: "Let those cursed orcans snap and snarl at each other for awhile. Fetch me their food sacks and we'll see who laughs last!"
    - huntingZoneId: 7
      id: 25
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 207
          villagerId: 1013
          pages:
            - social: 0
        - id: 2
          npcZoneId: 207
          villagerId: 1013
          pages:
            - social: 5
              content: "I know Heroth's trying, but there's only so much they can do. Eventually, the orcans are going to stop debating and overrun us. My daughter deserves better than that.<BR><BR>If you could take out a couple handfuls of the {@LinkCreature:7#7#Red Fang ragers} and their minions, the {@LinkCreature:7#8#Red Fang kobolds}, the rest would fall upon each other trying to establish dominance.<BR><BR>It's not a permanent solution, but we're living hour by hour here."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1013
          pages:
            - social: 5
              content: "Our farm should be safer, for now at least. Perhaps Abelia will have one night of undisturbed sleep.<BR><BR>Thanks. Heroth and Drustan haven't given up here and neither have I. We'll make this valley green again, as my wife likes to say, and fates be damned."
    - huntingZoneId: 7
      id: 26
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 207
          villagerId: 1005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 207
          villagerId: 1005
          pages:
            - social: 5
              content: "The orcans and the kumases made reaching the Sanctum Mysterium very tricky. Their supply shipment comes from us and, as you know, we just got ours.<BR><BR>I'll put together what we can spare for them but it'll be a few days.<BR><BR>Can you talk to {@LinkCreature:207#1001#Mattin} at the Sanctum Mysterium? Let him know we've not forgotten."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1001
          pages:
            - social: 5
              content: "Supplies and good news are in rather short supply. Heroth's situation is unenviable but ours may rapidly become untenable.<BR><BR>Your message is noted. Good day."
    - huntingZoneId: 7
      id: 27
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 207
          villagerId: 1018
          pages:
            - social: 0
        - id: 2
          npcZoneId: 207
          villagerId: 1018
          pages:
            - social: 5
              content: "Hey, there! I got \"voluntold\" and I need your help. The Mysterium has demanded I thin out the kumas ranks around here.<BR><BR>Have you seen the kumases? They're huge, mean, and bloodthirsty—and those are their good qualities.<BR><BR>Look, I can't do it. I'm a lone warrior, but if you gathered some allies, I bet you could take them down. Kill an {@LinkCreature:7#3#indolent kumas} and I'll give you the reward. Deal?"
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1018
          pages:
            - social: 5
              content: "Great job. As promised, here's the reward. I hope you don't mind but I had to take credit so you could get this. I doubt they'll ask for something this big anytime soon."
    - huntingZoneId: 7
      id: 28
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 207
          villagerId: 1100
          pages:
            - social: 0
        - id: 2
          npcZoneId: 207
          villagerId: 1100
          pages:
            - social: 5
              content: "It's our job to provide protection for the Mysterium researchers, so when they need some dangerous research ingredient, it's our job to get it. Now they want kumas cores! Can you believe it?<BR><BR>I need someone highly skilled. Like you, <PCNAME>. Gather a party and get a couple cores from the {@LinkCreature:7#4#torpid kumases} for me, would you?"
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1100
          pages:
            - social: 5
              content: "Great, you've got the cores. What'll they ask for next? Only Shara knows."
        - id: 4
          npcZoneId: 207
          villagerId: 1100
          pages:
            - social: 0
              content: "Do you have the cores? These Mysterium folk are breathing down my neck."
    - huntingZoneId: 7
      id: 29
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 207
          villagerId: 1005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 207
          villagerId: 1005
          pages:
            - social: 5
              content: "Count on the Mysterium to demand military support—and then ignore our advice. I warned them the kumases are too dangerous to study up close, but they just won't listen.<BR><BR>Specifically, Siria won't. She's ambitious and brave, but what good is that if she's dead? Think you can back her up? I think you're just what she needs.<BR><BR>I've got a note for {@LinkCreature:207#1009#Siria}. See that she gets it, will you?"
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1009
          pages:
            - social: 5
              content: "Yes, yes, I heard Heroth's warning quite well. My research won't be solved from the safety of a camp. I've got to get out in the field if I'm going to make my mark!<BR><BR>So, thank you for passing along his note. Now, I have work to do."
    - huntingZoneId: 7
      id: 91
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
        - id: 2
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
              content: "Those blasted Red Fangs are pushing us too hard. I'm too pretty to fight, so I'm sending you.<BR><BR>Hunt down the {@LinkCreature:7#5#Red Fang orcans} and {@LinkCreature:7#6#fighters}.<BR><BR>Report to Kieran at Casidhe's Stand when your mission is complete."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1006
          pages:
            - social: 5
              content: "Nicely done. If I survive this place, I'll simply stun the ladies with my good looks."
        - id: 4
          npcZoneId: 207
          villagerId: 1006
          pages:
            - social: 0
              content: "It looks like you haven't completed your mission yet."
    - huntingZoneId: 7
      id: 92
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
        - id: 2
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
              content: "The Red Fangs are making their push for control by starving what's left of our people in the Celestial Hills. Mostly, they're raiding our last farm.<BR><BR>Hunt down the {@LinkCreature:7#7#Red Fang ragers} and kill them.<BR><BR>Report to Heroth at Godric's Farm when you're finished."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1005
          pages:
            - social: 5
              content: "It's good to see a soldier willing to slog through the blood and the muck to get things done."
        - id: 4
          npcZoneId: 207
          villagerId: 1005
          pages:
            - social: 0
              content: "It looks like you haven't completed your mission yet."
    - huntingZoneId: 7
      id: 93
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
        - id: 2
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
              content: "The kumases have claimed the Omphalos Plains and challenge our control of the region.<BR><BR>You are to slay {@LinkCreature:7#3#indolent} and {@LinkCreature:7#4#torpid kumases} to establish our dominance.<BR><BR>Report to Heroth at Godric's Farm when you're successful."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1005
          pages:
            - social: 5
              content: "I hate kumases. Nasty brutes. They got what they deserved. If I ever make it back to Velika, <PCNAME>, I'm buying you an ale."
        - id: 4
          npcZoneId: 207
          villagerId: 1005
          pages:
            - social: 0
              content: "It looks like you haven't completed your mission yet."
    - huntingZoneId: 7
      id: 94
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
        - id: 2
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
              content: "Our efforts to stop the Scions of Lok are hampered by their guardians. You are to take the fight to them.<BR><BR>Kill the {@LinkCreature:7#12#Lokian lancers} and {@LinkCreature:7#13#berserkers} in the Cardovek Remnants.<BR><BR>Report to Prefect Nale at the Sanctum Mysterium when your mission is complete."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1016
          pages:
            - social: 5
              content: "By the gods, you're a great asset. Where were you when we first deployed? Doesn't matter. You're here now."
        - id: 4
          npcZoneId: 207
          villagerId: 1016
          pages:
            - social: 0
              content: "It looks like you haven't completed your mission yet."
    - huntingZoneId: 7
      id: 95
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
        - id: 2
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
              content: "The Scions of Lok have reinforced their position with juggernaut mercs. You're to ensure they wasted their money.<BR><BR>Eliminate the {@LinkCreature:7#23#juggernaut mercenaries} in the eastern Cardovek Remnants.<BR><BR>Report to Prefect Nale at the Sanctum Mysterium when your mission is complete."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1016
          pages:
            - social: 5
              content: "Outstanding. You can keep doing this until it stops being funny."
        - id: 4
          npcZoneId: 207
          villagerId: 1016
          pages:
            - social: 0
              content: "It looks like you haven't completed your mission yet."
    - huntingZoneId: 7
      id: 96
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
        - id: 2
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
              content: "The nagas are working for the kumases in the Omphalos Plains. We're culling their numbers.<BR><BR>Take out the {@LinkCreature:7#1#naga mercenaries}.<BR><BR>Report to Heroth at Godric's Farm when you're successful."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1005
          pages:
            - social: 5
              content: "Good work. I feel safer already.<BR><BR>My next post better be Castanica. I've had it with this open country life."
        - id: 4
          npcZoneId: 207
          villagerId: 1005
          pages:
            - social: 0
              content: "It looks like you haven't completed your mission yet."

