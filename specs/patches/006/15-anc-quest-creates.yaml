    - huntingZoneId: 3
      id: 21
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1004
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1004
          pages:
            - social: 4
              content: "These blasted {@LinkCreature:3#1#stonebeak scavengers} keep pestering us. It's not so much that they're dangerous as they're a distraction we don't need here in Blood Run.<BR><BR>Do me a favor, get out there and kill those wretches and bring me their tail feathers. We can always use more quills."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1004
          pages:
            - social: 4
              content: "Nice work. That'll help us focus on keeping the devas contained here. We just can't afford to let them break through to Lumbertown."
        - id: 4
          npcZoneId: 203
          villagerId: 1004
          pages:
            - social: 0
              content: "Don't worry. They're harmless. Well, mostly harmless. Go get 'em."
    - huntingZoneId: 3
      id: 26
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 59
          villagerId: 1009
          pages:
            - social: 0
        - id: 2
          npcZoneId: 59
          villagerId: 1009
          pages:
            - social: 5
              content: "Our worst nightmares came to pass when the honored dead of our past came back to stalk us in the present. We need to send them back to the dark, before they become too numerous and overrun us.<BR><BR>I've got a few volunteers waiting at the edge of town. Take one and work your way through Berzerad Cemetery. Kill what you must but come back safely—both of you."
        - id: 3
          npcZoneId: 3
          villagerId: 26
          pages:
            - social: 0
              content: "I'll do my best. Just don't leave me, okay?"
        - id: 4
          npcZoneId: 59
          prevId: 2
          villagerId: 1009
          pages:
            - social: 7
              content: "Your efforts likely saved the town, if not the entire region. And you helped one of our volunteers gain some badly needed experience.<BR><BR>Good work, soldier."
    - huntingZoneId: 3
      id: 32
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 203
          villagerId: 1021
          pages:
            - social: 0
        - id: 2
          npcZoneId: 203
          villagerId: 1021
          pages:
            - social: 4
              content: "I've got an uncomfortable suspicion the devas are behind our undead problem. Unfortunately, I can't prove it.<BR><BR>Timuron mentioned an <font color='#660000'>old grave</font> where mysterious things occur in Berzerad Cemetery. If I'm right, no ordinary revenant lurks there. Investigate the grave and kill any undead you find."
        - id: 3
          npcZoneId: 203
          prevId: 2
          villagerId: 1021
          pages:
            - social: 4
              content: "I was right. The devas created a nexus spirit, which drew the other souls back from the afterlife and imprisoned them in their bodies or infected the earth spirits.<BR><BR>Thanks to you, that shouldn't be much of a problem in the future."
    - huntingZoneId: 3
      id: 61
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 59
          villagerId: 1031
          pages:
            - social: 0
              content: "Avatar Weapon Mission Quest"
        - id: 2
          npcZoneId: 59
          villagerId: 1031
          pages:
            - social: 0
              content: "Rumor has it that the trap hunter in Crescentia, Roson, recently discovered an ancient relic with a magical power.<BR><BR>No one goes into detail about it, though! What's that about? You can't just throw out phrases like \"magical relic\" and then not give any more information!<BR><BR>Tell you what: Go to the source for me. Talk to Roson, ask her what's really going on with that relic."
        - id: 3
          npcZoneId: 59
          prevId: 2
          villagerId: 1031
          pages:
            - social: 0
              content: "What? They're saying I have a relic? How ridiculous!<BR><BR>Let this be a lesson to you: People talk before they know the whole story, and they repeat things before they ask for all the facts.<BR><BR>What I have is the general area to find pieces of relics. One piece doesn't really do anything. You have to gather a bunch of them.<NEXTPAGEBUTTON>&quot;But...gather them for what?&quot;</NEXTPAGEBUTTON>"
            - social: 0
              content: "I've recently uncovered an ancient legend about the gods and their relics.<BR><BR>If you collect enough pieces to make a whole relic, you can create an amazing weapon and acquire the power of the gods! An avatar weapon.<NEXTPAGEBUTTON>&quot;That sounds...fake.&quot;</NEXTPAGEBUTTON>"
            - social: 0
              content: "I know! But that's what my studies suggest. That's why I'm hunting for relics—I need to test this theory and see if what they say is true.<BR><BR>Except I'm having a hard time getting the relics. I've never been much of a fighter, and the relic pieces are usually found on monsters attracted to the relic energy. I'm a much better researcher.<BR><BR>But...you're an experienced fighter, right? Maybe you could...y'know. And then come back and show me what you've found?"
        - id: 4
          npcZoneId: 59
          prevId: 3
          villagerId: 1031
          pages:
            - social: 0
              content: "Did you find it? Is it true?<BR><BR>Oh, was my theory correct? I have to know!<NEXTPAGEBUTTON>&quot;Look at this.&quot;</NEXTPAGEBUTTON>"
            - social: 0
              content: "Oh my...that's incredible! Such a fine pair of swords...these are true adventurer's weapons!<BR><BR>And you've confirmed my research! Thank you!<BR><BR>In return, why don't you keep these swords? I think you would have much more use for it than I ever would.<BR><BR>There are supposed to be more relics hidden across the continent! I'll bet it wouldn't be hard for someone like you to find them all. Keep looking, and good luck on your future travels!"
        - id: 5
          npcZoneId: 59
          villagerId: 1031
          pages:
            - social: 0
              content: "Oh no, could you not find them? Was my theory all wrong?<BR><BR>Oh, please look again! I want so much to find some proof to this."
