questDialogs:
  upsert:
    - huntingZoneId: 63
      id: 5
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 1107
          pages:
            - social: 0
              content: "You've become an official federation soldier. You were summoned to Velika to meet Commander Seir, the commander of the Valkyon Federation's forces.<BR><BR>Seir was impressed with you and welcomed you formally into federation service, but the real power pusher of the military, Commander Samael, doesn't seem impressed with you. He dismissed your accomplishments as mere luck."
        - id: 2
          npcZoneId: 63
          villagerId: 1107
          pages:
            - social: 4
              content: "<PCNAME>, you did fine work on the Island of Dawn. Commander Seir is anxious to speak with you. Head to the federation's headquarters and find Uriela.<BR><BR>She'll point you in the right direction. Good luck."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1101
          pages:
            - social: 4
              content: "<PCNAME>? I've heard that name, haven't I? Oh! Yes, you're one of the recruits who helped out on the island! So peculiar, that island....<BR><BR>Ah, forgive me. I'm losing track of myself. Please go in. Commander Seir is expecting you."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1102
          pages:
            - social: 4
              content: "<PCNAME>? Delighted to meet a young soldier with your gumption!<BR><BR>With the situation in Arcadia province, and soldiers so thin on the ground this far from the argon front, we need more people who can take initiative.<BR><BR>Let me formally welcome you to the ranks of the Valkyon Federation!"
        - id: 5
          npcZoneId: 63
          prevId: 4
          villagerId: 1102
          pages:
            - social: 4
              content: "Tales of your heroics on the Island of Dawn spread quickly, <PCNAME>. The federation needs you now more than ever. Are you ready for new orders?<NEXTPAGEBUTTON>\"Yes, sir!\"</NEXTPAGEBUTTON>"
            - social: 5
              content: "Splendid. Commander Samael will handle your next deployment. It was good to meet you, <PCNAME>. I look forward to reading reports of your exploits!"
        - id: 6
          npcZoneId: 63
          prevId: 5
          villagerId: 1137
          pages:
            - social: 4
              content: "Look, you did fine—if killing a bunch of piglings counts as a battle. Around here we've got real problems that need real soldiers. We've got rebellion in Arcadia, and no supplies coming from the north.<BR><BR>If you're not up to it, you put lives at risk. Gotta keep your eye on the big picture. It takes more than luck to make a soldier."
    - huntingZoneId: 63
      id: 21
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 84
          villagerId: 1132
          pages:
            - social: 0
        - id: 2
          npcZoneId: 84
          villagerId: 1132
          pages:
            - social: 5
              content: "Word's come in for you, <PCNAME>. Consul Dougal wants you back in Velika as soon as possible.<BR><BR>Something about supporting efforts on the home front. Best get moving."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1160
          pages:
            - social: 5
              content: "Thank you for coming this far, <PCNAME>. Let me cut to the chase. Supporting the war effort's affected the quality of life throughout the federation.<BR><BR>The federation's sending you and other agents to support the magistrates, gather material goods, and provide some relief.<BR><BR>Report to Magistrate Arn in Lumbertown. Show the citizens that they're just as much of a priority as the argons."
        - id: 4
          npcZoneId: 60
          prevId: 3
          villagerId: 1013
          pages:
            - social: 9
              content: "Nature provides but enemies plunder. We're short on raw materials.<BR><BR>What we need most are verdra fibers, krymetal ore, and some sun essence. Without those, it's hard to make a living around here."
        - id: 5
          npcZoneId: 60
          prevId: 4
          villagerId: 1013
          pages:
            - social: 8
              content: "This will help out a lot! We can repair our tools, tend to our lands, and heal our hurts. Thank you.<NEXTPAGEBUTTON>\"Honored to be of service.\"</NEXTPAGEBUTTON>"
            - social: 5
              content: "You're far too modest. I'm sure Magistrate Bisi will agree when he sees you. He's in Popolion, and in more dire need than we were.<BR><BR>May Velik bless you."
        - id: 6
          npcZoneId: 60
          villagerId: 1013
          pages:
            - social: 0
              content: "Times are tough for everyone. We're just asking for some help with the bare necessities."
        - id: 7
          npcZoneId: 67
          prevId: 5
          villagerId: 1015
          pages:
            - social: 9
              content: "Yes, Lumbertown's starved for raw materials. Can you help?<BR><BR>Gather sylva fibers, linmetal ore, and some essence of wind, please? There's no glory in this, but it would help us all."
        - id: 8
          npcZoneId: 67
          prevId: 7
          villagerId: 1015
          pages:
            - social: 13
              content: "Thank you so much!<BR><BR>Nature does provide—when nature has <PCNAME>'s help!<NEXTPAGEBUTTON>\"All in a day's work.\"</NEXTPAGEBUTTON>"
            - social: 5
              content: "We will never forget what you did for us. Never!<BR><BR>New orders have come in for you. Looks like you're going to Tulufan. They need you next.<BR><BR>May Seren bless you!"
        - id: 9
          npcZoneId: 67
          villagerId: 1015
          pages:
            - social: 0
              content: "You can get all I asked for from Popolion's fields. I'd go but for the monsters..."
        - id: 10
          npcZoneId: 66
          prevId: 8
          villagerId: 1009
          pages:
            - social: 5
              content: "About damned time!<BR><BR>I've written so many letters to Velika that I've probably got my own wing in the archives.<BR><BR>Our stores were stolen recently. We'll get by—if we can replenish our stocks of shetla fibers, normetal ore, and star essence.<BR><BR>Can you help?"
        - id: 11
          npcZoneId: 66
          prevId: 10
          villagerId: 1009
          pages:
            - social: 8
              content: "Not bad. Adequate even.<BR><BR>If we'd known the federation would abandon us, we'd never have joined in the first place.<NEXTPAGEBUTTON>\"We're in this together.\"</NEXTPAGEBUTTON>"
            - social: 5
              content: "Hmph. Maybe.<BR><BR>Consul Dougal says you're to head to Tria in Southern Shara next.<BR><BR>Kaia's blessings protect you, <PCNAME>."
        - id: 12
          npcZoneId: 66
          villagerId: 1009
          pages:
            - social: 0
              content: "Well, I guess we could make do with sand. Bloody useful stuff, right? Can't make clothes, can't make weapons, but it can make anyone itch!"
        - id: 13
          npcZoneId: 70
          prevId: 11
          villagerId: 1011
          pages:
            - social: 5
              content: "We're grateful for any assistance.<BR><BR>Supplies are low at the moment. In particular, we need toira fibers, shadmetal ore, and some essence of ice.<BR><BR>The federation's support is vital to our survival and success. Please help us."
        - id: 14
          npcZoneId: 70
          prevId: 13
          villagerId: 1011
          pages:
            - social: 5
              content: "This will do nicely.<BR><BR>The people of Tria found new hope. Please accept our thanks.<NEXTPAGEBUTTON>\"You're welcome.\"</NEXTPAGEBUTTON>"
            - social: 5
              content: "Prefect Lauma, in Frontera, hopes to similarly benefit from federation assistance. Safe journey!"
        - id: 15
          npcZoneId: 70
          villagerId: 1011
          pages:
            - social: 0
              content: "We know this is difficult, but we're out of options. Please help us."
        - id: 16
          npcZoneId: 75
          prevId: 14
          villagerId: 1007
          pages:
            - social: 5
              content: "Consul Dougal explained about the federation's initiative to help the outlying settlements. We need the aid.<BR><BR>We're short on luria fibers, xermetal ore, and lightning essence. Any additions to our stocks would be appreciated."
        - id: 17
          npcZoneId: 75
          prevId: 16
          villagerId: 1007
          pages:
            - social: 5
              content: "Dougal chose his assistant well. We're grateful for the help and will put these supplies to good use.<BR><BR>Dougal has also asked you to return to Velika. Farewell, <PCNAME>."
        - id: 18
          npcZoneId: 75
          villagerId: 1007
          pages:
            - social: 0
              content: "We must have raw materials to keep Frontera active and productive."
        - id: 19
          npcZoneId: 63
          prevId: 17
          villagerId: 1160
          pages:
            - social: 5
              content: "I've heard nothing but good things about you. Even Turrek is more cheerful now.<BR><BR>There were no plots foiled or great beasts vanquished, but service to others is in the highest traditions of federation service. You've done well, <PCNAME>. Thank you."
    - huntingZoneId: 63
      id: 22
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "Ah, yes, I remember those: &quot;the colorful tuwangi look without the stinky froggy smell.&quot; Those hats took lots of bloodhide, toira fibers...and one perfectly spherical fruit.<BR><BR>Sadly, the fruit has been harvested to extinction. You can't find them anywhere! Don't waste your time looking.<NEXTPAGEBUTTON>&quot;But I have one.&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "Wow! How long have you been holding onto this?<BR><BR>No, not important. All I really need to know is which color hat you want!<NEXTPAGEBUTTON>&quot;Well...&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "That perfectly round fruit just doesn't exist. I don't even think you can get them at auction any more.<BR><BR>If you don't already have the fruit, don't waste your time gathering the other components."
    - huntingZoneId: 63
      id: 23
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "I used to make these hats that were all the rage with officers and other leaders.<BR><BR>But the main component, the leadership plume—you can't find those anymore. Not unless you've been hoarding one in a bank vault somewhere.<NEXTPAGEBUTTON>&quot;Yo ho!&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "Well, I'll be! You've had this gathering dust for a while, huh?<BR><BR>Okay, I'm game: What color do you want?<NEXTPAGEBUTTON>&quot;Well...&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "Just so you know, you can't just find leadership plumes anymore. So if you don't already have one, don't waste your time."
    - huntingZoneId: 63
      id: 24
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "A hood? I don't make those anymore.<BR><BR> Luria fibers and sun essence are easy to come by, but innerlid leather? You can't even find that in a museum, these days.<NEXTPAGEBUTTON>&quot;I already have some.&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "Oh, my! You actually have some?<BR><BR>Quick! Let's make you a hood! What tailor-made color would you like?<NEXTPAGEBUTTON>&quot;Well...&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "Look: Innerlid leather only comes from the eyelids of certain breeds of dracoloth—and that particular breed doesn't exist anymore.<BR><BR>Hunted to extinction for their eyelids, of all things..."
    - huntingZoneId: 63
      id: 26
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "Aviator cap? Those are so last year.<BR><BR>It's the cyasma-infused leather, you see. Rough hide and grave hide are plentiful, but nobody makes the cyasma-infused leather. So don't even ask.<NEXTPAGEBUTTON>&quot;But I already have some...&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "You actually had some cyasma-infused leather? Well, I suppose I can make one more aviator cap, if you're sure you want one.<NEXTPAGEBUTTON>&quot;I am!&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "Even the Invalesco don't trade in cyasma-infused leather anymore—and if they don't have it, no one would."
    - huntingZoneId: 63
      id: 27
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "Seriously? You want a custom-made pirate hat?<BR><BR>Look, if you don't have a piece of cyasma-infused leather sitting in a bank vault somewhere, there's nothing I can do for you. Even the Invalesco don't bother with it anymore.<NEXTPAGEBUTTON>&quot;It so happens, I do!&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "Well, well. Been hoarding this somewhere, have you? No, none of my business.<BR><BR>Let's get you that hat. Which color did you want?<NEXTPAGEBUTTON>&quot;Let's see...&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "Let me guess: You've found everything but the cyasma-infused leather.<BR><BR>Want my advice? If you haven't found it by now, you're not going to."
    - huntingZoneId: 63
      id: 28
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "A party hat? Oh, yes, I remember making those. I don't do that anymore.<BR><BR>The basic components are plentiful enough: gravehide and luria fibers. But the Chebikan cotton mill burned down, and you can't get Chebikan cotton anymore.<NEXTPAGEBUTTON>&quot;But I have this...&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "You actually have some Chebikan cotton? And you still want me to make a party hat out of it? Okay...<BR><BR>Well, I guess I just need to know what color you want.<NEXTPAGEBUTTON>&quot;Let's see...&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "First the Chebikan cotton mill burned down, then the Hands of Velika sold out of their back stock. Now you just can't get it—and even if you could, why waste it making a party hat?"
    - huntingZoneId: 63
      id: 29
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "A popo hat? Keep your voice down!<BR><BR>Listen: I got word that certain popori really weren't pleased by me making popori hats, so I had to stop.<NEXTPAGEBUTTON>&quot;Well, what do I do with this moppet?&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "Well, seeing as how you already had the popori moppet, I suppose I could make just one more.<BR><BR>Now, what were you thinking for the fur color?<NEXTPAGEBUTTON>&quot;Let's see...&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "The Hands of Velika tell me that the popori don't find these hats all that amusing. But, if you already have the moppet—and you really, really want one—I suppose it's better I make it for you."
    - huntingZoneId: 63
      id: 30
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "There was a time I happily made starling nestcaps—but then they got so popular that everyone wanted one.<BR><BR>Problem is, making one requires a vale starling egg, and all those hat-hunters snatched up every last one.<BR><BR>No more eggs, no more starlings. And no more hats.<NEXTPAGEBUTTON>&quot;You mean an egg like this?&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "You've got a starling egg? Well, um, it'd be a shame to waste it...<BR><BR>Okay, what color starling works best with your armor?<NEXTPAGEBUTTON>&quot;Let's see...&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "The Hyderad Legacy used to import starling eggs, but that business just dried up when the starlings died out. You'll never find one."
    - huntingZoneId: 63
      id: 31
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "You want a gilded feather? Sorry, but I made myself a promise: I don't make those anymore.<BR><BR>It's the downy struthio feathers, you see: The Shariar made struthio-poaching illegal. It's not worth it to me to invoke their wrath.<NEXTPAGEBUTTON>&quot;But I already have this feather...&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "You've already got the feather? Well, the Shariar only enforce the &quot;no-hunt&quot; law, so I guess I could make one more.<NEXTPAGEBUTTON>&quot;Great news.&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "Sorry, but the valiant fighters of the Shariar made struthio-hunting a crime. My advice is to sell off your xermetal ore and luria fibers and forget all about struthio feathers."
    - huntingZoneId: 63
      id: 32
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "Vampirs and witches do love their hats. So much so that they don't want anyone else making them.<BR><BR>The big problem is, they've locked away every last fire-kissed ruby in existence, so there's no chance whatsoever of getting one of these hats. Not now.<NEXTPAGEBUTTON>&quot;But I already have this fire-kissed ruby...&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "What? You already have one? My, my...<BR><BR>Okay, one more, for old time's sake. What style were you thinking?<NEXTPAGEBUTTON>&quot;What styles do you have?&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "If all you need is the fire-kissed ruby, I'm afraid you're out of luck. They're not available anymore. You should just sell the norsteel and shadsteel, and have done with it."
    - huntingZoneId: 63
      id: 33
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 5
              content: "Unless you have a piece of eldritch leather squirreled away somewhere, don't even ask. I can't make the top hats without the leather, and you can't get the leather anywhere.<NEXTPAGEBUTTON>&quot;I have the leather.&quot;</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3005
          pages:
            - social: 5
              content: "Wow, you actually had some?<BR><BR>Well, okay, then! What spectacular hat fits you best?<NEXTPAGEBUTTON>&quot;Let me see your selection.&quot;</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3005
          pages:
            - social: 0
              content: "If you need eldritch leather, you're out of luck. Trust me, just dump your bloodhide and rough hide on the market, and cut your losses."
    - huntingZoneId: 63
      id: 34
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3006
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3006
          pages:
            - social: 5
              content: "In order to tame a beast, you must first know what it eats.<BR><BR>If you feed it something it likes, say Tirkai grizzly steaks, it'll trust you.<NEXTPAGEBUTTON>4</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3006
          pages:
            - social: 5
              content: "After Val Tirkai fell to the argons, it became difficult to obtain the steaks here in Velika, but you obviously managed.<BR><BR>You’ll earn the beast's trust with this.<NEXTPAGEBUTTON>4</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3006
          pages:
            - social: 0
              content: "Taming a beast is no simple matter, and the shortest route to their hearts is through their stomachs."
    - huntingZoneId: 63
      id: 36
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 3006
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 3006
          pages:
            - social: 5
              content: "There’s an item that makes any feline purr—a silvervine branch. Now, it's rare and expensive, but absolutely worth the effort.<BR><BR>Bring one of those and we'll have this leopard curled up at your feet in no time.<NEXTPAGEBUTTON>4</NEXTPAGEBUTTON>"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 3006
          pages:
            - social: 5
              content: "Mmm, smells so...divine. I—I want it!<BR><BR>Sorry. Went a little whisker-crazy.<BR><BR>You probably should keep that away from me. I'm working the twelve steps, but each day's a challenge.<NEXTPAGEBUTTON>4</NEXTPAGEBUTTON>"
        - id: 4
          npcZoneId: 63
          villagerId: 3006
          pages:
            - social: 0
              content: "We really need that silvervine branch. It's for your leopard, not me. Honest!"
    - huntingZoneId: 63
      id: 59
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Are you always running out of space for the items you acquire on your travels? Sick of interrupting your adventures to organize your inventory?<BR><BR>If so, I have good news for you! Getty from Freedom Plaza in Velika, the city of commerce, has the solution you've been searching for, and your first inventory expansion is free!<BR><BR>That's right! Free! Try it yourself and discover the convenience of having an expanded inventory.<BR><BR>Come to Freedom Plaza today!"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1228
          pages:
            - social: 0
              content: "Hey there! Do you find yourself shoving items into your backpack long after it's full, only to realize they're strewn about the path behind you?<BR><BR>I offer an \"Inventory Expansion\" service for people just like you. First time's on the house!<BR><BR>If you're satisfied, you're welcome to come back and purchase my larger expansions!"
    - huntingZoneId: 63
      id: 61
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Mission orders<BR><BR>To empower our forces on the home front, Velika Headquarters will supply warhorses to skilled soldiers. Return to headquarters at once.<BR><BR>—Dougal, Velika Consul"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1160
          pages:
            - social: 0
              content: "Welcome, <PCNAME>! It's a shame a skilled soldier like you has been walking all this time.<BR><BR>Better to spend money on fine horses than on extra boot-leather, eh? A swift steed should help you get from mission to mission faster."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1149
          pages:
            - social: 0
              content: "You must be the <PCCLASS:lcase> that Dougal mentioned. I knew you'd come, but...my horses have grown restless lately, and they're not obeying their riders.<BR><BR>Maybe <font color='#0080FF'><A href=\"markmap:loc=1#-11565.4844,-9482.6436,6291.0557&type=1&name=Veridia Plants\">veridian extract</A></font>can calm their nerves. Gather some veridia plants around here and extract the oils. Then I'd feel better about turning these big boys loose."
        - id: 5
          npcZoneId: 63
          prevId: 4
          villagerId: 1149
          pages:
            - social: 0
              content: "This is just the thing—our horses are doing much better! Take this small token of my appreciation. It's one of my best, so I hope it'll be helpful for you."
        - id: 6
          npcZoneId: 63
          villagerId: 1149
          pages:
            - social: 0
              content: "Please bring me <font color='#0080FF'><A href=\"markmap:loc=1#-11565.4844,-9482.6436,6291.0557&type=1&name=Veridia Plants\">veridian extract</A></font>. They'll make our horses less restless."
    - huntingZoneId: 63
      id: 83
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 1136
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 1136
          pages:
            - social: 0
              content: "Hey, I don't suppose you're on your way to the Creation Workshop in Velika, are you? I'm waiting for a weapon from them—do you think you could stop in and ask Santia when it will be finished?<BR><BR>Only if you happen to find yourself going that way, of course."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1098
          pages:
            - social: 0
              content: "Oh, Velika's left...well, nevermind. I completely forgot about Jefaln's weapon. I'm absolutely swamped, though—it would really help me out if you could get materials from Thura and a design from Babur, and then process this ore for me.<BR><BR>Don't worry, I'll make the actual weapon, and it won't take long, but it would go so much faster if the ore was already processed."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1190
          pages:
            - social: 0
              content: "Hello! I handle reagents and parts, parts and reagents! They sound like the same thing. I guess they are, really, but everyone refers to them as separate things.<BR><BR>Anyway, you use them for different things. And in any case, I carry both. What did you want?"
        - id: 5
          npcZoneId: 63
          prevId: 4
          villagerId: 1196
          pages:
            - social: 0
              content: "Designs, designs, I'm up to my eyeballs in designs. You look rather plaid. Ha! Ha ha!<BR><BR>Ha? Eh, design merchant humor. You wouldn't get it.<BR><BR>Anyhow, here's the design you'll need."
        - id: 6
          npcZoneId: 63
          prevId: 5
          villagerId: 1098
          pages:
            - social: 0
              content: "Nicely done. Take this weapon design for your help."
        - id: 7
          npcZoneId: 63
          villagerId: 1098
          pages:
            - social: 0
              content: "What are you staring at? Your arms broken?<BR><BR>Well, I didn't see materials in them, so I assumed you had trouble lifting them."
    - huntingZoneId: 63
      id: 95
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 63
          villagerId: 9004
          pages:
            - social: 0
        - id: 2
          npcZoneId: 63
          villagerId: 9004
          pages:
            - social: 0
              content: "Hey! Don't just stay indoors all winter!<BR><BR>I'm Ambrrr, the Wintera messenger. Come find {@linkcreature:63#9004#me} in Velika and I will let you in on the best-kept secret of winter: the exciting Wintera battle!<BR>You can enjoy this game for a short time while Wintera lasts, so don't delay!<BR><BR>——Ambrrr"
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 9004
          pages:
            - social: 1
              content: "You came!<BR><BR>Are you ready to learn about our Wintera snowball battle?"

