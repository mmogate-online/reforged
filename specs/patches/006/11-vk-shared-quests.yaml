      string: "\"The honor is mine.\""
    - id: 6305005
      string: "Meet with Commander Seir."
    - id: 6305006
      string: "\"Thank you.\""
    - id: 6305007
      string: "Speak with Commander Seir."
    - id: 6305008
      string: "\"For the federation!\""
    - id: 6305009
      string: "Speak with Commander Samael."
    - id: 6321008
