questDialogs:
  upsert:
    - huntingZoneId: 7
      id: 1
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "You helped Mysterium researchers discover how the Scions of Lok were controlling the kumases."
        - id: 2
          npcZoneId: 0
          villagerId: 0
          pages:
            - social: 0
              content: "Mission Orders<BR><BR>Reinforcements required in the Celestial Hills. Soldiers available for reassignment should report to Prefect Daven in Lumbertown at once."
        - id: 3
          npcZoneId: 60
          prevId: 2
          villagerId: 1014
          pages:
            - social: 4
              content: "Ah, <PCNAME>! Just who I was looking for.<BR><BR>I've got several disturbing reports from Celestial Hills about nagas and kumases. Take charge of this matter personally.<BR><BR>Head to Godric's Farm and speak with {@LinkCreature:207#1005#Heroth}. He'll have more details for you."
        - id: 4
          npcZoneId: 207
          prevId: 3
          villagerId: 1005
          pages:
            - social: 4
              content: "Do you see those baetyliths out there with the blue markings? The kumases can't stay away from them. Neither can the researchers I'm responsible for, apparently. Some of them have wandered off, and I won't be able to look for them until we've cleared the nearby kumases. Look for Radat, their leader. Take him out."
        - id: 5
          npcZoneId: 207
          prevId: 4
          villagerId: 1005
          pages:
            - social: 4
              content: "You're pretty handy. A lot of soldiers panic the first time they fight a kumas, but you seem to know what you're about. Good work.<BR><BR>Some of the researchers have straggled in from their camp southeast of here, but {@LinkCreature:207#1009#Siria}, the most stubborn of them all, is still out there. Think you could scout around and find her?"
        - id: 6
          npcZoneId: 207
          prevId: 5
          villagerId: 1009
          pages:
            - social: 4
              content: "Aww, was Heroth worried? How sweet—if I was a maiden in distress. I'm on a mission, same as him.<BR><BR>Ready to help? Okay.<BR><BR>The kumases are obsessed with the markings on the baetyliths, which are in the original language of magic. God stuff.<BR><BR>The nagas work for the kumases. There's a kumas called {@LinkCreature:7#2000#Kadas}. I'd like to get a look at the amulet he wears. There might be a hint there."
        - id: 7
          npcZoneId: 207
          prevId: 6
          villagerId: 1009
          pages:
            - social: 4
              content: "Wow, you got it! That's great! Now I need something else to compare this with.<BR><BR>Why are you looking at me like that? Didn't you agree to help me?<BR><BR>If you examine the <font color='#0080FF'><A href=\"markmap:loc=7001#55019,9993,1935&type=1&name=Baetyliths Location\">baetyliths</A></font> scattered all around here, you'll find shards. Bring some back to me. Now isn't that easy?"
        - id: 8
          npcZoneId: 207
          villagerId: 1009
          pages:
            - social: 0
              content: "Blast and damnation! It's just one kumas. You've killed so many already. I just want you to kill one more, and bring me its amulet. Please, hurry!"
        - id: 9
          npcZoneId: 207
          prevId: 7
          villagerId: 1009
          pages:
            - social: 4
              content: "Let's take a look.<BR><BR>Just as I thought. The power in these shards feels the same as the amulet. But in the amulet, it's more concentrated.<BR><BR>My guess is the amulet is storing up power from the baetyliths."
        - id: 10
          npcZoneId: 207
          villagerId: 1009
          pages:
            - social: 0
              content: "No, no, you need to bring me some baetylith shards to compare the amulet against. A hypothesis needs to be tested!"
        - id: 11
          npcZoneId: 207
          prevId: 9
          villagerId: 1009
          pages:
            - social: 4
              content: "A few of the baetyliths seem to have most of the power. They're easy to recognize—they spark with energy. I wonder if that's where the kumases are storing the power they've taken from the others.<BR><BR>Poke around a bit, will you? If the {@LinkObject:45#sparking baetyliths} are important, someone or something will try to prevent you from finding out."
        - id: 12
          npcZoneId: 207
          prevId: 11
          villagerId: 1009
          pages:
            - social: 4
              content: "Imps, eh? They'll work for anyone. In this case I'm guessing they work for the kumases.<BR><BR>It means whatever they're taking from the baetyliths, the kumases don't want to share.<BR><BR>Take my report to Mattin at the Sanctum Mysterium south of here. I'll go back to Godric's farm and remind Heroth he's not my nursemaid."
        - id: 13
          npcZoneId: 207
          prevId: 12
          villagerId: 1001
          pages:
            - social: 4
              content: "A report from Siria? Let me see...<BR><BR>Sounds like she's got a handle on the kumas problem, all right. Thank you for bringing this."
    - huntingZoneId: 7
      id: 2
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 207
          villagerId: 1001
          pages:
            - social: 0
              content: "The Mysterium sought your help to foil the research the Scions of Lok were conducting. You found references to an ancient fountain, but stopped the Scions' leader—Tezluar—before they could finish what they were doing. Unfortunately, the Scions reacted forcefully and launched a massive assault on the Sanctum Mysterium. You protected Mattin as he brought magical shields to bear and saved the sanctum."
        - id: 2
          npcZoneId: 207
          villagerId: 1001
          pages:
            - social: 4
              content: "We're in a race with the Scions of Lok to uncover the ancient secrets in the Cardovek Remnants. Sadly, they've got a head start on us.<BR><BR>The Celestial Hills were important to many of the gods, and the Scions might well be looking for something related. Certainly the omphaloses on the plains are divine in origin.<BR><BR>Go see Padraig, one of our scholars near the remnants."
        - id: 3
          npcZoneId: 207
          prevId: 2
          villagerId: 1044
          pages:
            - social: 4
              content: "Aye, they're up to something, but I'm not sure what. They've got some papers, but they're all encoded—and they're divided into parts.<BR><BR>If you could put together a whole document, I might be able to make sense of it. The {@LinkCreature:7#14#Lokian sorcerers} are your best bet for finding a complete copy of the pages."
        - id: 4
          npcZoneId: 207
          prevId: 3
          villagerId: 1044
          pages:
            - social: 4
              content: "Blast it all!<BR><BR>The documents are fine, but they're in code. I've seen the {@LinkCreature:7#13#Lokian berserkers} reading the cryptographs—so they have to have some way of decoding it.<BR><BR>Find a berserker and see if it has something we can use to decipher the text. We must learn what they're up to."
        - id: 5
          npcZoneId: 207
          prevId: 4
          villagerId: 1044
          pages:
            - social: 4
              content: "Do you have everything?<BR><BR>All the cryptographs and a decryption device?We can learn nothing without them.<BR><BR>Did you decrypt the messages?"
        - id: 6
          npcZoneId: 207
          prevId: 4
          villagerId: 1044
          pages:
            - social: 0
              content: "You lost it?<BR><BR>Now what am I gonna do? Oh! Wait a minute, <PCNAME>."
        - id: 7
          npcZoneId: 207
          prevId: 4
          villagerId: 1044
          pages:
            - social: 0
              content: "Come on, I want to see the ENTIRE decrypted message."
        - id: 8
          npcZoneId: 207
          prevId: 5
          villagerId: 1044
          pages:
            - social: 4
              content: "Someone gave me this a while back but I didn't realize at the time...<BR><BR>You must be the luckiest <PCClass:lcase> I've ever met. Is this the decoder you lost? Here! Take it and get to the decoding."
        - id: 9
          npcZoneId: 207
          prevId: 5
          villagerId: 1044
          pages:
            - social: 4
              content: "That flaming naga spoor {@LinkCreature:7#102#Tezluar}! He's behind this! He's looking for some fountain—looks like Akasha was after it once upon a time.<BR><BR>They don't have a clue where it is right now and with a little help from you, they need never find it.<BR><BR>Kill Tezluar and deal these Scion fools a real setback."
        - id: 10
          npcZoneId: 207
          villagerId: 1044
          pages:
            - social: 0
              content: "The {@LinkCreature:7#13#Lokian berserkers} must have some way to read the cryptographs. They don't have enough brains to do it themselves!"
        - id: 11
          npcZoneId: 207
          prevId: 9
          villagerId: 1044
          pages:
            - social: 4
              content: "Well done, my friend! Hurry back to Mattin and deliver the good news!"
        - id: 12
          npcZoneId: 207
          prevId: 11
          villagerId: 1001
          pages:
            - social: 4
              content: "The Scions of Lok appear to be sore losers. They're massing for an attack. Our shield can repel them—if we can get it raised in time.<BR><BR>Keep our foes at bay until the defenses are active!"
        - id: 13
          npcZoneId: 419
          prevId: 12
          villagerId: 99
          pages:
            - social: 4
              content: "Courage and skill protected the secrets and knowledge we've uncovered. For that, we are very grateful.<BR><BR>The Celestial Hills have many secrets, some we are not yet ready to discover, and others, perhaps, were never meant for us to know. Together, we've kept them safe.<BR><BR>Go with our thanks."
    - huntingZoneId: 7
      id: 4
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          villagerId: 0
          pages: []
        - id: 100
          npcZoneId: 207
          villagerId: 1001
          pages:
            - social: 0
              content: "General Samael taught you how to use glyphs as a reward for your achievements in the Celestial Hills."
        - id: 2
          npcZoneId: 207
          villagerId: 1001
          pages:
            - social: 4
              content: "Take this to Dougal in Velika. Tell him I sent you. Please hurry."
        - id: 3
          npcZoneId: 63
          prevId: 2
          villagerId: 1160
          pages:
            - social: 4
              content: "It's rare to see such glowing words written in Mattin's hand. You certainly impressed him, <PCNAME>.<BR><BR>Deliver this little epistle to Samael. He's as hard to win over as Mattin, but if anything can do it, this report can.<BR><BR>Well done, <PCNAME>. This is exactly the kind of action we need from our soldiers right now."
        - id: 4
          npcZoneId: 63
          prevId: 3
          villagerId: 1137
          pages:
            - social: 4
              content: "Hmm. Well, this is quite a report. I guess you're not the keener I expected. I underestimated you. I promise I won't do that in the future.<BR><BR>We need more than just soldiers, we need leaders. Dougal thinks you're ready for a commission. I'm hardly going to argue against it, not after deeds such as these. Come, it's not every day you get to be a hero."
        - id: 5
          npcZoneId: 63
          villagerId: 1137
          pages:
            - social: 0
              content: "Do you have something to report?"
        - id: 6
          npcZoneId: 63
          prevId: 4
          villagerId: 1138
          pages:
            - social: 4
              content: "<PCNAME>! What took you so long?<BR><BR>let's start the ceremony."
        - id: 7
          npcZoneId: 63
          prevId: 6
          villagerId: 1138
          pages:
            - social: 4
              content: "Now, as an officer, you should learn how to use glyphs.<BR><BR>Glyphs have different powers according to the classes. Glyphs will grant additional power to your skills."

questStrings:
  upsert:
    - id: 701001
      string: "Scruffy Kumas Herders"
    - id: 701002
      string: "\"For the federation!\""
    - id: 701003
      string: "Speak with Prefect Daven in Lumbertown."
    - id: 701004
      string: "\"I'm on it.\""
    - id: 701005
      string: "Report to Centurion Heroth at Godric's Farm in Celestial Hills."
    - id: 701006
      string: "Eliminate Radat to discourage the kumases."
    - id: 701007
      string: "\"I won't let you down.\""
    - id: 701008
      string: "Report back to Centurion Heroth."
    - id: 701009
      string: "\"I'll find one.\""
    - id: 701010
      string: "Find Siria in central Omphalos Plains."
    - id: 701011
      string: "Kumasi Amulet"
    - id: 701012
      string: "Kill Kadas and retrieve his amulet."
    - id: 701013
      string: "Take the amulet to Siria."
    - id: 701014
      string: "\"I'll do it.\""
    - id: 701015
      string: "\"So what's next?\""
    - id: 701016
      string: "Investigate the baetyliths in the Omphalos Plains and collect shards for Siria."
    - id: 701017
      string: "Take the shards back to Siria."
    - id: 701018
      string: "\"Wish me luck.\""
    - id: 701019
      string: "Speak with Siria."
    - id: 701020
      string: "Investigate the sparking baetyliths in the Omphalos Plains and eliminate their {@LinkObject:45#protectors}."
    - id: 701021
