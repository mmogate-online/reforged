# Velika's classic (v31) crafting-material and design vendors: the eight stores
# 180 to 185, 195 and 196 with their twenty tabs, and the merchants of Velika,
# Crescentia and Lumbertown bound back to them.
#
# The stores and every tab list are absent from v92 rather than changed, so the
# rows below are full catalogues, not deltas, and nothing outside this region
# references them. The four v92 stores 190 to 193 that replaced them are left
# as they are: merchants in other towns still sell from them, and the Velika
# merchants that offered both in v31 keep both. Lists 1900 and 1910 were their
# v31 tabs, so they are restored with the set but no store lists them.
#
# villagerMenus upsert replaces the whole menu list, so each row states every
# menu the merchant offers.
#
# A store's title, its dialog button and every tab label resolve through
# StrSheet_Npc by the store's stringId and each tab's stringed, so the strings
# are restored with the stores or the store opens blank. The classic string ids
# 180 to 182 name the live fishing delivery menus on this server, so stores 180
# to 182 point at fresh ids 1800, 1810 and 1820 rather than renaming those.
#
# A merchant's title (StrSheet_Creature) follows the store it sells: material
# vendors take their classic titles, design vendors on 190 to 193 keep v92's.
#
# provenance: ported-from-v31

spec:
  version: "1.0"
  schema: v92

imports:
  - from: item-ids
    use:
      variables:
        - ARMORCRAFTING_DESIGN_KRYSTEEL_INGOT_23003
        - DESIGN_DEOSILEX_23004
        - DESIGN_VERDRACLOTH_23002
        - DESIGN_ZALISLEATHER_23005
