# Velika, Crescentia, Lumbertown and the Arcadia zones' villager menus returned
# to their classic (v31) bindings: the rows v92 added are removed, among them the
# Velika entry NPCs of the post-classic instances, whose doors go with them.
#
# The Velika design merchants stay on the stores v92 gave them. Store ids 192 and
# 193 name different shops in the two eras, so a v31 binding would put a design
# merchant in front of a store that does not match its title.
#
# Kept as v92 has them, on purpose: warehouse, wardrobe and inventory-expansion
# entries on bankers, the class trainers' extra SkillLearn menus, and every entry
# that names a v92-era system (pegasus platform, medal and guild stores, the
# healers' restore menus, the union on/off switch). Those are account features
# and engine wiring, not zone content, so they carry no op here.
#
# villagerMenus upsert replaces the whole menu list, so a re-pointed row states
# every menu the villager offers.
#
# provenance: ported-from-v31

spec:
  version: "1.0"
  schema: v92

villagerMenus:
  upsert:
    - huntingZoneId: 63
      npcTemplateId: 1567   # v92 had Teleport 631567 (questCompleted 18118)
      menus:
        - { type: Teleport, id: 631567 }
    # The guild-quest board stewards of the three hub towns: the board itself and the
    # reward officer who takes completed guild quests.
    - huntingZoneId: 59
      npcTemplateId: 1602
      menus:
        - { type: ChapterHouse, id: 1 }
    - huntingZoneId: 59
      npcTemplateId: 1603
      menus:
        - { type: ChapterHouseEnd, id: 1 }
    - huntingZoneId: 60
      npcTemplateId: 1602
      menus:
        - { type: ChapterHouse, id: 1 }
    - huntingZoneId: 60
      npcTemplateId: 1029
      menus:
        - { type: ChapterHouseEnd, id: 1 }
    - huntingZoneId: 63
      npcTemplateId: 1602
      menus:
        - { type: ChapterHouse, id: 1 }
    - huntingZoneId: 63
      npcTemplateId: 1603
      menus:
        - { type: ChapterHouseEnd, id: 1 }

