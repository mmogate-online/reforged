# Velika and Arcadia instance pruning: removes the post-classic instances entered
# from these regions (the Velika Banquet chain, Velik's Hold and Sanctuary with
# their hard modes, Wonderholme, Antaroth's Abyss, Harrowhold, Broken Prison, the
# solo trials and the solo rework of Bastion of Lok) and re-enables the classic
# solo Bastion of Lok (continent 9887) behind its original entry.
#
# A dungeon is closed by deleting its DungeonConstraint row and every teleport that
# lands in it. Where that empties a teleport list the list goes with it. The dungeon
# definitions themselves (DungeonData_<continentId>.xml) stay: the arbiter validates
# the dungeon registries (matching, events, work data, continents) against them and
# refuses to start when a referenced definition is missing, so removing a definition
# means removing every registry row first. Client-side registries that still name these instances
# (DungeonMatching, StrSheet_Dungeon, ScenarioDungeon, DungeonWorkData, GmEvent), and the
# menus of NPCs standing inside the removed instances, are left as dead wiring on purpose. Quests that enter these instances remain
# until the quest surface is ported and point at nothing until then.
#
# Dynamic geometry is not dead wiring: the world server keys doors by id across every
# geometry file it loads, and the solo rework's copy of Bastion of Lok defines the same
# door id as the party version, so while both load the party gate never spawns. The
# rework's geometry file goes with the instance.
#
# provenance: ported-from-v31

spec:
  version: "1.0"
  schema: v92

dynamicGeos:
  delete:
    - 3001

dungeonConstraints:
  delete:
    - 3001
    - 3017
    - 9031
    - 9032
    - 9033
    - 9505
    - 9506
    - 9509
    - 9643
    - 9710
    - 9720
    - 9780
    - 9781
    - 9795
    - 9833
    - 9920
    - 9950
    - 9980
    - 9981

  upsert:
    - continentId: 9887
      isActive: true
      requiredActPoint: 0
      huntingZoneId: 887
      coolTimeForSupportMatching:
        base: 60
        withTrait: 30
      coolTime: 10
      coolTimeForAccountTrait:
        base: 10
        withTrait: 5

