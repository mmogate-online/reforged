  # A list that keeps another destination: only the removed instance's entry goes.
  deleteTeleportEntries:
    - teleportListId: 2301502
      uniqueIds: [23015023]

  # Two lists restated whole. 2031501 loses the solo-rework entry and regains the
  # classic solo Bastion of Lok entry beside the party entry; it is written as a whole
  # list because an entry-level edit does not carry the entry's condition. 31000 is the
  # Oblivion Woods portal stone's list, pointed back at Lakan's Prison as the classic
  # data has it instead of at the removed Broken Prison.
  upsert:
    - id: 2031501
      teleports:
        - uniqueId: 2031501
          desc: "비밀 기지"
          stringId: "@rgn:9087001"
          continentId: 9087
          pos: "76339, 583, 310"
          dir: ""
          distance: 10
        - uniqueId: 2031502
          desc: "비밀 기지(1인)"
          stringId: "@rgn:9887001"
          continentId: 9887
          pos: "76339, 583, 310"
          dir: ""
          distance: 10
          conditions:
            - type: Bp
              value: 10
    - id: 31000
      teleports:
        - uniqueId: 31000
          desc: "라칸의 제단 이동용"
          stringId: "@rgn:31000"
          continentId: 9810
          pos: "-84921.9766,170370.3906,13781.1768"
          dir: ""
          distance: 10

# The portal stone's name and dialog name its destination, and the client reads them
# from its own copy, so they follow the list back to Lakan's Prison. The classic data
# carries the name but no dialog for this stone; the dialog is its sibling's with the
# destination image and text.
creatureStrings:
  update:
    - huntingZoneId: 3
      templateId: 1000
      changes:
        name: "Lakan's Prison Teleportal"

villagerDialogs:
  upsert:
    - huntingZoneId: 3
      id: 1000
      voiceTypeId: 0
      texts:
        - id: 1
          endSocial: 0
          pages:
            - social: 0
              voiceTypeId: 0
              text: "<img src='img://__Image_Dungeon_9810.9810'/><BR><BR>(This teleportal takes you to <font color='#0000FF'>Lakan's Prison</font>.)"
