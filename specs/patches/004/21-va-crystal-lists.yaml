# Crystal merchants restored to their classic (v31) catalogues: tabs 1101 and
# 1102 of store 110.
#
# buyLists upsert is REPLACE-ALL and store 110 is shared: 35 merchants offer it,
# 6 in Velika and 29 in 21 other towns and camps, so the classic catalogue
# reaches all of them. That blast radius is accepted deliberately. For the 29
# merchants outside this region it means:
#   1101 gains the 40 plain weapon crystals (Pounding, Bitter, Focused, Savage,
#        Swift, Brilliant, Carving and Threatening in the Hexage, Pentant,
#        Concach, Crux and Niveot cuts) and loses the 40 Fine weapon crystals
#        (those eight plus Wrathful and Spiteful, in the four cuts below Niveot).
#   1102 gains the 25 plain armor crystals (Hardy, Poised, Relentless, Fleetfoot
#        and Vigorous in the same five cuts) and loses the 4 Fine Hardy crystals
#        (Hexage, Pentant, Concach, Crux).
#
# provenance: ported-from-v31

