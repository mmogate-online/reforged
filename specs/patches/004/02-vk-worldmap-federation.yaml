# Velika world map: re-adds the Free Traders Hall (World 1, Velika guard, section 3)
# and the Velika Federation union fields (World 9999, guard 61: the three field maps
# and their three fortress towns), with every map marker each of them carried.
#
# A world-map section upsert replaces that section's whole marker list, so every
# marker is stated here even where one already exists. Worlds and guards are
# addressed by id and only the listed ones are touched; the continent list is left
# alone because the key is absent. The client copy of this file merges by id and
# never deletes, so this spec only adds sections and markers.
#
# Hall markers carry continent 7005 because Velika is mounted there. Union-field
# markers carry their own field continents (9121, 9122, 9123), and the marker type
# spellings are the ones the client asset names use.
#
# provenance: ported-from-v31

