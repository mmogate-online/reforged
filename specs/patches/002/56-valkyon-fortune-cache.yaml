      name: "Valkyon Fortune Cache"
      toolTip: "A sealed supply cache the Valkyon Federation issues to volunteers of the alpha expedition, packed by a quartermaster with no eye for matching sets.$BR$BR<font color = '#2478FF'>Opens for one reward: a head accessory, a body costume, masterwork alkahest, an infusion cache or a crystal cache.</font>$BR<font color = '#FF0000'>Everything drawn from this cache belongs to the alpha expedition alone and does not carry into the launch build.</font>"
