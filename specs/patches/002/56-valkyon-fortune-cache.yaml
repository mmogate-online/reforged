# The Valkyon Fortune Cache: a blind cosmetic cache sold for the early-progression
# currency, and the eleven sum-to-1 reward bags behind it.
#
# THE ODDS ARE ODDS. `Gacha.xml` carries no roll counter, so a guaranteed reward
# after N openings cannot be expressed here. Every cadence is a mean, never a floor.
#
# EVERY GROUP MUST TOTAL EXACTLY 1 or the world server refuses to boot, so weights
# are generated from an integer grid rather than written by hand.
#
# ONE GROUP PER RACE AND GENDER, ELEVEN IN ALL, AND NO UNGATED GROUP. Most body
# costumes are per-race sculpts gated by `requiredRace`, so a single pooled bag
# would hand ten players in eleven a costume they cannot wear. Every multi-group
# gacha in the corpus partitions the player base totally rather than mixing a
# gated group with an ungated fallback, and these eleven cover every playable
# combination. Baraka is male only, hence eleven and not twelve.
#
# ARMOUR RECOLOURS ARE NOT COSTUMES AND ARE EXCLUDED. Many style items are just an
# equippable armour model retinted, so a player already wearing that armour gains
# nothing by pulling it. They are told apart by resolving the appearance to its
# model designation and dropping anything on an armour model line.
#
# Generated by a tool. Do not hand-edit; regenerate instead.
#
# provenance: policy

spec:
  version: "1.0"
  schema: v92

imports:
  - from: progression-tokens
    use:
      variables:
        - VALKYON_FORTUNE_CACHE

# Every reward row is `itemTemplateId` plus a weight, so the weight is the
# archetype and the id is the only per-row fact. Each definition carries a full
# key set, so nothing is injected that a consumer row did not ask for.
#
# The head and filler weights are shared by all eleven groups. The costume weights
# are not: pool sizes differ per race, so each group gets its own pair, named for
# the group, and it is the CADENCE that is constant across them, not the weight.
#
# `equalProbability` cannot do this job. It is a whole-group directive, every group
# here holds four different weight classes, and it rounds to two decimals, which
# would zero every cosmetic row.

definitions:
  # Head accessories: 489 rows in every group, about one every 10 openings between them
  headAccessory:
    probability: 0.0002044
    min: 1
    max: 1
  crystalCache:
    probability: 0.0010000
    min: 1
    max: 1
  infusionCache:
    probability: 0.0020000
    min: 1
    max: 1
  # Body costumes, non-dyable for human male: 188 rows, about one every 90 openings between them
  plain_human_male:
    probability: 0.0000591
    min: 1
    max: 1
  # Body costumes, dyable for human male: 51 rows, about one every 180 openings between them
  dyable_human_male:
    probability: 0.0001089
