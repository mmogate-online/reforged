spec:
  version: "1.0"
  schema: v92

imports:
  - from: progression-tokens
    use:
      variables:
        - EARLY_PROGRESSION_TOKEN

# Island of Dawn level 5-7 reward pass: the level-7 First Expedition set moves off
# the story spine onto four zone quests, the progression token is added, and three
# stale new-class weapons are corrected.
#
# Design rule behind the distribution: zone quests own POWER progression, story
# quests own LORE progression, and a full set look must stay completable. Quest
# 1305 previously granted the entire set in one story turn-in while two zone
# quests paid duplicates of pieces the player already had.
#
# questCompensations upsert is REPLACE-ALL, so each entry restates a quest's
# complete reward block rather than a delta, and specs apply in sorted filename
# order: a higher-numbered spec naming these quests would be the last writer and
# would silently undo this distribution. That is why the XP values and the token
# rows live here rather than in a later spec of their own. A `class` bag needs one
# row per class, so the token appears twelve times in those blocks; an `allpay`
# bag needs a single row.
#
# TRAP on the in-progress gate. Quests 1326 and 1330 were offerable only while
# story quest 1305 was ACTIVE, so a player who completed 1305 without visiting
# them lost the level-7 feet and hands permanently and the set stopped being
# completable. `inProgress: []` REMOVES the element, which is the canonical
# no-gate form; `inProgress: 0` instead writes "quest 0,0 must be in progress" and
# makes the quest permanently unofferable. That leg is server-only: the client
# Quest XSD carries no in-progress element, so it needs no repack.

quests:
  update:
    # Clear the in-progress gate so the two carriers stay offerable after 1305 completes,
    # which is what makes the level-7 set completable. Server-only: the client XSD carries
    # no 진행퀘스트 element.
    - id: 1326            # Mana out of Mudmen (carries the lv7 feet)
      changes:
        requirements:
          inProgress: []

    - id: 1330            # Horned Horrors (carries the lv7 hands)
      changes:
        requirements:
          inProgress: []

questCompensations:
  upsert:
    # ---- story spine: lore only, the whole First Expedition set removed ---------
    - questId: 1305       # A Clue in the Dark (was 48 rows: full lv7 set + weapon)
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 4900
          gold: 490

          itemBag: "allpay"
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation (R23 story leg)
              quantity: 60

    - questId: 1332       # They'll Eat Anything (Kamarnu, delivered to Jehan) -> lv7 BODY
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 900
          gold: 90
          itemBag: "class"
          items:
