spec:
  version: "1.0"
  schema: v92

# Flatten the gear-dismantle refund onto a single untiered feedstock item, 94101.
# Feedstock is one commodity: the tuning that separate tiers used to provide lives
# on the quantity axis instead. The retired ids 94102 to 94112 keep their
# ItemTemplate rows, so stacks already held stay valid.
#
# resultItemAmount is deliberately NOT touched, so the vanilla grade ladder
# (weapon 4/8/24/48, body 3/6/18/36, arm and leg 2/4/12/24 across grades 0 to 3)
# and the zero payout at rank 8 and above both survive exactly. Changing supply
# and demand in one pass would leave the next tuning pass uninterpretable.
#
# FIVE combatItemType values, not four: ENCHANT_COMPONENT_WEAPON is a
# decomposition type alongside the four EQUIP_* slots, and skipping it leaves 64
# rows pointing at a retired id. EQUIP_WEAPON also stops at rank 12 while the
# other four run to rank 16.
#
# SEMANTICS. decompositions MERGES by (combatItemType, rank, rareGrade); it is not
# clear-and-replace, so every row is restated here and a row count after apply
# proves nothing. The gate is a value check: no row in EnchantData.xml may keep a
# resultItemTemplateId other than 94101.
#
# No client leg, and provably so: the client EnchantData.xsd declares baseCost,
# combatItemType, rank, rareGrade and resultItemAmount but NOT
# resultItemTemplateId, so this change cannot reach the client. If resultItemAmount
# is ever changed, that family needs a real sync descriptor first.

enchantDatas:
  update:
    - changes:
        decompositions:
          # EQUIP_WEAPON: 48 rows, ranks 1 to 12 (28 paying, 20 at amount 0)
