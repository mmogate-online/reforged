# Priest heal-over-time: restore the classic abnormality values. Companion to
# 51-priest-heal-restore-v31.yaml, which restores the direct HpDiff heals; the
# over-time half lives in Abnormality.xml and is a different DSL entity, so it
# needs its own spec. Generated, do not hand-edit.
#
# The healing tick is AbnormalityEffect type=51, where `value` is the per-tick
# amount and `max` is the lifetime cap. The two track each other and MUST MOVE
# TOGETHER: changing value alone silently clips the heal at the old cap.
#
# Effects are clear-and-replace on update, so each effect is restated in full
# rather than patched attribute by attribute.
#
# Deliberately NOT restored: `group="skill"`, a structural attribute with no
# classic analogue, and `level` on 801400/801401, which drives abnormality
# stacking and override order rather than heal magnitude.
#
# WARNING: Restorative Burst (801100/801101) is a MECHANIC change, not a value
# port. Classic heals proportionally (method 3) over 10 s where the current data
# heals a flat amount (method 2) over 5 s, so the skill changes in kind and not
# just in size. It is the last block in the file so it can be removed on its own.

