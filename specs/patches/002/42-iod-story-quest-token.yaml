spec:
  version: "1.0"
  schema: v92

# Story-spine progression token, the leg RV-03 never had (ruling R23).
#
# Framework: reforged-content-framework 02-progression-lanes.md section 1, whose
#   Lane A row (story quests, side quests, NPC dailies) lists early-progression
#   tokens as a Lane A reward; and 03-currencies.md 3b-i.
# Backlog: RV-03 token threading, rulings R23 (story quests pay), R26 (the ladder),
#   R27 (the item).
#
# WHY THIS EXISTS. Wave 1 threaded the token into all 35 zone quests and no story
# quest, because RV-03's target list and the section 2 role table both omitted the
# spine. That omission was never ruled and contradicted R1, "every vector pays some
# of it". It also left the spine as the ONLY lane with no tangible reward: the
# patch-002 trimming waves stripped 1303, 1304, 1305, 1315 and 1331 to exp and gold,
# so a story-only player earned no item at all on the island.
#
# THE LADDER (R26) is priced by EFFORT, not by level band, and there is deliberately
# no per-bracket curve. Framework 03 3b-i's "no level-band rate scaling" governs the
# PLAYER (a synced-down vet earns what a native earns); it does not require every
# piece of content to pay the same. A steep band curve would make high zones the only
# worthwhile farm and hollow out the early zones this token exists to keep populated.
#
#   150  capstone, the island finale (1317)
#   100  dungeon-gated climax (1316, stated in 002/29)
#    60  Mission, 5+ tasks
#    40  Mission, 2 to 4 tasks
#    25  Mission, 1 task
#    20  class training (a character completes exactly ONE of the twelve)
#    10  the paired gathering intros 1382 and 1383 (a character completes one)
#
# OWNERSHIP. `questCompensations: upsert` is REPLACE-ALL and specs apply in sorted
# filename order, so this spec is the last writer for every quest it names. It names
# ONLY story quests no other patch-002 spec owns. The nine it must not touch are
# stated in their owning specs: 1303 and 1304 in 002/28; 1305, 1315 and 1316 in
# 002/29; 1331 in 002/30; 1380, 1381 and 1387 in 002/18.
#
# EVERY BLOCK RESTATES THE COMPLETE REWARD, exp, gold and every pre-existing item
# row, because a partial restatement silently deletes the rest.
#
# XP IS UNTOUCHED HERE. R10 caps ZONE quests against the story median; the spine is
# never nerfed and must stay self-sufficient to level 10.

imports:
  - from: progression-tokens
    use:
      variables:
        - EARLY_PROGRESSION_TOKEN

questCompensations:
  upsert:
    - questId: 1301       # Whatever It Takes | story, 1 task -> 25
      huntingZoneId: 13
      compensations:
