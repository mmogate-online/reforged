    # -> 300941 Terron (zarco, 12% grant): 3 territories = 9 mobs
    - huntingZoneId: 13
      groupId: 1300019
      territoryId: 13016070          # 78282,-85513, south-west
      npcInstanceId: 13474760
      changes:
        npcTemplateId: 300941
        ai: 6

    - huntingZoneId: 13
      groupId: 1300019
      territoryId: 13016160          # 80852,-82833, north-east
      npcInstanceId: 13474850
