# Author the three missing class training quests (1380 Ninja, 1381 Brawler, 1387
# Valkyrie) and admit them to the story spine.
#
# THE SOFT-LOCK THIS CLOSES. Quest 1303 is gated behind an OR of the nine class
# training quests 1371-1379, each hard-gated to ONE class and offered by Dulari
# (213,1017) after 1304. The classes added after the classic era have no training
# quest, so they finish 1304, are offered nothing, and can never satisfy 1303's
# OR-prereq: the whole spine behind it dies. Reaper (Soulless) is excluded on
# purpose, since it starts elsewhere at a higher level and never walks this chain.
#
# STRUCTURE: 3 tasks, reusing the live NPC cast of the classic training quests, so
# no new spawns and no NpcLoc regeneration are needed. Dialog is class-agnostic
# through the <PCCLASS:lcase> token; only the quest TITLE names the class, and it
# uses the game name, not the internal one. Class names in `requirements.classes`
# are the internal ones, case-sensitive, validated at apply time (E427).
#
# 1303's prerequisites are a REPLACE-all list, so the full OR set is restated below
# with prerequisiteLogic: OR. A character is one class, so completing any single
# training quest unlocks it, unchanged for the nine classic classes.
#
# CLIENT SYNC TRAP: new low-id quests insert into the client's IdSorted Quest and
# QuestDialog layout, which the manifest-narrowed sync cannot place (E680). Sync
# these with --no-narrow. QuestCompensationData and QuestGroupList are server-only.

spec:
  version: "1.0"
  schema: v92

# These are story Missions, so they pay the early-progression token at the class
# training tier, like their nine classic siblings 1371-1379.
imports:
  - from: progression-tokens
    use:
      variables:
        - EARLY_PROGRESSION_TOKEN

# ---- 1. New training quest bodies (3) -----------------------------------------
quests:
  upsert:
    # -- 1380 Ninja Training (Assassin) -------------------------------------
    - id: 1380
      header:
        questNumber: 1380
        storyGroupId: 1
        questTitle: "@quest:1380001"
        questType: Mission
        repeatType: OneTime
        cancellable: Forbidden
        startTaskId: 1
        linkedQuest: 101          # 1,1 end-of-chain sentinel (matches 1371-1379)
        giverNpc: "213,1017"      # Dulari offers it (발생조건 NPC대화)
        recommendedPartySize: 1
        recommendedLevel: 2
        summaryInfo: 100
        questDialogue: 2
        startPopup: "@quest:1380002"
        endPopup: "@quest:1380003"
      requirements:
        minLevel: 2
        prerequisites: [1304]
        classes: [Assassin]       # gates the quest to Ninja
      tasks:
        - taskId: 1
          type: VisitTask
          nextTaskId: 2
          journalScript: 2
          journalText: "@quest:1380004"
          body:
            npcId: "213,1023"     # Junia
            dialogueId: 3
            completionButtonText: "@quest:1380005"
        - taskId: 2
          type: HuntTask
          nextTaskId: 3
          journalScript: 3
          journalText: "@quest:1380006"
          body:
            huntingZoneId: 13
            targetId: 300921      # noruks
            targetCount: 5
        - taskId: 3
          type: VisitTask
          nextTaskId: 0
          hasReward: true
          journalScript: 4
          journalText: "@quest:1380007"
          body:
            npcId: "213,1115"     # Nivek
            dialogueId: 4
            completionButtonText: "@quest:1380008"

    # -- 1381 Brawler Training (Fighter) ------------------------------------
    - id: 1381
      header:
        questNumber: 1381
        storyGroupId: 1
        questTitle: "@quest:1381001"
        questType: Mission
        repeatType: OneTime
        cancellable: Forbidden
        startTaskId: 1
        linkedQuest: 101
        giverNpc: "213,1017"
        recommendedPartySize: 1
        recommendedLevel: 2
        summaryInfo: 100
        questDialogue: 2
        startPopup: "@quest:1381002"
        endPopup: "@quest:1381003"
      requirements:
        minLevel: 2
        prerequisites: [1304]
        classes: [Fighter]        # gates the quest to Brawler
      tasks:
        - taskId: 1
          type: VisitTask
          nextTaskId: 2
          journalScript: 2
          journalText: "@quest:1381004"
          body:
            npcId: "213,1023"
            dialogueId: 3
            completionButtonText: "@quest:1381005"
        - taskId: 2
          type: HuntTask
          nextTaskId: 3
          journalScript: 3
          journalText: "@quest:1381006"
          body:
            huntingZoneId: 13
            targetId: 300921
            targetCount: 5
        - taskId: 3
          type: VisitTask
          nextTaskId: 0
          hasReward: true
          journalScript: 4
          journalText: "@quest:1381007"
          body:
            npcId: "213,1115"
            dialogueId: 4
            completionButtonText: "@quest:1381008"

    # -- 1387 Valkyrie Training (Glaiver) -----------------------------------
    - id: 1387
      header:
        questNumber: 1387
        storyGroupId: 1
        questTitle: "@quest:1387001"
        questType: Mission
        repeatType: OneTime
        cancellable: Forbidden
        startTaskId: 1
        linkedQuest: 101
        giverNpc: "213,1017"
        recommendedPartySize: 1
        recommendedLevel: 2
        summaryInfo: 100
        questDialogue: 2
        startPopup: "@quest:1387002"
        endPopup: "@quest:1387003"
      requirements:
        minLevel: 2
        prerequisites: [1304]
        classes: [Glaiver]        # gates the quest to Valkyrie
      tasks:
        - taskId: 1
          type: VisitTask
          nextTaskId: 2
          journalScript: 2
          journalText: "@quest:1387004"
          body:
            npcId: "213,1023"
            dialogueId: 3
            completionButtonText: "@quest:1387005"
        - taskId: 2
          type: HuntTask
          nextTaskId: 3
          journalScript: 3
          journalText: "@quest:1387006"
          body:
            huntingZoneId: 13
            targetId: 300921
            targetCount: 5
        - taskId: 3
          type: VisitTask
          nextTaskId: 0
          hasReward: true
          journalScript: 4
          journalText: "@quest:1387007"
          body:
            npcId: "213,1115"
            dialogueId: 4
            completionButtonText: "@quest:1387008"

  # ---- 2. Extend 1303's OR-prereq to admit the three new training quests ------
  update:
    - id: 1303                    # The Secret Life of Trees
      changes:
        requirements:
          prerequisites: [1371, 1372, 1373, 1374, 1375, 1376, 1377, 1378, 1379, 1380, 1381, 1387]
          prerequisiteLogic: OR

