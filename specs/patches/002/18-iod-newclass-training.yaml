# ---- 4. Quest dialogs (3) -----------------------------------------------------
# Per quest: Text 1 (system placeholder), Text 100 (summary, ref summaryInfo=100),
# Text 2 (Dulari briefing, ref questDialogue=2), Text 3 (Junia, task 1 dialogueId=3),
# Text 4 (Nivek turn-in, task 3 dialogueId=4). Dialog id = quest offset (80/81/87).
