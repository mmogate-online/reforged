# ---- 5. Quest rewards ---------------------------------------------------------
# Mirrors the classic training quests 1371-1379: flat exp+gold, no class-scoped
# item, so no per-class compensation-row split is needed.
questCompensations:
  upsert:
    - questId: 1380
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 2100
          gold: 150
          itemBag: "allpay"
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation
              quantity: 20

    - questId: 1381
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 2100
          gold: 150
          itemBag: "allpay"
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation
              quantity: 20

    - questId: 1387
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 2100
          gold: 150
          itemBag: "allpay"
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation
              quantity: 20

# ---- 6. Story-group registration ----------------------------------------------
# Append the three quests to Story Group 1 ("World of TERA"), the classic training
# block, so the server groups them with 1371-1379. `upsertQuests` appends without
# rewriting the existing membership.
questStoryGroups:
  upsertQuests:
    - storyGroupId: 1
      quests:
        - id: 1380
          dec: "Ninja Training"
        - id: 1381
          dec: "Brawler Training"
        - id: 1387
          dec: "Valkyrie Training"

