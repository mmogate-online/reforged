# ---- 5. Quest rewards (QuestCompensationData_13, synced to client) -------------
# Mirrors the classic training quests 1371-1379: flat exp+gold, no class-scoped
# item (so no new-class compensation-row split is needed).
questCompensations:
  upsert:
    - questId: 1380
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 2100
          gold: 150
          itemBag: "allpay"
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation (R23 story leg)
              quantity: 20

    - questId: 1381
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 2100
          gold: 150
          itemBag: "allpay"
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation (R23 story leg)
              quantity: 20

    - questId: 1387
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 2100
          gold: 150
          itemBag: "allpay"
          items:
