  upsert:
    # 1380 (huntingZone 13, dialog id 80) ----------------------------------
    - huntingZoneId: 13
      id: 80
      voiceTypeId: 0
      texts:
        - id: 1
          npcZoneId: 0
          prevId: 0
          villagerId: 0
          pages:
            - social: 0
        - id: 100
          npcZoneId: 213
          prevId: 0
          villagerId: 1017
          pages:
            - social: 0
              content: "You trained under Junia and proved your skills against the noruks."
        - id: 2
          npcZoneId: 213
          prevId: 0
          villagerId: 1017
          pages:
            - social: 4
              content: "You've made your rounds and seen what this island asks of a soldier. Before I send you any deeper, you'd best be ready for it.<BR><BR>Junia over there will make a proper <PCCLASS:lcase> of you. Go and learn what she has to teach."
        - id: 3
          npcZoneId: 213
          prevId: 2
          villagerId: 1023
          pages:
            - social: 4
              content: "So Dulari sends me another recruit. Good: skills are earned, not handed out.<BR><BR>Put what you know to use on the {@LinkCreature:13#300921#noruks} to the south. When you've thinned a few, report to Nivek at the base of the hill."
