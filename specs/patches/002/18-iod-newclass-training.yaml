  upsert:
    # 1380 Ninja -----------------------------------------------------------
    - id: 1380001
      string: "Ninja Training"
    - id: 1380002
      string: "Time to sharpen your skills!"
    - id: 1380003
      string: "Well handled. You're ready for what lies ahead."
    - id: 1380004
      string: "Speak with Junia at Dulari's Camp to begin your training."
    - id: 1380005
      string: '"Understood."'
    - id: 1380006
      string: "Test your skills on the noruks nearby. Defeat 5."
    - id: 1380007
      string: "Report to Nivek at the base of the hill."
    - id: 1380008
      string: '"Understood."'
    # 1381 Brawler ---------------------------------------------------------
    - id: 1381001
      string: "Brawler Training"
