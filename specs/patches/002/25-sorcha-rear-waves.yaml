        # `questFail` group above cannot end a 1391 run: without this, the player
        # could let Sorcha die and still be paid for waiting out 420 seconds. Her
        # HP reaching zero is the trigger that does fire, and an `npcHp` group at
        # value 0 carrying a teleport is the corpus's own eject shape.
        #
        # It is NOT quest-scoped: no `npcHp` group anywhere carries a questId. So
        # it fires on a 1346 run too, alongside the `questFail` group above, which
        # ejects to the same coordinates a few seconds apart.
        - type: npcHp
          uniqueId: "437,1001"
          value: "0"
          repeat: true
          tasks:
            - { type: message, string: "@dungeon:9037011", style: "alert", next: "time", nextValue: 3 }
            - { type: teleport, continentId: 13, pos: [66615, -79814, -3003], next: "none" }
