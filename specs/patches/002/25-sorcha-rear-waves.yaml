# Wire the dormant rear-wave territories into the Sorcha encounter (dungeon
# 9037), and serve the repeatable quest 1391 alongside the one-time 1346.
#
# `eventGroups` is a list-replace nested collection, so the ENTIRE tree is
# restated here, including the guard timer, the HP barks and the failure handler
# that do not change. `upsert` is required because nested collections are
# create/upsert-only (E209 under update.changes); it preserves the root
# attributes and the sibling `conditions` collection another spec owns.
#
# THE 420s GUARD TIMER CANNOT MOVE. Quest 1346's guard task carries its own
# <제한시간> element, the DSL cannot author that element, and it is what completes
# the quest. The spawn chain is one linear sequence of `next: time` delays that
# must therefore fit inside 420s: it ends at 340s, leaving 80s of hold-out with
# the finale on the field. The arithmetic is exact; do not "fix" the timings.
#
# THE WAVE CHAIN IS DUPLICATED PER QUEST, DELIBERATELY. 1391 is dispatched by a
# `questProgress` group on its task 2, never by `talkNpc`: Sorcha's dialog lists
# one entry per MATCHING EventGroup, so a shared or unbound group offers the same
# line twice, and splitting waves from timer across two groups lets the player
# start the two chains at different moments. RETUNE BOTH COPIES TOGETHER.
#
# Sorcha's death ends the run through an `npcHp` group at value 0, not through
# `questFail`: a dungeon-event task never fails, so failure semantics never
# reach 1391.

spec:
  version: "1.0"
  schema: v92

dungeonDatas:
  upsert:
    - continentId: 9037
      eventGroups:
        # ---- One-time quest 1346: spawn waves + guard timer ----
        - type: talkNpc
          uniqueId: "437,1001"
          events:
            # Spawn tasks name a territory only; TerritoryData decides how many
            # mobs it places. Each rear-group insert (marked REAR) SPLITS the
            # delay it was inserted into, so every stage total is unchanged.
            - textId: 2
              questId: 1346
              taskId: 1
              eventTaskGroups:
                - eventTasks:
                    # -- stage 1 (group 43700009) + rear (43700012) --
