                    - { type: spawn, huntingZoneId: 437, territoryId: "43700364", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "6" }   # REAR Lumbering Ghilliedhu
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700323", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "10" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700329", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 0,   next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700325", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 50,  next: "time", nextValue: "4" }   # was 10, split
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700365", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "6" }   # REAR Terron
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700331", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 150, next: "time", nextValue: "20" }  # was 40, split
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700366", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "20" }  # REAR Pigling
                    # -- stage 2 (group 43700010) + rear (43700013) --
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700332", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 50,  next: "time", nextValue: "2" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700338", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 0,   next: "time", nextValue: "6" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700333", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 0,   next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700341", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 50,  next: "time", nextValue: "4" }   # was 10, split
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700367", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "6" }   # REAR Cromos
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700344", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "7" }   # was 15, split
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700368", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "8" }   # REAR Rockcrawler
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700334", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 50,  next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700339", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 0,   next: "time", nextValue: "4" }   # was 10, split
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700369", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "6" }   # REAR Stonebeak Brigand
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700345", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "10" }  # was 20, split
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700370", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "10" }  # REAR Sporewalker
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700346", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 150, next: "time", nextValue: "30" }  # was 60, split
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700371", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "30" }  # REAR Rockcrawler
                    # -- stage 3 (groups 43700011 + 43700014), FULLY WIRED --
                    # Pass 3: all 15 previously dormant stage-3 territories added, so
                    # the finale runs 25 spawn points instead of 10. Window stretched
