                    # the 420s guard timer; the chain now ends at 400s, leaving 20s of
                    # hold-out. Rhythm is deliberate: clusters of spawns 4s apart
                    # (a pincer the party must split for), then an 18-19s breather.
                    # The 10 originally-wired tasks keep their relative order.
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700347", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 0,   next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700348", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }   # WIRED pass 3
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700375", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "18" }  # WIRED pass 3, rear
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700359", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700349", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }   # WIRED pass 3
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700372", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700376", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "19" }  # WIRED pass 3, rear
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700354", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 0,   next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700350", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }   # WIRED pass 3
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700377", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "18" }  # WIRED pass 3, rear
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700360", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700351", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }   # WIRED pass 3
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700374", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700379", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }   # WIRED pass 3, rear
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700352", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "19" }  # WIRED pass 3
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700361", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700353", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }   # WIRED pass 3
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700380", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }   # WIRED pass 3, rear
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700355", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "18" }  # WIRED pass 3
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700362", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700356", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }   # WIRED pass 3
                    - { type: spawn, huntingZoneId: 437, territoryId: "43700378", targetNpcId: { huntingZone: 437, templateId: 1001 }, startAggro: 70,  next: "time", nextValue: "4" }
