spec:
  version: "1.0"
  schema: v92

imports:
  - from: progression-tokens
    use:
      variables:
        - EARLY_PROGRESSION_TOKEN

# Remove the level 5/6 gear step from Island of Dawn, so the gear ladder reads
# level-4 set -> level-7 First Expedition set -> Kugai set, with nothing in between.
# Exactly two quests granted level 5/6 equipment, 1331 and 1347; both keep their exp
# and gold and lose their item rows.
#
# `questCompensations: upsert` is REPLACE-ALL, so omitting `items` and `itemBag` is
# what leaves exp and gold only, and any LATER-NUMBERED spec naming either quest
# would silently undo this. That is why 1347's progression-token row is written here
# rather than in the spec that owns the rest of the token map: specs apply in path
# order and the last writer wins.
#
# 1331 is a story Mission and stays itemless. 1347 is a zone quest, and zone quests
# own power progression, so it takes a currency row rather than a set piece: the
# level 5-7 set is already fully distributed across quests 1326, 1330, 1332 and 1333.

questCompensations:
  upsert:
    - questId: 1331       # Climbing through the Ranks (was the lv5 Family Ties body)
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 2300
          gold: 230
          itemBag: "allpay"
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation (R23 story leg)
              quantity: 60

    - questId: 1347       # It Was a Rock...Crawler (was the lv6 Rockhound hands) -> token only
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 900          # already under the 5-6 cap of 900
          gold: 90
          itemBag: "allpay"      # added by wave 1: the quest had no bag at all
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation
              quantity: 8
