# Mystic Spirit of Life: restore the classic heal-over-time values.
#
# Generated from the classic server datasheet; regenerate rather than hand-edit.
#
# The Mystic's healing elemental is a summoned NPC (templates 1023200-1023212, one
# per rank). Its burst heal lives in NpcSkillData_1023 and is identical in both eras;
# what was flattened is the over-time component, abnormalities 701000-701012, which
# grows 100 to 160 across the 13 ranks live where it grew 70 to 914 classically.
# Ranks 1-3 come out slightly weaker after this spec, ranks 4-13 much stronger.
#
# Only `value` is restored. `max`, the lifetime cap, is already identical between the
# eras, which is itself evidence the caps were sized for the classic per-tick amount.
#
# `effects` is clear-and-replace, so each block restates the whole effect rather than
# the one changed field. Every abnormality here carries exactly one effect, so
# nothing is lost by that.

spec:
  version: "1.0"
  schema: v92

abnormalities:
  update:
    - id: 701000
      changes:
        effects:
          - type: 51
            tickInterval: 2
            value: "70"   # v92 100
            method: 2
            variation: 0
            min: 0
            max: 420
            defenceBonusRate: 1
            effectId: 50015
            effectPart: "FXBottom54"
