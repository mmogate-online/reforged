spec:
  version: "1.0"
  schema: v92

# Island of Dawn level 1-4 reward cadence: zone quests own POWER progression and
# story quests own LORE progression, so gear moves off the story spine onto the
# zone quests, anchored on the level-4 set, and the duplicate Noruk quest 1318
# is retired behind the sentinel prerequisite.
#
# The level-4 set is the anchor because it is the only complete low tier in the
# data (nine pieces, all requiredLevel 4, one visual tier), and six of the nine
# were granted by no quest anywhere. A player has to be able to finish a full
# set look inside one bracket, which the level-3 tier cannot offer.
#
# A `class` bag has no classless row anywhere in the data, so a bag that also
# grants a token duplicates that token across all twelve class rows.
# Reaper/Soulless stays omitted from every row, even where the item admits it.
#
# questCompensations upsert is REPLACE-ALL and the last spec to name a quest
# wins, with spec discovery ordered by relative path. That is why these zone
# quests take their token and XP values HERE instead of in a higher-numbered
# spec: such a spec would silently drop the set distribution above and still
# report a successful apply.
#
# Mid-tier class weapons (levels 3 and 4) sit in id ranges far from the low-tier
# ranges, so a nearest-match pool that knows only the low ids falls back to the
# level-2 weapon and hands out the same item three quests running.

imports:
  - from: progression-tokens
    use:
      variables:
        - EARLY_PROGRESSION_TOKEN

quests:
  update:
    # Retire the Noruk duplicate. Restores the v31 shipped state for this quest.
    - id: 1318            # Hunting the Beasts -> sentinel (was 1322, spec 001/14)
      changes:
        requirements:
          prerequisites: [9999]

questCompensations:
  upsert:
    # ---- story spine: lore only, gear stripped -------------------------------
    - questId: 1303       # The Secret Life of Trees (was lv4 weapon + lv4 body)
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 2600
          gold: 260
          itemBag: "allpay"
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation (R23 story leg)
              quantity: 60

    - questId: 1304       # Making the Rounds (was the lv2 weapon set)
      huntingZoneId: 13
      compensations:
        - compensationId: 1
          type: "normal"
          exp: 800
          gold: 80

    # ---- zone quests: the level-4 set, one piece each -------------------------
          itemBag: "allpay"
          items:
            - templateId: $EARLY_PROGRESSION_TOKEN      # Valkyon Commendation (R23 story leg)
