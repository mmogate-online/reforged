spec:
  version: "1.0"
  schema: v92

# Infusion fodder dismantle: one flat feedstock item (94101), yield scaled by fodder GRADE.
# Paired with 06-gear-infusion-items.yaml, which points each fodder item at one of these
# rows by slot group AND rareGrade.
#
# The faucet previously paid a flat 48 (weapon and body) or 24 (arm and leg) with grade
# ignored, so uncommon and superior fodder returned the same feedstock. The ladder below
# keeps the vanilla 1:3:6 shape across the three grades that exist and anchors it on RARE,
# so mean output stays roughly where it was while the grade axis is introduced.
#
# upsert on decompositions REPLACES the record completely when it exists, so each row below
# has to be the whole intended state, not a delta. FixedOutput is authored WITHOUT
# enchantStep, which is both the existing shape of these rows and the majority convention
# in the file.
#
# All fodder is rank 16, and the EnchantData dismantle path pays resultItemAmount 0 at rank
# 8 and above, so the two dismantle systems cannot collide on these items. Precedence would
# only become a live question if fodder were ever authored at rank 7 or below.

decompositions:
  upsert:
    # weapon and body group
    - id: 206863
      desc: "uncommon weapon and body infusion fodder"
      fixedOutputs:
        - outputs:
            - templateId: 94101
              amount: 16
    - id: 206861
      desc: "rare weapon and body infusion fodder"
      fixedOutputs:
        - outputs:
            - templateId: 94101
              amount: 48
    - id: 206865
      desc: "superior weapon and body infusion fodder"
      fixedOutputs:
        - outputs:
            - templateId: 94101
              amount: 96

    # arm and leg group, half the weapon and body yield
    - id: 206864
      desc: "uncommon arm and leg infusion fodder"
      fixedOutputs:
        - outputs:
            - templateId: 94101
              amount: 8
    - id: 206862
      desc: "rare arm and leg infusion fodder"
      fixedOutputs:
        - outputs:
            - templateId: 94101
              amount: 24
    - id: 206866
      desc: "superior arm and leg infusion fodder"
      fixedOutputs:
        - outputs:
            - templateId: 94101
              amount: 48

    # Unreferenced spare rows, restated only to move them off a retired feedstock tier
    # (94104) so that any future fodder landing on them cannot hand back a dead item.
    - id: 206867
      desc: "spare weapon and body fodder row, unreferenced"
      fixedOutputs:
        - outputs:
            - templateId: 94101
              amount: 48
    - id: 206868
      desc: "spare arm and leg fodder row, unreferenced"
      fixedOutputs:
        - outputs:
            - templateId: 94101
              amount: 24
