spec:
  version: "1.0"
  schema: v92

# Island of Dawn zone quest XP clamp and early-progression token payout.
#
# THE XP RULE. Each zone quest is capped at 25 percent of the median story quest XP of
# its level bracket, rounded to the nearest 10, where the bracket is minLevel rounded
# down to an odd number: 1-2 caps at 200, 3-4 at 220, 5-6 at 900, 7-8 at 1300. A quest
# already under its cap keeps its XP. Gold is deliberately left alone even where it now
# looks large beside the clamped XP: the compensation for the cut is the token, and
# raising gold as well would inflate the early economy this pass exists to contain.
#
# THE TOKEN RATE IS PRICED BY EFFORT: 20 at 3 or more tasks, 12 at 2 tasks, 8 at 1.
# There is deliberately no per-level-band curve, because a steep curve would hollow out
# the early zones the token exists to populate. Repeatable quests pay no token at all:
# it is an early-progression currency with a fixed ceiling, and a quest that can be
# re-accepted immediately and without limit would make that income unbounded and the
# ceiling meaningless. A repeatable pays a content-scoped currency instead, one whose
# only sink is the content it comes from.
#
# A `class` item bag pays a shared item by carrying one duplicate row per class. There
# is no such thing as a classless row inside a `class` bag, so the token appears twelve
# times in those blocks. Reaper/Soulless is omitted from every row.
#
# TRAP: `questCompensations: upsert` is REPLACE-ALL, and specs apply in path order, so
# a spec numbered 40 is the last writer for every quest it names. Every block below is
# therefore COMPLETE, restating exp, gold, itemBag and all surviving item rows rather
# than only the changed ones, and quests already authored by an earlier spec in this
# patch are amended there instead of named here. The dangerous case is a quest whose
# gear rows live only in the patch 001 baseline: naming it here with the token alone
# would silently strip that gear while the apply reported success.

imports:
  - from: progression-tokens
    use:
      variables:
        - EARLY_PROGRESSION_TOKEN
  - from: dungeon-tokens
    use:
      variables:
        - SORCHA_TOKEN

questCompensations:
  upsert:
