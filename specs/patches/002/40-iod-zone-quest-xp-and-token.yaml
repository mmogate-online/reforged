spec:
  version: "1.0"
  schema: v92

# Island of Dawn zone quest XP clamp and progression-token threading, for every live
# zone quest patch 002 does not already own.
#
# Framework: reforged-content-framework 02-progression-lanes.md 2 (zone-quest XP
#   weighting) and 03-currencies.md 3b-i (early-progression token: reward parity, and
#   "same rate for all players in the content, no level-band rate scaling").
# Backlog: RV-07 (zone quest XP pass) and RV-03 (token threading), with rulings R10,
#   R20, R21 and R22.
# Plan: docs/plans/reward-vectors/IOD-WAVE1-PLAN.md phase E2.
# Numbers: docs/plans/reward-vectors/IOD-WAVE1-BATCH0-MEASUREMENTS.md section 3, which
#   is the authoritative table. Do NOT author from the plan's prose: three of its
#   figures are superseded by that measurement.
#
# THE XP RULE. Each live zone quest is capped at 25 percent of the MEDIAN story quest
# XP of its level bracket, rounded to the nearest 10. A quest above its cap drops to
# the cap; a quest already under it is untouched. Bracket = minLevel rounded down to an
# odd number. The measured caps:
#   bracket 1-2   cap 200     bracket 5-6   cap 900
#   bracket 3-4   cap 220     bracket 7-8   cap 1,300
# Two corrections are baked into those medians and they bite in OPPOSITE directions:
# the twelve class-training missions (2,100 XP each) count ONCE, because a character
# completes exactly one, which drops bracket 1-2 from 525 to 200; and the paired
# gathering intros 1382/1383 (100 XP) are excluded as non-story payouts, which raises
# bracket 5-6 from 300 to 900.
#
# GOLD IS DELIBERATELY UNTOUCHED, including where it now looks large next to the
# clamped XP. RV-07's compensation is the token and only the token (plan phase E2,
# caveat 2): adding gold here would be exactly the quiet scope creep that ruling
# excludes. The vendor that spends the token is RV-02, in wave 2.
#
# THE TOKEN RATE IS FLAT: one Dawn Seal per quest, every quest, no bracket scaling.
# Framework 03 3b-i rules the earn rate is "the same rate for all players in the
# content ... no level-band rate scaling", so a per-bracket ladder would contradict it.
# It also makes wave-1 income trivially readable (seals earned = zone quests done),
# which is precisely the measured accumulation data RV-02 prices against. If wave 2
# wants differentiation it belongs in the PRICES, not in the earn rate.
#
# BAG MODES. 24 of these quests take one token row in an `allpay` bag; the twelve that
# had no `itemBag` at all gain `itemBag: "allpay"` alongside it. Quests 1326 and 1330
# are `class` bags and take TWELVE duplicate token rows each, per R22: there are zero
# occurrences anywhere in v92 server, v92 client or v31 of a classless row inside a
# `class` bag, while 62 of 94 v92 class bags already pay a shared item by duplicating
# it per class. The in-file precedent for the resulting 24-row bag is quest 1310, in
# this same file. Reaper/Soulless stays omitted from every row per doctrine.
#
# ---------------------------------------------------------------------------
# WHY THIS SPEC DOES NOT NAME ALL 35 ZONE QUESTS
# ---------------------------------------------------------------------------
# `questCompensations: upsert` is REPLACE-ALL and `discover_specs` sorts on the
# relative path string, so a spec numbered 40- is the LAST writer for every quest it
# names. Nine of the 35 are already authored inside patch 002, and naming them here
# would silently overwrite the trim wave: the whole level-4 set (002/28), the First
# Expedition body and weapon (002/29), and two deliberate strips (002/29, 002/30).
# The apply would succeed and the op counts would look right.
#
# So those nine are amended IN THEIR OWNING SPEC instead, which is also the project's
# standing precedent (TRACKER.md, Trim 5: each quest keeps one authoritative statement
# in the patch). This is legitimate while patch 002 is open, because specs replay
# wholesale from the committed baseline.
#   002/28  1319, 1322, 1324, 1325
#   002/29  1332, 1333, 1348, 1349
#   002/30  1347
#   this    the other 26
#
# 1326 AND 1330 ARE THE EXCEPTION AND THEY ARE THE RISK. They are `class` bags whose
# rows exist ONLY in the patch 001 baseline (spec 001/04); nothing in patch 002 has
# ever touched their compensations. Because upsert is replace-all, a statement here
# that named only the token would silently strip the level-7 feet (15021/15024/15027)
# and hands (15020/15023/15026). Their twelve gear rows are therefore reproduced below
# verbatim from 001/04, in 001/04's own row order, and verified against the committed
# server HEAD. 002/29 warns about exactly this in its own header.
#
# EVERY BLOCK BELOW IS COMPLETE, for the same replace-all reason: every exp, gold,
# itemBag and surviving item row is restated, not just the changed ones. The baseline
# for each was read from the server datasheet's committed HEAD, which is what migrate
# replays against via --source-ref.

imports:
  - from: iod-tokens
    use:
      variables:
        - IOD_PROGRESSION_TOKEN

