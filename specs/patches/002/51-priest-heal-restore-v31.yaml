# Priest heals: restore the v31 values and cooldowns. Every value here is ABSOLUTE,
# so the result is the same whatever multipliers the datasheet currently carries.
# Generated from the v31 datasheet; do not hand-edit, regenerate instead.
#
#   group 18  Heal Thyself       internal "Self Heal"         ranks 1-12
#   group 19  Focus Heal         internal "Healing Light"     ranks 1-9 (+3 copies)
#   group  3  Healing Circle     internal "Concentrate Heal"  ranks 1-7, 2 subs
#   group 37  Healing Immersion  internal "Cure Wing"         ranks 1-2
#
# No new ranks and no new skill ids: v31 ranks that v92 does not carry are left out,
# and they were not learnable in v31 either (absent from SkillGetConList). Priest also
# heals through abnormalities, which are a separate DSL entity and a separate spec.
#
# FOCUS HEAL COOLDOWNS ARE DELIBERATELY NOT TOUCHED. v92 puts the 2500 ms gate on the
# Shot sub (10); v31 puts the same magnitude on the LockOn sub (00). Porting v31 by
# skill id would zero the Shot gate and move it onto a sub that v92's chain does not
# gate on. Healing Circle's cooldown IS restored, on both of its subs.
#
# Two places have no v31 source and lean on v92: Healing Circle sub 30 is a v92-only
# Short Cast split, derived from the v31 Long Cast by that rank's own v92 ratio; and
# Focus Heal ranks 30/31/32 are internally Lv09 chain/crest copies of rank 9, set to
# the v31 rank 9 value so they stay in step with the base skill.

spec:
  version: "1.0"
  schema: v92

# Two layers of definitions. `Heal*` describe only WHERE HpDiff sits in the XML;
# `S<skillId>` carry the actual balance decision, one line each, so every value
# appears exactly once in this file instead of once per race/gender variant.
#
# `category` cannot be a list (the DSL rejects it), so the 11 variants must be
# listed individually. Those lines carry no data, only the variant name.
definitions:
  Heal:
    targetingLists:
      - targetings:
          - areas:
              - effect:
                  hpDiff:
                    value: $V
  Heal_0_1_0:
    targetingLists:
      - targetings:
          - {}
          - areas:
              - effect:
                  hpDiff:
                    value: $V

  # ---- Healing Circle ----
  S30100: { id: 30100, changes: { $extends: Heal, $with: { V: 2379 }, precondition: { coolTime: 5000 } } }  # rank 1: 3018 -> 2379
  S30130: { id: 30130, changes: { $extends: Heal, $with: { V: 2974 }, precondition: { coolTime: 5000 } } }  # rank 1: 3773 -> 2974 (derived: v31 long cast x 1.25017 (v92 ratio))
